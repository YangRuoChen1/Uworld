                                <input type="number" min={0} max={500} value={medEngNewLimit} onChange={(e) => setMedEngNewLimit(Math.max(0, Number(e.target.value)))} className="w-16 px-2 py-1.5 rounded-lg border font-bold text-teal-700" />
                              </label>
                              <label className="flex items-center gap-1.5 font-semibold text-slate-700">
                                <span>复习上限:</span>
                                <input type="number" min={0} max={999} value={medEngRevLimit} onChange={(e) => setMedEngRevLimit(Math.max(0, Number(e.target.value)))} className="w-16 px-2 py-1.5 rounded-lg border font-bold text-emerald-700" />
                              </label>
                            </div>
                            <div className="flex flex-wrap gap-2">
                              {medEngDueStats.total > 0 && (
                                <button onClick={startMedEngAheadSession} className="px-4 py-3 rounded-xl bg-white border border-teal-300 text-teal-700 hover:bg-teal-50 font-bold text-xs sm:text-sm">
                                  提前复习 / 自由刷卡
                                </button>
                              )}
                              <button onClick={startMedEngSession} className="px-7 py-3 rounded-xl bg-teal-700 hover:bg-teal-600 text-white font-extrabold text-sm shadow-lg flex items-center gap-2">
                                <Icon name="play" className="w-4 h-4" /> <span>开始医学英语 FSRS 复习</span>
                              </button>
                            </div>
                          </div>
                        </div>
                      </div>
                    )}
                  </main>
                </>
              )}

              {/* VIEW 2: UWORLD TEST INTERFACE (WITH PER-QUESTION TIMER) */}
              {view === "TEST" && activeBlock && currentQuestion && (() => {
                const qid = currentQuestion.id;
                const isSubmitted = Boolean(activeBlock.submitted[qid]);
                const selectedOpt = activeBlock.answers[qid];
                const struckOpts = activeBlock.struck[qid] || [];
                const isMarked = markedIds.includes(qid);
                const isCorrect = selectedOpt === currentQuestion.answer;
                const fontSizeCls = textSize === 0 ? "text-sm" : textSize === 2 ? "text-lg" : "text-base";
                const qHighlights = highlightsMap[qid] || [];
                const qSpent = qTimesMap[qid] || 0;

                return (
                  <div className="flex-1 flex flex-col h-screen overflow-hidden">
                    <header className="bg-[#1b4b91] text-white px-3 py-2 flex items-center justify-between gap-2 shrink-0 shadow">
                      <div className="flex items-center gap-2.5">
                        <div className="text-xs sm:text-sm font-bold leading-tight">
                          <div>Item {activeBlock.currentIndex + 1} of {activeBlock.qIds.length}</div>
                          <div className="text-[10px] text-blue-200 font-mono">{currentQuestion.step} · {formatTime(qSpent)}</div>
                        </div>
                        <button onClick={() => resetSingleQuestionStatus(qid)} title="清除本题作答记录，恢复为未写状态" className="px-2.5 py-1 rounded border text-xs font-semibold bg-blue-800/70 hover:bg-blue-700 border-blue-500">
                          🔄 重置本题
                        </button>
                        <button onClick={() => setMarkedIds(p => p.includes(qid) ? p.filter(i => i !== qid) : [...p, qid])} className={`px-2.5 py-1 rounded border text-xs font-semibold flex items-center gap-1 ${isMarked ? "bg-rose-600 border-rose-400" : "bg-blue-800/70 border-blue-500"}`}>
                          <Icon name="flag" className="w-3.5 h-3.5" /> <span>{isMarked ? "Marked" : "Mark"}</span>
                        </button>
                      </div>
                      <div className="flex items-center gap-1.5">
                        <button disabled={activeBlock.currentIndex === 0} onClick={() => { setActiveBlock(p => ({ ...p, currentIndex: p.currentIndex - 1 })); setExpandedExpOpt(null); }} className="px-2.5 py-1 rounded bg-blue-800 disabled:opacity-40 text-xs font-semibold">Previous</button>
                        <button disabled={activeBlock.currentIndex >= activeBlock.qIds.length - 1} onClick={() => { setActiveBlock(p => ({ ...p, currentIndex: p.currentIndex + 1 })); setExpandedExpOpt(null); }} className="px-2.5 py-1 rounded bg-blue-800 disabled:opacity-40 text-xs font-semibold">Next</button>
                      </div>
                      <div className="flex items-center gap-1 text-xs">
                        <button onClick={() => setHighlightMode(!highlightMode)} className={`px-2 py-1 rounded ${highlightMode ? "bg-yellow-400 text-slate-950 font-bold" : "hover:bg-blue-800"}`}>荧光笔</button>
                        <button onClick={() => setShowLabModal(true)} className="px-2 py-1 rounded hover:bg-blue-800">Lab</button>
                        <button onClick={() => setShowNotesModal(true)} className="px-2 py-1 rounded hover:bg-blue-800">Notes</button>
                        <button onClick={() => setDarkMode(!darkMode)} className="px-2 py-1 rounded hover:bg-blue-800"><Icon name={darkMode ? "sun" : "moon"} className="w-4 h-4" /></button>
                        <button onClick={() => setTextSize(s => (s + 1) % 3)} className="px-2 py-1 rounded hover:bg-blue-800 font-bold">A</button>
                      </div>
                    </header>

                    <div className="flex-1 flex overflow-hidden">
                      <aside className={`w-12 shrink-0 overflow-y-auto border-r flex flex-col items-center py-2 gap-1 ${darkMode ? "bg-slate-900 border-slate-800" : "bg-slate-200 border-slate-300"}`}>
                        {activeBlock.qIds.map((id, idx) => (
                          <button key={id} onClick={() => { setActiveBlock(p => ({ ...p, currentIndex: idx })); setExpandedExpOpt(null); }} className={`w-9 h-8 rounded text-xs font-bold ${idx === activeBlock.currentIndex ? "bg-blue-700 text-white" : activeBlock.submitted[id] ? (activeBlock.answers[id] === questions.find(q => q.id === id)?.answer ? "text-emerald-600" : "text-rose-600") : ""}`}>{idx + 1}</button>
                        ))}
                      </aside>

                      <main className={`flex-1 overflow-y-auto p-4 sm:p-8 ${darkMode ? "bg-slate-950 text-slate-100" : "bg-white text-slate-900"}`}>
                        <div className="max-w-4xl mx-auto space-y-6 pb-12">
                          <div className="flex justify-between items-center text-xs text-slate-400">
                            <span>{currentQuestion.step} · <strong className={darkMode ? "text-sky-300" : "text-blue-700"}>{currentQuestion.system}</strong></span>
                            <button onClick={() => {
                              const sel = window.getSelection()?.toString().trim();
                              if (sel && sel.length >= 2) setHighlightsMap(p => ({ ...p, [qid]: [...(p[qid] || []), sel] }));
                            }} className="px-2 py-0.5 rounded bg-yellow-100 text-yellow-900 border border-yellow-300">高亮选中文字</button>
                          </div>

                          <p onMouseUp={() => { if (!highlightMode) return; const sel = window.getSelection()?.toString().trim(); if (sel && sel.length >= 2) setHighlightsMap(p => ({ ...p, [qid]: [...(p[qid] || []), sel] })); }} className={`font-serif-clinical leading-relaxed whitespace-pre-line ${fontSizeCls}`}>
                            {renderHighlightedStem(currentQuestion.stem, qHighlights)}
                          </p>

                          {currentQuestion.vignetteImage && <img src={currentQuestion.vignetteImage} alt="Exhibit" onClick={() => setZoomImage(currentQuestion.vignetteImage)} className="max-h-80 rounded-lg border mx-auto cursor-zoom-in" />}

                          <div className={`rounded-xl border-2 p-3 sm:p-4 space-y-2 ${darkMode ? "border-slate-700 bg-slate-900/60" : "border-sky-200 bg-slate-50/70"}`}>
                            {Object.entries(currentQuestion.options).map(([key, text]) => {
                              const isSel = selectedOpt === key, isAns = currentQuestion.answer === key, isStruck = struckOpts.includes(key);
                              let cls = "border-transparent hover:bg-blue-50";
                              if (!isSubmitted && isSel) cls = "bg-blue-100/80 border-blue-500";
                              if (isSubmitted) cls = isAns ? "bg-emerald-50 border-emerald-500 text-slate-900" : isSel ? "bg-rose-50 border-rose-500 text-slate-900" : "border-transparent";
                              return (
                                <div key={key} className={`flex items-center justify-between gap-2 px-3 py-2.5 rounded-lg border ${cls}`}>
                                  <button disabled={isSubmitted} onClick={() => setActiveBlock(p => ({ ...p, answers: { ...p.answers, [qid]: key } }))} className="flex-1 text-left flex items-start gap-3">
                                    <span className="w-6 h-6 rounded-full border flex items-center justify-center text-xs font-bold shrink-0">{key}</span>
                                    <span className={`${fontSizeCls} ${isStruck ? "line-through opacity-45" : ""}`}>{text}</span>
                                  </button>
                                  {!isSubmitted && <button onClick={() => setActiveBlock(p => ({ ...p, struck: { ...p.struck, [qid]: isStruck ? struckOpts.filter(k => k !== key) : [...struckOpts, key] } }))} className="text-[11px] px-2 py-0.5 rounded border text-slate-400">{isStruck ? "恢复" : "划掉"}</button>}
                                </div>
                              );
                            })}
                          </div>

                          {!isSubmitted && <button onClick={handleSubmitQuestion} className="px-7 py-2.5 rounded-lg bg-[#2563eb] text-white font-bold text-sm shadow">Submit</button>}

                          {isSubmitted && (
                            <div className={`rounded-xl border p-5 space-y-4 ${darkMode ? "bg-slate-900 border-slate-700" : "bg-slate-50 border-slate-200"}`}>
                              <div className="flex flex-wrap items-center justify-between gap-2 pb-3 border-b">
                                <span className={`font-extrabold text-sm ${isCorrect ? "text-emerald-500" : "text-rose-500"}`}>
                                  {isCorrect ? "✓ Correct" : `✗ Incorrect · Correct Answer: ${currentQuestion.answer}`}
                                </span>
                                <span className="px-2.5 py-1 rounded-full bg-blue-100 text-blue-800 text-xs font-bold font-mono">
                                  ⏱ 本题用时: {Math.floor(qSpent / 60)}分 {qSpent % 60}秒
                                </span>
                              </div>
                              {Object.entries(currentQuestion.explanations || {}).map(([k, exp]) => (
                                <div key={k} className={`rounded-lg border p-3 text-xs sm:text-sm ${k === currentQuestion.answer ? "border-emerald-300 bg-emerald-50/70 text-slate-900" : "border-slate-200 bg-white text-slate-800"}`}>
                                  <div className="font-bold">Choice {k} {k === currentQuestion.answer ? "(Correct)" : ""}</div>
                                  <p className="mt-1 whitespace-pre-line">{exp}</p>
                                </div>
                              ))}
                              {currentQuestion.generalExplanation && (
                                <div className="p-4 rounded-xl border bg-white text-slate-800 space-y-1">
                                  <div className="text-xs font-extrabold text-blue-700">疾病机制与诊疗深度解析</div>
                                  <p className="text-xs sm:text-sm whitespace-pre-line">{currentQuestion.generalExplanation}</p>
                                </div>
                              )}
                              {Array.isArray(currentQuestion.explanationImages) && currentQuestion.explanationImages.length > 0 && (
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                  {currentQuestion.explanationImages.map((src, i) => <img key={i} src={src} alt="" onClick={() => setZoomImage(src)} className="rounded-lg border max-h-64 mx-auto cursor-zoom-in" />)}
                                </div>
                              )}
                              {currentQuestion.educationalObjective && (
                                <div className="p-4 rounded-xl border bg-amber-50 border-amber-300 text-slate-900">
                                  <div className="text-xs font-extrabold text-amber-700 mb-1">Educational Objective</div>
                                  <p className="text-xs sm:text-sm whitespace-pre-line">{currentQuestion.educationalObjective}</p>
                                </div>
                              )}
                              <div className="flex justify-end pt-1">
                                <button onClick={() => convertQuestionToAnki(currentQuestion)} className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow">
                                  🧠 一键转存为 Anki 填空卡
                                </button>
                              </div>
                            </div>
                          )}
                        </div>
                      </main>
                    </div>

                    <footer className="bg-[#1b4b91] text-white px-4 py-2 flex items-center justify-between text-xs shrink-0">
                      <span className="font-mono">Block Time: {formatTime(activeBlock.elapsedSec)}</span>
                      <div className="flex gap-2">
                        <button onClick={() => setView("DASHBOARD")} className="px-3 py-1 rounded bg-blue-800 font-semibold">Suspend</button>
                        <button onClick={handleEndBlock} className="px-3 py-1 rounded bg-rose-600 font-bold">End Block</button>
                      </div>
                    </footer>
                  </div>
                );
              })()}

              {/* VIEW 3: ANKI FULL-SCREEN STUDY SESSION */}
              {view === "ANKI_STUDY" && currentAnkiStudyCard && (
                <div className="flex-1 flex flex-col min-h-screen bg-slate-100">
                  <header className="bg-indigo-900 text-white px-4 py-3 flex items-center justify-between">
                    <div className="text-sm font-bold">
                      Anki FSRS 复习 · 剩余 {ankiQueue.length} 张 · <span className="text-indigo-200">{currentAnkiStudyCard.step} · {currentAnkiStudyCard.system}</span>
                    </div>
                    <div className="flex items-center gap-2">
                      <button disabled={ankiHistory.length === 0} onClick={handleAnkiUndo} title="回退到上一张 (快捷键 Ctrl+Z)" className="px-3 py-1 rounded-lg bg-indigo-700 hover:bg-indigo-600 disabled:opacity-40 border border-indigo-400 text-xs font-bold">↩️ 上一张 (Ctrl+Z)</button>
                      <button onClick={() => setEditingAnkiCard({ ...currentAnkiStudyCard })} className="px-3 py-1 rounded-lg bg-indigo-700 hover:bg-indigo-600 border border-indigo-400 text-xs font-bold">✏️ 编辑此卡</button>
                      <button onClick={() => setView("DASHBOARD")} className="px-3 py-1 rounded-lg bg-indigo-800 hover:bg-indigo-700 text-xs font-bold">返回主页</button>
                    </div>
                  </header>
                  <main className="flex-1 max-w-3xl w-full mx-auto p-4 sm:p-8 flex flex-col justify-center space-y-5">
                    <div className="bg-white rounded-2xl border shadow-lg p-6 space-y-5">
                      {currentAnkiStudyCard.type === "io" ? (
                        <div className="flex flex-col items-center space-y-2">
                          <div className="relative inline-block">
                            <img src={currentAnkiStudyCard.image} alt="IO" className="max-h-[70vh] rounded-lg border" />
                            {(currentAnkiStudyCard.masks || []).map((m, i) => {
                              const targetC = currentAnkiStudyCard.activeCNum || 1;
                              const isTarget = m.cNum ? m.cNum === targetC : true;
                              if (ankiRevealed && isTarget) return null; // Uncover ONLY target mask on back!
                              return (
                                <div
                                  key={i}
                                  style={{ left: `${m.x}%`, top: `${m.y}%`, width: `${m.w}%`, height: `${m.h}%` }}
                                  className={`absolute border ${isTarget ? "bg-rose-400/95 border-rose-700" : "bg-amber-200/95 border-amber-700"}`}
                                />
                              );
                            })}
                          </div>
                          {currentAnkiStudyCard.activeCNum && (
                            <div className="text-[11px] text-slate-400">红色遮挡为当前考察项 (#c{currentAnkiStudyCard.activeCNum})，黄色为其余遮挡</div>
                          )}
                        </div>
                      ) : (
                        <div className="text-base sm:text-lg leading-relaxed font-serif-clinical">
                          {renderClozeText(currentAnkiStudyCard.text, ankiRevealed, currentAnkiStudyCard.activeCNum)}
                        </div>
                      )}

                      {ankiRevealed && currentAnkiStudyCard.extra && (
                        <div className="p-4 rounded-xl bg-slate-50 border text-sm anki-html" dangerouslySetInnerHTML={{ __html: currentAnkiStudyCard.extra }} />
                      )}

                      {!ankiRevealed ? (
                        <button onClick={() => setAnkiRevealed(true)} className="w-full py-3.5 rounded-xl bg-indigo-700 hover:bg-indigo-600 text-white font-extrabold text-sm shadow">
                          显示答案
                        </button>
                      ) : (
                        <div className="grid grid-cols-4 gap-2">
                          {[
                            [1, "Again 重来", "bg-rose-600"],
                            [2, "Hard 困难", "bg-amber-600"],
                            [3, "Good 良好", "bg-emerald-600"],
                            [4, "Easy 简单", "bg-sky-600"]
                          ].map(([g, label, cls]) => (
                            <button key={g} onClick={() => handleAnkiStudyRate(g)} className={`${cls} text-white rounded-xl py-3 px-2 text-center font-bold text-xs shadow`}>
                              <div>{label}</div>
                              <div className="text-[11px] opacity-90 mt-0.5">{formatFsrsInterval(fsrsSchedule(currentAnkiStudyCard.fsrs, g, targetRetention))}</div>
                            </button>
                          ))}
                        </div>
                      )}
                    </div>
                  </main>
                </div>
              )}


              {/* VIEW 3B: MEDENG FSRS FLIP-CARD STUDY */}
              {view === "MEDENG_STUDY" && currentMedEngCard && (
                <div className="flex-1 flex flex-col min-h-screen bg-slate-100">
                  <header className="bg-teal-900 text-white px-4 py-3 flex items-center justify-between shadow">
                    <div className="text-xs sm:text-sm font-bold">
                      <span>🩺 医学英语 FSRS 翻转卡 · 第 {medEngIdx + 1} / {medEngQueue.length} 张</span>
                      <span className="ml-2 px-2 py-0.5 rounded bg-teal-700 text-teal-100 text-[11px]">{currentMedEngCard.category}</span>
                      <span className="ml-1.5 px-2 py-0.5 rounded bg-amber-400 text-slate-950 text-[11px]">{currentMedEngCard.direction}</span>
                    </div>
                    <div className="flex items-center gap-2">
                      <button disabled={medEngHistory.length === 0} onClick={handleMedEngUndo} title="回退到上一张 (快捷键 Ctrl+Z)" className="px-3 py-1.5 rounded-lg bg-teal-700 hover:bg-teal-600 disabled:opacity-40 border border-teal-400 text-xs font-bold">↩️ 上一张 (Ctrl+Z)</button>
                      <button onClick={() => setEditingMedEngCard({ ...currentMedEngCard })} className="px-3 py-1.5 rounded-lg bg-teal-700 hover:bg-teal-600 border border-teal-400 text-xs font-bold">✏️ 编辑此卡</button>
                      <button onClick={() => setView("DASHBOARD")} className="px-3 py-1.5 rounded-lg bg-teal-800 hover:bg-teal-700 text-xs font-bold">返回主页</button>
                    </div>
                  </header>
                  <main className="flex-1 flex items-center justify-center p-4 sm:p-8">
                    <div className="w-full max-w-2xl bg-white rounded-3xl border border-slate-200 shadow-xl p-6 sm:p-10 space-y-6">
                      <div className="flex flex-wrap items-center justify-between gap-2 text-xs text-slate-500 border-b pb-3">
                        <span className="font-bold text-teal-700">{currentMedEngCard.system}</span>
                        <span>{currentMedEngCard.frontHint}</span>
                      </div>

                      <div onClick={() => !medEngRevealed && setMedEngRevealed(true)} className="min-h-[160px] flex flex-col items-center justify-center text-center p-6 rounded-2xl bg-slate-50 border border-slate-200 cursor-pointer select-text">
                        <div className="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2">正面 (Front)</div>
                        <div className="text-2xl sm:text-3xl font-extrabold text-slate-900 leading-snug">{currentMedEngCard.front}</div>
                        <button type="button" onClick={(e) => { e.stopPropagation(); speakEnglish(currentMedEngCard.front); }} className="mt-3 px-3 py-1 rounded-full bg-white border border-slate-300 text-xs font-bold text-slate-600 hover:bg-teal-50 hover:text-teal-700">
                          🔊 朗读发音
                        </button>
                      </div>

                      {medEngRevealed && (
                        <div className="p-6 rounded-2xl bg-teal-50/70 border-2 border-teal-300 text-center space-y-2">
                          <div className="text-[11px] font-bold uppercase tracking-wider text-teal-600">反面答案 (Back)</div>
                          <div className="text-xl sm:text-2xl font-extrabold text-teal-950 leading-snug">{currentMedEngCard.back}</div>
                          {currentMedEngCard.note && <div className="text-xs text-slate-500 pt-1">出处 / 备注：{currentMedEngCard.note}</div>}
                        </div>
                      )}

                      {!medEngRevealed ? (
                        <button onClick={() => setMedEngRevealed(true)} className="w-full py-3.5 rounded-xl bg-teal-700 hover:bg-teal-600 text-white font-extrabold text-sm shadow">
                          翻转查看答案
                        </button>
                      ) : (
                        <div className="grid grid-cols-4 gap-2">
                          {[
                            [1, "Again 重来", "bg-rose-600"],
                            [2, "Hard 困难", "bg-amber-600"],
                            [3, "Good 良好", "bg-emerald-600"],
                            [4, "Easy 简单", "bg-sky-600"]
                          ].map(([g, label, cls]) => (
                            <button key={g} onClick={() => handleMedEngRate(g)} className={`${cls} text-white rounded-xl py-3 px-2 text-center font-bold text-xs shadow`}>
                              <div>{label}</div>
                              <div className="text-[11px] opacity-90 mt-0.5">{formatFsrsInterval(fsrsSchedule(currentMedEngCard.fsrs, g, targetRetention))}</div>
                            </button>
                          ))}
                        </div>
                      )}
                    </div>
                  </main>
                </div>
              )}

              {/* VIEW 4: BLOCK SUMMARY */}
              {view === "SUMMARY" && activeBlock && (
                <div className="flex-1 flex items-center justify-center p-6">
                  <div className="w-full max-w-xl bg-white rounded-2xl border shadow-xl p-8 text-center space-y-5">
                    <h2 className="text-2xl font-extrabold">Block Complete</h2>
                    <div className="text-5xl font-black text-blue-700">{Math.round(((activeBlock.correctCount || 0) / activeBlock.qIds.length) * 100)}%</div>
                    <p className="text-sm text-slate-600">答对 {activeBlock.correctCount || 0} / {activeBlock.qIds.length} 题</p>
                    <div className="flex justify-center gap-3">
                      <button onClick={() => setView("TEST")} className="px-5 py-2.5 rounded-xl bg-slate-100 font-bold text-sm">逐题复盘</button>
                      <button onClick={() => setView("DASHBOARD")} className="px-6 py-2.5 rounded-xl bg-blue-700 text-white font-bold text-sm">返回主页</button>
                    </div>
                  </div>
                </div>
              )}

              {/* MODAL: QUESTION MANAGER (WITH BATCH SELECT & MOVE!) */}
              {showQManager && (
                <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-3 sm:p-6">
                  <div className="w-full max-w-4xl bg-white rounded-2xl shadow-2xl flex flex-col max-h-[90vh]">
                    <div className="px-5 py-4 border-b flex justify-between items-center">
                      <h3 className="font-bold text-lg">题库管理 ({questions.length} 题)</h3>
                      <button onClick={() => setShowQManager(false)}><Icon name="x" className="w-5 h-5" /></button>
                    </div>
                    <div className="px-5 pt-3 border-b flex flex-wrap gap-4 text-sm font-semibold">
                      {isAdmin && (
                        <>
                          <button onClick={() => setQmTab("json")} className={`pb-2.5 border-b-2 ${qmTab === "json" ? "border-blue-600 text-blue-700" : "border-transparent text-slate-500"}`}>JSON 批量导入</button>
                          <button onClick={() => setQmTab("manual")} className={`pb-2.5 border-b-2 ${qmTab === "manual" ? "border-emerald-600 text-emerald-700" : "border-transparent text-slate-500"}`}>单题录入 (Ctrl+V 贴图)</button>
                        </>
                      )}
                      <button onClick={() => setQmTab("browse")} className={`pb-2.5 border-b-2 ${qmTab === "browse" ? "border-blue-600 text-blue-700" : "border-transparent text-slate-500"}`}>题库浏览 / 批量移动 / 同步</button>
                    </div>
                    <div className="p-5 overflow-y-auto flex-1 text-xs">
                      {qmTab === "json" && isAdmin && (
                        <div className="space-y-3">

                            <select value={ioSystem} onChange={(e) => setIoSystem(e.target.value)} className="border rounded-lg px-3 py-2">{getSystemsForStep(ioStep).map(s => <option key={s.id} value={s.id}>{s.id} ({s.cn})</option>)}</select>

                          <div onPaste={(e) => { const items = e.clipboardData?.items; if (!items) return; for (let i = 0; i < items.length; i++) { if (items[i].type.indexOf("image") !== -1) { e.preventDefault(); const r = new FileReader(); r.onload = (ev) => { setIoImage(ev.target.result); setIoMasks([]); }; r.readAsDataURL(items[i].getAsFile()); break; } } }} className="p-3 rounded-xl border-2 border-dashed bg-slate-50 flex justify-between items-center">
                            <span>按 <strong>Ctrl+V</strong> 贴图或选择图片：</span>
                            <input type="file" accept="image/*" onChange={(e) => { const f = e.target.files?.[0]; if (!f) return; const r = new FileReader(); r.onload = (ev) => { setIoImage(ev.target.result); setIoMasks([]); }; r.readAsDataURL(f); }} />
                          </div>
                          {ioImage && (
                            <div className="space-y-2">
                              <div className="flex justify-between"><span>拖拽鼠标画遮挡框（已画 {ioMasks.length} 个）：</span><button onClick={() => setIoMasks(m => m.slice(0, -1))} className="px-2 py-0.5 rounded bg-slate-200">撤销</button></div>
                              <div className="flex justify-center bg-slate-900 p-2 rounded-xl">
                                <div className="relative inline-block select-none cursor-crosshair"
                                  onMouseDown={(e) => { const r = e.currentTarget.getBoundingClientRect(); const x = ((e.clientX - r.left) / r.width) * 100, y = ((e.clientY - r.top) / r.height) * 100; setIoDrawing({ startX: x, startY: y, curX: x, curY: y }); }}
                                  onMouseMove={(e) => { if (!ioDrawing) return; const r = e.currentTarget.getBoundingClientRect(); setIoDrawing(d => ({ ...d, curX: Math.min(100, Math.max(0, ((e.clientX - r.left) / r.width) * 100)), curY: Math.min(100, Math.max(0, ((e.clientY - r.top) / r.height) * 100)) })); }}
                                  onMouseUp={() => { if (!ioDrawing) return; const x = Math.min(ioDrawing.startX, ioDrawing.curX), y = Math.min(ioDrawing.startY, ioDrawing.curY), w = Math.abs(ioDrawing.curX - ioDrawing.startX), h = Math.abs(ioDrawing.curY - ioDrawing.startY); if (w > 2 && h > 2) setIoMasks(p => [...p, { x, y, w, h }]); setIoDrawing(null); }}>
                                  <img src={ioImage} alt="" draggable={false} className="max-h-64 pointer-events-none" />
                                  {ioMasks.map((m, idx) => <div key={idx} style={{ left: `${m.x}%`, top: `${m.y}%`, width: `${m.w}%`, height: `${m.h}%` }} className="absolute bg-amber-400/85 border-2 border-amber-700 pointer-events-none" />)}
                                </div>
                              </div>
                            </div>
                          )}
                          <button onClick={() => {
                            if (!ioImage || ioMasks.length === 0) return;
                            setAnkiCards(p => [{ id: `aio-${Date.now()}`, type: "io", step: ioStep, system: ioSystem, image: ioImage, masks: ioMasks, extra: ioExtra.trim(), fsrs: createInitialFSRS() }, ...p]);
                            setIoImage(""); setIoMasks([]); setIoExtra(""); showToast("图片遮挡卡已保存！", "success");
                          }} className="w-full py-2.5 rounded-xl bg-emerald-600 text-white font-bold">保存图片遮挡卡</button>
                        </div>
                      )}

                      {ankiMgrTab === "apkg" && isAdmin && (
                        <div className="space-y-4">
                          <div className="p-4 rounded-xl bg-slate-50 border space-y-3">
                            <div className="font-bold text-slate-800">1. 解析并预览 .apkg 牌组（已支持 Anki 最新版 Zstd 压缩格式与媒体图片）：</div>
                            <div className="grid grid-cols-2 gap-2">
                              <select value={apkgStep} onChange={(e) => { setApkgStep(e.target.value); setApkgSystem(getSystemsForStep(e.target.value)[0].id); }} className="border rounded-lg px-3 py-2 bg-white font-semibold">{STEPS.map(s => <option key={s}>{s}</option>)}</select>
                              <select value={apkgSystem} onChange={(e) => setApkgSystem(e.target.value)} className="border rounded-lg px-3 py-2 bg-white">{getSystemsForStep(apkgStep).map(s => <option key={s.id} value={s.id}>{s.id} ({s.cn})</option>)}</select>
                            </div>
                            <label className="inline-block px-4 py-2.5 rounded-xl bg-indigo-700 text-white font-bold cursor-pointer">
                              {apkgBusy ? "正在解压解析 .apkg..." : "选择本地 .apkg 文件预览"}
                              <input type="file" accept=".apkg" disabled={apkgBusy} className="hidden" onChange={async (e) => {
                                const f = e.target.files?.[0];
                                if (!f) return;
                                setApkgBusy(true);
                                try {
                                  const res = await parseApkgFile(f, apkgStep, apkgSystem);
                                  if (res.imported.length === 0) { showToast("未在 .apkg 中找到有效卡片", "error"); }
                                  else { setApkgPreview(res); }
                                } catch (err) {
                                  showToast(".apkg 解析失败：" + err.message, "error");
                                } finally { setApkgBusy(false); e.target.value = ""; }
                              }} />
                            </label>

                            {apkgPreview && (
                              <div className="p-4 rounded-xl border-2 border-indigo-400 bg-indigo-50/50 space-y-3 mt-2">
                                <div className="flex justify-between items-center font-bold text-indigo-800">
                                  <span>预览 .apkg：共 {apkgPreview.imported.length} 张（新卡 {apkgPreview.imported.filter(c => !c.fsrs?.reps).length} · 今日到期 {apkgPreview.imported.filter(c => c.fsrs?.reps > 0 && c.fsrs.due <= Date.now()).length}）· 含 {apkgPreview.mediaCount} 个媒体</span>
                                  <button onClick={() => setApkgPreview(null)} className="text-slate-500 hover:text-rose-600">取消</button>
                                </div>
                                <div className="max-h-52 overflow-y-auto space-y-2">
                                  {apkgPreview.imported.slice(0, 8).map((c, idx) => (
                                    <div key={idx} className="p-2.5 rounded-lg bg-white border text-xs">
                                      <div className="font-bold text-indigo-700">#{idx + 1} · {c.originalDeck || c.system} · {c.fsrs?.reps ? `已复习 ${c.fsrs.reps} 次` : "新卡"}</div>
                                      <div className="text-slate-700 line-clamp-2 mt-0.5 anki-html" dangerouslySetInnerHTML={{ __html: c.text }} />
                                    </div>
                                  ))}
                                  {apkgPreview.imported.length > 8 && <div className="text-center text-slate-400">... 还有 {apkgPreview.imported.length - 8} 张卡片</div>}
                                </div>
                                <div className="flex justify-end gap-2">
                                  <button onClick={() => setApkgPreview(null)} className="px-4 py-2 rounded-lg bg-white border font-bold">取消</button>
                                  <button onClick={() => {
                                    setAnkiCards(prev => [...apkgPreview.imported, ...prev]);
                                    showToast(`确认成功！已导入 ${apkgPreview.imported.length} 张卡片至 ${apkgStep} · ${apkgSystem}`, "success");
                                    setApkgPreview(null);
                                    setAnkiMgrTab("browse");
                                  }} className="px-5 py-2 rounded-lg bg-indigo-700 text-white font-bold">确认导入这 {apkgPreview.imported.length} 张卡片</button>
                                </div>
                              </div>
                            )}
                          </div>

                          <div className="p-4 rounded-xl bg-amber-50 border border-amber-200 space-y-2.5">
                            <div className="font-bold text-amber-900">2. 导出为原生 .apkg 牌组（含媒体图片、每日上限预设与学习进度）：</div>
                            <button disabled={apkgBusy || ankiCards.length === 0} onClick={async () => {
                              setApkgBusy(true);
                              try {
                                const blob = await exportApkgFile(ankiCards, ankiNewLimit, ankiRevLimit);
                                const a = document.createElement("a");
                                a.href = URL.createObjectURL(blob);
                                a.download = `UWorld_Anki_${ankiStep.replace(/\s+/g, "")}.apkg`;
                                a.click();
                                showToast("已导出原生 .apkg 文件！", "success");
                              } catch (err) {
                                showToast("导出失败：" + err.message, "error");
                              } finally { setApkgBusy(false); }
                            }} className="px-5 py-2.5 rounded-xl bg-amber-600 text-white font-bold">
                              {apkgBusy ? "打包中..." : `导出全部 ${ankiCards.length} 张卡片为 .apkg`}
                            </button>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )}

              {/* MODAL: ANKI STATISTICS DASHBOARD (MULTI-DECK, FORECAST, CARD COUNTS, INTERVALS, RETENTION) */}
              {showAnkiStatsModal && (() => {
                const nowMs = Date.now();
                const scopedCards = ankiCards.filter(c =>
                  (statsStepFilter === "ALL" || (c.step || "Step 1") === statsStepFilter) &&
                  statsSelectedSystems.includes(c.system)
                );
                const scopedCardIds = new Set(scopedCards.map(c => c.id));
                const scopedLogs = ankiRevLog.filter(l => scopedCardIds.has(l.cardId) || (
                  (statsStepFilter === "ALL" || l.step === statsStepFilter) && statsSelectedSystems.includes(l.system)
                ));
                const todayDk = getStudyDateKey(nowMs);
                const todayLogs = scopedLogs.filter(l => l.dayKey === todayDk);
                const todayAgain = todayLogs.filter(l => l.grade === 1).length;

                // Card Counts breakdown (Anki style)
                const cntNew = scopedCards.filter(c => !c.suspended && (!c.fsrs || c.fsrs.reps === 0)).length;
                const cntLearn = scopedCards.filter(c => !c.suspended && c.fsrs && c.fsrs.reps > 0 && (c.fsrs.state === "Learning" || c.fsrs.state === "Relearning")).length;
                const cntYoung = scopedCards.filter(c => !c.suspended && c.fsrs && c.fsrs.reps > 0 && c.fsrs.state === "Review" && (c.fsrs.scheduledDays || 0) < 21).length;
                const cntMature = scopedCards.filter(c => !c.suspended && c.fsrs && c.fsrs.reps > 0 && c.fsrs.state === "Review" && (c.fsrs.scheduledDays || 0) >= 21).length;
                const cntSusp = scopedCards.filter(c => c.suspended).length;
                const totalC = scopedCards.length || 1;

                // Future Due Forecast (0..statsForecastDays)
                const forecastBins = Array.from({ length: statsForecastDays + 1 }, (_, d) => 0);
                let overdueCount = 0;
                scopedCards.forEach(c => {
                  if (c.suspended || !c.fsrs || c.fsrs.reps === 0) return;
                  const diffDays = Math.floor(((c.fsrs.due || nowMs) - nowMs) / 86400000);
                  if (diffDays <= 0) overdueCount++;
                  else if (diffDays <= statsForecastDays) forecastBins[diffDays]++;
                });
                forecastBins[0] = overdueCount;
                const maxForecast = Math.max(1, ...forecastBins);
                const totalForecast = forecastBins.reduce((a, b) => a + b, 0);

                // Interval distribution & Median
                const ivls = scopedCards
                  .filter(c => c.fsrs && c.fsrs.reps > 0)
                  .map(c => c.fsrs.scheduledDays || 0)
                  .sort((a, b) => a - b);
                const medianIvl = ivls.length > 0 ? ivls[Math.floor(ivls.length / 2)] : 0;
                const ivlBuckets = [
                  ["<1天", ivls.filter(x => x < 1).length],
                  ["1–7天", ivls.filter(x => x >= 1 && x <= 7).length],
                  ["8–20天", ivls.filter(x => x >= 8 && x <= 20).length],
                  ["21–60天", ivls.filter(x => x >= 21 && x <= 60).length],
                  ["60天+", ivls.filter(x => x > 60).length]
                ];
                const maxBucket = Math.max(1, ...ivlBuckets.map(b => b[1]));

                // Answer buttons & Retention
                const btnCounts = [1, 2, 3, 4].map(g => scopedLogs.filter(l => l.grade === g).length);
                const passRate = (logs) => logs.length ? Math.round((logs.filter(l => l.grade > 1).length / logs.length) * 1000) / 10 + "%" : "-";

                // Pie conic-gradient
                const pNew = (cntNew / totalC) * 100;
                const pLearn = (cntLearn / totalC) * 100;
                const pYoung = (cntYoung / totalC) * 100;
                const pMature = (cntMature / totalC) * 100;
                const pieBg = scopedCards.length === 0 ? "#e2e8f0" :
                  `conic-gradient(#38bdf8 0% ${pNew}%, #fb923c ${pNew}% ${pNew + pLearn}%, #4ade80 ${pNew + pLearn}% ${pNew + pLearn + pYoung}%, #16a34a ${pNew + pLearn + pYoung}% ${pNew + pLearn + pYoung + pMature}%, #eab308 ${pNew + pLearn + pYoung + pMature}% 100%)`;

                return (
                  <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-3 sm:p-6">
                    <div className="w-full max-w-5xl bg-slate-50 text-slate-900 rounded-2xl shadow-2xl flex flex-col max-h-[92vh]">
                      <div className="px-5 py-4 bg-white border-b rounded-t-2xl flex justify-between items-center">
                        <div className="font-extrabold text-lg flex items-center gap-2">📊 Anki 统计分析面板</div>
                        <button onClick={() => setShowAnkiStatsModal(false)}><Icon name="x" className="w-5 h-5 text-slate-400" /></button>
                      </div>

                      {/* Multi-Deck Selector */}
                      <div className="px-5 py-3 bg-white border-b space-y-2 text-xs">
                        <div className="flex flex-wrap items-center justify-between gap-2">
                          <div className="flex items-center gap-2">
                            <span className="font-bold text-slate-600">范围:</span>
                            {["ALL", "Step 1", "Step 2"].map(st => (
                              <button key={st} onClick={() => setStatsStepFilter(st)} className={`px-3 py-1 rounded-lg font-bold ${statsStepFilter === st ? "bg-indigo-700 text-white" : "bg-slate-100 text-slate-600"}`}>{st === "ALL" ? "全部 Step" : st}</button>
                            ))}
                          </div>
                          <div className="flex gap-2">
                            <button onClick={() => setStatsSelectedSystems(ALL_SYSTEMS_UNIQUE.map(s => s.id))} className="text-indigo-600 font-bold">全选系统</button>
                            <button onClick={() => setStatsSelectedSystems([])} className="text-slate-400">清空</button>
                          </div>
                        </div>
                        <div className="flex flex-wrap gap-1.5 max-h-20 overflow-y-auto">
                          {ALL_SYSTEMS_UNIQUE.filter(s => ankiCards.some(c => c.system === s.id)).map(sys => {
                            const on = statsSelectedSystems.includes(sys.id);
                            return (
                              <button key={sys.id} onClick={() => setStatsSelectedSystems(p => on ? p.filter(i => i !== sys.id) : [...p, sys.id])} className={`px-2 py-0.5 rounded-full border text-[11px] font-semibold ${on ? "bg-indigo-100 border-indigo-400 text-indigo-800" : "bg-slate-50 border-slate-200 text-slate-400"}`}>
                                {sys.id} ({ankiCards.filter(c => c.system === sys.id).length})
                              </button>
                            );
                          })}
                        </div>
                      </div>

                      <div className="p-5 overflow-y-auto space-y-5 text-xs">
                        {/* 1. Today */}
                        <div className="bg-white rounded-xl border p-4 text-center space-y-1">
                          <div className="text-sm font-bold text-slate-800">今天</div>
                          <p className="text-slate-600">
                            今天在 <strong>{Math.round((todayStats.studySec || 0) / 6) / 10} 分钟</strong>内学习了 <strong>{todayLogs.length}</strong> 张卡片 · 「重来」计数：<strong>{todayAgain}</strong> ({todayLogs.length ? Math.round((todayAgain / todayLogs.length) * 1000) / 10 : 0}%)
                          </p>
                        </div>

                        {/* 2. Forecast */}
                        <div className="bg-white rounded-xl border p-4 space-y-3">
                          <div className="flex justify-between items-center">
                            <span className="text-sm font-bold text-slate-800">预测：将来到期的复习数目</span>
                            <div className="flex gap-1.5">
                              {[30, 90].map(d => (
                                <button key={d} onClick={() => setStatsForecastDays(d)} className={`px-2.5 py-1 rounded font-bold ${statsForecastDays === d ? "bg-emerald-600 text-white" : "bg-slate-100 text-slate-600"}`}>{d === 30 ? "1个月" : "3个月"}</button>
                              ))}
                            </div>
                          </div>
                          <div className="h-36 flex items-end gap-0.5 pt-4 border-b border-slate-200">
                            {forecastBins.map((cnt, d) => (
                              <div key={d} title={`+${d}天: ${cnt}张`} className="flex-1 flex flex-col items-center justify-end h-full group relative">
                                <div style={{ height: `${Math.max(cnt > 0 ? 4 : 0, Math.round((cnt / maxForecast) * 100))}%` }} className={`w-full rounded-t ${d === 0 ? "bg-rose-500" : "bg-emerald-500"}`} />
                              </div>
                            ))}
                          </div>
                          <div className="flex flex-wrap justify-around text-slate-600 pt-1">
                            <span>今日到期/逾期: <strong className="text-rose-600">{forecastBins[0]}</strong></span>
                            <span>明天到期: <strong className="text-emerald-700">{forecastBins[1] || 0}</strong></span>
                            <span>未来 {statsForecastDays} 天总计: <strong>{totalForecast}</strong> 次复习</span>
                            <span>平均: <strong>{Math.round(totalForecast / statsForecastDays)}</strong> 次/天</span>
                          </div>
                        </div>

                        {/* 3. Card Counts + Intervals */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          <div className="bg-white rounded-xl border p-4 space-y-3">
                            <div className="text-sm font-bold text-slate-800">卡片数量 ({scopedCards.length} 张)</div>
                            <div className="flex items-center justify-around gap-4">
                              <div className="w-28 h-28 rounded-full border shrink-0" style={{ background: pieBg }} />
                              <div className="space-y-1.5 flex-1">
                                {[
                                  ["未学习 (New)", cntNew, "bg-sky-400"],
                                  ["学习中 (Learning)", cntLearn, "bg-orange-400"],
                                  ["欠熟练 (<21天)", cntYoung, "bg-green-400"],
                                  ["已熟练 (≥21天)", cntMature, "bg-green-600"],
                                  ["已暂停 (Suspended)", cntSusp, "bg-yellow-500"]
                                ].map(([lbl, cnt, dot]) => (
                                  <div key={lbl} className="flex justify-between items-center">
                                    <span className="flex items-center gap-1.5"><span className={`w-2.5 h-2.5 rounded-sm ${dot}`} />{lbl}</span>
                                    <span className="font-mono font-bold">{cnt} ({Math.round((cnt / totalC) * 1000) / 10}%)</span>
                                  </div>
                                ))}
                              </div>
                            </div>
                          </div>

                          <div className="bg-white rounded-xl border p-4 space-y-3">
                            <div className="flex justify-between items-center">
                              <span className="text-sm font-bold text-slate-800">复习间隔分布</span>
                              <span className="font-bold text-indigo-700">间隔中位数: {medianIvl} 天</span>
                            </div>
                            <div className="h-28 flex items-end gap-3 pt-2 border-b">
                              {ivlBuckets.map(([lbl, cnt]) => (
                                <div key={lbl} className="flex-1 flex flex-col items-center justify-end h-full">
                                  <span className="text-[10px] font-mono text-slate-500 mb-0.5">{cnt}</span>
                                  <div style={{ height: `${Math.max(cnt > 0 ? 6 : 0, Math.round((cnt / maxBucket) * 80))}%` }} className="w-full bg-sky-500 rounded-t" />
                                </div>
                              ))}
                            </div>
                            <div className="flex justify-between text-[10px] text-slate-500">
                              {ivlBuckets.map(([lbl]) => <span key={lbl} className="flex-1 text-center">{lbl}</span>)}
                            </div>
                          </div>
                        </div>

                        {/* 4. Retention & Answer Buttons */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          <div className="bg-white rounded-xl border p-4 space-y-2">
                            <div className="text-sm font-bold text-slate-800">记忆保留率 (通过率)</div>
                            <div className="grid grid-cols-3 text-center py-2 border-b font-bold text-slate-500">
                              <span>时间段</span><span>通过率</span><span>复习次数</span>
                            </div>
                            {[
                              ["今天", todayLogs],
                              ["近 7 天", scopedLogs.filter(l => nowMs - l.ts <= 7 * 86400000)],
                              ["全部记录", scopedLogs]
                            ].map(([lbl, arr]) => (
                              <div key={lbl} className="grid grid-cols-3 text-center py-1.5 border-b last:border-0">
                                <span className="font-semibold">{lbl}</span>
                                <span className="font-bold text-emerald-600">{passRate(arr)}</span>
                                <span className="font-mono">{arr.length}</span>
                              </div>
                            ))}
                          </div>

                          <div className="bg-white rounded-xl border p-4 space-y-2">
                            <div className="text-sm font-bold text-slate-800">回答按钮统计</div>
                            <div className="grid grid-cols-4 gap-2 pt-3 text-center">
                              {[
                                ["Again 重来", btnCounts[0], "bg-rose-100 text-rose-800"],
                                ["Hard 困难", btnCounts[1], "bg-amber-100 text-amber-800"],
                                ["Good 良好", btnCounts[2], "bg-emerald-100 text-emerald-800"],
                                ["Easy 简单", btnCounts[3], "bg-sky-100 text-sky-800"]
                              ].map(([lbl, cnt, cls]) => (
                                <div key={lbl} className={`p-3 rounded-xl ${cls}`}>
                                  <div className="font-bold">{lbl}</div>
                                  <div className="text-xl font-black mt-1">{cnt}</div>
                                </div>
                              ))}
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                );
              })()}

              {/* MODAL: MISTAKE FSRS, LAB, NOTES, ZOOM, AUTH */}
              {showMistakeModal && (
                <div className="fixed inset-0 z-50 bg-slate-950/75 flex items-center justify-center p-4">
                  <div className="w-full max-w-3xl bg-white rounded-2xl shadow-2xl p-5 max-h-[88vh] flex flex-col space-y-4">
                    <div className="flex justify-between items-center border-b pb-3">
                      <h3 className="font-bold text-lg">FSRS 错题记忆复习 ({dueMistakes.length} 到期)</h3>
                      <button onClick={() => setShowMistakeModal(false)}><Icon name="x" className="w-5 h-5" /></button>
                    </div>
                    <div className="overflow-y-auto flex-1 space-y-4">
                      {!currentFsrsCard ? (
                        <div className="text-center py-12 text-slate-500">🎉 今日到期错题已全部复习完毕！</div>
                      ) : (
                        <>
                          <div className="text-xs font-bold text-blue-700">{currentFsrsCard.step} · {currentFsrsCard.system}</div>
                          <p className="font-serif-clinical text-sm leading-relaxed">{currentFsrsCard.stem}</p>
                          <div className="space-y-1.5">
                            {Object.entries(currentFsrsCard.options || {}).map(([k, v]) => (

                              if (Array.isArray(d.medEngCards)) setMedEngCards(d.medEngCards);
                              if (Array.isArray(d.medEngMistakes)) setMedEngMistakes(d.medEngMistakes);
                              if (Array.isArray(d.medEngRevLog)) setMedEngRevLog(d.medEngRevLog);
                              if (Array.isArray(d.ankiRevLog)) setAnkiRevLog(d.ankiRevLog);
                              if (d.attemptedMap) setAttemptedMap(d.attemptedMap);
                              if (Array.isArray(d.markedIds)) setMarkedIds(d.markedIds);
                              if (d.notesMap) setNotesMap(d.notesMap);
                              if (d.highlightsMap) setHighlightsMap(d.highlightsMap);
                              if (d.dailyLogs) setDailyLogs(d.dailyLogs);
                              showToast("已从本地备份完整恢复全部数据！", "success");
                            } catch { showToast("备份文件格式无效", "error"); }
                          };
                          reader.readAsText(f);
                          e.target.value = "";
                        }} />
                      </label>
                    </div>
                  </div>
                </div>
              )}
            </>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
