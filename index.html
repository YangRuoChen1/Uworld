 depriving the heart tissue of sufficient oxygen and nutrients to function normally; most often caused by coronary atherosclerosis. CAD is a common cause of heart failure and myocardial infarction.","Ch.10 Cardiovascular, immune, lymphatic systems and blood · coronary artery disease (CAD) (KOR- o-nar-ē) (AR- te-rē) (di- ZĒZ)"],[9,2,"","cor pulmonale","enlargement of the heart's right ventricle due to pulmonary disease","Ch.10 Cardiovascular, immune, lymphatic systems and blood · cor pulmonale (kor) (pul- mō-NAL-ē)"],[9,2,"","deep vein thrombosis (DVT)","condition of thrombus (blood clot) in a deep vein of the body. Most often occurs in the lower extremities. A clot, or part of a clot, can break off and travel to the lungs, causinga pulmonary embolism.","Ch.10 Cardiovascular, immune, lymphatic systems and blood · deep vein thrombosis (DVT) (dēp) (vān) (throm- BŌ-sis)"],[9,2,"","fibrillation","rapid, quivering, uncoordinated contractions of the atria or ventricles causing cardiac arrhythmia","Ch.10 Cardiovascular, immune, lymphatic systems and blood · fibrillation (fi-bri-LĀ- shun)"],[9,2,"","heart failure (HF)","condition in which there is an inability of the heart to pump enough blood through the body to supply the tissues and organs with nutrients and oxygen (also called congestive heart failure [CHF])","Ch.10 Cardiovascular, immune, lymphatic systems and blood · heart failure (HF) (hart) (fāl-ŪR)"],[9,2,"","hypertensive heart disease (HHD)","disorder of the heart caused by persistent high blood pressure; it may be associated with hypertrophy (abnormal thickening of the heart muscle) or dilation of the chambers of the heart (due to thinning and stretching of the heart muscle)","Ch.10 Cardiovascular, immune, lymphatic systems and blood · hypertensive heart disease (HHD) (hī- per-TEN-siv) (hart) (di- ZĒZ)"],[9,2,"","intermittent claudication","condition of pain, tension and weakness in a limb that starts when walking is begun, increases until walking is no longer possible, and then completely resolves when the patient is at rest. It is caused by reversible muscle ischemia that occurs with peripheral artery disease.","Ch.10 Cardiovascular, immune, lymphatic systems and blood · intermittent claudication (in-ter-MIT- ent) (klaw- di-KĀ-shun)"],[9,2,"","mitral valve stenosis","narrowing of the mitral valve from scarring, usually caused by episodes of rheumatic fever","Ch.10 Cardiovascular, immune, lymphatic systems and blood · mitral valve stenosis (MĪ- tral) (ste-NŌ- sis)"],[9,2,"","myocardial infarction (MI)","death (necrosis) of a portion of the myocardium caused by lack of oxygen resulting from an interrupted blood supply (also called heart attack)","Ch.10 Cardiovascular, immune, lymphatic systems and blood · myocardial infarction (MI) (mī-ō- KAR-dē-al) (in-FARK- shun)"],[9,2,"","peripheral artery disease (PAD)","disease of the arteries in the arms and legs, resulting in narrowing or complete obstruction of the artery. This is caused most commonly by atherosclerosis, but occasionally by inflammatory diseases, emboli, or thrombus formation. The most common symptom of peripheral artery disease is intermittent claudication. (also called peripheral vascular disease [PVD])","Ch.10 Cardiovascular, immune, lymphatic systems and blood · peripheral artery disease (PAD) (pe- RIF-er-al) (AR-ter-ē) (di-ZĒZ)"],[9,2,"","rheumatic heart disease","damage to the heart muscle or heart valves caused by one or more episodes of rheumatic fever","Ch.10 Cardiovascular, immune, lymphatic systems and blood · rheumatic heart disease (rū-MAT-ik) (hart) (di- ZĒZ)"],[9,2,"","varicose veins","distended or tortuous veins usually found in the lower extremities (Fig. 10.12)","Ch.10 Cardiovascular, immune, lymphatic systems and blood · varicose veins (VAR- i-kōs) (vānz)"],[9,2,"","artificial cardiac pacemaker","battery-powered apparatus implanted under the skin with leads placed on the heart or in the chamber of the heart used to treat an abnormal heart rhythm, usually one that is too slow, secondary to an abnormal sinus node","Ch.10 Cardiovascular, immune, lymphatic systems and blood · artificial cardiac pacemaker (ar-ti- FISH-el) (KAR-dē- ak) (PĀS-mā-kr)"],[9,2,"","automatic implantable cardiac defibrillator (AICD)","device implanted in the body that continuously monitors the heart rhythm. If life-threatening arrhythmias occur, the device delivers an electric shock to convert the arrhythmia back to a normal rhythm.","Ch.10 Cardiovascular, immune, lymphatic systems and blood · automatic implantable cardiac defibrillator (AICD) (aw-to- MAT-ik) (im- PLANT-a-bl) (KAR-dē-ak) (dē- FIB-ri-lā-tor)"],[9,2,"","catheter ablation","procedure in which abnormal cells that trigger abnormal heart rhythms (arrhythmias) are destroyed by usinga device that heats or freezes the cells (Fig. 10.13)","Ch.10 Cardiovascular, immune, lymphatic systems and blood · catheter ablation (KATH-e-ter) (ab- LĀ-shun)"],[9,2,"","coronary artery bypass graft (CABG)","surgical technique to bringa new blood supply to heart muscle by detouring around blocked arteries","Ch.10 Cardiovascular, immune, lymphatic systems and blood · coronary artery bypass graft (CABG) (KOR-o- nar-ē) (AR-te-rē) (BĪ-pas) (graft)"],[9,2,"","coronary stent","supportive scaffold device placed in the coronary artery; used to prevent closure of the artery after angioplasty or atherectomy; used to treat an artery occluded by plaque","Ch.10 Cardiovascular, immune, lymphatic systems and blood · coronary stent (KOR-o-nar-ē) (stent)"],[9,2,"","femoropopliteal bypass","surgery to establish an alternate route from femoral artery to popliteal artery to bypass an obstruction","Ch.10 Cardiovascular, immune, lymphatic systems and blood · femoropopliteal bypass (fem-o-rō- pop-LIT-ē-al) (BĪ- pass)"],[9,2,"","percutaneous transluminal coronary angioplasty (PTCA)","procedure in whicha balloon is advanced intoa coronary artery to the area where plaque has formed. When the balloon is inflated, the vessel wall expands, allowing blood to flow more freely. (also called balloon angioplasty)","Ch.10 Cardiovascular, immune, lymphatic systems and blood · percutaneous transluminal coronary angioplasty (PTCA) (per-kū- TĀ-nē-us) (trans- LŪ-min-al) (KOR- o-nar-ē) (AN-jē-ō- plas-tē)"],[9,2,"","thrombolytic therapy","injection of a medication either intravenously or intra-arterially to dissolve blood clots. It is often used in emergency departments for acute myocardial infarction.","Ch.10 Cardiovascular, immune, lymphatic systems and blood · thrombolytic therapy (throm-bō- LIT-ik) (THER-a- pē)"],[9,2,"","digital subtraction angiography (DSA)","process of digital radiographic imaging of the blood vessels that \"subtracts\" or removes structures not being studied (see Table 10.1)","Ch.10 Cardiovascular, immune, lymphatic systems and blood · digital subtraction angiography (DSA) (DIJ-i-tal) (sub-TRAK- shun) (an-jē-OG- ra-fē)"],[9,2,"","Doppler ultrasound","study that uses high-frequency sound waves for detection of blood flow within the vessels; used to assess intermittent claudication, deep vein thrombosis, and other blood flow abnormalities","Ch.10 Cardiovascular, immune, lymphatic systems and blood · Doppler ultrasound (DOP-ler) (UL- tra-sound)"],[9,2,"","sestamibi test","nuclear medicine test used to diagnose coronary artery disease and assess revascularization after coronary artery bypass surgery. Sestamibi, a radioactive isotope, is taken up by normal myocardial cells, but not in ischemia or infarction. These areas are identified as \"cold\" spots on the images produced.","Ch.10 Cardiovascular, immune, lymphatic systems and blood · sestamibi test (ses-ta-MIB-ē) (test)"],[9,2,"","single-photon emission computed tomography (SPECT)","nuclear medicine test that collectsa series of images (projections) as a Gamma camera rotates around the patient. These projections are then used by a computer to generate three dimensional pictures; it also helps show the function of organs, such as coronary artery flow or active and inactive areas of the brain.","Ch.10 Cardiovascular, immune, lymphatic systems and blood · single-photon emission computed tomography (SPECT) (SING- el) (FŌ-ton) (ē- MISH-on) (com- PŪ-ted) (tō- MOG-ra-fē)"],[9,2,"","transesophageal echocardiogram (TEE)","ultrasound test that examines cardiac function and structure by using an ultrasound probe placed in the esophagus, which provides more direct views of the heart structures","Ch.10 Cardiovascular, immune, lymphatic systems and blood · transesophageal echocardiogram (TEE) (trans-e- sof-a-JĒ-al) (ek-ō- KAR-dē-ō-gram)"],[9,2,"","cardiac catheterization","diagnostic procedure performed by passinga catheter into the heart froma blood vessel in the groin or arm to examine the condition of the heart and surrounding blood vessels; used to diagnose and treat cardiovascular conditions such as coronary artery disease","Ch.10 Cardiovascular, immune, lymphatic systems and blood · cardiac catheterization (KAR-dē-ak) (kath-e-ter-i- ZĀ-shun)"],[9,2,"","exercise stress test","study that evaluates cardiac function during physical stress by ridinga bike or walking on a treadmill. Electrocardiography is the most common method, but echocardiography and nuclear medicine scanning (diagnostic imaging tests) can also be used to measure cardiac function while exercising.","Ch.10 Cardiovascular, immune, lymphatic systems and blood · exercise stress test (EK-ser- sīz) (stres) (test)"],[9,2,"","blood pressure (BP)","pressure exerted by the blood against the blood vessel walls. A blood pressure measurement written as systolic pressure (120) and diastolic pressure (80) is commonly recorded as 120/80 (blood pressure is measured in millimeters of mercury [mm Hg]).","Ch.10 Cardiovascular, immune, lymphatic systems and blood · blood pressure (BP) (blud) (PRES-ūr)"],[9,2,"","pulse","contraction of the heart, which can be felt witha fingertip. The pulse is most commonly felt over the radial artery (in the wrist); however, the pulsations can be felt overa number of sites, including the femoral (groin) and carotid (neck) arteries.","Ch.10 Cardiovascular, immune, lymphatic systems and blood · pulse (puls)"],[9,2,"","sphygmomanomet er","device used for measuring blood pressure","Ch.10 Cardiovascular, immune, lymphatic systems and blood · sphygmomanomet er (sfig-mō-ma- NOM-e-ter)"],[9,2,"","C-reactive protein (CRP) (C)-","blood test to measure the amount of C-reactive protein in the blood, which when elevated, indicates inflammation in the body. It is sometimes used in assessing the risk of cardiovascular disease.","Ch.10 Cardiovascular, immune, lymphatic systems and blood · C-reactive protein (CRP) (C)-(rē-AK-tiv) (PRŌ-tēn)"],[9,2,"","creatine phosphokinase (CPK)","blood test used to measure the level of creatine phosphokinase, an enzyme of heart and skeletal muscle released into the blood after muscle injury or necrosis. The test is useful in evaluating patients with acute myocardial infarction.","Ch.10 Cardiovascular, immune, lymphatic systems and blood · creatine phosphokinase (CPK) (KRĒ-a- tin) (fos-fō-KĪ- nās)"],[9,2,"","lipid profile","blood test used to measure the amount and type of lipids (fat-like substances) in a sample of blood. This test is used to evaluate one of the risks of cardiovascular disease, and to monitor therapy for patients taking lipid-lowering medications. (Table 10.2)","Ch.10 Cardiovascular, immune, lymphatic systems and blood · lipid profile (LIP-id) (PRŌ- fīl)"],[9,2,"","troponin","blood test that measures troponin, a heart muscle enzyme. Troponins are released into the blood approximately 3 hours after necrosis of the heart muscle and may remain elevated from 7 to 10 days. The test is useful in the diagnosis of a myocardial infarction.","Ch.10 Cardiovascular, immune, lymphatic systems and blood · troponin (TRŌ- pō-nin)"],[9,2,"","bruit","sound heard over an artery during auscultation resulting from vibration in the vessel wall caused by turbulent blood flow. Bruits are frequently caused by abnormal narrowing of an artery.","Ch.10 Cardiovascular, immune, lymphatic systems and blood · bruit (broo-Ē)"],[9,2,"","hypercholesterolemia","excessive amount of cholesterol in the blood; associated with an increased risk of cardiovascular disease","Ch.10 Cardiovascular, immune, lymphatic systems and blood · hypercholesterolemi a (hī-per-k-les-ter-ol- Ē-mē-a)"],[9,2,"","hyperlipidemia","excessive amount of any type of fats (lipoproteins, triglycerides, and cholesterol) in the blood; associated with an increased risk of cardiovascular disease","Ch.10 Cardiovascular, immune, lymphatic systems and blood · hyperlipidemia (hī- per-lip-i-DĒ-mē-a)"],[9,2,"","hypertension (HTN)","blood pressure that is above normal (greater than 130/80 mm Hg in adults under the age of 60)","Ch.10 Cardiovascular, immune, lymphatic systems and blood · hypertension (HTN) (hī-per-TEN-shun)"],[9,2,"","hypertriglyceridemia","excessive amount of triglycerides in the blood; associated with an increased risk of cardiovascular disease","Ch.10 Cardiovascular, immune, lymphatic systems and blood · hypertriglyceridemi a (hī-per-trī-glis-er-rī- DĒ-mē-a)"],[9,2,"","hypotension","blood pressure that is below normal (less than 90/60 mm Hg in adults under the age of 60)","Ch.10 Cardiovascular, immune, lymphatic systems and blood · hypotension (hī-pō- TEN-shun)"],[9,2,"","murmur","unusual sound heard during auscultation of the heart caused by turbulent blood flow. It may be \"innocent\" (not indicating disease), or it may reflect disease or malformation, such as an abnormal heart valve.","Ch.10 Cardiovascular, immune, lymphatic systems and blood · murmur (MER-mer)"],[9,2,"","occlusion","closing or blockage of a blood vessel or hollow organ","Ch.10 Cardiovascular, immune, lymphatic systems and blood · occlusion (a-KLOO- shun)"],[9,2,"","cardiopulmonary resuscitation (CPR)","emergency procedure consisting of external cardiac compressions; may be accompanied by artificial ventilation","Ch.10 Cardiovascular, immune, lymphatic systems and blood · cardiopulmonary resuscitation (CPR) (kar-dē-ō-PUL-mo-nar- ē) (rē-sus-i-TĀ-shun)"],[9,2,"","defibrillation","application of an electric shock to the myocardium through the chest wall to restore normal cardiac rhythm (Fig. 10.14)","Ch.10 Cardiovascular, immune, lymphatic systems and blood · defibrillation (dē-fib-ri- LĀ-shun)"],[9,2,"","vasoconstrictor","agent that narrows the diameter of the blood vessels","Ch.10 Cardiovascular, immune, lymphatic systems and blood · vasoconstrictor (vās-ō- kon-STRIK-tor)"],[9,2,"","vasodilator","agent that expands the diameter of the blood vessels","Ch.10 Cardiovascular, immune, lymphatic systems and blood · vasodilator (vās-ō-DĪ- lā-tor)"],[9,2,"","anemia","condition in which there is a reduction in the number of erythrocytes (RBCs). Anemia may be caused by blood loss, by decreased production of RBCs, or by increased destruction of RBCs. (Table 10.3)","Ch.10 Cardiovascular, immune, lymphatic systems and blood · anemia (a- NĒ-mē-a)"],[9,2,"","bleeding disorder","disease in which there is an inability to form proper blood clots; examples include hemophilia, von Willebrand disease, and bleeding factor deficiencies","Ch.10 Cardiovascular, immune, lymphatic systems and blood · bleeding disorder (BLĒD-ing) (dis-OR- der)"],[9,2,"","hemophilia","inherited bleeding disorder most commonly caused by a deficiency of the coagulation factor VIII","Ch.10 Cardiovascular, immune, lymphatic systems and blood · hemophili a (hē-mō- FIL-ē-a)"],[9,2,"","leukemia","malignant disease characterized by excessive increase in abnormal leukocytes (white blood cells) formed in the bone marrow (Table 10.4)","Ch.10 Cardiovascular, immune, lymphatic systems and blood · leukemia (lū-KĒ-mē- a)"],[9,2,"","sepsis","systemic inflammatory response caused by pathogenic microorganisms, usually bacteria, entering the bloodstream and multiplying; life- threatening condition, which may lead to tissue damage, organ failure, and death. The overwhelming presence of pathogens in the blood is called septicemia.","Ch.10 Cardiovascular, immune, lymphatic systems and blood · sepsis (SEP-sis)"],[9,2,"","sickle cell disease","group of inherited red blood cell disorders (anemias) where hemoglobin is abnormally shaped and has a shorter life cycle","Ch.10 Cardiovascular, immune, lymphatic systems and blood · sickle cell disease (SI- kl) (sel) (di- ZĒZ)"],[9,2,"","thalassemia","inherited bleeding disorder causing reduced production of healthy blood cells and hemoglobin","Ch.10 Cardiovascular, immune, lymphatic systems and blood · thalassemi a (thal-a- SĒ-mē-ah)"],[9,2,"","bone marrow aspiration","procedure to obtaina sample of the liquid portion of the bone marrow, usually from the ilium (upper hip bone) for study; used to diagnose leukemia, infections, some types of anemia, and other blood disorders","Ch.10 Cardiovascular, immune, lymphatic systems and blood · bone marrow aspiration (bōn) (MAR-ō) (as-pi-RĀ- shun)"],[9,2,"","bone marrow biopsy","procedure to obtaina sample of the solid portion of bone marrow, usually from the ilium, for study; used to diagnose leukemia, infections, some types of anemia, and other blood disorders. May be performed at the same time as bone marrow aspiration.","Ch.10 Cardiovascular, immune, lymphatic systems and blood · bone marrow biopsy (bōn) (MAR-ō) (BĪ-op-sē)"],[9,2,"","activated partial thromboplastin time","blood test that measures the ability of the blood to clot by assessing intrinsic blood factors. Used to evaluate bleeding disorders such as hemophilia A and B and monitor some types of anticoagulation therapy such as heparin. Frequently ordered in conjunction with prothrombin time (PT/INR).","Ch.10 Cardiovascular, immune, lymphatic systems and blood · activated partial thromboplastin time (aPTT) (AK-ti-vāt-ed) (PAR-shel) (throm-bō- PLAS-tin) (tīm)"],[9,2,"","bleeding profile","series of tests that measure the ability of various factors in the blood to forma clot. Usually includes PT/INR, aPTT, thrombin time, and tests for platelets and fibrinogen.","Ch.10 Cardiovascular, immune, lymphatic systems and blood · bleeding profile (BLĒD-ing) (PRŌ-fīl)"],[9,2,"","complete blood count with differential","laboratory test for basic blood screening that measures various aspects of erythrocytes, leukocytes, and thrombocytes (platelets); this automated test quickly providesa tremendous amount of information about the blood","Ch.10 Cardiovascular, immune, lymphatic systems and blood · complete blood count with differential (CBC with diff) (com-PLĒT) (blud) (kownt) (with) (dif-er- EN-shal)"],[9,2,"","hematocrit","percentage of a blood sample that is composed of erythrocytes. It is used in the diagnosis and evaluation of anemic patients.","Ch.10 Cardiovascular, immune, lymphatic systems and blood · hematocrit (Hct) (hē-MAT- o-crit)"],[9,2,"","hemoglobin","blood test that measures the amount of hemoglobin (the protein in red blood cells that carries oxygen) in the blood","Ch.10 Cardiovascular, immune, lymphatic systems and blood · hemoglobin (Hgb) (HĒ-mō- glō-bin)"],[9,2,"","prothrombin time (PT/INR)","blood test that measures the ability of the blood to clot by assessing extrinsic blood factors. Used to evaluate bleeding disorders such as those caused by liver disease or vitamin K deficiency, or to monitor anticoagulation therapy such as warfarin. Frequently ordered in conjunction with activated partial thromboplastin time (aPTT).","Ch.10 Cardiovascular, immune, lymphatic systems and blood · prothrombin time (PT/INR) (prō-THROM- bin) (tīm)"],[9,2,"","bone marrow transplant (BMT)","infusion of healthy bone marrow cells froma matched donor intoa patient with severely diseased or damaged bone marrow; the donor cells may establisha colony of new, healthy tissue in the recipient's bone marrow","Ch.10 Cardiovascular, immune, lymphatic systems and blood · bone marrow transplant (BMT) (bōn) (MAR-ō) (TRANS- plant)"],[9,2,"","peripheral blood stem cell transplant (PBSCT)","infusion of blood-forming cells (stem cells) to replace blood cells damaged by disease or treatments, such as chemotherapy; stem cells are collected by apheresis, a process in which blood is removed from the patient or a matched donor and spun througha machine to harvest stem cells","Ch.10 Cardiovascular, immune, lymphatic systems and blood · peripheral blood stem cell transplant (PBSCT) (pe-RIF-er- al)(blud) (stem) (sel) (TRANS- plant)"],[9,2,"","perfusionist","person who operates the heart-lung machine during surgeries where the patient's blood must be oxygenated outside of the body; perfusionists monitor and are responsible for the circulatory and respiratory function of the patient during cardiothoracic surgery","Ch.10 Cardiovascular, immune, lymphatic systems and blood · perfusionist (per-FŪ- shun-ist)"],[9,2,"","phlebotomi st","person who performs venipuncture for the purpose of drawing blood or injecting IV fluids","Ch.10 Cardiovascular, immune, lymphatic systems and blood · phlebotomi st (fle-BOT- ō-mist)"],[9,2,"","anticoagula nt","agent that slows the blood clotting process","Ch.10 Cardiovascular, immune, lymphatic systems and blood · anticoagula nt (an-tī-kō- AG-ū-lant)"],[9,2,"","blood dyscrasia","any abnormal or pathologic condition of the blood","Ch.10 Cardiovascular, immune, lymphatic systems and blood · blood dyscrasia (blud) (dis- KRĀ-zha)"],[9,2,"","extravasation","escape of blood or other fluid froma vessel into the tissue","Ch.10 Cardiovascular, immune, lymphatic systems and blood · extravasatio n (ek-strav-a- SĀ-shun)"],[9,2,"","venipuncture","procedure used to puncturea vein witha needle to remove blood, instilla medication, or start an intravenous infusion (also called phlebotomy)","Ch.10 Cardiovascular, immune, lymphatic systems and blood · venipunctur e (VEN-i- punk-chur)"],[9,2,"","infectious mononucleosis","acute infection caused by the Epstein-Barr virus characterized by swollen lymph nodes, sore throat, fatigue, and fever. The disease affects mostly young people and is often transmitted by saliva.","Ch.10 Cardiovascular, immune, lymphatic systems and blood · infectious mononucleosis (in-FEK-shus) (mon-ō-nū-klē- Ō-sis)"],[9,2,"","lymphedema","swelling of tissue, usually of one arm or leg, caused by faulty lymphatic drainage","Ch.10 Cardiovascular, immune, lymphatic systems and blood · lymphedema (lim-fi-DĒ-ma)"],[9,2,"","acquired immunodeficiency syndrome (AIDS)","advanced, chronic immune system suppression caused by human immunodeficiency virus (HIV) infection; manifested by opportunistic infections (such as candidiasis and tuberculosis), neurologic disease (peripheral neuropathy and cognitive motor impairment), and secondary neoplasms (Kaposi sarcoma)","Ch.10 Cardiovascular, immune, lymphatic systems and blood · acquired immunodeficiency syndrome (AIDS) (a-KWĪRD) (im-ū- nō-de-FISH-en-sē) (SIN-drōm)"],[9,2,"","allergy","hypersensitivity to a substance, resulting in an inflammatory immune response","Ch.10 Cardiovascular, immune, lymphatic systems and blood · allergy (AL-er-jē)"],[9,2,"","anaphylaxis","exaggerated reaction to a previously encountered antigen such as bee venom, peanuts, or latex. While symptoms may initially be mild, such as hives or sneezing, anaphylaxis can quickly become severe. When it leads to a drop in blood pressure and blockage of the airway (which can lead to death within minutes), it is called anaphylactic shock.","Ch.10 Cardiovascular, immune, lymphatic systems and blood · anaphylaxis (an-a- fe-LAK-sis)"],[9,2,"","autoimmune disease","disease caused by the body's inability to distinguish its own cells from foreign bodies, thus producing antibodies that attack its own tissue. Rheumatoid arthritis and systemic lupus erythematosus are examples of autoimmune diseases.","Ch.10 Cardiovascular, immune, lymphatic systems and blood · autoimmune disease (aw-tō-i- MŪN) (di-ZĒZ)"],[9,2,"","immunodeficiency","disorder caused by an inability to produce an adequate immune response due to a lack of functioning antibodies, lymphocytes, or both. May be inherited, acquired by an infection, or caused by treatments, such as chemotherapy. (also called immunocompromised)","Ch.10 Cardiovascular, immune, lymphatic systems and blood · immunodeficiency (im-ū-nō-de-FISH- en-sē)"],[9,2,"","opportunistic infections","illnesses caused by microorganisms that are not usually pathogenic but result in disease because of a weakened immune system","Ch.10 Cardiovascular, immune, lymphatic systems and blood · opportunistic infections (op-ar- too-NIS-tik) (in- FEK-shuns)"],[9,2,"","sarcoidosis","disease in which clumps of inflammatory cells form in one or more organs of the body, frequently the lungs and lymph nodes. Thought to be caused by an overreaction of the immune system to an unknown substance.","Ch.10 Cardiovascular, immune, lymphatic systems and blood · sarcoidosis (sar- koi-DŌ-sis)"],[9,2,"","erythrocyte sedimentation rate (ESR)","blood test that determines the amount of time it takes for red blood cells to settle at the bottom of a tube of blood. A faster than normal rate may indicate inflammation, part of the immune response. Because the test cannot identifya specific disease, it is usually combined with other, more specific tests. (also called sed rate)","Ch.10 Cardiovascular, immune, lymphatic systems and blood · erythrocyte sedimentation rate (ESR) (e- RITH-rō-sīt) (sed-a-men- TĀ-shun) (rāt)"],[9,2,"","allergist","physician who studies and treats allergic conditions","Ch.10 Cardiovascular, immune, lymphatic systems and blood · allergist (AL-er- jist)"],[9,2,"","allergen","environmental substance capable of producinga hypersensitivity reaction (allergy) in the body. Common allergens are house dust, pollen, animal dander, and various foods.","Ch.10 Cardiovascular, immune, lymphatic systems and blood · allergen (AL-er-jen)"],[9,2,"","antibody","protective protein produced by the immune system in response to the presence of a foreign substance (antigen)","Ch.10 Cardiovascular, immune, lymphatic systems and blood · antibody (AN-ti- bod-ē)"],[9,2,"","antigen","substance that triggers an immune response when introduced into the body. Examples of antigens are transplant tissue, toxins, and infectious organisms.","Ch.10 Cardiovascular, immune, lymphatic systems and blood · antigen (AN-ti-jen)"],[9,2,"","immunity","being resistant to specific invading pathogens","Ch.10 Cardiovascular, immune, lymphatic systems and blood · immunity (i-MŪ-ni- tē)"],[9,2,"","immunosuppression","state in which in the body\"s ability to fight infections or disease is reduced; may be caused by a disease process, be a treatment side effect, or induced with pharmaceuticals to prevent transplant rejection and to treat autoimmune diseases","Ch.10 Cardiovascular, immune, lymphatic systems and blood · immunosuppressio n (im-ū-nō-su- PRESH-un)"],[9,2,"","vaccine","suspension of weakened or killed microorganisms administered by injection, mouth, or nasal spray, which induces immunity to prevent an infectious disease","Ch.10 Cardiovascular, immune, lymphatic systems and blood · vaccine (vak-SĒN)"],[10,2,"","adhesion","abnormal growing together of two peritoneal surfaces that normally are separated. This may occur after abdominal surgery. Surgical treatment is called adhesiolysis or adhesiotomy.","Ch.11 Digestive system · adhesion (ad- HĒ-zhun)"],[10,2,"","celiac disease","malabsorption syndrome caused by an immune reaction to gluten (a protein in wheat, rye, and barley), which may damage the lining of the small intestine that is responsible for absorption of food into the bloodstream. Celiac disease is considereda multisystem disorder with varying signs and symptoms, including abdominal bloating and pain, chronic diarrhea or constipation, steatorrhea (excessive fat in the stool), vomiting, weight loss, fatigue, and iron deficiency anemia. A pruritic skin rash known as dermatitis herpetiformis may be associated with celiac disease. (also called gluten enteropathy)","Ch.11 Digestive system · celiac disease (SĒ-lē-ak) (di- ZĒZ)"],[10,2,"","cirrhosis","chronic disease of the liver with gradual destruction of cells and formation of scar tissue; commonly caused by alcoholism and certain types of viral hepatitis","Ch.11 Digestive system · cirrhosis (sir-RŌ- sis)"],[10,2,"","Crohn disease","chronic inflammation of the intestinal tract usually affecting the ileum and colon; characterized by cobblestone ulcerations and the formation of scar tissue that may lead to intestinal obstruction (also called regional ileitis or regional enteritis)","Ch.11 Digestive system · Crohn disease (krōn) (di-ZĒZ)"],[10,2,"","gastroesophageal reflux disease (GERD)","abnormal backward flow of the gastrointestinal contents into the esophagus, causing heartburn and the gradual breakdown of the mucous barrier of the esophagus","Ch.11 Digestive system · gastroesophageal reflux disease (GERD) (gas-trō- e-sof-a-JĒ-al) (RĒ- fluks) (di-ZĒZ)"],[10,2,"","hemochromatosis","iron metabolism disorder that occurs when too much iron is absorbed from food, resulting in excessive deposits of iron in the tissue; can cause heart failure, diabetes, cirrhosis, or cancer of the liver","Ch.11 Digestive system · hemochromatosi s (hē-mō-krō-ma- TŌ-sis)"],[10,2,"","hemorrhoids","swollen or distended veins in the rectum or anus, which are called internal or external, respectively, and can be a source of rectal bleeding and pain","Ch.11 Digestive system · hemorrhoids (HEM-o-roydz)"],[10,2,"","ileus","nonmechanical obstruction of the intestine, caused by a lack of effective peristalsis (involuntary wavelike movements that propel food along the gastrointestinal tract)","Ch.11 Digestive system · ileus (IL-ē-us)"],[10,2,"","intussusception","prolapse of one part of the intestine inside the part next to it. It is most common in infants; symptoms may include intestinal blockage, abdominal pain with cramping, or a lump that can be felt from the outside.","Ch.11 Digestive system · intussusception (in-tu-sus-SEP- shun)"],[10,2,"","irritable bowel syndrome (IBS)","periodic disturbances of bowel function, such as diarrhea and/or constipation, usually associated with abdominal pain","Ch.11 Digestive system · irritable bowel syndrome (IBS) (IR-i-ta-bl) (BOW-el) (SIN- drōm)"],[10,2,"","obesity","excess of body fat, which increases body weight; a condition in which body mass index (BMI) is greater than 30 kg/m2. Overweight is defined as BMI between 25 and 29.9 kg/m2. Morbid obesity is defined as a BMI over 40 kg/m2.","Ch.11 Digestive system · obesity (ō-BĒS- i-tē)"],[10,2,"","peptic ulcer","erosion of the mucous membrane of the stomach or duodenum associated with increased secretion of acid from the stomach, bacterial infection (H. pylori), or medications such as nonsteroidal anti-inflammatory drugs (often referred to as gastric or duodenal ulcer, depending on its location) (Fig. 11.8)","Ch.11 Digestive system · peptic ulcer (PEP-tik) (UL- ser)"],[10,2,"","polyp","tumorlike growth extending outward froma mucous membrane; usually benign; common sites are in the nose, throat, and intestines (Figs. 11.9 and 11.11)","Ch.11 Digestive system · polyp (POL-ip)"],[10,2,"","ulcerative colitis (UC)","disease characterized by inflammation of the colon with the formation of ulcers, which can cause bloody diarrhea. A proctocolectomy with permanent ileostomy may become necessary if the patient doesn't respond to medical therapy.","Ch.11 Digestive system · ulcerative colitis (UC) (UL- ser-a-tiv) (kō-LĪ- tis)"],[10,2,"","volvulus","twisting or kinking of the intestine, causing intestinal obstruction","Ch.11 Digestive system · volvulus (VOL- vū-lus)"],[10,2,"","abdominoperineal resection (APR)","removal of the distal colon, rectum, and anal sphincter through both abdominal and perineal approaches; performed to treat some colorectal cancers and inflammatory diseases of the lower large intestine. The patient will havea colostomy.","Ch.11 Digestive system · abdominoperineal resection (APR) (ab-dom-i-nō-per-i- NĒ-el) (rē-SEK- shun)"],[10,2,"","anastomosis","connection created by surgically joining two structures, such as blood vessels or bowel segments (Fig. 11.12)","Ch.11 Digestive system · anastomosis (pl. anastomoses) (a- nas-to-MŌ-sis) (a- nas-to-MŌ-sēz)"],[10,2,"","bariatric surgery","surgical reduction of gastric capacity to treat morbid obesity, a condition that can cause serious illness (Table 11.1)","Ch.11 Digestive system · bariatric surgery (bar-ē-AT-rik) (SUR-jer-ē)"],[10,2,"","hemorrhoidectomy","excision of hemorrhoids, the swollen or distended veins in the lower rectum and anus","Ch.11 Digestive system · hemorrhoidectom y (hem-o-royd-EK- to-mē)"],[10,2,"","vagotomy","cutting of certain branches of the vagus nerve, performed with gastric surgery to reduce the amount of gastric acid produced and thus reduce the recurrence of ulcers","Ch.11 Digestive system · vagotomy (vā- GOT-o-mē)"],[10,2,"","abdominal sonography","ultrasound scanning of the abdominal cavity in which the size and structure of organs such as the aorta, liver, gallbladder, bile ducts, and pancreas can be visualized (Table 11.2)","Ch.11 Digestive system · abdominal sonography (ab-DOM-i-nal) (so-NOG- ra-fē)"],[10,2,"","barium enema (BE)","series of radiographic images taken of the large intestine after the contrast agent barium has been administered rectally (also called lower GI series) (Fig. 11.16)","Ch.11 Digestive system · barium enema (BE) (BAR- ē-um) (EN-e-ma)"],[10,2,"","endoscopic retrograde cholangiopancreatography (ERCP)","procedure using an endoscope to visualize the biliary and pancreatic ducts, introduce contrast agents, and record x-ray images (fluoroscopy); used to evaluate obstructions, strictures, and some diseases of the liver and pancreas. Stone removal, biopsy, and stenting may be performed during the procedure for treatment.","Ch.11 Digestive system · endoscopic retrograde cholangiopancreatography (ERCP) (en-dō-SKOP-ic) (RET-rō-grād) (kō-lan-jē-ō- pan-krē-a-TOG-rah-fē)"],[10,2,"","endoscopic ultrasound (EUS)","procedure using an endoscope fitted with an ultrasound probe that provides images of the esophageal and gastric linings, as well as the walls of the small and large intestines; used to detect tumors and cystic growths and for staging of malignant tumors","Ch.11 Digestive system · endoscopic ultrasound (EUS) (en-dō-SKOP-ic) (UL-tra-sound)"],[10,2,"","upper GI series","series of radiographic images taken of the pharynx, esophagus, stomach, and duodenum after the contrast agent barium has been administered orally (also called upper gastrointestinal series)","Ch.11 Digestive system · upper GI series (UP-per) (G-Ī) (SE-rēz)"],[10,2,"","fecal occult blood test (FOBT)","examination of a stool sample to detect blood not directly visible. Occult blood refers to blood that is present but can only be detected by chemical testing or by microscope. The test is used to screen for colon cancer or polyps.","Ch.11 Digestive system · fecal occult blood test (FOBT) (FĒ-kl) (o-KULT) (blud) (test)"],[10,2,"","Helicobacter pylori stool antigen","chemical test on a fecal sample to determine the presence of the bacteria (H. pylori) that can cause peptic ulcers","Ch.11 Digestive system · Helicobacter pylori (H. pylori) stool antigen (hel-i- kō-BAK-ter) (pī-LŌ-rē) (stul) (AN-ti-jen)"],[10,2,"","ascites","abnormal collection of fluid in the peritoneal cavity","Ch.11 Digestive system · ascites (a-SĪ- tēz)"],[10,2,"","diarrhea","frequent discharge of liquid stool","Ch.11 Digestive system · diarrhea (dī-a- RĒ-a)"],[10,2,"","emesis","expelling matter from the stomach through the mouth (also called vomiting)","Ch.11 Digestive system · emesis (EM-e- sis)"],[10,2,"","flatus","gas in the gastrointestinal tract or expelled through the anus","Ch.11 Digestive system · flatus (FLĀ- tus)"],[10,2,"","hematemesis","vomiting of blood","Ch.11 Digestive system · hematemesis (hē-ma-TEM-e- sis)"],[10,2,"","hematochezia","passage of visibly bloody feces","Ch.11 Digestive system · hematochezia (hē-ma-tō-KĒ- zha)"],[10,2,"","malabsorption","impaired digestion or intestinal absorption of nutrients","Ch.11 Digestive system · malabsorption (mal-ab-SORP- shun)"],[10,2,"","melena","black, tarry stool that contains digested blood; usuallya result of bleeding in the upper GI tract","Ch.11 Digestive system · melena (me- LĒ-na)"],[10,2,"","nausea","urge to vomit","Ch.11 Digestive system · nausea (NAW- zē-a)"],[10,2,"","reflux","abnormal backward flow. In esophageal reflux, the stomach contents flow back into the esophagus.","Ch.11 Digestive system · reflux (RĒ- fluks)"],[10,2,"","gastric lavage","washing out of the stomach","Ch.11 Digestive system · gastric lavage (GAS-trik) (la-VOZH)"],[10,2,"","feces","waste from the gastrointestinal tract expelled through the anus (also called stool or fecal matter)","Ch.11 Digestive system · feces (FĒ- sēz)"],[10,2,"","palpate","to examine by hand; to feel","Ch.11 Digestive system · palpate (PAL- pāt)"],[10,2,"","stoma","surgical opening between an organ and the surface of the body, such as the opening established in the abdominal wall by colostomy, ileostomy, or a similar operation. Stoma may also refer to an opening created between body structures or between portions of the intestines.","Ch.11 Digestive system · stoma (STŌ- ma)"],[11,2,"","amblyopia","reduced vision in one eye caused by disuse or misuse associated with strabismus, unequal refractive errors, or otherwise impaired vision. The brain suppresses images from the impaired eye to avoid double vision. (also called lazy eye)","Ch.12 Eye · amblyopia (am-blē-Ō-pē- a)"],[11,2,"","anisometropia","significant unequal refractive error between two eyes","Ch.12 Eye · anisometropi a (an-i-sō-ma- TRŌ-pē-a)"],[11,2,"","astigmatism","blurred vision caused by irregular curvature of the cornea or lens. Light refracts improperly, resulting in diffused, rather than points of light focusing on the retina. (Fig. 12.5C)","Ch.12 Eye · astigmatism (Ast) (a-STIG- ma-tizm)"],[11,2,"","cataract","clouding of the lens of the eye (Fig. 12.4)","Ch.12 Eye · cataract (KAT-a-rakt)"],[11,2,"","chalazion","noninfected obstruction of an oil gland of the eyelid (also called meibomian cyst)","Ch.12 Eye · chalazion (ka-LĀ-zē-on)"],[11,2,"","drusen","yellowish deposits located under the retina; commonly associated with aging and macular degeneration","Ch.12 Eye · drusen (DRŪ- zen)"],[11,2,"","glaucoma","eye disorder characterized by increase of intraocular pressure (IOP). If left untreated may progress to optic nerve damage and visual impairment or loss.","Ch.12 Eye · glaucoma (glaw-KŌ- ma)"],[11,2,"","hyperopia","farsightedness (Fig. 12.5B)","Ch.12 Eye · hyperopia (hī-per-Ō-pē- a)"],[11,2,"","hyphema","hemorrhage within the anterior chamber of the eye; most often caused by blunt trauma (also called hyphemia)","Ch.12 Eye · hyphema (hī- FĒ-ma)"],[11,2,"","macular degeneration","progressive deterioration of the portion of the retina called the macula, resulting in loss of central vision (Fig. 12.6). Age-related macular degeneration (AMD) is the leading cause of legal blindness in persons older than 65 years; onset occurs between the ages of 50 and 60.","Ch.12 Eye · macular degeneration (MAC-ū-lar) (dē-gen-e-RĀ- shun)"],[11,2,"","myopia","nearsightedness (Fig. 12.5A)","Ch.12 Eye · myopia (mī- Ō-pē-a)"],[11,2,"","nyctalopia","poor vision at night or in faint light (also called night blindness)","Ch.12 Eye · nyctalopia (nik-ta-LŌ-pē- a)"],[11,2,"","nystagmus","involuntary, jerking movements of the eyes","Ch.12 Eye · nystagmus (nis-TAG- mus)"],[11,2,"","pinguecula","yellowish mass on the conjunctiva that may be related to long-term exposure to ultraviolet light, dry climates, and dust. A pinguecula that spreads onto the cornea becomesa pterygium.","Ch.12 Eye · pinguecula (ping-GWEH- kū-la)"],[11,2,"","presbyopia","impaired vision as a result of aging","Ch.12 Eye · presbyopia (pres-bē-Ō-pē- a)"],[11,2,"","pterygium","thin tissue growing onto the cornea from the conjunctiva, usually caused by sun exposure","Ch.12 Eye · pterygium (te-RIJ-ē-um)"],[11,2,"","retinal detachment","separation of the retina from the choroid in the posterior portion of the eye resulting in a disruption of vision that may be permanent if treatment is delayed; onset may be gradual or sudden and is not painful (Fig. 12.7)","Ch.12 Eye · retinal detachment (RET-in-al) (dē-TACH- ment)"],[11,2,"","retinitis pigmentosa","hereditary, progressive disease marked by night blindness with atrophy and retinal pigment changes","Ch.12 Eye · retinitis pigmentosa (ret-i-NĪ-tis) (pig-men-TŌ- sa)"],[11,2,"","strabismus","condition in which the eyes look in different directions; caused by dysfunction of the external eye muscles or an uncorrected refractive error (called cross-eyed when one eye turns in)","Ch.12 Eye · strabismus (stra-BIZ- mus)"],[11,2,"","sty","infection of an oil gland of the eyelid (also spelled stye and also called hordeolum)","Ch.12 Eye · sty (stī)"],[11,2,"","enucleation","surgical removal of the eyeball (also, excision of a whole organ or mass without cutting into it)","Ch.12 Eye · enucleation (ē-nū- klē-Ā-shun)"],[11,2,"","LASIK","laser procedure that reshapes the corneal tissue beneath the surface of the cornea to correct astigmatism, hyperopia, and myopia. It differs from photorefractive keratectomy (PRK) in that it reshapes corneal tissue beneath the surface rather than on the surface (Fig. 12.8B).","Ch.12 Eye · LASIK (laser- assisted in situ keratomileusis) (LĀ-sik) (ker-a-tō- mi-LOO-sis)"],[11,2,"","phacoemulsification (PHACO)","method to remove cataracts in which an ultrasonic needle probe breaks up the lens, which is then aspirated","Ch.12 Eye · phacoemulsification (PHACO) (fa-kō-ē- mul-si-fi-KĀ-shun)"],[11,2,"","photorefractive keratectomy (PRK)","procedure for the treatment of astigmatism, hyperopia, and myopia in whicha laser is used to reshape (flatten) the corneal surface by removinga portion of the cornea (Fig. 12.8A)","Ch.12 Eye · photorefractive keratectomy (PRK) (fō-tō-rē-FRAK-tiv) (ker-a-TEK-to-mē)"],[11,2,"","retinal photocoagulation","intense beam of light froma laser condenses retinal tissue to seal leaking blood vessels, to destroy abnormal tissue or lesions, or to bond the retina to the back of the eye. Used to treat retinal tears, diabetic retinopathy, wet macular degeneration, glaucoma, and intraocular tumors.","Ch.12 Eye · retinal photocoagulation (RET-in-al) (fō-tō-kō- ag-ū-LĀ-shun)"],[11,2,"","scleral buckling","procedure to repair retinal detachment in whicha piece of silicone is applied to the abnormal part of the sclera. This pushes in, or \"buckles\" the sclera toward the middle of the eye, decreasing the traction on the retina. For larger detachments, an entire band may encircle the eyeball. Cryoretinopexy is often used to repair the hole in the retina prior to the buckling procedure. (Fig. 12.9)","Ch.12 Eye · scleral buckling (SKLER-al) (BUK- ling)"],[11,2,"","trabeculectomy","surgical creation of an opening that allows aqueous humor to drain out of the eye to underneath the conjunctiva where it is absorbed; used to treat glaucoma by reducing intraocular pressure. (Laser trabeculoplasty may also be used.)","Ch.12 Eye · trabeculectomy (tra- bek-ū-LEK-to-mē)"],[11,2,"","vitrectomy","surgical removal of all or part of the vitreous humor (to provide access to interior structures of the eye; used to treat diabetic retinopathy, retinal detachment, or a hole in the macula)","Ch.12 Eye · vitrectomy (vi- TREK-to-mē)"],[11,2,"","optical coherence tomography (OCT)","noninvasive test that uses light waves to take cross-sectional images of the retina; used to detect many eye conditions including macular degeneration, glaucoma, retinopathy, and optic nerve damage.","Ch.12 Eye · optical coherence tomography (OCT) (OP-ti-kul)(kō-HĒR- entt) (tō-MOG-rah- fē)"],[11,2,"","slit lamp","horizontally mounted binocular microscope that usesa very narrow vertical beam of light (slit) to examine the eye in great detail. It is especially useful for viewing the conjunctiva, cornea, lens, and vitreous humor.","Ch.12 Eye · slit lamp (slit) (lamp)"],[11,2,"","emmetropia","normal refractive condition of the eye","Ch.12 Eye · emmetropia (Em) (em-e-TRŌ-pē-a)"],[11,2,"","visual acuity (VA)","sharpness of vision for either distance or near","Ch.12 Eye · visual acuity (VA) (VIZH-ū-al) (a-KŪ-i- tē)"],[11,2,"","optician","specialist who fills prescriptions for lenses (cannot prescribe lenses)","Ch.12 Eye · optician (op-TISH- in)"],[11,2,"","optometrist","health professional who diagnoses, treats, and manages diseases and disorders of the eyes and visual processing system; doctor of optometry (OD)","Ch.12 Eye · optometris t (op-TOM- e-trist)"],[11,2,"","intraocular lens (IOL)","artificial lens implanted within the eye during cataract surgery","Ch.12 Eye · intraocular lens (IOL) (in-tra-OK-ū- lar) (lenz)"],[11,2,"","miotic","agent that constricts the pupil","Ch.12 Eye · miotic (mī-OT-ik)"],[11,2,"","mydriatic","agent that dilates the pupil","Ch.12 Eye · mydriatic (mid-rē-AT-ik)"],[12,2,"","acoustic neuroma","benign tumor within the internal auditory canal growing from the acoustic nerve; may cause hearing loss and may damage structures of the cerebellum as it grows","Ch.13 Ear · acoustic neuroma (a- KOOS-tik) (nū-RŌ-ma)"],[12,2,"","cholesteatoma","cystlike mass composed of epithelial cells and cholesterol occurring in the middle ear; may be associated with chronic otitis media","Ch.13 Ear · cholesteatom a (ko-le-stē-a- TŌ-ma)"],[12,2,"","Ménière disease","chronic disease of the inner ear characterized by a sensation of spinning motion (vertigo), ringing in the ear (tinnitus), aural fullness, and fluctuating hearing loss; symptoms are related to a change in volume or composition of fluid within the labyrinth","Ch.13 Ear · Ménière disease (me- NYĀR) (di- ZĒZ)"],[12,2,"","otitis externa (OE)","inflammation of the outer ear","Ch.13 Ear · otitis externa (OE) (ō-TĪ-tis) (eks-TER-na)"],[12,2,"","otitis media (OM)","inflammation of the middle ear (Fig. 13.3A)","Ch.13 Ear · otitis media (OM) (ō-TĪ- tis) (MĒ-dē-a)"],[12,2,"","ototoxicity","adverse pharmocological reaction causing damage to the vestibulocochlear nerve; results in abnormalities of hearing and balance","Ch.13 Ear · ototoxicity (ō- tō-tok-SIS-i- tē)"],[12,2,"","presbycusis","hearing impairment occurring with age","Ch.13 Ear · presbycusis (prez-bi-KŪ- sis)"],[12,2,"","tinnitus","ringing in the ears (Note: the ending is itus and not itis, the usual ending for inflammation)","Ch.13 Ear · tinnitus (tin- NĪ-tus)"],[12,2,"","vertigo","sense that either one's own body (subjective vertigo) or the environment (objective vertigo) is revolving; may indicate inner ear disease","Ch.13 Ear · vertigo (VER- ti-gō)"],[13,2,"","ankylosing spondylitis","form of arthritis that first affects the spine and adjacent structures and that, as it progresses, causesa forward bend of the spine (also called Strümpell-Marie arthritis or disease, or rheumatoid spondylitis)","Ch.14 Musculoskeletal system · ankylosing spondylitis (ang- ki-LŌ-sing) (spon- di-LĪ-tis)"],[13,2,"","bunion","abnormal prominence of the joint at the base of the great toe, the metatarsal- phalangeal joint. It is a common problem, often hereditary or caused by poorly fitted shoes. (also called hallux valgus)","Ch.14 Musculoskeletal system · bunion (BUN- yun)"],[13,2,"","carpal tunnel syndrome (CTS)","common nerve entrapment disorder of the wrist caused by compression of the median nerve; symptoms include pain and tingling in portions of the hand and fingers","Ch.14 Musculoskeletal system · carpal tunnel syndrome (CTS) (KAR-pl) (TUN- el) (SIN-drōm)"],[13,2,"","compartment syndrome","painful condition caused by increased pressure withina muscle that can lead to ischemia; acute compartment syndrome is a medical emergency and is caused by severe injury","Ch.14 Musculoskeletal system · compartment syndrome (kom- PART-ment) (SIN-drōm)"],[13,2,"","dislocation","displacement of bones in a joint from their normal alignment (also called luxation)","Ch.14 Musculoskeletal system · dislocation (dis- lō-KĀ-shun)"],[13,2,"","exostosis","abnormal benign growth on the surface of a bone (also called spur)","Ch.14 Musculoskeletal system · exostosis (ek-sos- TŌ-sis)"],[13,2,"","fracture","broken bone","Ch.14 Musculoskeletal system · fracture (fx) (FRAK-chūr)"],[13,2,"","ganglion cyst","collection of jellylike fluid forminga benign mass arising from joints, most commonly appearing in the wrist, hand, and ankle","Ch.14 Musculoskeletal system · ganglion cyst (GANG-glē-on) (sist)"],[13,2,"","gout","disease in which an excessive amount of uric acid in the blood causes sodium urate crystals (tophi) to be deposited in the joints, producing arthritis. The great toe is frequently affected.","Ch.14 Musculoskeletal system · gout (gowt)"],[13,2,"","herniated disk","rupture of the intervertebral disk cartilage, which allows the contents to protrude through it, putting pressure on the spinal nerve roots (also called slipped disk, ruptured disk, herniated intervertebral disk, or herniated nucleus pulposus [HNP])","Ch.14 Musculoskeletal system · herniated disk (HER-nē-āt-ed) (disk)"],[13,2,"","Lyme disease","infection caused by a bite froma deer tick infected with Borrelia burgdorferi. This bacterium provokes an immune response in the body, the symptoms of which can mimic several musculoskeletal diseases. Patients may experience fever, headache, and joint pain. A rash (target lesion) may initially arise at the site of the tick bite.","Ch.14 Musculoskeletal system · Lyme disease (līm) (di-ZĒZ)"],[13,2,"","muscular dystrophy (MD)","group of hereditary diseases characterized by degeneration of muscle and weakness","Ch.14 Musculoskeletal system · muscular dystrophy (MD) (MUS-kū-lar) (DIS-tro-fē)"],[13,2,"","myasthenia gravis (MG)","chronic disease characterized by muscle weakness and thought to be caused by a defect in the transmission of impulses from nerve to muscle cell. The face, larynx, and throat are frequently affected; no true paralysis of the muscles exists.","Ch.14 Musculoskeletal system · myasthenia gravis (MG) (mī- as-THĒ-nē-a) (GRA-vis)"],[13,2,"","osteoporosis","abnormal loss of bone density that may lead to an increase in fractures of the ribs, thoracic and lumbar vertebrae, hips, and wrists after slight trauma (occurs predominantly in postmenopausal women)","Ch.14 Musculoskeletal system · osteoporosis (os- tē-ō-po-RŌ-sis)"],[13,2,"","plantar fasciitis","inflammation of the connective tissue of the sole of the foot (plantar fascia) due to repetitive injury; common cause of heel pain","Ch.14 Musculoskeletal system · plantar fasciitis (PLAN-tar) (fas- ē-Ī-tis)"],[13,2,"","repetitive strain injury (RSI)","cumulative damage to joint, muscle, or other tissue caused by movements performed over and over again; characterized by pain, swelling, numbness, and lack of strength and flexibility, most commonly affecting the hands, wrists, elbows, and shoulders","Ch.14 Musculoskeletal system · repetitive strain injury (RSI) (rē- PET-i-tiv) (strān) (IN-ja-rē)"],[13,2,"","rheumatoid arthritis (RA)","chronic systemic disease characterized by autoimmune inflammatory changes in the connective tissue throughout the body (Fig. 14.9C)","Ch.14 Musculoskeletal system · rheumatoid arthritis (RA) (RŪ-ma-toid) (ar- THRĪ-tis)"],[13,2,"","rotator cuff disease","damage to one or more of the four tendons stabilizing the shoulder joint due to injury or degeneration; symptoms may include pain, limited range of motion, and muscle weakness","Ch.14 Musculoskeletal system · rotator cuff disease (RŌ-tā- tor) (kuf) (di- ZĒZ)"],[13,2,"","spinal stenosis","narrowing of the spinal canal with compression of nerve roots. The condition is either congenital or due to spinal degeneration. Symptoms are pain radiating to the thigh or lower legs and numbness or tingling in the lower extremities.","Ch.14 Musculoskeletal system · spinal stenosis (SPĪ-nal) (ste-NŌ- sis)"],[13,2,"","spondylolisthesis","forward slipping of one vertebra over another","Ch.14 Musculoskeletal system · spondylolisthesis (spon-di-lō-lis- THĒ-sis)"],[13,2,"","sprain","abnormal stretching or tearing of a ligament that supportsa joint","Ch.14 Musculoskeletal system · sprain (sprān)"],[13,2,"","strain","abnormal stretching or tearing of a muscle or tendon","Ch.14 Musculoskeletal system · strain (strān)"],[13,2,"","subluxation","partial dislocation of bones in a joint","Ch.14 Musculoskeletal system · subluxation (sub-luk-SĀ-shun)"],[13,2,"","tarsal tunnel syndrome","painful foot disorder caused by compression of the posterior tibial nerve as it passes through the ankle","Ch.14 Musculoskeletal system · tarsal tunnel syndrome (TĀR- sl) (TUN-el) (SIN- drōm)"],[13,2,"","dual x-ray absorptiometry (DXA)","radiographic imaging, usually of the lumbar spine and hips, to measure bone loss and bone mineral density; the procedure utilizes low doses of radiation and is used in the diagnosis of osteoporosis and monitoring of treatment (also called dual-energy x-ray absorptiometry [DEXA], bone densitometry, and bone density test) (Fig. 14.11)","Ch.14 Musculoskeletal system · dual x-ray absorptiometry (DXA) (du-al) (EKS-rā) (ab- sorp-shē-OM-e- trē)"],[13,2,"","bone markers","blood and urine tests to determine the rate of bone turnover (resorption and formation); often used with DXA to diagnose and monitor treatment of osteoporosis and other bone disorders","Ch.14 Musculoskeletal system · bone markers (bōn) (MAR-krs)"],[13,2,"","muscle biopsy","removal of muscle tissue usinga needle or small incision; used to assess musculoskeletal abnormalities involving weakness or pain such as muscular dystrophy, myasthenia gravis, and polymyositis","Ch.14 Musculoskeletal system · muscle biopsy (MUS-el) (BĪ-op-sē)"],[13,2,"","crepitus","crackling sensation heard or felt when two bones rub against each other or grating caused by the rubbing together of dry surfaces of a joint (also called crepitation)","Ch.14 Musculoskeletal system · crepitu s (KREP- i-tus)"],[13,2,"","prosthesis,","artificial substitute for a missing body part such as a limb, joint, or eye","Ch.14 Musculoskeletal system · prosthesis (pl. prostheses) (pros-THĒ- sis), (pros-THĒ-sēz)"],[13,2,"","chiropractic","system of treatment that consists of manipulation of the vertebral column","Ch.14 Musculoskeletal system · chiropractic (kī-rō-PRAK- tik)"],[13,2,"","chiropractor (DC)","specialist in manipulation of the vertebral column (chiropractic)","Ch.14 Musculoskeletal system · chiropractor (DC) (KĪ-rō- prak-tor)"],[13,2,"","orthopedics","branch of medicine dealing with the study and treatment of diseases and abnormalities of the musculoskeletal system","Ch.14 Musculoskeletal system · orthopedics (Ortho) (or-thō- PĒ-diks)"],[13,2,"","orthopedist","physician who specializes in the study and treatment of diseases and abnormalities of the musculoskeletal system","Ch.14 Musculoskeletal system · orthopedist (or-thō-PĒ-dist)"],[13,2,"","orthotics","making and fitting of orthopedic appliances used to support, align, prevent, or treat musculoskeletal deformities; examples of appliances include braces, splints, and arch supports","Ch.14 Musculoskeletal system · orthotics (or- THOT-iks)"],[13,2,"","orthotist","specialist in making and fitting appliances used to support, align, prevent or treat musculoskeletal deformities","Ch.14 Musculoskeletal system · orthotist (or- THOT-ist)"],[13,2,"","osteopath (DO)","physician who specializes in a system of medicine placing emphasis on the relation between organs and the musculoskeletal system (osteopathy)","Ch.14 Musculoskeletal system · osteopath (DO) (OS-tē-ō- path)"],[13,2,"","osteopathy","system of medicine that uses the usual forms of diagnosis and treatment but places greater emphasis on the relation between body organs and the musculoskeletal system; manipulation may be used in addition to other treatments","Ch.14 Musculoskeletal system · osteopathy (os-tē-OP-a-thē)"],[13,2,"","podiatrist","specialist in treating and diagnosing diseases and disorders of the foot, including medical and surgical treatment","Ch.14 Musculoskeletal system · podiatrist (pō-DĪ-a-trist)"],[13,2,"","rheumatologist","physician who specializes in the study and treatment of musculoskeletal disorders characterized by inflammation and degeneration of structures (rheumatic diseases)","Ch.14 Musculoskeletal system · rheumatologist (roo-ma-TOL-ō- jist)"],[13,2,"","rheumatology","study and treatment of musculoskeletal disorders characterized by inflammation and degeneration of structures (rheumatic diseases)","Ch.14 Musculoskeletal system · rheumatology (roo-ma-TOL-ō- jē)"],[13,2,"","abduction","moving away from the midline","Ch.14 Musculoskeletal system · abduction (ab- DUK-shun)"],[13,2,"","adduction","moving toward the midline","Ch.14 Musculoskeletal system · adduction (ad- DUK-shun)"],[13,2,"","inversion","turning inward","Ch.14 Musculoskeletal system · inversion (in- VER-zhun)"],[13,2,"","eversion","turning outward","Ch.14 Musculoskeletal system · eversion (ē-VER- zhun)"],[13,2,"","extension","movement in whicha limb is placed in a straight position, increasing the angle between the bone and the joint","Ch.14 Musculoskeletal system · extension (ek- STEN-shun)"],[13,2,"","flexion","movement in whicha limb is bent, decreasing the angle between the bone and the joint","Ch.14 Musculoskeletal system · flexion (FLEK- shun)"],[13,2,"","pronation","movement that turns the palm down","Ch.14 Musculoskeletal system · pronation (prō- NĀ-shun)"],[13,2,"","supination","movement that turns the palm up","Ch.14 Musculoskeletal system · supination (sū- pi-NĀ-shun)"],[13,2,"","rotation","turning around its own axis","Ch.14 Musculoskeletal system · rotation (rō-TĀ- shun)"],[14,2,"","Alzheimer disease (AD)","type of dementia that occurs more frequently after the age of 65, but can begin at any age. The brain shrinks dramatically as nerve cells die and tissues atrophy. The disease is slowly progressive and usually results in profound dementia in 5 to 10 years. A prominent feature of AD is the inability to remember the recent past, while memories of the distant past remain intact.","Ch.15 Nervous system and behavioral health · Alzheimer disease (AD) (AWLTZ-hī- mer) (di-ZĒZ)"],[14,2,"","amyotrophic lateral sclerosis (ALS)","progressive muscle atrophy caused by degeneration and scarring of neurons along the lateral columns of the spinal cord that control muscles (also called Lou Gehrig disease)","Ch.15 Nervous system and behavioral health · amyotrophic lateral sclerosis (ALS) (ā-mī-ō- TRŌ-fik) (LAT- er-al) (skle-RŌ- sis)"],[14,2,"","Bell palsy","paralysis of muscles on one side of the face caused by inflammation or compression of the facial nerve, cranial nerve VII. Signs includea sagging mouth on the affected side and nonclosure of the eyelid; paralysis is usually temporary.","Ch.15 Nervous system and behavioral health · Bell palsy (bel) (PAWL-zē)"],[14,2,"","botulism","serious illness caused by a bacterial toxin that interferes with nerve conduction, causing skeletal muscle paralysis. Initial symptoms may include trouble seeing and muscle weakness leading to difficulty swallowing and breathing. Foodborne botulism, wound botulism, and infant botulism are types of the illness, all of which can be fatal and are medical emergencies.","Ch.15 Nervous system and behavioral health · botulism (BOCH-e-liz- um)"],[14,2,"","cerebral aneurysm","ballooning of a weakened portion of an arterial wall (aneurysm) in the cerebrum. It is usually asymptomatic until it ruptures, which can be very serious and can result in death.","Ch.15 Nervous system and behavioral health · cerebral aneurysm (se- RĒ-bral) (AN-ū- rizm)"],[14,2,"","cerebral palsy (CP)","condition characterized by lack of muscle control and partial paralysis, caused by a brain defect or lesion present at birth or shortly after","Ch.15 Nervous system and behavioral health · cerebral palsy (CP) (se-RĒ- bral) (PAWL-zē)"],[14,2,"","chronic traumatic encephalopathy (CTE)","progressive degenerative disease of the brain which generally appears years or decades after repeated head trauma. Originally diagnosed in boxers (dementia pugilistica), it has now been found in other professional athletes who experienced repeated head trauma, such as football, ice hockey, soccer, wrestling, and basketball players. Signs and symptoms include memory loss, aggression, confusion, attention deficits, poor judgment, anxiety, and depression. Currently, CTE can only be definitively diagnosed after death by brain autopsy, but in the future, diagnostic imaging, chemical biomarkers, and neuropsychological tests may be helpful.","Ch.15 Nervous system and behavioral health · chronic traumatic encephalopathy (CTE) (KRON- ik) (tra-MAT-ik) (en-sef-a-LOP-a- thē)"],[14,2,"","dementia","cognitive impairment characterized by loss of intellectual brain function. Patients have difficulty in various ways, including difficulty in performing complex tasks, reasoning, learning and retaining new information, orientation, word finding, and behavior. Dementia has several causes and is not considered part of normal aging. (Table 15.1)","Ch.15 Nervous system and behavioral health · dementia (de- MEN-sha)"],[14,2,"","epilepsy","condition characterized by recurrent seizures; a general term given to a group of neurologic disorders, all characterized by abnormal electrical activity in the brain","Ch.15 Nervous system and behavioral health · epilepsy (EP-i- lep-sē)"],[14,2,"","multiple sclerosis (MS)","chronic degenerative disease characterized by sclerotic patches along the brain and spinal cord; signs and symptoms fluctuate over the course of the disease; more common symptoms include fatigue, balance and coordination impairments, numbness, and vision problems","Ch.15 Nervous system and behavioral health · multiple sclerosis (MS) (MUL-ti-pl) (skle-RŌ-sis)"],[14,2,"","Parkinson disease (PD)","chronic degenerative disease of the central nervous system. Signs and symptoms include resting tremors of the hands and feet, rigidity, expressionless face, shuffling gait, and eventually dementia. It usually occurs after the age of 50 years (also called parkinsonism).","Ch.15 Nervous system and behavioral health · Parkinson disease (PD) (PAR-kin-sun) (di-ZĒZ)"],[14,2,"","sciatica","inflammation of the sciatic nerve, causing pain that travels from the thigh through the leg to the foot and toes; can be caused by injury, infection, arthritis, herniated disk, or from prolonged pressure on the nerve from sitting for long periods","Ch.15 Nervous system and behavioral health · sciatica (sī-AT-i- ka)"],[14,2,"","shingles","viral disease that affects the peripheral nerves and causes blisters on the skin that follow the course of the affected nerves (also called herpes zoster )","Ch.15 Nervous system and behavioral health · shingles (SHING-gelz)"],[14,2,"","stroke","interruption of blood supply to a region of the brain, depriving nerve cells in the affected area of oxygen and nutrients. The cells cannot perform and may be damaged or die within minutes. The parts of the body controlled by the involved cells will experience dysfunction. Speech, movement, memory, and other CNS functions may be affected in varying degrees. Ischemic stroke is a result of a blocked blood vessel. Hemorrhagic stroke is a result of bleeding (also called cerebrovascular accident [CVA] or brain attack).","Ch.15 Nervous system and behavioral health · stroke (strōk)"],[14,2,"","subarachnoid hemorrhage (SAH)","bleeding between the pia mater and arachnoid layers of the meninges (subarachnoid space), caused by a ruptured blood vessel (usuallya cerebral aneurysm). The patient may experience an intense, sudden headache accompanied by nausea, vomiting, and neck pain. SAH is a critical condition which must be recognized and treated immediately to prevent permanent brain damage or death (a cause of hemorrhagic stroke).","Ch.15 Nervous system and behavioral health · subarachnoid hemorrhage (SAH) (sub-e- RAK-noid) (HEM-o-rij)"],[14,2,"","transient ischemic attack (TIA)","sudden deficient supply of blood to the brain lastinga short time. The symptoms may be similar to those of stroke, but with TIA the symptoms are temporary and the usual outcome is complete recovery. TIAs are often warning signs for eventual occurrence of a stroke.","Ch.15 Nervous system and behavioral health · transient ischemic attack (TIA) (TRAN- sē-ent) (is-KĒ- mik) (a-TAK)"],[14,2,"","positron emission tomography (PET) scan","nuclear medicine procedure creating computerized images of chemical changes, such as sugar metabolism in brain tissue. Radioactive materials called tracers are bound to molecules used in metabolism. Areas that are more active, such as cancers, will use more of these molecules, and the PET scan will detect higher activity there. PET is usually combined with CT imaging, which shows precise anatomic location of the abnormality.","Ch.15 Nervous system and behavioral health · positron emission tomography (PET) scan (POZ-i-tron) (ē-MISH- un) (tō- MOG-rah- fē) (skan)"],[14,2,"","evoked potential studies","group of diagnostic tests that measure changes and responses in brain waves elicited by visual, auditory, or somatosensory stimuli","Ch.15 Nervous system and behavioral health · evoked potential studies (EP studies) (i-VŌKD) (pō-TEN- shal) (STUD-ēz)"],[14,2,"","deep tendon reflexes (DTR)","portion of the physical examination where gentle strikes at specific locations are performed to assess the possibility of potential neurological abnormalities (also called muscle stretch reflexes [MSR])","Ch.15 Nervous system and behavioral health · deep tendon reflexes (DTR) (dēp) (TEN- don) (RĒ-flek-suhs)"],[14,2,"","lumbar puncture (LP)","diagnostic procedure performed by insertion of a needle into the subarachnoid space usually between the third and fourth lumbar vertebrae; performed for many reasons, including the removal of cerebrospinal fluid (also called spinal tap)","Ch.15 Nervous system and behavioral health · lumbar puncture (LP) (LUM- bar) (PUNK- chur)"],[14,2,"","ataxia","lack of muscle coordination","Ch.15 Nervous system and behavioral health · ataxia (a-TAK-sē- a)"],[14,2,"","coma","state of profound unconsciousness","Ch.15 Nervous system and behavioral health · coma (KŌ-ma)"],[14,2,"","concussion","injury to the brain caused by minor or major head trauma; symptoms include vertigo, headache, and possible loss of consciousness","Ch.15 Nervous system and behavioral health · concussion (kon- KUSH-un)"],[14,2,"","convulsion","sudden, involuntary contraction of a group of muscles; may be present duringa seizure","Ch.15 Nervous system and behavioral health · convulsion (kun-VUL-zhun)"],[14,2,"","disorientation","state of mental confusion as to time, place, or identity","Ch.15 Nervous system and behavioral health · disorientation (dis-or-ē-en-TĀ- shun)"],[14,2,"","dysarthria","inability to use speech that is distinct and connected because of a loss of muscle control after damage to the peripheral or central nervous system","Ch.15 Nervous system and behavioral health · dysarthria (dis- AR-thrē-a)"],[14,2,"","paraplegia","paralysis from the waist down caused by damage to the lower level of the spinal cord","Ch.15 Nervous system and behavioral health · paraplegia (par- a-PLĒ-ja)"],[14,2,"","seizure","sudden, abnormal surge of electrical activity in the brain, resulting in involuntary body movements or behaviors","Ch.15 Nervous system and behavioral health · seizure (SĒ-zher)"],[14,2,"","spasticity","continued contraction of certain muscles due to damage of the brain or spinal cord controlling voluntary movement and causing tightness and stiffness that can interfere with normal movement, speech, and gait; associated with cerebral palsy, multiple sclerosis, and other neurological disorders","Ch.15 Nervous system and behavioral health · spasticity (spa- STIS-i-tē)"],[14,2,"","syncope","fainting or sudden loss of consciousness caused by lack of blood supply to the cerebrum","Ch.15 Nervous system and behavioral health · syncope (SINK- o-pē)"],[14,2,"","unconsciousness","state of being unaware of surroundings and incapable of responding to stimuli as a result of injury, shock, illness, or drugs","Ch.15 Nervous system and behavioral health · unconsciousness (un-KON-shus- nes)"],[14,2,"","shunt","tube implanted in the body to redirect the flow of a fluid","Ch.15 Nervous system and behavioral health · shunt (shunt)"],[14,2,"","cognitive","pertaining to the mental processes of comprehension, judgment, memory, and reason (Table 15.2)","Ch.15 Nervous system and behavioral health · cognitive (COG- ni-tiv)"],[14,2,"","conscious","awake, alert, aware of one's surroundings","Ch.15 Nervous system and behavioral health · conscious (KON- shus)"],[14,2,"","gait","manner or style of walking","Ch.15 Nervous system and behavioral health · gait (gāt)"],[14,2,"","incoherent","unable to express one's thoughts or ideas in an orderly, intelligible manner","Ch.15 Nervous system and behavioral health · incoherent (in-kō- HĒR-ent)"],[14,2,"","anorexia nervosa","eating disorder characterized by a disturbed perception of body image resulting in failure to maintain body weight, intensive fear of gaining weight, pronounced desire for thinness, and, in females, amenorrhea","Ch.15 Nervous system and behavioral health · anorexia nervosa (an-ō-REK-sē-a) (ner-VŌ-sa)"],[14,2,"","anxiety disorder","disorder characterized by feelings of apprehension, tension, or uneasiness arising typically from the anticipation of unreal or imagined danger","Ch.15 Nervous system and behavioral health · anxiety disorder (ang-ZĪ-e-tē) (dis- OR-der)"],[14,2,"","attention deficit/hyperactivity disorder (ADHD)","disorder of learning and behavioral problems characterized by marked inattention, distractibility, impulsiveness, and hyperactivity","Ch.15 Nervous system and behavioral health · attention deficit/hyperactivity disorder (ADHD) (a-TEN-shun) (DEF- i-sit) (hī-per-ak-TIV- i-tē) (dis-OR-der)"],[14,2,"","autism","spectrum of mental disorders, the features of which include onset during infancy or childhood, preoccupation with subjective mental activity, inability to interact socially, and impaired communication (also referred to as autism spectrum disorders [ASD])","Ch.15 Nervous system and behavioral health · autism (AW-tizm)"],[14,2,"","bipolar disorder","major psychological disorder typified by a disturbance in mood. The disorder is manifested by manic (elevated or irritated mood, excessive energy, impulsiveness) and depressive episodes that may alternate; or elements of both may occur simultaneously.","Ch.15 Nervous system and behavioral health · bipolar disorder (bī- PŌ-lar) (dis-OR- der)"],[14,2,"","bulimia nervosa","eating disorder characterized by uncontrolled binge eating followed by purging (induced vomiting)","Ch.15 Nervous system and behavioral health · bulimia nervosa (bū-LĒ-mē-a) (ner- VŌ-sa)"],[14,2,"","major depression","mood disturbance characterized by feelings of sadness, despair, discouragement, hopelessness, lack of joy, altered sleep patterns, and difficulty with decision making and daily function. Depression ranges from normal feelings of sadness (resulting from and proportional to personal loss or tragedy), through dysthymia (chronic depressive neurosis), to major depression. (also referred to as clinical depression, mood disorder)","Ch.15 Nervous system and behavioral health · major depression (MĀ-jor) (dē- PRESH-un)"],[14,2,"","obsessive- compulsive disorder (OCD)","disorder characterized by intrusive, unwanted thoughts that result in the tendency to perform repetitive acts or rituals (compulsions), usually as a means of releasing tension or anxiety","Ch.15 Nervous system and behavioral health · obsessive- compulsive disorder (OCD) (ob- SES-iv) (kom-PUL- siv) (dis-OR-der)"],[14,2,"","panic attack","episode of sudden onset of acute anxiety, occurring unpredictably, with feelings of acute apprehension, dyspnea, dizziness, sweating, and/or chest pain, depersonalization, paresthesia and fear of dying, loss of mind or control","Ch.15 Nervous system and behavioral health · panic attack (PAN- ik) (a-TAK)"],[14,2,"","phobia","marked and persistent fear that is excessive or unreasonable cued by the presence or anticipation of a specific situation or object (such as claustrophobia, the abnormal fear of being in enclosed spaces)","Ch.15 Nervous system and behavioral health · phobia (FŌ-bē-a)"],[14,2,"","pica","compulsive eating of nonnutritive substances such as clay or ice. This condition may be a result of an iron deficiency. When iron deficiency is the cause of pica the condition will disappear in 1 or 2 weeks when treated with iron therapy.","Ch.15 Nervous system and behavioral health · pica (PĪ-ka)"],[14,2,"","posttraumatic stress disorder (PTSD)","significant behavioral health disorder in which some people exposed to a traumatic event go on to developa series of symptoms related to it. These include mentally re-experiencing the event, increased autonomic arousal (the fight-flight-freeze response), avoidance of thoughts or activities that are reminders of the trauma, social withdrawal, and difficulty making emotional contacts with family and friends.","Ch.15 Nervous system and behavioral health · posttraumatic stress disorder (PTSD) (pōst-tra- MAT-ik) (stres) (dis- OR-der)"],[14,2,"","schizophrenia","any one of a large group of psychotic disorders characterized by gross distortions of reality, disturbance of language and communication, withdrawal from social interaction, and the disorganization and fragmentation of thought, perception, and emotional reaction","Ch.15 Nervous system and behavioral health · schizophrenia (skit-sō-FRĒ-nē-a)"],[14,2,"","somatoform disorders","disorders characterized by physical symptoms for which no known physical cause exists","Ch.15 Nervous system and behavioral health · somatoform disorders (sō-MAT- ō-form) (dis-OR- derz)"],[15,2,"","Addison disease","chronic syndrome resulting froma deficiency in the hormonal secretion of the adrenal cortex. Signs and symptoms may include weakness, weight loss, hypotension, darkening of skin, and loss of appetite.","Ch.16 Endocrine system · Addison disease (AD-i-sun) (di-ZĒZ)"],[15,2,"","congenital hypothyroidism","condition caused by congenital absence or atrophy (wasting away) of the thyroid gland, resulting in hypothyroidism. The disease is characterized by puffy features, mental deficiency, large tongue, and short stature.","Ch.16 Endocrine system · congenital hypothyroidism (kon-JEN-i-tal) (hī- pō-THĪ-royd-izm)"],[15,2,"","Cushing syndrome","group of signs and symptoms attributed to the excessive production of cortisol by the adrenal cortices (pl. of cortex). This syndrome may be the result of a pituitary tumor that produces ACTH or a primary adrenal cortex hypersecretion. Signs include abnormally pigmented skin, \"moon face,\" pads of fat on the chest and abdomen, \"buffalo hump\" (fat on the upper back), wasting away of muscle, and hypertension.","Ch.16 Endocrine system · Cushing syndrome (KOOSH-ing) (SIN- drōm)"],[15,2,"","diabetes insipidus (DI)","result of decreased secretion of antidiuretic hormone by the posterior lobe of the pituitary gland. Symptoms include excessive thirst (polydipsia), large amounts of urine (polyuria), and water being excreted from the body.","Ch.16 Endocrine system · diabetes insipidus (DI) (dī-a-BĒ-tēz) (in-SIP-i-dus)"],[15,2,"","diabetes mellitus (DM)","chronic disease involvinga disorder of carbohydrate metabolism caused by under-activity of the insulin-producing islets of Langerhans and characterized by elevated blood sugar (hyperglycemia). DM can cause chronic renal disease, retinopathy, and neuropathy. In extreme cases the patient may develop ketosis, acidosis, and finally coma (Table 16.1).","Ch.16 Endocrine system · diabetes mellitus (DM) (dī-a-BĒ-tēz) (MEL-li-tus)"],[15,2,"","gigantism","condition brought about by hypersecretion of growth hormone by the pituitary gland before puberty","Ch.16 Endocrine system · gigantism (jī-GAN- tizm)"],[15,2,"","Graves disease","autoimmune disorder of the thyroid gland characterized by the production of more thyroid hormone than the body needs (hyperthyroidism), goiter, and exophthalmos (abnormal protrusion of the eyeballs)","Ch.16 Endocrine system · Graves disease (grāvz) (di-ZĒZ)"],[15,2,"","Hashimoto thyroiditis","disease in which thyroid gland cells are destroyed by autoimmune processes. Characterized by hypothyroidism and goiter; more common in females.","Ch.16 Endocrine system · Hashimoto thyroiditis (hah- she-MŌ-tō) (thī- royd-Ī-tis)"],[15,2,"","ketoacidosis","serious condition resulting from uncontrolled diabetes mellitus in which acid ketones accumulate from fat metabolism in the absence of adequate insulin. If not promptly controlled by adequate insulin and hydration, can progress to coma and death.","Ch.16 Endocrine system · ketoacidosis (kē-tō- as-i-DŌ-sis)"],[15,2,"","metabolic syndrome","group of signs and symptoms including insulin resistance, obesity characterized by excessive fat around the area of the waist and abdomen, hypertension, hyperglycemia, elevated triglycerides, and low levels of the \"good\" cholesterol HDL. Risks include development of type 2 diabetes mellitus, coronary heart disease, or stroke (also called syndrome X and insulin resistance syndrome).","Ch.16 Endocrine system · metabolic syndrome (met-a- BOL-ik) (SIN-drōm)"],[15,2,"","myxedema","condition resulting from an extreme deficiency of the thyroid hormone thyroxine; a severe form of hypothyroidism in an adult. Signs include puffiness of the face and hands, coarse and thickened skin, enlarged tongue, slow speech, and anemia.","Ch.16 Endocrine system · myxedema (mik- se-DĒ-ma)"],[15,2,"","neuroblastoma","malignant cancer that often starts in the adrenal medulla, composed of immature nerve cells. Primarily affects children.","Ch.16 Endocrine system · neuroblastoma (nū-rō-blas-TŌ-ma)"],[15,2,"","pheochromocytoma","tumor of the adrenal medulla, which is usually non-malignant and characterized by hypertension, headaches, palpitations, diaphoresis, chest pain, and abdominal pain. Surgical removal of the tumor is the most common treatment. Though usually curable with early detection, it can be fatal if untreated.","Ch.16 Endocrine system · pheochromocytoma (fē-ō-krō-mō-sī-TŌ- ma)"],[15,2,"","thyrotoxicosis","condition caused by excessive thyroid hormones","Ch.16 Endocrine system · thyrotoxicosis (thī- rō-tok-si-KŌ-sis)"],[15,2,"","radioactive iodine uptake (RAIU)","nuclear medicine scan that measures thyroid function, particularly when distinguishing different causes of hyperthyroidism. Radioactive iodine is given to the patient orally, after which the amount of its uptake into the thyroid gland is measured. Images of the gland can also be obtained using this procedure.","Ch.16 Endocrine system · radioactive iodine uptake (RAIU) (rā- dē-ō-AK-tiv) (Ī-ō-dīn) (UP-tāk)"],[15,2,"","sestamibi parathyroid scan","nuclear medicine procedure used to localize hyperactive parathyroid glands. The glands that take up an abnormal amount of radioactive substance are identified and selected for surgical removal; the other parathyroid glands may be left in place.","Ch.16 Endocrine system · sestamibi parathyroid scan (ses-ta- MIB-ē) (par- a-THĪ-royd) (skan)"],[15,2,"","thyroid sonography","ultrasound test of the thyroid gland used to help determine whethera thyroid nodule is likely benign or possibly malignant, including whether it is cystic or solid. Also used to help guidea fine needle aspiration (FNA) biopsy.","Ch.16 Endocrine system · thyroid sonography (THĪ-royd) (so-NOG-ra- fē)"],[15,2,"","fasting blood sugar (FBS)","blood test to determine the amou
