    function speakEnglish(text, accent = "en-US", audioUrl = "") {
      if (audioUrl) {
        try {
          const a = new Audio(audioUrl);
          a.play().catch(() => speakEnglish(text, accent, ""));
          return;
        } catch (e) {}
      }
      if (!window.speechSynthesis || !text) return;
      try {
        window.speechSynthesis.cancel();
        const clean = String(text).replace(/\//g, " ").replace(/\([^)]*\)/g, "").trim();
        const u = new SpeechSynthesisUtterance(clean);
        u.lang = accent;
        u.rate = 0.92;
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }

    function findCandidateQuestionsForAnki(card, questionsList) {
      if (!card || !Array.isArray(questionsList) || questionsList.length === 0) return [];
      const raw = ((card.text || "") + " " + (card.extra || ""))
        .replace(/<[^>]+>/g, " ")
        .replace(/\{\{\s*[cC]\d+\s*::(.*?)\}\}/g, " $1 ")
        .toLowerCase();
      const tokens = Array.from(new Set(
        (raw.match(/[a-z0-9]{4,}|[\u4e00-\u9fa5]{2,}/g) || [])
          .filter(w => !["this","that","with","from","which","have","been","were","they","their","when","what","where","into","only","also","more","than","most","some","such","will","would","could","should","about","after","before","between","during","under","above","other","there","these","those","because","patient","presents","year","old","history","shows","associated","increased","decreased","normal"].includes(w))
      )).slice(0, 28);
      const scored = questionsList.map(q => {
        let score = 0;
        if (card.step && q.step === card.step) score += 12;
        if (card.system && q.system === card.system) score += 20;
        const qBlob = ((q.stem || "") + " " + (q.educationalObjective || "") + " " + (q.generalExplanation || "") + " " + Object.values(q.options || {}).join(" ")).toLowerCase();
        let hits = 0;
        tokens.forEach(t => { if (qBlob.includes(t)) hits++; });
        const hitRatio = tokens.length > 0 ? hits / Math.min(tokens.length, 12) : 0;
        score += Math.round(hitRatio * 68);
        return { q, score, hits };
      }).filter(x => x.hits > 0 || x.score >= 32).sort((a, b) => b.score - a.score);
      return scored.slice(0, 6);
    }

    function computeSpellingDiff(userStr, targetStr) {
      const a = String(userStr || "").trim();
      const b = String(targetStr || "").trim();
      const n = a.length, m = b.length;
      const dp = Array.from({ length: n + 1 }, () => Array(m + 1).fill(0));
      for (let i = 1; i <= n; i++) {
        for (let j = 1; j <= m; j++) {
          dp[i][j] = a[i - 1].toLowerCase() === b[j - 1].toLowerCase()
            ? dp[i - 1][j - 1] + 1
            : Math.max(dp[i - 1][j], dp[i][j - 1]);
        }
      }
      const ops = [];
      let i = n, j = m;
      while (i > 0 || j > 0) {
        if (i > 0 && j > 0 && a[i - 1].toLowerCase() === b[j - 1].toLowerCase()) {
          ops.unshift({ type: "ok", ch: b[j - 1] });
          i--; j--;
        } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
          ops.unshift({ type: "miss", ch: b[j - 1] });
          j--;
        } else {
          ops.unshift({ type: "extra", ch: a[i - 1] });
          i--;
        }
      }
      return ops;
    }

    // Clean empty question bank as requested
    const INITIAL_QUESTIONS = [];

    // =========================================================================
    // 3. STUDY DAY BOUNDARY (03:00 AM - 03:00 AM) & CHECK-IN CALENDAR HELPERS
    // =========================================================================
    function getStudyDateKey(nowMs = Date.now()) {
      const shifted = new Date(nowMs - 3 * 3600 * 1000);
      const y = shifted.getFullYear();
      const m = String(shifted.getMonth() + 1).padStart(2, "0");
      const d = String(shifted.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function getStudyDayStartMs(nowMs = Date.now()) {
      const shifted = new Date(nowMs - 3 * 3600 * 1000);
      return new Date(shifted.getFullYear(), shifted.getMonth(), shifted.getDate(), 3, 0, 0, 0).getTime();
    }

    function getStudyDayEndMs(nowMs = Date.now()) {
      const shifted = new Date(nowMs - 3 * 3600 * 1000);
      return new Date(shifted.getFullYear(), shifted.getMonth(), shifted.getDate() + 1, 3, 0, 0, 0).getTime();
    }

    function addStudyDaysStartMs(nowMs, days) {
      const shifted = new Date(nowMs - 3 * 3600 * 1000);
      return new Date(shifted.getFullYear(), shifted.getMonth(), shifted.getDate() + days, 3, 0, 0, 0).getTime();
    }

    function isCardDue(fsrs, nowMs = Date.now()) {
      if (!fsrs || (fsrs.reps || 0) === 0) return true;
      const due = fsrs.due || 0;
      const isDayInterval = fsrs.state === "Review" || (fsrs.scheduledDays || 0) >= 1;
      if (isDayInterval) {
        return due < getStudyDayEndMs(nowMs);
      }
      return due <= nowMs;
    }

    function computeCheckInStats(dailyLogs) {
      // dailyLogs = { "2026-11-15": { studySec: 1900, qCount: 12, ankiCount: 25 } }
      const checkedKeys = Object.keys(dailyLogs || {})
        .filter(k => k >= "2026-10-01" && k <= "2056-10-01" && (dailyLogs[k]?.studySec || 0) >= 1800)
        .sort();
      const totalDays = checkedKeys.length;
      let maxStreak = 0;
      let curStreak = 0;
      let prevDate = null;
      checkedKeys.forEach(k => {
        const dt = new Date(k + "T00:00:00");
        if (prevDate && Math.round((dt - prevDate) / 86400000) === 1) {
          curStreak += 1;
        } else {
          curStreak = 1;
        }
        if (curStreak > maxStreak) maxStreak = curStreak;
        prevDate = dt;
      });
      return { totalDays, maxStreak, checkedSet: new Set(checkedKeys) };
    }

    // =========================================================================
    // 4. FSRS SPACED REPETITION ENGINE (WITH REALISTIC ANKI LEARNING STEPS)
    // =========================================================================
    const FSRS_DEFAULTS = {
      w: [0.4, 0.6, 2.4, 5.8, 4.93, 0.94, 0.86, 0.01, 1.49, 0.14, 0.94, 2.18, 0.05, 0.34, 1.26, 0.29, 2.61],
      DECAY: -0.5,
      FACTOR: 19 / 81,
      MAX_INTERVAL: 180
    };

    function createInitialFSRS(nowMs = Date.now()) {
      return {
        state: "New",
        stepIdx: 0,
        stability: 0.4,
        difficulty: 5.0,
        elapsedDays: 0,
        scheduledDays: 0,
        reps: 0,
        lapses: 0,
        lastReview: nowMs,
        due: nowMs
      };
    }

    function fsrsRetrievability(elapsedDays, stability) {
      if (stability <= 0) return 0;
      return Math.pow(1 + FSRS_DEFAULTS.FACTOR * (Math.max(0, elapsedDays) / stability), FSRS_DEFAULTS.DECAY);
    }

    function fsrsNextIntervalDays(stability, targetRetention = 0.90) {
      const r = Math.min(0.98, Math.max(0.70, targetRetention));
      const ivl = (stability / FSRS_DEFAULTS.FACTOR) * (Math.pow(r, 1 / FSRS_DEFAULTS.DECAY) - 1);
      return Math.min(FSRS_DEFAULTS.MAX_INTERVAL, Math.max(1, Math.round(ivl)));
    }

    function fsrsSchedule(cardFsrs, grade, targetRetention = 0.90, nowMs = Date.now()) {
      const w = FSRS_DEFAULTS.w;
      const f = cardFsrs || createInitialFSRS(nowMs);
      const elapsedDays = f.lastReview ? Math.max(0, (nowMs - f.lastReview) / 86400000) : 0;
      const clampD = (d) => Math.min(10, Math.max(1, d));

      let nextS = f.stability || 0.4;
      let nextD = f.difficulty || 5.0;
      let nextState = f.state || "New";
      let nextStepIdx = f.stepIdx || 0;
      let nextLapses = f.lapses || 0;
      let nextDays = 0;
      let dueMs = nowMs;

      // Case 1: New or Learning (multi-step intra-session consolidation)
      if (f.reps === 0 || f.state === "New" || f.state === "Learning") {
        nextD = clampD(w[4] - Math.exp(w[5] * (grade - 1)) + 1);
        if (grade === 1) {
          // Again: < 1 min, reset to step 0
          nextState = "Learning"; nextStepIdx = 0; nextS = 0.3; nextDays = 0;
          dueMs = nowMs + 60 * 1000;
        } else if (grade === 2) {
          // Hard: < 6 min, stay in Learning
          nextState = "Learning"; nextStepIdx = f.stepIdx || 0; nextS = 0.5; nextDays = 0;
          dueMs = nowMs + 6 * 60 * 1000;
        } else if (grade === 3) {
          // Good: Step 0 -> <10 min (Step 1); Step 1+ -> Graduate to Review (1 day)
          if ((f.stepIdx || 0) === 0) {
            nextState = "Learning"; nextStepIdx = 1; nextS = 1.0; nextDays = 0;
            dueMs = nowMs + 10 * 60 * 1000;
          } else {
            nextState = "Review"; nextStepIdx = 2; nextS = 1.2; nextDays = 1;
            dueMs = addStudyDaysStartMs(nowMs, 1);
          }
        } else {
          // Easy: Graduate immediately (3 days)
          nextState = "Review"; nextStepIdx = 2; nextS = 3.0; nextDays = 3;
          dueMs = addStudyDaysStartMs(nowMs, 3);
        }
      } else if (f.state === "Relearning") {
        // Relearning a lapsed Review card
        if (grade === 1) {
          nextState = "Relearning"; nextStepIdx = 0; nextDays = 0;
          dueMs = nowMs + 60 * 1000;
        } else if (grade === 2) {
          nextState = "Relearning"; nextStepIdx = 0; nextDays = 0;
          dueMs = nowMs + 6 * 60 * 1000;
        } else {
          nextState = "Review";
          nextDays = grade === 4 ? Math.max(2, Math.min(7, Math.round((f.scheduledDays || 2) * 0.6))) : 1;
          nextS = Math.max(1.0, nextDays);
          dueMs = addStudyDaysStartMs(nowMs, nextDays);
        }
      } else {
        // Mature / Young Review Card
        const R = fsrsRetrievability(elapsedDays, f.stability);
        nextD = clampD(f.difficulty - w[6] * (grade - 3));
        nextD = clampD(w[7] * w[4] + (1 - w[7]) * nextD);
        if (grade === 1) {
          nextLapses += 1;
          nextState = "Relearning";
          nextStepIdx = 0;
          nextS = Math.max(0.4, (f.stability || 1) * 0.35);
          nextDays = 0;
          dueMs = nowMs + 10 * 60 * 1000;
        } else {
          const hardPenalty = grade === 2 ? 0.75 : 1;
          const easyBonus = grade === 4 ? 1.3 : 1;
          const rawS = f.stability * (1 + Math.exp(w[8]) * (11 - nextD) * Math.pow(f.stability, -w[9]) * (Math.exp(w[10] * (1 - R)) - 1) * hardPenalty * easyBonus);
          // Smooth growth cap: never jump more than 2.4x previous stability in one review
          nextS = Math.min(FSRS_DEFAULTS.MAX_INTERVAL, Math.max(1, Math.min(rawS, Math.max(2, f.stability * (grade === 4 ? 2.5 : grade === 3 ? 2.0 : 1.3)))));
          nextState = "Review";
          nextDays = fsrsNextIntervalDays(nextS, targetRetention);
          if (grade === 2) nextDays = Math.max(1, Math.min(nextDays, Math.round((f.scheduledDays || 1) * 1.2)));
          dueMs = addStudyDaysStartMs(nowMs, nextDays);
        }
      }

      return {
        state: nextState,
        stepIdx: nextStepIdx,
        stability: Number(nextS.toFixed(3)),
        difficulty: Number(nextD.toFixed(3)),
        elapsedDays: Number(elapsedDays.toFixed(2)),
        scheduledDays: nextDays,
        reps: (f.reps || 0) + 1,
        lapses: nextLapses,
        lastReview: nowMs,
        due: dueMs
      };
    }

    function formatFsrsInterval(nextFsrs) {
      if (!nextFsrs) return "1天";
      const diffMs = Math.max(0, (nextFsrs.due || 0) - (nextFsrs.lastReview || Date.now()));
      if ((nextFsrs.scheduledDays || 0) < 1) {

          return `< ${mins} 分钟`;
        }
        return `${Math.max(1, Math.round(diffMs / 3600000))} 小时`;
      }
      const d = nextFsrs.scheduledDays;
      if (d < 30) return `${d} 天`;
      if (d < 365) return `${(d / 30).toFixed(1)} 个月`;
      return `${(d / 365).toFixed(1)} 年`;
    }

    function extractAutoKeyClues(q) {
      if (!q || !q.stem) return [];
      if (Array.isArray(q.keyClues) && q.keyClues.length > 0) return q.keyClues;
      const stem = String(q.stem);
      const clues = [];
      // 1. High-yield clinical patterns in stem
      const patterns = [
        /\b\d{1,3}-year-old\s+(?:man|woman|boy|girl|male|female|infant|child)\b/i,
        /(?:blood pressure|BP)\s+(?:is|of)?\s*\d{2,3}\/\d{2,3}\s*mm\s*Hg/i,
        /(?:temperature|temp)\s+(?:is|of)?\s*\d{2,3}(?:\.\d)?\s*°?[CF]/i,
        /(?:pulse|heart rate|HR)\s+(?:is|of)?\s*\d{2,3}(?:\/min|\s*bpm)?/i,
        /(?:pH|PaCO2|HCO3-|creatinine|potassium|sodium|hemoglobin|WBC|platelets)\s*(?:is|of|:|=)?\s*[\d.,]+(?:\s*(?:mEq\/L|mg\/dL|g\/dL|mm\s*Hg|\/mm3))?/i
      ];
      patterns.forEach(re => {
        const m = stem.match(re);
        if (m && m[0] && !clues.includes(m[0])) clues.push(m[0]);
      });
      // 2. Discriminating phrases from Educational Objective / Correct Answer appearing in stem
      const eoWords = ((q.educationalObjective || "") + " " + (q.options?.[q.answer] || ""))
        .toLowerCase()
        .match(/[a-z]{5,}/g) || [];
      const stop = new Set(["which","patient","diagnosis","treatment","mechanism","associated","increased","decreased","following","most","likely","causes","cause","syndrome","disease"]);
      const uniqueEo = Array.from(new Set(eoWords)).filter(w => !stop.has(w));
      const sentences = stem.split(/(?<=[.!?])\s+/);
      sentences.forEach(sent => {
        if (clues.length >= 4) return;
        const low = sent.toLowerCase();
        const hit = uniqueEo.some(w => low.includes(w));
        if (hit && sent.length <= 140 && !clues.some(c => sent.includes(c))) {
          clues.push(sent.trim());
        }
      });
      // Fallback: pick 2 key finding clauses
      if (clues.length < 2) {
        const findingRe = /(?:reveals?|shows?|demonstrates?|auscultation|biopsy|ECG|CT|MRI|radiograph)[^.;,]{8,75}/gi;
        let fm;
        while ((fm = findingRe.exec(stem)) !== null && clues.length < 3) {
          if (!clues.includes(fm[0].trim())) clues.push(fm[0].trim());
        }
      }
      return clues.slice(0, 4);
    }

    function renderHighlightedStem(stem, highlights = [], clues = [], showClues = false) {
      if (!stem) return null;
      const activeClues = showClues ? (clues || []).filter(Boolean) : [];
      const activeHls = (highlights || []).filter(Boolean);
      const all = [...activeClues, ...activeHls];
      if (all.length === 0) return stem;
      const escaped = all.map(h => h.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).sort((a, b) => b.length - a.length);
      if (escaped.length === 0) return stem;
      const parts = stem.split(new RegExp(`(${escaped.join("|")})`, "g"));
      return parts.map((part, idx) => {
        if (activeClues.includes(part)) return <mark key={idx} className="uw-clue" title="关键题眼 (Key Clue)">{part}</mark>;
        if (activeHls.includes(part)) return <mark key={idx} className="uw-hl">{part}</mark>;
        return <React.Fragment key={idx}>{part}</React.Fragment>;
      });
    }

    function parseAndReplaceCloze(text, revealed = false, activeCNum = null) {
      if (!text) return "";
      const src = String(text);
      let out = "";
      let i = 0;
      const openRe = /\{\{\s*[cC](\d+)\s*::/g;
      while (i < src.length) {
        openRe.lastIndex = i;
        const m = openRe.exec(src);
        if (!m) {
          out += src.slice(i);
          break;
        }
        out += src.slice(i, m.index);
        const cNum = Number(m[1]);
        let j = openRe.lastIndex;
        let depth = 2; // we already consumed "{{"
        while (j < src.length && depth > 0) {
          if (src[j] === "{") depth++;
          else if (src[j] === "}") depth--;
          j++;
        }
        if (depth > 0) {
          // Unclosed, emit rest as-is
          out += src.slice(m.index);
          break;
        }
        // Body is between openRe.lastIndex and j - 2 (closing "}}")
        const body = src.slice(openRe.lastIndex, j - 2);
        const sepIdx = body.lastIndexOf("::");
        let ans = body, hint = "";
        if (sepIdx !== -1) {
          const possibleHint = body.slice(sepIdx + 2);
          if (!possibleHint.includes("<") && !possibleHint.includes(">") && !possibleHint.includes("$")) {
            ans = body.slice(0, sepIdx);
            hint = possibleHint.trim();
          }
        }
        const isTarget = !activeCNum || cNum === Number(activeCNum);
        if (!isTarget) {
          out += ans;
        } else if (!revealed) {
          const safeHint = (hint || "...").replace(/</g, "&lt;").replace(/>/g, "&gt;");
          out += `<span class="inline-block px-2 py-0.5 mx-0.5 rounded bg-blue-100 text-blue-800 border border-blue-300 font-bold">[${safeHint}]</span>`;
        } else {
          out += `<span class="inline-block px-1.5 py-0.5 mx-0.5 rounded bg-emerald-100 text-emerald-900 border border-emerald-400 font-bold">${ans}</span>`;
        }
        i = j;
      }
      return out;
    }

        const idx = maths.length;

      const restore = (str) => str.replace(/@@MATH_(\d+)@@/g, (_, idx) => maths[Number(idx)] || "");

    function normalizeAnkiClozeActiveNum(cards) {
      if (!Array.isArray(cards) || cards.length === 0) return cards || [];
      const groups = new Map();
      cards.forEach((c, idx) => {
        if (c && c.type === "cloze" && c.text && !c.activeCNum) {
          const key = c.text;
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(idx);
        }
      });
      if (groups.size === 0) return cards;
      const out = [...cards];
      groups.forEach((idxs, txt) => {
        const nums = [];
        const re = /\{\{\s*[cC](\d+)\s*::/g;
        let m;
        while ((m = re.exec(txt)) !== null) {
          const n = Number(m[1]);
          if (!nums.includes(n)) nums.push(n);
        }
        nums.sort((a, b) => a - b);
        if (nums.length === 0) return;
        idxs.forEach((cardIdx, pos) => {
          out[cardIdx] = { ...out[cardIdx], activeCNum: nums[pos % nums.length] };
        });
      });
      return out;
    }

    function isZstdBytes(u8) {
      return u8 && u8.length >= 4 && u8[0] === 0x28 && u8[1] === 0xb5 && u8[2] === 0x2f && u8[3] === 0xfd;
    }

    function maybeDecompressZstd(u8) {
      if (!isZstdBytes(u8)) return u8;
      if (!window.fzstd || !window.fzstd.decompress) throw new Error("Zstd 解压引擎 (fzstd) 未加载");

    function parseMediaProtobuf(u8) {
      // Minimal Protobuf decoder for Anki MediaEntries { repeated MediaEntry entries = 1; }
      const dec = new TextDecoder("utf-8");
      const readVarint = (buf, pos) => {
        let val = 0, shift = 0;
        while (pos < buf.length) {
          const b = buf[pos++];
          val |= (b & 0x7f) << shift;
          if ((b & 0x80) === 0) break;
          shift += 7;
        }
        return [val, pos];
      };
      const map = {};
      let pos = 0, idx = 0;
      while (pos < u8.length) {
        const [tag, p1] = readVarint(u8, pos); pos = p1;
        const fieldNum = tag >> 3, wireType = tag & 7;
        if (fieldNum === 1 && wireType === 2) {
          const [len, p2] = readVarint(u8, pos); pos = p2;
          const entryEnd = pos + len;
          let ePos = pos, fname = "";
          while (ePos < entryEnd) {
            const [eTag, ep1] = readVarint(u8, ePos); ePos = ep1;
            const ef = eTag >> 3, ew = eTag & 7;
            if (ef === 1 && ew === 2) {
              const [slen, ep2] = readVarint(u8, ePos); ePos = ep2;
              fname = dec.decode(u8.subarray(ePos, ePos + slen));
              ePos += slen;
            } else if (ew === 0) {
              const [, ep2] = readVarint(u8, ePos); ePos = ep2;
            } else if (ew === 2) {
              const [blen, ep2] = readVarint(u8, ePos); ePos = ep2 + blen;
            } else break;
          }
          if (fname) map[String(idx)] = fname;
          idx++;
          pos = entryEnd;
        } else if (wireType === 0) {
          const [, p2] = readVarint(u8, pos); pos = p2;
        } else if (wireType === 2) {
          const [len, p2] = readVarint(u8, pos); pos = p2 + len;
        } else break;
      }
      return map;
    }

    function uint8ToBase64(u8) {
      let bin = "";
      const chunk = 0x8000;
      for (let i = 0; i < u8.length; i += chunk) {
        bin += String.fromCharCode.apply(null, u8.subarray(i, i + chunk));
      }
      return btoa(bin);
    }

    // Parse .apkg (Supports both Legacy collection.anki2/21 JSON and Anki 23.10+ collection.anki21b Zstd + Protobuf!)
    async function parseApkgFile(file, fallbackStep, fallbackSystem) {
      if (!window.JSZip) throw new Error("JSZip 未加载");
      const zip = await window.JSZip.loadAsync(file);
      const dbEntry = zip.file("collection.anki21b") || zip.file("collection.anki21") || zip.file("collection.anki2");
      if (!dbEntry) throw new Error("无效的 .apkg 文件（缺少数据库）");

      const mediaEntry = zip.file("media");
      const mediaMap = {};
      if (mediaEntry) {
        const rawMediaU8 = maybeDecompressZstd(new Uint8Array(await mediaEntry.async("arraybuffer")));
        let filenameMap = {};
        if (rawMediaU8.length > 0 && rawMediaU8[0] === 0x7b) {
          filenameMap = JSON.parse(new TextDecoder("utf-8").decode(rawMediaU8));
        } else {
          filenameMap = parseMediaProtobuf(rawMediaU8);
        }
        for (const [numKey, filename] of Object.entries(filenameMap)) {
          const fEntry = zip.file(numKey);
          if (fEntry) {
            const fileU8 = maybeDecompressZstd(new Uint8Array(await fEntry.async("arraybuffer")));
            const b64 = uint8ToBase64(fileU8);
            const ext = (filename.split(".").pop() || "png").toLowerCase();
            const mime = ext === "jpg" || ext === "jpeg" ? "image/jpeg" : ext === "gif" ? "image/gif" : ext === "svg" ? "image/svg+xml" : "image/png";
            mediaMap[filename] = `data:${mime};base64,${b64}`;
          }
        }
      }

      const replaceMedia = (str) => {
        if (!str) return "";
        return str.replace(/src=["']([^"']+)["']/gi, (full, fname) => {
          const clean = decodeURIComponent(fname);
          return mediaMap[clean] ? `src="${mediaMap[clean]}"` : full;
        });
      };

      const SQL = await getSqlInstance();
      const rawDbU8 = new Uint8Array(await dbEntry.async("arraybuffer"));
      const dbBytes = maybeDecompressZstd(rawDbU8);
      const db = new SQL.Database(dbBytes);

      let decksJson = {};
      let colCrtSec = Math.floor(Date.now() / 1000);
      try {
        const colRes = db.exec("SELECT crt, decks FROM col LIMIT 1");
        if (colRes[0]?.values?.[0]) {
          if (colRes[0].values[0][0]) colCrtSec = Number(colRes[0].values[0][0]);
          if (colRes[0].values[0][1]) decksJson = JSON.parse(colRes[0].values[0][1]);
        }
      } catch (e) {}
      try {
        const dRows = db.exec("SELECT id, name FROM decks");
        if (dRows[0]?.values) dRows[0].values.forEach(([id, name]) => { decksJson[String(id)] = { name }; });
      } catch (e) {}

      const rows = db.exec(`
        SELECT c.id, c.did, c.ord, c.type, c.queue, c.due, c.ivl, c.reps, c.lapses, n.flds
        FROM cards c JOIN notes n ON c.nid = n.id
      `);
      const imported = [];
      if (rows[0]?.values) {
        rows[0].values.forEach(([cid, did, cord, ctype, cqueue, cdue, ivl, reps, lapses, flds], idx) => {
          const fields = String(flds || "").split("\x1f");
          const front = replaceMedia(fields[0] || "");
          const back = replaceMedia(fields.slice(1).join("<br/>"));
          if (front.includes("请更新至 Anki 的最新版本") || front.includes("Please update to the latest Anki")) return;
          const deckName = decksJson[String(did)]?.name || "";
          const nowMs = Date.now();
          const stability = ivl > 0 ? Number(ivl) : 0.4;
          let realDueMs = nowMs;
          let cardState = "New";
          const isSuspended = Number(cqueue) === -1;
          const isNewCard = Number(ctype) === 0 || Number(cqueue) === 0 || Number(reps) === 0;
          if (!isNewCard) {
            cardState = "Review";
            if (Number(cqueue) === 1 || Number(cqueue) === 3) {
              cardState = "Learning";
              realDueMs = Number(cdue) * 1000;
            } else if (Number(cqueue) === 2 || Number(ctype) === 2) {
              realDueMs = getStudyDayStartMs((colCrtSec + Number(cdue) * 86400) * 1000);
            }
          }
          const fsrs = {
            state: cardState,
            stability,
            difficulty: 5.0,
            elapsedDays: 0,
            scheduledDays: Math.max(0, Number(ivl || 0)),
            reps: isNewCard ? 0 : Number(reps || 0),
            lapses: Number(lapses || 0),
            lastReview: isNewCard ? 0 : Math.max(0, realDueMs - Math.max(1, Number(ivl || 1)) * 86400000),
            due: realDueMs
          };

          // Detect Anki 23.10+ Native Image Occlusion (image-occlusion:rect:left=...)
          const isNativeIO = front.includes("image-occlusion:rect:");
          if (isNativeIO) {
            const masks = [];
            const rectRe = /\{\{c(\d+)::image-occlusion:rect:([^}]+)\}\}/g;
            let rm;
            while ((rm = rectRe.exec(front)) !== null) {
              const cNum = Number(rm[1]);
              const props = rm[2];
              const getProp = (k) => {
                const pm = props.match(new RegExp(k + "=([\\d.]+)"));
                return pm ? parseFloat(pm[1]) * 100 : 0;
              };
              masks.push({
                cNum,
                x: getProp("left"),
                y: getProp("top"),
                w: getProp("width"),
                h: getProp("height")
              });
            }
            const allFieldsHtml = replaceMedia(fields.slice(1).join("<br/>"));
            const imgMatch = allFieldsHtml.match(/<img[^>]+src=["']([^"']+)["'][^>]*>/i);
            const ioImgSrc = imgMatch ? imgMatch[1] : "";
            const ioExtraHtml = allFieldsHtml.replace(/<img[^>]*>/gi, "").trim();
            imported.push({
              id: `apkg-${cid}-${Date.now()}-${idx}`,
              type: "io",
              step: fallbackStep,
              system: fallbackSystem,
              originalDeck: deckName,
              image: ioImgSrc,
              masks,
              activeCNum: Number(cord || 0) + 1,
              extra: ioExtraHtml,
              suspended: isSuspended,
              flag: 0,
              fsrs
            });
          } else {
            const isCloze = /\{\{\s*[cC]\d+\s*::/.test(front);
            imported.push({
              id: `apkg-${cid}-${Date.now()}-${idx}`,
              type: isCloze ? "cloze" : "basic",
              step: fallbackStep,
              system: fallbackSystem,
              originalDeck: deckName,
              text: front,
              extra: back,
              activeCNum: isCloze ? (Number(cord || 0) + 1) : undefined,
              suspended: isSuspended,
              flag: 0,
              fsrs
            });
          }
        });
      }
      db.close();
      return { imported, deckCount: Object.keys(decksJson).length, mediaCount: Object.keys(mediaMap).length };
    }

    // Export cards to real .apkg (ZIP + collection.anki2 + media)
    async function exportApkgFile(cards, presetNewLimit, presetRevLimit) {
      if (!window.JSZip) throw new Error("JSZip 未加载");
      const SQL = await getSqlInstance();
      const db = new SQL.Database();
      const nowSec = Math.floor(Date.now() / 1000);
      const nowMs = Date.now();

      db.run(`
        CREATE TABLE col (id integer primary key, crt integer not null, mod integer not null, scm integer not null, ver integer not null, dty integer not null, usn integer not null, ls integer not null, conf text not null, models text not null, decks text not null, dconf text not null, tags text not null);
        CREATE TABLE notes (id integer primary key, guid text not null, mid integer not null, mod integer not null, usn integer not null, tags text not null, flds text not null, sfld integer not null, csum integer not null, flags integer not null, data text not null);
        CREATE TABLE cards (id integer primary key, nid integer not null, did integer not null, ord integer not null, mod integer not null, usn integer not null, type integer not null, queue integer not null, due integer not null, ivl integer not null, factor integer not null, reps integer not null, lapses integer not null, left integer not null, odue integer not null, odid integer not null, flags integer not null, data text not null);
        CREATE TABLE revlog (id integer primary key, cid integer not null, usn integer not null, ease integer not null, ivl integer not null, lastIvl integer not null, factor integer not null, time integer not null, type integer not null);
        CREATE TABLE graves (usn integer not null, oid integer not null, type integer not null);
      `);

      const mid = 1600000000001;
      const models = {
        [mid]: {
          id: mid, name: "UWorld-Cloze", type: 1, mod: nowSec, usn: -1, sortf: 0, did: 1,
          tmpls: [{ name: "Cloze", ord: 0, qfmt: "{{cloze:Text}}", afmt: "{{cloze:Text}}<br><hr>{{Extra}}", bqfmt: "", bafmt: "", did: null }],
          flds: [{ name: "Text", ord: 0, sticky: false, rtl: false, font: "Arial", size: 20 }, { name: "Extra", ord: 1, sticky: false, rtl: false, font: "Arial", size: 16 }],
          css: ".card { font-family: arial; font-size: 18px; text-align: left; color: black; background-color: white; }"
        }
      };
      const decks = { "1": { id: 1, name: "UWorld QBank Anki", mod: nowSec, usn: -1, lrnToday: [0,0], revToday: [0,0], newToday: [0,0], timeToday: [0,0], collapsed: false, desc: "", dyn: 0, conf: 1 } };
      const dconf = { "1": { id: 1, name: "Default", new: { perDay: presetNewLimit, delays: [1, 10], ints: [1, 4, 7], initialFactor: 2500, order: 1 }, rev: { perDay: presetRevLimit, ease4: 1.3, ivlFct: 1, maxIvl: 36500 }, lapse: { delays: [10], mult: 0, minInt: 1, leechAction: 0, leechFails: 8 }, maxTaken: 60, timer: 0, autoplay: true, replayq: true, mod: nowSec, usn: -1 } };

      db.run("INSERT INTO col VALUES (1,?,?,?,?,0,-1,0,?,?,?,?,?)", [nowSec, nowMs, nowMs, 11, "{}", JSON.stringify(models), JSON.stringify(decks), JSON.stringify(dconf), "{}"]);

      const zip = new window.JSZip();
      const mediaManifest = {};
      let mediaIdx = 0;

      const extractMedia = (htmlStr) => {
        if (!htmlStr) return "";
        return htmlStr.replace(/src=["'](data:image\/([a-zA-Z0-9+]+);base64,([^"']+))["']/gi, (full, dataUri, ext, b64) => {
          const fname = `uw_img_${mediaIdx}.${ext === "jpeg" ? "jpg" : ext}`;
          zip.file(String(mediaIdx), b64, { base64: true });
          mediaManifest[String(mediaIdx)] = fname;
          mediaIdx++;
          return `src="${fname}"`;
        });
      };

      cards.forEach((c, i) => {
        const nid = nowMs + i * 10;
        const cid = nid + 1;
        let front = c.type === "io" ? `<img src="${c.image}">` : (c.text || "");
        let back = c.extra || "";
        front = extractMedia(front);
        back = extractMedia(back);
        const flds = `${front}\x1f${back}`;
        const reps = c.fsrs?.reps || 0;
        const ivl = Math.round(c.fsrs?.scheduledDays || 0);
        const lapses = c.fsrs?.lapses || 0;
        const ctype = reps === 0 ? 0 : 2;
        const cqueue = reps === 0 ? 0 : 2;
        const tag = `${c.step || "Step1"}_${(c.system || "General").replace(/\s+/g, "_")}`;
        db.run("INSERT INTO notes VALUES (?,?,?,?,?,?,?,?,?,0,'')", [nid, `uw_${nid}`, mid, nowSec, -1, ` ${tag} `, flds, 0, 0]);
        db.run("INSERT INTO cards VALUES (?,?,1,0,?,-1,?,?,?,?,2500,?,?,0,0,0,0,'')", [cid, nid, nowSec, ctype, cqueue, i + 1, ivl, reps, lapses]);
      });

      const dbBinary = db.export();
      db.close();
      zip.file("collection.anki2", dbBinary);
      zip.file("media", JSON.stringify(mediaManifest));
      return await zip.generateAsync({ type: "blob" });
    }

        const headers = { "apikey": cloudCfg.anonKey, "Authorization": "Bearer " + cloudCfg.anonKey };
        (async () => {
          try {
            const res = await fetch(`${baseUrl}/rest/v1/medspire_saves?username=eq.${encodeURIComponent(currentUser)}&select=data->updatedAt`, { headers });
            if (!res.ok) return;
            const rows = await res.json();
            const remoteUpd = rows?.[0]?.updatedAt;
            const localSyncAt = safeGetStorage(getUserKey(currentUser, "lastSyncAt"), "");
            if (remoteUpd && (!localSyncAt || new Date(remoteUpd).getTime() - new Date(localSyncAt).getTime() > 3000)) {
              await syncToSupabase("pull", true);
            }
          } catch (e) {}
        })();
      }, [currentUser]);

      // BeforeUnload: confirm exit if unsynced & fire keepalive upload of core progress + changed items!
      useEffect(() => {
        const onBeforeUnload = (e) => {
          if (currentUser === "guest" || !hasUnsynced) return;
          // Attempt keepalive lightweight progress upload
          try {
            const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
            const medEngFsrsMap = {};
            medEngCards.forEach(c => {
              if (c.suspended || (c.fsrs && (c.fsrs.reps > 0 || c.fsrs.lapses > 0))) {
                medEngFsrsMap[c.id] = { fsrs: c.fsrs, suspended: Boolean(c.suspended) };
              }
            });
            const ankiFsrsMap = {};
            ankiCards.forEach(c => {
              if (c.suspended || (c.fsrs && (c.fsrs.reps > 0 || c.fsrs.lapses > 0))) {
                ankiFsrsMap[c.id] = { fsrs: c.fsrs, suspended: Boolean(c.suspended) };
              }
            });
            fetch(`${baseUrl}/rest/v1/medspire_saves`, {
              method: "POST",
              keepalive: true,
              headers: { "apikey": cloudCfg.anonKey, "Authorization": "Bearer " + cloudCfg.anonKey, "Content-Type": "application/json", "Prefer": "resolution=merge-duplicates" },
              body: JSON.stringify({
                username: currentUser,
                data: {
                  mistakes, medEngMistakes, medEngRevLog, ankiRevLog,
                  attemptedMap, markedIds, notesMap, highlightsMap, dailyLogs,
                  medEngFsrsMap, ankiFsrsMap,
                  activeBlock: savedBlock,
                  updatedAt: new Date().toISOString()
                }
              })
            });
          } catch (err) {}
          e.preventDefault();
          e.returnValue = "你有未同步的学习进度，确定离开吗？（离开时将尝试自动上传核心进度）";
          return e.returnValue;
        };
        window.addEventListener("beforeunload", onBeforeUnload);
        return () => window.removeEventListener("beforeunload", onBeforeUnload);
      }, [currentUser, hasUnsynced, mistakes, medEngMistakes, medEngRevLog, ankiRevLog, attemptedMap, markedIds, notesMap, highlightsMap, dailyLogs, medEngCards, ankiCards, savedBlock]);

      const deleteQuestionById = (qid) => {
        setQuestions(prev => prev.filter(q => q.id !== qid));
        setMistakes(prev => prev.filter(m => m.id !== qid));
        setMarkedIds(prev => prev.filter(id => id !== qid));
        setAttemptedMap(prev => { const n = { ...prev }; delete n[qid]; return n; });
      };

      const handleBatchMoveQuestions = () => {
        if (selectedMoveIds.length === 0) { showToast("请先勾选要移动的题目", "error"); return; }
        const idSet = new Set(selectedMoveIds);
        setQuestions(prev => prev.map(q => idSet.has(q.id) ? { ...q, step: moveTargetStep, system: moveTargetSystem } : q));
        showToast(`已将 ${selectedMoveIds.length} 道题移动至 ${moveTargetStep} · ${moveTargetSystem}`, "success");
        setSelectedMoveIds([]);
      };

      const availableYears = useMemo(() => {
        const s = new Set(["2022"]);
        Object.keys(qbankManifest?.years || {}).forEach(y => s.add(String(y)));
        questions.forEach(q => { if (q.year) s.add(String(q.year)); });
        return Array.from(s).sort();
      }, [qbankManifest, questions]);

      const getSystemsForYearStep = (year, step) => {
        const base = year === "2022" ? [...getSystemsForStep(step)] : [];
        const baseIds = new Set(base.map(s => s.id));
        const mfSys = Object.keys(qbankManifest?.years?.[year]?.[step] || {});
        const qSys = questions.filter(q => (q.year || "2022") === year && (q.step || "Step 1") === step).map(q => q.system).filter(Boolean);
        [...mfSys, ...qSys].forEach(id => {
          if (!baseIds.has(id)) {
            baseIds.add(id);
            const known = ALL_SYSTEMS_UNIQUE.find(x => x.id === id);
            base.push(known || { id, cn: id });
          }
        });
        return base.length > 0 ? base : getSystemsForStep(step);
      };

      // QBank Eligible Questions
      const stepQuestions = useMemo(() => questions.filter(q => (q.year || "2022") === activeYear && (q.step || "Step 1") === activeStep), [questions, activeYear, activeStep]);
      const eligibleQuestions = useMemo(() => {
        return stepQuestions.filter(q => {
          if (qbankTrackFilter !== "ALL" && (q.track || "USMLE") !== qbankTrackFilter) return false;
          if (!selectedSystems.includes(q.system)) return false;
          if (qFilterMode === "Unused") return !attemptedMap[q.id];
          if (qFilterMode === "Incorrect") return mistakes.some(m => m.id === q.id) || (attemptedMap[q.id] && !attemptedMap[q.id].lastCorrect);
          if (qFilterMode === "Marked") return markedIds.includes(q.id);
          return true;
        });
      }, [stepQuestions, selectedSystems, qFilterMode, attemptedMap, mistakes, markedIds]);

      // Anki Eligible Cards (by Step & System, respecting New & Review limits)
      const ankiStepCards = useMemo(() => ankiCards.filter(c => (c.step || "Step 1") === ankiStep), [ankiCards, ankiStep]);
      const ankiDueStats = useMemo(() => {
        const now = Date.now();
        const filtered = ankiStepCards.filter(c => ankiSelectedSystems.includes(c.system));
        const activeFiltered = filtered.filter(c => !c.suspended);
        const newCards = activeFiltered.filter(c => !c.fsrs || c.fsrs.reps === 0);
        const revCards = activeFiltered.filter(c => c.fsrs && c.fsrs.reps > 0 && isCardDue(c.fsrs, now));
        return { total: filtered.length, newCards, revCards };
      }, [ankiStepCards, ankiSelectedSystems]);

      const startAnkiSession = () => {
        const pickedNew = ankiDueStats.newCards.slice(0, ankiNewLimit);
        const pickedRev = ankiDueStats.revCards.slice(0, ankiRevLimit);
        const queue = [...pickedRev, ...pickedNew];
        if (queue.length === 0) {
          showToast("当前选定系统没有新卡或到期复习卡！", "info");
          return;
        }
        setAnkiQueue(queue.map(c => c.id));
        setAnkiRevealed(false);
        setAnkiUndoStack([]);
        setView("ANKI_STUDY");
      };

      const startAnkiAheadSession = () => {
        const filtered = ankiStepCards.filter(c => ankiSelectedSystems.includes(c.system));
        if (filtered.length === 0) {
          showToast("当前选定系统暂无任何卡片！", "info");
          return;
        }
        const sorted = [...filtered].sort((a, b) => (a.fsrs?.due || 0) - (b.fsrs?.due || 0)).slice(0, Math.max(20, ankiRevLimit));
        setAnkiQueue(sorted.map(c => c.id));
        setAnkiRevealed(false);
        setAnkiUndoStack([]);
        setView("ANKI_STUDY");
        showToast(`已开启提前复习模式（共 ${sorted.length} 张）`, "info");
      };

      const currentAnkiStudyCard = useMemo(() => {
        if (ankiQueue.length === 0) return null;
        return ankiCards.find(c => c.id === ankiQueue[0]) || null;
      }, [ankiQueue, ankiCards]);

      const handleAnkiStudyUndo = () => {
        if (ankiUndoStack.length === 0) {
          showToast("当前没有可撤销的卡片", "info");
          return;
        }
        const snap = ankiUndoStack[ankiUndoStack.length - 1];
        setAnkiUndoStack(prev => prev.slice(0, -1));
        setAnkiCards(prev => prev.map(c => c.id === snap.cardId ? { ...c, fsrs: snap.prevFsrs } : c));
        setAnkiRevLog(prev => prev.slice(snap.addedLogCount || 1));
        setDailyLogs(prev => {
          const cur = prev[snap.dayKey];
          if (!cur) return prev;
          return { ...prev, [snap.dayKey]: { ...cur, ankiCount: Math.max(0, (cur.ankiCount || 0) - 1) } };
        });
        setAnkiQueue(snap.prevQueue);
        setAnkiRevealed(true);
        showToast("已撤销至上一张 Anki 卡片，可重新评分", "info");
      };

      const handleAnkiStudyRate = (grade) => {
        if (!currentAnkiStudyCard) return;
        const nowMs = Date.now();
        const dk = getStudyDateKey();
        const snap = {
          cardId: currentAnkiStudyCard.id,
          prevFsrs: currentAnkiStudyCard.fsrs ? { ...currentAnkiStudyCard.fsrs } : createInitialFSRS(),
          prevQueue: [...ankiQueue],
          addedLogCount: 1,
          dayKey: dk
        };
        setAnkiUndoStack(prev => [...prev.slice(-29), snap]);
        const nextFsrs = fsrsSchedule(currentAnkiStudyCard.fsrs, grade, targetRetention, nowMs);
        setAnkiCards(prev => prev.map(c => c.id === currentAnkiStudyCard.id ? { ...c, fsrs: nextFsrs } : c));
        setAnkiRevLog(prev => [{
          ts: nowMs,
          dayKey: getStudyDateKey(nowMs),
          cardId: currentAnkiStudyCard.id,
          step: currentAnkiStudyCard.step || "Step 1",
          system: currentAnkiStudyCard.system || "General Principles",
          grade,
          stateBefore: currentAnkiStudyCard.fsrs?.state || "New",
          ivlAfter: nextFsrs.scheduledDays || 0
        }, ...prev.slice(0, 4999)]);
        setDailyLogs(prev => {
          const cur = prev[dk] || { studySec: 0, qCount: 0, ankiCount: 0 };
          return { ...prev, [dk]: { ...cur, ankiCount: (cur.ankiCount || 0) + 1 } };
        });
        setAnkiRevealed(false);
        const keepInSession = nextFsrs.state === "Learning" || nextFsrs.state === "Relearning";
        setAnkiQueue(prev => {
          const rest = prev.slice(1);
          if (keepInSession) {
            const insertAt = Math.min(rest.length, grade === 1 ? 2 : 4);
            return [...rest.slice(0, insertAt), prev[0], ...rest.slice(insertAt)];
          }
          if (rest.length === 0) {
            setTimeout(() => { showToast("本次 Anki 知识点学习已完成！", "success"); setView("DASHBOARD"); }, 50);
          }
          return rest;
        });
      };

      // FSRS Mistakes Due
      const dueMistakes = useMemo(() => {
        const now = Date.now();
        const qIdSet = new Set(questions.map(q => q.id));
        return mistakes.filter(m => qIdSet.has(m.id) && (!m.fsrs || isCardDue(m.fsrs, now))).sort((a, b) => (a.fsrs?.due || 0) - (b.fsrs?.due || 0));
      }, [mistakes, questions]);
      const currentFsrsCard = dueMistakes[0] || null;

      // Start QBank Test
      const startTestBlock = async () => {
        const newly = await ensureStaticSystemsLoaded(activeYear, activeStep, selectedSystems);
        let pool = eligibleQuestions;
        if (newly.length > 0) {
          const m = new Map();
          [...questions, ...newly].forEach(q => { if (q && q.id) m.set(q.id, q); });
          pool = Array.from(m.values()).filter(q => {
            if ((q.year || "2022") !== activeYear || (q.step || "Step 1") !== activeStep) return false;
            if (qbankTrackFilter !== "ALL" && (q.track || "USMLE") !== qbankTrackFilter) return false;
            if (!selectedSystems.includes(q.system)) return false;
            if (qFilterMode === "Unused") return !attemptedMap[q.id];
            if (qFilterMode === "Incorrect") return mistakes.some(x => x.id === q.id) || (attemptedMap[q.id] && !attemptedMap[q.id].lastCorrect);
            if (qFilterMode === "Marked") return markedIds.includes(q.id);
            return true;
          });
        }
        if (pool.length === 0) { showToast("当前筛选条件下暂无题目", "error"); return; }
        const picked = [...pool].sort(() => Math.random() - 0.5).slice(0, Math.min(questionCount, pool.length));
        const block = {
          id: `blk-${Date.now()}`,
          year: activeYear,
          step: activeStep,
          mode: testMode,
          sectionTitle: `${activeYear} · ${activeStep} · ${testMode} · ${qFilterMode}`,
          qIds: picked.map(q => q.id),
          currentIndex: 0,
          answers: {},
          submitted: {},
          struck: {},
          elapsedSec: 0,
          startedAt: new Date().toLocaleString("zh-CN", { hour12: false })
        };
        setActiveBlock(block);
        setExpandedExpOpt(null);
        setView("TEST");
      };


      const resetSingleQuestionStatus = (qid) => {
        setAttemptedMap(prev => { const n = { ...prev }; delete n[qid]; return n; });
        setMistakes(prev => prev.filter(m => m.id !== qid));
        if (activeBlock && activeBlock.qIds.includes(qid)) {
          setActiveBlock(prev => {
            if (!prev) return prev;
            const newSub = { ...prev.submitted }; delete newSub[qid];
            const newAns = { ...prev.answers }; delete newAns[qid];
            return { ...prev, submitted: newSub, answers: newAns };
          });
        }
        showToast("已重置该题为未写状态", "info");
      };

      const resetSystemQuestionsStatus = (sysId) => {
        const targetIds = new Set(questions.filter(q => (q.step || "Step 1") === activeStep && q.system === sysId).map(q => q.id));
        if (targetIds.size === 0) return;
        if (!confirm(`确定要重置「${sysId}」全部 ${targetIds.size} 道题的作答状态（恢复为未写）吗？`)) return;
        setAttemptedMap(prev => {
          const n = { ...prev };
          targetIds.forEach(id => delete n[id]);
          return n;
        });
        setMistakes(prev => prev.filter(m => !targetIds.has(m.id)));
        showToast(`已重置「${sysId}」全部 ${targetIds.size} 道题状态！`, "success");
      };


      const startWeaknessBlock = async () => {
        const curSysList = getSystemsForYearStep(activeYear, activeStep);
        await ensureStaticSystemsLoaded(activeYear, activeStep, curSysList.map(s => s.id));
        const sysStats = curSysList.map(sys => {
          const qs = stepQuestions.filter(q => q.system === sys.id);
          const done = qs.filter(q => attemptedMap[q.id]);
          const right = done.filter(q => attemptedMap[q.id]?.lastCorrect).length;
          const acc = done.length > 0 ? right / done.length : 0.5;
          return { id: sys.id, acc, count: qs.length };
        }).filter(s => s.count > 0).sort((a, b) => a.acc - b.acc);

        const weakSysIds = new Set(sysStats.slice(0, 3).map(s => s.id));
        const mistakeIds = new Set(mistakes.map(m => m.id));
        const markedSet = new Set(markedIds);

        const scored = stepQuestions.map(q => {
          let score = 0;
          if (mistakeIds.has(q.id) || (attemptedMap[q.id] && !attemptedMap[q.id].lastCorrect)) score += 3;
          if (markedSet.has(q.id)) score += 2;
          if (weakSysIds.has(q.system)) score += 2;
          if (!attemptedMap[q.id]) score += 1;
          return { q, score, rnd: Math.random() };
        }).sort((a, b) => (b.score - a.score) || (a.rnd - b.rnd));

        const picked = scored.slice(0, Math.min(questionCount === 999 ? 40 : questionCount, scored.length)).map(x => x.q);
        if (picked.length === 0) { showToast("当前 Step 暂无题目可组卷", "error"); return; }
        setActiveBlock({
          id: `blk-weak-${Date.now()}`,
          step: activeStep,
          mode: testMode,
          sectionTitle: `${activeStep} · 🎯 薄弱项突击`,
          qIds: picked.map(q => q.id),
          currentIndex: 0,
          answers: {},
          submitted: {},
          struck: {},
          elapsedSec: 0,
          startedAt: new Date().toLocaleString("zh-CN", { hour12: false })
        });
        setExpandedExpOpt(null);
        setView("TEST");
        showToast(`已生成 ${picked.length} 题薄弱项突击卷！`, "success");
      };

      const convertQuestionToAnki = (q) => {
        if (!q) return;
        const ansText = q.options?.[q.answer] || q.answer;
        const promptCore = q.educationalObjective
          ? `${q.educationalObjective}\n\n核心考点：{{c1::${ansText}}}`
          : `${(q.stem || "").slice(0, 220)}...\n\n正确答案：{{c1::${ansText}}}`;
        const extraHtml = [
          q.generalExplanation ? `<div><strong>解析：</strong>${q.generalExplanation}</div>` : "",
          q.explanations?.[q.answer] ? `<div class="mt-2"><strong>正确选项解释：</strong>${q.explanations[q.answer]}</div>` : ""
        ].filter(Boolean).join("");
        const newCard = {
          id: `anki-q-${q.id}-${Date.now()}`,
          type: "cloze",
          step: q.step || activeStep,
          system: q.system,
          sourceQuestionId: q.id,
          text: promptCore,
          extra: extraHtml,
          activeCNum: 1,
          suspended: false,
          flag: 0,
          fsrs: createInitialFSRS()
        };
        setAnkiCards(prev => [newCard, ...prev]);
        showToast("已一键转存为 Anki 填空卡！", "success");
      };

      // Global Keyboard Shortcuts for Desktop Speed Study
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === "Escape") {
            if (zoomImage) { setZoomImage(null); return; }
            if (dictPopup) { setDictPopup(null); return; }
            if (linkedQModal) { setLinkedQModal(null); return; }
            if (linkAnkiModal) { setLinkAnkiModal(null); return; }
            if (showShortcutsModal) { setShowShortcutsModal(false); return; }
            if (showLabModal) { setShowLabModal(false); return; }
            if (showVocabModal) { setShowVocabModal(false); return; }
            if (showNotesModal) { setShowNotesModal(false); return; }
            return;
          }
          const tag = (e.target?.tagName || "").toUpperCase();
          if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || e.target?.isContentEditable) return;
          if (showQManager || showAnkiMgrModal || showMedEngManager || showAuthModal || showPerfModal || showNotebookModal || previewAnkiCard || editingAnkiCard || editingMedEngCard || showLabModal || showVocabModal || dictPopup || linkedQModal || linkAnkiModal || zoomImage || showShortcutsModal || showBackfillModal) return;

          const low = e.key.toLowerCase();
          if (e.key === "?") {
            e.preventDefault();
            setShowShortcutsModal(true);
            return;
          }

          if (view === "ANKI_STUDY" && currentAnkiStudyCard) {
            if (e.code === "Space") { e.preventDefault(); if (!ankiRevealed) setAnkiRevealed(true); }
            else if (e.key === "Enter") { e.preventDefault(); if (!ankiRevealed) setAnkiRevealed(true); else handleAnkiStudyRate(3); }
            else if (ankiRevealed && ["1", "2", "3", "4"].includes(e.key)) { e.preventDefault(); handleAnkiStudyRate(Number(e.key)); }
            else if (low === "z" || e.key === "ArrowLeft") { e.preventDefault(); handleAnkiStudyUndo(); }
            else if (low === "q") { e.preventDefault(); openAnkiLinkedQuestion(currentAnkiStudyCard); }
            else if (low === "e") { e.preventDefault(); setEditingAnkiCard({ ...currentAnkiStudyCard }); }
            else if (low === "s") {
              e.preventDefault();
              setAnkiCards(prev => prev.map(c => c.id === currentAnkiStudyCard.id ? { ...c, suspended: true } : c));
              setAnkiRevealed(false);
              setAnkiQueue(prev => prev.slice(1));
              showToast("已暂停该 Anki 卡片", "info");
            }
          } else if (view === "MEDENG_STUDY" && currentMedEngCard) {
            if (e.code === "Space") { e.preventDefault(); if (!medEngRevealed) setMedEngRevealed(true); }
            else if (e.key === "Enter") { e.preventDefault(); if (!medEngRevealed) setMedEngRevealed(true); else handleMedEngRate(3); }
            else if (medEngRevealed && ["1", "2", "3", "4"].includes(e.key)) { e.preventDefault(); handleMedEngRate(Number(e.key)); }
            else if (low === "z" || e.key === "ArrowLeft") { e.preventDefault(); handleMedEngUndo(); }
            else if (low === "r" || low === "v") { e.preventDefault(); speakEnglish(currentMedEngCard.front); }
            else if (low === "e") { e.preventDefault(); setEditingMedEngCard({ ...currentMedEngCard }); }
            else if (low === "s") {
              e.preventDefault();
              setMedEngCards(prev => prev.map(c => c.id === currentMedEngCard.id ? { ...c, suspended: true } : c));
              setMedEngRevealed(false);
              setMedEngQueue(prev => {
                const rest = [...prev.slice(0, medEngIdx), ...prev.slice(medEngIdx + 1)];
                if (medEngIdx >= rest.length) setMedEngIdx(0);
                return rest;
              });
              showToast("已暂停该医学英语卡片", "info");
            }
          } else if (view === "TEST" && activeBlock && currentQuestion) {
            const qid = currentQuestion.id;
            const isSub = Boolean(activeBlock.submitted[qid]);
            const keyMap = { "1": "A", "2": "B", "3": "C", "4": "D", "5": "E", "a": "A", "b": "B", "c": "C", "d": "D", "e": "E" };
            const opt = keyMap[low];
            if (opt && !isSub && currentQuestion.options?.[opt]) {
              setActiveBlock(p => ({ ...p, answers: { ...p.answers, [qid]: opt } }));
            } else if ((e.key === "Enter" || e.code === "Space") && !isSub) {
              if (activeBlock.answers[qid]) { e.preventDefault(); handleSubmitQuestion(); }
            } else if (e.key === "Enter" && isSub && activeBlock.currentIndex < activeBlock.qIds.length - 1) {
              e.preventDefault();
              setActiveBlock(p => ({ ...p, currentIndex: p.currentIndex + 1 })); setExpandedExpOpt(null);
            } else if ((e.key === "ArrowLeft" || low === "p") && activeBlock.currentIndex > 0) {
              setActiveBlock(p => ({ ...p, currentIndex: p.currentIndex - 1 })); setExpandedExpOpt(null);
            } else if ((e.key === "ArrowRight" || low === "n") && activeBlock.currentIndex < activeBlock.qIds.length - 1) {
              setActiveBlock(p => ({ ...p, currentIndex: p.currentIndex + 1 })); setExpandedExpOpt(null);
            } else if (low === "m") {
              e.preventDefault();
              setMarkedIds(p => p.includes(qid) ? p.filter(i => i !== qid) : [...p, qid]);
            } else if (low === "k" && isSub) {
              e.preventDefault();
              setShowKeyClues(v => !v);
            } else if (low === "l") {
              e.preventDefault();
              setShowLabModal(v => !v);
            } else if (low === "h") {
              e.preventDefault();
              setHighlightMode(v => !v);
            } else if (low === "o") {
              e.preventDefault();
              setShowNotesModal(v => !v);
            } else if (low === "t") {
              const sel = window.getSelection()?.toString().trim();
              if (sel) { e.preventDefault(); lookupSelectionInDict(sel, currentQuestion.stem + " " + Object.values(currentQuestion.options || {}).join(" "), currentQuestion); }
            }
          }
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, [view, activeBlock, currentQuestion, ankiRevealed, currentAnkiStudyCard, medEngRevealed, currentMedEngCard, medEngIdx, showQManager, showAnkiMgrModal, showMedEngManager, showAuthModal, showPerfModal, showNotebookModal, previewAnkiCard, editingAnkiCard, editingMedEngCard, showLabModal, showVocabModal, dictPopup, linkedQModal, linkAnkiModal, zoomImage, showShortcutsModal, showNotesModal]);

      const startOverviewFromQuestion = (sysQuestions, startIdx, titleLabel) => {
        if (!sysQuestions || sysQuestions.length === 0) return;
        const block = {
          id: `blk-ov-${Date.now()}`,
          step: activeStep,
          mode: "Tutor",
          sectionTitle: `${activeStep} · 总览直选 · ${titleLabel}`,
          qIds: sysQuestions.map(q => q.id),
          currentIndex: Math.max(0, Math.min(startIdx, sysQuestions.length - 1)),
          answers: {},
          submitted: {},
          struck: {},
          elapsedSec: 0,
          startedAt: new Date().toLocaleString("zh-CN", { hour12: false })
        };
        setActiveBlock(block);
        setExpandedExpOpt(null);
        setView("TEST");
      };

      const currentQuestion = useMemo(() => {
        if (!activeBlock) return null;
        return questions.find(q => q.id === activeBlock.qIds[activeBlock.currentIndex]) || null;
      }, [activeBlock, questions]);

      const recordAnswerResult = (q, chosen) => {
        const isCorrect = chosen === q.answer;
        setAttemptedMap(prev => ({ ...prev, [q.id]: { lastCorrect: isCorrect, count: (prev[q.id]?.count || 0) + 1 } }));
        const dk = getStudyDateKey();
        setDailyLogs(prev => {
          const cur = prev[dk] || { studySec: 0, qCount: 0, ankiCount: 0 };
          return { ...prev, [dk]: { ...cur, qCount: (cur.qCount || 0) + 1 } };
        });
        if (!isCorrect) {
          const nowMs = Date.now();
          setMistakes(prev => {
            const existing = prev.find(m => m.id === q.id);
            const rec = {
              ...q,
              wrongChoice: chosen,
              timestamp: new Date(nowMs).toLocaleString("zh-CN", { hour12: false }),
              sectionLabel: `${q.step || "Step 1"} · ${q.system}`,
              wrongCount: existing ? (existing.wrongCount || 1) + 1 : 1,
              fsrs: existing?.fsrs ? fsrsSchedule(existing.fsrs, 1, targetRetention, nowMs) : createInitialFSRS(nowMs)
            };
            return [rec, ...prev.filter(m => m.id !== q.id)];
          });
        }
      };

      const handleSubmitQuestion = () => {
        if (!activeBlock || !currentQuestion) return;
        const chosen = activeBlock.answers[currentQuestion.id];
        if (!chosen) { showToast("请先选择一个选项", "error"); return; }
        recordAnswerResult(currentQuestion, chosen);
        setActiveBlock(prev => ({ ...prev, submitted: { ...prev.submitted, [currentQuestion.id]: true } }));
        setExpandedExpOpt(currentQuestion.answer);
      };

      const handleEndBlock = () => {
        if (!activeBlock) return;
        const newSubmitted = { ...activeBlock.submitted };
        let correctCount = 0;
        activeBlock.qIds.forEach(qid => {
          const q = questions.find(item => item.id === qid);
          const chosen = activeBlock.answers[qid];
          if (q && chosen) {
            if (!newSubmitted[qid]) { recordAnswerResult(q, chosen); newSubmitted[qid] = true; }
            if (chosen === q.answer) correctCount++;
          }
        });
        setActiveBlock({ ...activeBlock, submitted: newSubmitted, correctCount });
        safeSetStorage(getUserKey(currentUser, "activeBlock"), null);
        setSavedBlock(null);
        setView("SUMMARY");
      };

      const formatTime = (sec) => {
        const m = Math.floor((sec || 0) / 60).toString().padStart(2, "0");
        const s = ((sec || 0) % 60).toString().padStart(2, "0");
        return `${m}:${s}`;
      };


      // MedEng (Exploring Medical Language) Computed Queues & Handlers
      const medEngFilteredAll = useMemo(() => {
        return medEngCards.filter(c => {
          if (!medEngSelectedSystems.includes(c.system)) return false;
          if (medEngCategoryFilter !== "ALL" && c.category !== medEngCategoryFilter) return false;
          if (medEngDirFilter !== "ALL" && c.direction !== medEngDirFilter) return false;
          return true;
        });
      }, [medEngCards, medEngSelectedSystems, medEngCategoryFilter, medEngDirFilter]);

      const medEngDueStats = useMemo(() => {
        const now = Date.now();
        const active = medEngFilteredAll.filter(c => !c.suspended);
        const newCards = active.filter(c => !c.fsrs || c.fsrs.reps === 0);
        const revCards = active.filter(c => c.fsrs && c.fsrs.reps > 0 && isCardDue(c.fsrs, now));
        return { newCards, revCards, total: active.length };
      }, [medEngFilteredAll]);

      const dueMedEngMistakes = useMemo(() => {
        const now = Date.now();
        return medEngMistakes.filter(m => !m.fsrs || isCardDue(m.fsrs, now));
      }, [medEngMistakes]);

      const startMedEngSession = () => {
        const pickedNew = medEngDueStats.newCards.slice(0, medEngNewLimit);
        const pickedRev = medEngDueStats.revCards.slice(0, medEngRevLimit);
        const q = [...pickedRev, ...pickedNew].map(c => c.id);
        if (q.length === 0) { showToast("当前筛选条件暂无到期或未学医学英语卡片！", "info"); return; }
        setMedEngQueue(q);
        setMedEngIdx(0);
        setMedEngRevealed(false);
        setMedEngUndoStack([]);
        setView("MEDENG_STUDY");
      };

      const startMedEngAheadSession = () => {
        const active = medEngFilteredAll.filter(c => !c.suspended);
        if (active.length === 0) { showToast("请先勾选至少一个章节或词库", "info"); return; }
        const q = active.slice(0, Math.max(1, medEngNewLimit + medEngRevLimit)).map(c => c.id);
        setMedEngQueue(q);
        setMedEngIdx(0);
        setMedEngRevealed(false);
        setMedEngUndoStack([]);
        setView("MEDENG_STUDY");
      };

      const startMedEngDictationSession = () => {
        const active = medEngFilteredAll.filter(c => !c.suspended);
        if (active.length === 0) { showToast("请先勾选至少一个章节或词库", "info"); return; }
        // Deduplicate by target English medical term so each term is tested once in dictation
        const seen = new Set();
        const picked = [];
        for (const c of active) {
          const term = c.direction === "正→反" ? c.front : c.back;
          const key = term.toLowerCase();
          if (!seen.has(key)) {
            seen.add(key);
            picked.push(c.id);
          }
          if (picked.length >= Math.max(10, medEngNewLimit + medEngRevLimit)) break;
        }
        setMedEngDictQueue(picked);
        setMedEngDictIdx(0);
        setMedEngDictInput("");
        setMedEngDictResult(null);
        setMedEngDictUndoStack([]);
        setView("MEDENG_DICTATION");
        const firstCard = medEngCards.find(c => c.id === picked[0]);
        if (firstCard) {
          const term = firstCard.direction === "正→反" ? firstCard.front : firstCard.back;
          setTimeout(() => speakEnglish(term, "en-US"), 150);
        }
      };

      const currentDictCard = useMemo(() => {
        if (view !== "MEDENG_DICTATION" || !medEngDictQueue[medEngDictIdx]) return null;
        return medEngCards.find(c => c.id === medEngDictQueue[medEngDictIdx]) || null;
      }, [view, medEngDictQueue, medEngDictIdx, medEngCards]);

      const ecdictShardCache = useRef({});
      const ecdictInflight = useRef({});

      const getEcdictShardKey = (word) => {
        const w = String(word || "").trim().toLowerCase();
        if (w.length >= 2 && /^[a-z]{2}$/.test(w.slice(0, 2))) return w.slice(0, 2);
        if (w.length >= 1 && /^[a-z]$/.test(w[0])) return w[0] + "_";
        return "__";
      };

      const loadEcdictShard = async (wordOrPrefix) => {
        const key = getEcdictShardKey(wordOrPrefix);
        if (ecdictShardCache.current[key]) return ecdictShardCache.current[key];
        if (ecdictInflight.current[key]) return ecdictInflight.current[key];
        const task = (async () => {
          let db = null;
          try {
            db = await new Promise((res, rej) => {
              const req = indexedDB.open("medspire_ecdict_v2", 1);
              req.onupgradeneeded = () => {
                if (!req.result.objectStoreNames.contains("shards")) req.result.createObjectStore("shards");
              };
              req.onsuccess = () => res(req.result);
              req.onerror = () => rej(req.error);
            });
            const cached = await new Promise((res) => {
              const tx = db.transaction("shards", "readonly");
              const r = tx.objectStore("shards").get(key);
              r.onsuccess = () => res(r.result || null);
              r.onerror = () => res(null);
            });
            if (cached && typeof cached === "object") {
              ecdictShardCache.current[key] = cached;
              return cached;
            }
          } catch (e) {}
          try {
            const resp = await fetch(`./dict/${key}.json`);
            if (resp.ok) {
              const data = await resp.json();
              ecdictShardCache.current[key] = data;
              if (db) {
                setTimeout(() => {
                  try {
                    const tx = db.transaction("shards", "readwrite");
                    tx.objectStore("shards").put(data, key);
                  } catch (e) {}
                }, 0);
              }
              return data;
            }
          } catch (e) {}
          return null;
        })();
        ecdictInflight.current[key] = task;
        try {
          return await task;
        } finally {
          delete ecdictInflight.current[key];
        }
      };

      const queryEcdictWord = async (raw) => {
        const clean = String(raw || "").trim().toLowerCase();
        if (!clean) return null;
        const candidates = [clean];
        if (!clean.includes(" ")) {
          if (clean.endsWith("ies") && clean.length > 4) candidates.push(clean.slice(0, -3) + "y");
          if (clean.endsWith("es") && clean.length > 3) {
            candidates.push(clean.slice(0, -2));
            candidates.push(clean.slice(0, -2) + "is");
          }
          if (clean.endsWith("s") && clean.length > 2) candidates.push(clean.slice(0, -1));
          if (clean.endsWith("ed") && clean.length > 3) {
            candidates.push(clean.slice(0, -2));
            candidates.push(clean.slice(0, -1));
          }
          if (clean.endsWith("ing") && clean.length > 4) {
            candidates.push(clean.slice(0, -3));
            candidates.push(clean.slice(0, -3) + "e");
          }
          if (clean.endsWith("ae") && clean.length > 3) candidates.push(clean.slice(0, -1));
          if (clean.endsWith("i") && clean.length > 3) candidates.push(clean.slice(0, -1) + "us");
        }
        for (const cand of candidates) {
          const shard = await loadEcdictShard(cand);
          if (!shard) return { unavailable: true };
          if (shard[cand]) {
            const entry = { ...shard[cand], matchedWord: cand };
            if (entry.x && (!entry.p || !entry.d)) {
              const m = entry.x.match(/(?:^|\/)0:([^/]+)/);
              if (m && m[1]) {
                const lShard = await loadEcdictShard(m[1].toLowerCase());
                const lEntry = lShard?.[m[1].toLowerCase()];
                if (lEntry) {
                  if (!entry.p && lEntry.p) entry.p = lEntry.p;
                  if (!entry.d && lEntry.d) entry.d = lEntry.d;
                }
              }
            }
            return entry;
          }
        }
        return null;
      };

      const lookupSelectionInDict = async (rawSelection, sourceText, qObj) => {
        const sel = String(rawSelection || "").trim().replace(/^[^a-zA-Z0-9]+|[^a-zA-Z0-9-]+$/g, "");
        if (!sel || sel.length < 2) { showToast("请先在题干或选项中划选英文单词或短语", "info"); return; }
        // Extract surrounding sentence from sourceText
        let ctxSentence = "";
        if (sourceText) {
          const sentences = String(sourceText).split(/(?<=[.!?])\s+/);
          ctxSentence = sentences.find(st => st.toLowerCase().includes(sel.toLowerCase())) || String(sourceText).slice(0, 220);
        }
        // Check local MedEng root matches
        const lowSel = sel.toLowerCase();
        const localRoots = medEngCards.filter(c => {
          if (c.direction !== "正→反") return false;
          const stem = c.front.replace(/\//g, "").replace(/-/g, "").toLowerCase();
          return stem.length >= 3 && (lowSel.includes(stem) || stem === lowSel);
        }).slice(0, 4);

        const initPopup = {
          word: sel,
          contextSentence: ctxSentence,
          sourceQuestionId: qObj?.id || "",
          sourceStep: qObj?.step || "",
          sourceSystem: qObj?.system || "",
          loading: true,
          ukPhonetic: "",
          usPhonetic: "",
          ukAudio: "",
          usAudio: "",
          zhMeaning: "",
          enDef: "",
          dictExample: "",
          dictSource: "",
          dictTags: "",
          matchedWord: "",
          localRoots
        };
        setDictPopup(initPopup);

        let ukPhonetic = "", usPhonetic = "", ukAudio = "", usAudio = "", enDef = "", dictExample = "", zhMeaning = "";
        let dictSource = "", dictTags = "", matchedWord = "";

        // 1. Primary: Query local/GitHub ECDICT shards (./dict/<letter>.json)
        const ec = await queryEcdictWord(sel);
        if (ec && !ec.unavailable) {
          dictSource = "ECDICT";
          if (ec.p) {
            const ph = `[${ec.p}]`;
            ukPhonetic = ph;
            usPhonetic = ph;
          }
          if (ec.t) zhMeaning = ec.t;
          if (ec.d) enDef = ec.d;
          if (ec.g) dictTags = ec.g;
          if (ec.matchedWord && ec.matchedWord !== lowSel) matchedWord = ec.matchedWord;
        } else {
          // 2. Fallback: Online dictionaryapi.dev + mymemory (when ./dict/ not deployed yet)
          dictSource = ec?.unavailable ? "ONLINE_FALLBACK" : "ONLINE";
          const singleWord = sel.split(/\s+/)[0].toLowerCase();
          try {
            if (!sel.includes(" ")) {
              const r = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(singleWord)}`);
              if (r.ok) {
                const data = await r.json();
                const entry = data?.[0];
                if (entry) {
                  (entry.phonetics || []).forEach(p => {
                    if (p.audio && p.audio.includes("-uk")) { ukAudio = p.audio; if (p.text) ukPhonetic = p.text; }
                    else if (p.audio && p.audio.includes("-us")) { usAudio = p.audio; if (p.text) usPhonetic = p.text; }
                    if (!ukPhonetic && p.text) ukPhonetic = p.text;
                    if (!usPhonetic && p.text) usPhonetic = p.text;
                  });
                  const m0 = entry.meanings?.[0];
                  if (m0) {
                    const d0 = m0.definitions?.[0];
                    enDef = `(${m0.partOfSpeech || ""}) ${d0?.definition || ""}`;
                    dictExample = d0?.example || "";
                  }
                }
              }
            }
          } catch (e) {}

          try {
            const tr = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(sel)}&langpair=en|zh-CN`);
            if (tr.ok) {
              const td = await tr.json();
              zhMeaning = td?.responseData?.translatedText || "";
            }
          } catch (e) {}
        }

        setDictPopup(prev => prev && prev.word === sel ? {
          ...prev,
          loading: false,
          ukPhonetic,
          usPhonetic,
          ukAudio,
          usAudio,
          zhMeaning: zhMeaning || (localRoots[0]?.back || ""),
          enDef,
          dictExample,
          dictSource,
          dictTags,
          matchedWord
        } : prev);
      };

      const openAnkiLinkedQuestion = (card) => {
        if (!card) return;
        if (card.sourceQuestionId) {
          const found = questions.find(q => q.id === card.sourceQuestionId);
          if (found) {
            setLinkedQModal({ question: found, ankiCard: card });
            return;
          }
        }
        setLinkAnkiModal({ ankiCard: card, search: "" });
      };

      const bindAnkiToQuestion = (card, q) => {
        setAnkiCards(prev => prev.map(c =>
          (c.id === card.id || (card.text && c.text === card.text))
            ? { ...c, sourceQuestionId: q.id }
            : c
        ));
        if (previewAnkiCard && previewAnkiCard.id === card.id) {
          setPreviewAnkiCard(p => ({ ...p, sourceQuestionId: q.id }));
        }
        setLinkAnkiModal(null);
        setLinkedQModal({ question: q, ankiCard: { ...card, sourceQuestionId: q.id } });
        showToast("已永久关联该原题！", "success");
      };

      const batchAutoLinkAnkiQuestions = () => {
        if (questions.length === 0) { showToast("当前题库为空，无法自动匹配", "error"); return; }
        let linkedCnt = 0;
        setAnkiCards(prev => prev.map(c => {
          if (c.sourceQuestionId) return c;
          const cands = findCandidateQuestionsForAnki(c, questions);
          if (cands[0] && cands[0].score >= 48) {
            linkedCnt++;
            return { ...c, sourceQuestionId: cands[0].q.id };
          }
          return c;
        }));
        if (linkedCnt > 0) showToast(`已智能为 ${linkedCnt} 张旧 Anki 卡片自动关联原题！`, "success");
        else showToast("未发现高置信度匹配，可在单张卡片点击「🔗 原题」手动检索绑定", "info");
      };

      const currentMedEngCard = useMemo(() => {
        if (view !== "MEDENG_STUDY" || !medEngQueue[medEngIdx]) return null;
        return medEngCards.find(c => c.id === medEngQueue[medEngIdx]) || null;
      }, [view, medEngQueue, medEngIdx, medEngCards]);

      const handleMedEngUndo = () => {
        if (medEngUndoStack.length === 0) {
          showToast("当前没有可回退的卡片", "info");
          return;
        }
        const snap = medEngUndoStack[medEngUndoStack.length - 1];
        setMedEngUndoStack(prev => prev.slice(0, -1));
        setMedEngCards(prev => prev.map(c => c.id === snap.cardId ? { ...c, fsrs: snap.prevFsrs } : c));
        setMedEngMistakes(snap.prevMistakes);
        setMedEngRevLog(prev => prev.slice(0, snap.revLogLen));
        setDailyLogs(prev => {
          const cur = prev[snap.dayKey];
          if (!cur) return prev;
          return { ...prev, [snap.dayKey]: { ...cur, medEngCount: Math.max(0, (cur.medEngCount || 0) - 1) } };
        });
        setMedEngQueue(snap.prevQueue);
        setMedEngIdx(snap.prevIdx);
        setMedEngRevealed(true);
        showToast("已回退至上一张卡片，可重新评分", "info");
      };

      const handleMedEngRate = (grade) => {
        if (!currentMedEngCard) return;
        const dk = getStudyDateKey();
        const snap = {
          cardId: currentMedEngCard.id,
          prevFsrs: currentMedEngCard.fsrs ? { ...currentMedEngCard.fsrs } : createInitialFSRS(),
          prevQueue: [...medEngQueue],
          prevIdx: medEngIdx,
          prevMistakes: [...medEngMistakes],
          revLogLen: medEngRevLog.length,
          dayKey: dk
        };
        setMedEngUndoStack(prev => [...prev.slice(-29), snap]);
        const nextFsrs = fsrsSchedule(currentMedEngCard.fsrs, grade, targetRetention);
        const updatedCard = { ...currentMedEngCard, fsrs: nextFsrs };
        setMedEngCards(prev => prev.map(c => c.id === currentMedEngCard.id ? updatedCard : c));
        setMedEngRevLog(prev => [...prev, { ts: Date.now(), cardId: currentMedEngCard.id, system: currentMedEngCard.system, category: currentMedEngCard.category, grade }]);

        // Track mistakes if rated Again (1), remove if rated Good(3)/Easy(4)
        if (grade === 1) {
          setMedEngMistakes(prev => {
            const exists = prev.some(m => m.id === updatedCard.id);
            return exists ? prev.map(m => m.id === updatedCard.id ? updatedCard : m) : [updatedCard, ...prev];
          });
        } else if (grade >= 3) {
          setMedEngMistakes(prev => prev.filter(m => m.id !== updatedCard.id));
        }

        setDailyLogs(prev => {
          const cur = prev[dk] || { studySec: 0, qCount: 0, ankiCount: 0, medEngCount: 0 };
          return { ...prev, [dk]: { ...cur, medEngCount: (cur.medEngCount || 0) + 1 } };
        });

        setMedEngRevealed(false);
        const keepInSession = nextFsrs.state === "Learning" || nextFsrs.state === "Relearning";
        setMedEngQueue(prev => {
          const curId = prev[medEngIdx];
          const rest = [...prev.slice(0, medEngIdx), ...prev.slice(medEngIdx + 1)];
          if (keepInSession && curId) {
            const insertAt = Math.min(rest.length, medEngIdx + (grade === 1 ? 2 : 4));
            return [...rest.slice(0, insertAt), curId, ...rest.slice(insertAt)];
          }
          if (medEngIdx >= rest.length) {
            if (rest.length === 0) {
              setTimeout(() => { showToast("🎉 本轮医学英语翻转卡学习完成！", "success"); setView("DASHBOARD"); }, 50);
              return [];
            }
            setMedEngIdx(0);
          }
          return rest;
        });
      };

      const handleAddSingleMedEngCard = () => {
        if (!isAdmin || !newMeFront.trim() || !newMeBack.trim()) { showToast("请填写正面与反面内容", "error"); return; }
        const nowId = Date.now();
        const ptCn = { "Combining Form": "词干/组合形式", "Prefix": "前缀", "Suffix": "后缀" }[newMePartType] || "";
        const ptLabel = newMeCat === "Word Parts" ? `${newMePartType} (${ptCn})` : newMeCat;
        const created = [{
          id: `me-man-${nowId}-f`,
          system: newMeSys,
          category: newMeCat,
          partType: newMeCat === "Word Parts" ? newMePartType : "",
          direction: "正→反",
          front: newMeFront.trim(),
          frontHint: newMeCat === "Word Parts" ? `${ptLabel} · 写出其英文含义` : newMeCat === "Abbreviations" ? "Medical Abbreviation · 写出全称" : "Medical Term · 写出英文释义",
          back: newMeBack.trim(),
          note: newMeNote.trim() || newMeSys,
          suspended: false,
          fsrs: createInitialFSRS()
        }];
        if (newMeBothSides) {
          created.push({
            id: `me-man-${nowId}-b`,
            system: newMeSys,
            category: newMeCat,
            partType: newMeCat === "Word Parts" ? newMePartType : "",
            direction: "反→正",
            front: newMeBack.trim(),
            frontHint: newMeCat === "Word Parts" ? `${ptLabel} · 写出对应的医学词缀` : newMeCat === "Abbreviations" ? "写出对应的医学缩写" : "根据释义写出医学术语",
            back: newMeFront.trim(),
            note: newMeNote.trim() || newMeSys,
            suspended: false,
            fsrs: createInitialFSRS()
          });
        }
        setMedEngCards(prev => [...created, ...prev]);
        setNewMeFront(""); setNewMeBack(""); setNewMeNote("");
        showToast(`已成功添加 ${created.length} 张医学英语卡片！`, "success");
      };

      const prepareMedEngJsonPreview = (rawStr) => {
        if (!isAdmin) return;
        try {
          const parsed = JSON.parse((rawStr || medEngJsonText).trim());
          const arr = Array.isArray(parsed) ? parsed : [parsed];
          const out = [];
          const nowId = Date.now();
          arr.forEach((item, idx) => {
            if (!item || !item.front || !item.back) return;
            const sys = (!medEngJsonForce && MEDENG_SYSTEMS.some(s => s.id === item.system)) ? item.system : medEngJsonSys;
            const cat = (!medEngJsonForce && MEDENG_CATEGORIES.includes(item.category)) ? item.category : medEngJsonCat;
            const dir = item.direction || "正→反";
            out.push({
              id: item.id || `me-json-${nowId}-${idx}`,
              system: sys,
              category: cat,
              partType: item.partType || "",
              direction: dir,
              front: String(item.front).trim(),
              frontHint: item.frontHint || `${cat} · ${dir}`,
              back: String(item.back).trim(),
              note: item.note || sys,
              suspended: false,
              fsrs: createInitialFSRS()
            });
          });
          if (out.length === 0) { showToast("JSON 中没有有效卡片（需包含 front 和 back）", "error"); return; }
          setMedEngPreviewList(out);
        } catch (e) { showToast("JSON 格式错误，请检查语法", "error"); }
      };

      const confirmMedEngJsonImport = () => {
        if (!isAdmin || !medEngPreviewList || medEngPreviewList.length === 0) return;
        setMedEngCards(prev => [...medEngPreviewList, ...prev]);
        setMedEngPreviewList(null);
        setMedEngJsonText("");
        setMedEngMgrTab("browse");
        showToast(`已导入 ${medEngPreviewList.length} 张医学英语卡片！`, "success");
      };

      const sendEmailOtp = async (mode) => {
