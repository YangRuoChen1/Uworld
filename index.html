ix D: Common Medical Abbreviations"],[16,1,"","UTI","urinary tract infection","Appendix D: Common Medical Abbreviations"],[16,1,"","UV","ultraviolet","Appendix D: Common Medical Abbreviations"],[16,1,"","UVR","ultraviolet radiation","Appendix D: Common Medical Abbreviations"],[16,1,"","V","tidal volume","Appendix D: Common Medical Abbreviations"],[16,1,"","VA","visual acuity","Appendix D: Common Medical Abbreviations"],[16,1,"","vag","vaginal","Appendix D: Common Medical Abbreviations"],[16,1,"","VATS","video-assisted thoracic surgery","Appendix D: Common Medical Abbreviations"],[16,1,"","VBAC","vaginal birth after cesarean section","Appendix D: Common Medical Abbreviations"],[16,1,"","VBG","venous blood gas","Appendix D: Common Medical Abbreviations"],[16,1,"","VC","vital capacity","Appendix D: Common Medical Abbreviations"],[16,1,"","VCUG","voiding cystourethrogram","Appendix D: Common Medical Abbreviations"],[16,1,"","VD","venereal disease","Appendix D: Common Medical Abbreviations"],[16,1,"","VDRL","Venereal Disease Research Laboratory","Appendix D: Common Medical Abbreviations"],[16,1,"","vent","ventilator","Appendix D: Common Medical Abbreviations"],[16,1,"","VER","visual evoked response","Appendix D: Common Medical Abbreviations"],[16,1,"","VFib","ventricular fibrillation","Appendix D: Common Medical Abbreviations"],[16,1,"","VH","vaginal hysterectomy","Appendix D: Common Medical Abbreviations"],[16,1,"","VLAP","visual laser ablation of the prostate","Appendix D: Common Medical Abbreviations"],[16,1,"","VLDL","very-low-density lipoprotein","Appendix D: Common Medical Abbreviations"],[16,1,"","V/Q","lung ventilation/perfusion scan","Appendix D: Common Medical Abbreviations"],[16,1,"","VRE","vancomycin-resistant enterococci","Appendix D: Common Medical Abbreviations"],[16,1,"","VS","vital signs","Appendix D: Common Medical Abbreviations"],[16,1,"","VUR","vesicoureteral reflux","Appendix D: Common Medical Abbreviations"],[16,1,"","WA","while awake","Appendix D: Common Medical Abbreviations"],[16,1,"","WBC","white blood cell (leukocyte)","Appendix D: Common Medical Abbreviations"],[16,1,"","W/C","wheelchair","Appendix D: Common Medical Abbreviations"],[16,1,"","wt","weight","Appendix D: Common Medical Abbreviations"],[16,1,"","XRT","radiation therapy, x-ray radiotherapy, x-ray therapy","Appendix D: Common Medical Abbreviations"],[1,2,"","benign","not malignant, nonrecurrent, favorable for recovery (See Fig. 2.5)","Ch.2 Body structure, oncology, and laboratory tests · benign (be- NĪN)"],[1,2,"","biological therapy","treatment of cancer with biological response modifiers (BRM) that work with the immune system (also called biotherapy or immunotherapy) (Table 2.3)","Ch.2 Body structure, oncology, and laboratory tests · biological therapy (bī-ō- LOJ-i-kel) (THER-a-pē)"],[1,2,"","carcinoma in situ","cancer in the early stage before invading surrounding tissue (Fig. 2.4)","Ch.2 Body structure, oncology, and laboratory tests · carcinoma in situ (kar-si- NŌ-ma) (in) (SĪ-too)"],[1,2,"","chemotherapy","treatment of cancer with drugs","Ch.2 Body structure, oncology, and laboratory tests · chemotherapy (chemo) (kē- mō-THER-a- pē)"],[1,2,"","encapsulated","enclosed withina capsule, as with benign or malignant tumors that have not spread beyond the capsule of the organ in which it originated","Ch.2 Body structure, oncology, and laboratory tests · encapsulated (en-KAP-sū- lā-ted)"],[1,2,"","hospice","provides palliative or supportive care for terminally ill patients and their families. Usually offered to those who havea prognosis of approximately 6 months or less, when curative forms of treatment are no longer possible or desired. A team-based approach delivers care in a variety of settings, most often in the patient\"s home.","Ch.2 Body structure, oncology, and laboratory tests · hospice (HOS-pis)"],[1,2,"","malignant","tending to become progressively worse and to cause death, as in cancer (Fig. 2.5)","Ch.2 Body structure, oncology, and laboratory tests · malignant (ma-LIG-nant)"],[1,2,"","palliative","providing relief but not cure. Symptom management is provided to relieve suffering in all stages of disease, and is not limited to care at the end of life. It can be given with curative or life-prolonging treatment, or with end-of-life (hospice) care. While hospice care includes palliative care, not all of palliative care is hospice care.","Ch.2 Body structure, oncology, and laboratory tests · palliative (PAL-ē-a-tiv)"],[1,2,"","radiation therapy (XRT)","treatment of cancer witha radioactive substance, x-ray, or radiation (also called radiation oncology and radiotherapy)","Ch.2 Body structure, oncology, and laboratory tests · radiation therapy (XRT) (rā-dē-Ā- shun) (THER- a-pē)"],[1,2,"","remission","improvement or absence of signs of disease","Ch.2 Body structure, oncology, and laboratory tests · remission (rē- MISH-un)"],[1,2,"","chemistry panel","a series of tests performed on a blood sample that give information regarding multiple systems including the kidneys, liver, and lungs; these also provide glucose and protein levels. (also called comprehensive metabolic panel)","Ch.2 Body structure, oncology, and laboratory tests · chemistry panel (KEM-is-trē) (PAN-el)"],[1,2,"","complete blood count with differential","laboratory test for basic blood screening that measures various aspects of erythrocytes (red blood cells), leukocytes (white blood cells), and thrombocytes (platelets); this automated test quickly providesa tremendous amount of information about the blood.","Ch.2 Body structure, oncology, and laboratory tests · complete blood count with differential (CBC with diff) (com- PLĒT) (blud) (kownt) (with) (dif-er-EN-shal)"],[1,2,"","culture and sensitivity (C&S)","test performed on a sample to determine the presence of pathogenic bacteria. The specimen is placed on a medium for growth (culture) and if pathogenic bacteria grow, is then tested for antibiotic sensitivity to identify an antibiotic that will provide the most effective treatment. C&S is used to identify the pathogen present and causing the infection.","Ch.2 Body structure, oncology, and laboratory tests · culture and sensitivity (C&S) (KUL-cher) (and) (sen-si-TIV-i-tē)"],[1,2,"","genetic testing","examines DNA, the chemical database that carries instructions for the body\"s functions; can reveal changes in genes that may cause illness or disease.","Ch.2 Body structure, oncology, and laboratory tests · genetic testing (je-NET-ik) (TEST-ing)"],[1,2,"","specimen","sample of blood, urine, or body tissue that is taken for medical testing (also called collection sample)","Ch.2 Body structure, oncology, and laboratory tests · specimen (SPES- i-men)"],[1,2,"","afebrile","without fever","Ch.2 Body structure, oncology, and laboratory tests · afebrile (ā-FEB-ril)"],[1,2,"","erythema","redness","Ch.2 Body structure, oncology, and laboratory tests · erythema (er-i- THĒ-ma)"],[1,2,"","febrile","havinga fever","Ch.2 Body structure, oncology, and laboratory tests · febrile (FEB-ril)"],[1,2,"","inflammation","localized protective response to injury or tissue destruction characterized by redness, swelling, heat, and pain","Ch.2 Body structure, oncology, and laboratory tests · inflammation (in- fla-MĀ-shun)"],[1,2,"","exacerbation","increase in the severity of a disease or its symptoms","Ch.2 Body structure, oncology, and laboratory tests · exacerbation (eg-zas-er- BĀ-shun)"],[1,2,"","idiopathic","pertaining to disease of unknown origin","Ch.2 Body structure, oncology, and laboratory tests · idiopathic (id-ē-ō-PATH- ik)"],[1,2,"","morbidity","state of being diseased; incidence of illness in a population","Ch.2 Body structure, oncology, and laboratory tests · morbidity (mor-BID-i-tē)"],[1,2,"","mortality","state of being mortal (death); incidence of the number of deaths in a population","Ch.2 Body structure, oncology, and laboratory tests · mortality (mor-TAL-i-tē)"],[1,2,"","bacteria","single-celled microorganisms that reproduce by cell division and may cause infection by invading body tissue","Ch.2 Body structure, oncology, and laboratory tests · bacteria (s. bacterium) (bak-TĒR-ē-a) (bak-TĒR-ē- um)"],[1,2,"","fungus","organism that feeds by absorbing organic molecules from its surroundings and may cause infection by invading body tissue; single-celled fungi (yeast) reproduce by budding; multi-celled fungi (mold) reproduce by spore formation","Ch.2 Body structure, oncology, and laboratory tests · fungus (pl. fungi) (FUN- gus) (FUN-jī)"],[1,2,"","infection","invasion of pathogens in body tissue. Types of infection include bacterial, viral, and fungal. An acute infection may remain localized if the body's defense mechanisms are effective or may persist to become subacute or chronic. A systemic infection occurs when the pathogen causinga local infection gains access to the vascular or lymphatic system and becomes disseminated throughout the body.","Ch.2 Body structure, oncology, and laboratory tests · infection (in- FEK-shun)"],[1,2,"","microorganism","a form of life that is too small to be seen withouta microscope; includes bacteria, fungi, and viruses","Ch.2 Body structure, oncology, and laboratory tests · microorganis m (mī-krō- OR-gan-iz- um)"],[1,2,"","virus","minute microorganism, much smaller thana bacterium, characterized by a lack of independent metabolism and the ability to replicate only within living host cells; these may cause infection by invading body tissue.","Ch.2 Body structure, oncology, and laboratory tests · virus (pl. viruses) (VĪ- ras) (VĪ-ras- uz)"],[2,2,"","computed tomography (CT)","imaging modality that combines x-rays with computer technology to produce detailed, cross sectional images of the body, called \"slices.\" Oral or intravenous contrast agent may be given to highlight specific regions in the body, resulting in clearer images.","Ch.3 Directional terms, positions, and imaging · computed tomography (CT) (kom- PŪ-ted) (to- MOG-rah-fē)"],[2,2,"","fluoroscopy","imaging of moving body structures, like an x-ray movie. An x-ray beam is passed through the body part being studied, and then the image is transmitted to a monitor in real time so that movement can be seen in detail. Contrast agent is often used to help identify and assess the function of different structures.","Ch.3 Directional terms, positions, and imaging · fluoroscopy (flōr-OS-ka- pē)"],[2,2,"","nuclear medicine (NM)","imaging of internal structures by usinga Gamma camera to detect radiation from different parts of the body aftera radioactive material (radioisotope) has been given to the patient. Computer software assembles data into images called scans.","Ch.3 Directional terms, positions, and imaging · nuclear medicine (NM) (NOO- klē-er) (MED- i-sin)"],[2,2,"","magnetic resonance imaging (MRI)","high strength, computer-controlled magnetic fields producinga series of sectional images (slices) that visualize abnormalities such as swelling, infections, tumors, and herniated disks","Ch.3 Directional terms, positions, and imaging · magnetic resonance imaging (MRI) (mag- NET-ik) (REZ-ō-nans) (IM-a-jing)"],[2,2,"","scan","image obtained from diagnostic imaging procedures using sensing devices and (most often) radioisotopes","Ch.3 Directional terms, positions, and imaging · scan (skan)"],[3,2,"","abrasion","scraping away of the skin by mechanical process or injury","Ch.4 Integumentary system · abrasion (a- BRĀ-zhun)"],[3,2,"","acne","inflammatory disease of the skin involving the sebaceous glands and hair follicles","Ch.4 Integumentary system · acne (AK-nē)"],[3,2,"","actinic keratosis","precancerous skin condition of horny tissue formation that results from excessive exposure to sunlight. It may evolve intoa squamous cell carcinoma.","Ch.4 Integumentary system · actinic keratosis (ack- TIN-ik) (ker-a- TŌ-sis)"],[3,2,"","albinism","congenital hereditary condition characterized by partial or total lack of pigment (melanin) in the skin, hair, and eyes","Ch.4 Integumentary system · albinism (AL- bi-niz-um)"],[3,2,"","basal cell carcinoma (BCC)","malignant epithelial tumor arising from the bottom layer of the epidermis called the basal layer; it seldom metastasizes, but invades local tissue and may recur in the same location. Common in individuals who have had excessive sun exposure. (Fig. 4.3)","Ch.4 Integumentary system · basal cell carcinoma (BCC) (BĀ-sal) (sel) (kar-si- NŌ-ma)"],[3,2,"","candidiasis","infection of the skin, mouth (also called thrush), or vagina caused by the yeast- type fungus Candida albicans. Candida is normally present in the mucous membranes; overgrowth causes an infection. Esophageal candidiasis is often seen in patients with acquired immunodeficiency syndrome (AIDS).","Ch.4 Integumentary system · candidiasis (kan-di-DĪ-a- sis)"],[3,2,"","carbuncle","infection of skin and subcutaneous tissue composed of a cluster of boils (furuncles, see below) caused by staphylococcal bacteria","Ch.4 Integumentary system · carbuncle (KAR-bung-kl)"],[3,2,"","cellulitis","inflammation of the skin and subcutaneous tissue caused by infection; characterized by redness, pain, heat, and swelling","Ch.4 Integumentary system · cellulitis (sel-ū- LĪ-tis)"],[3,2,"","contusion","injury with no break in the skin, characterized by pain, swelling, and discoloration (also calleda bruise)","Ch.4 Integumentary system · contusion (kon-TŪ-zhun)"],[3,2,"","eczema","noninfectious, inflammatory skin disease characterized by redness, blisters, scabs, and itching","Ch.4 Integumentary system · eczema (EK-ze- ma)"],[3,2,"","fissure","slit or cracklike sore in the skin","Ch.4 Integumentary system · fissure (FISH- ur)"],[3,2,"","furuncle","painful skin nodule caused by staphylococcal bacteria in a hair follicle (also calleda boil)","Ch.4 Integumentary system · furuncle (FER- ung-kl)"],[3,2,"","gangrene","death of tissue caused by loss of blood supply followed by bacterial invasion (a form of necrosis)","Ch.4 Integumentary system · gangrene (GANG-grēn)"],[3,2,"","herpes","inflammatory skin disease caused by herpes virus characterized by small blisters in clusters. Many types of herpes exist. Herpes simplex virus type 1, for example, causes fever blisters; herpes zoster, also called shingles, is characterized by painful skin eruptions that follow nerves inflamed by the virus. (see Table 4.1)","Ch.4 Integumentary system · herpes (HER- pēz)"],[3,2,"","impetigo","superficial skin infection characterized by pustules and caused by either staphylococci or streptococci (see Table 4.1)","Ch.4 Integumentary system · impetigo (im- pe-TĪ-gō)"],[3,2,"","Kaposi sarcoma","cancerous condition starting as purple or brown papules that spreads through the skin to the lymph nodes and internal organs; frequently seen with AIDS","Ch.4 Integumentary system · Kaposi sarcoma (KAP-ō-sē) (sar-KŌ-ma)"],[3,2,"","keloid","overgrowth of scar tissue","Ch.4 Integumentary system · keloid (KĒ- loyd)"],[3,2,"","laceration","torn, ragged-edged wound","Ch.4 Integumentary system · laceration (las- er-Ā-shun)"],[3,2,"","measles","highly contagious viral disease characterized by fever, runny nose, cough, and a spreading skin rash. It is a potentially disastrous disease which can lead to pneumonia, severe bleeding, brain infections (which may cause seizures, developmental delay or chronic brain disease), and sometimes lead to death. Measles is a significant cause of death, despite the availability of a safe, effective vaccine.","Ch.4 Integumentary system · measles (MĒ- zalz)"],[3,2,"","MRSA infection","invasion of body tissue by methicillin-resistant Staphylococcus aureus, a strain of common bacteria that has developed resistance to methicillin and other antibiotics. It can produce skin and soft tissue infections and sometimes bloodstream infections and pneumonia, which can be fatal if not treated. MRSA is quite common in hospitals and long-term care facilities but is increasingly emerging as an important infection in the general population.","Ch.4 Integumentary system · MRSA infection (MER-sah) (in- FEK-shun)"],[3,2,"","pediculosis","invasion into the skin and hair by lice","Ch.4 Integumentary system · pediculosis (pe-dik-ū-LŌ- sis)"],[3,2,"","pilonidal cyst (SIST)","abnormal pocket in the skin that contains hair and skin debris. It is frequently located near the tailbone, at the top of the cleft of the buttocks. If it becomes infected, it can be severely painful and may require surgery. (Fig. 4.4)","Ch.4 Integumentary system · pilonidal cyst (pī-lō-NĪ-dal) (SIST)"],[3,2,"","pressure injury","damage of the skin and the subcutaneous tissue caused by prolonged pressure, often occurring in bedridden patients; the injury, which may be painful, can present as intact skin or an open ulcer (also called pressure ulcer and bedsore; formerly called decubitus ulcer) (Fig. 4.5)","Ch.4 Integumentary system · pressure injury (PRESH-ur) (IN-ja-rē)"],[3,2,"","psoriasis","chronic skin condition producing red lesions covered with silvery scales","Ch.4 Integumentary system · psoriasis (so- RĪ-a-sis)"],[3,2,"","rosacea","chronic disorder of the skin that produces erythema, papules, pustules, and abnormal dilation of tiny blood vessels, usually occurring on the central area of the face in people older than 30 years","Ch.4 Integumentary system · rosacea (rō- ZĀ-shē-a)"],[3,2,"","scabies","skin infection caused by the itch mite, characterized by papule eruptions that are caused by the female burrowing into the outer layer of the skin and laying eggs. This condition is accompanied by severe itching. (Table 4.1)","Ch.4 Integumentary system · scabies (SKĀ- bēz)"],[3,2,"","squamous cell carcinoma (SCC)","malignant growth developing from scalelike epithelial tissue of the surface layer of the epidermis; it invades local tissue and may metastasize. While most commonly appearing on the skin, SCC can occur in other parts of the body including the mouth, lips, and genitals. The most frequent cause is chronic exposure to sunlight. (Fig. 4.3)","Ch.4 Integumentary system · squamous cell carcinoma (SCC) (SQWĀ-mus) (sel) (kar-si- NŌ-ma)"],[3,2,"","systemic lupus erythematosus (SLE)","chronic inflammatory disease involving the skin, joints, kidneys, and nervous system. This autoimmune disease is characterized by periods of remission and exacerbations. It also may affect other organs.","Ch.4 Integumentary system · systemic lupus erythematosus (SLE) (sis- TEM-ik) (LŪ- pus) (e-ri-thē- ma-TŌ-sus)"],[3,2,"","tinea","fungal infection of the skin. The fungi may infect keratin of the skin, hair, and nails. Infections are classified by body regions such as tinea capitis (scalp), tinea corporis (body), and tinea pedis (foot). Tinea in general is also called ringworm, and tinea pedis specifically is also called athlete's foot. (Table 4.1)","Ch.4 Integumentary system · tinea (TIN-ē-a)"],[3,2,"","urticaria","itchy skin eruption composed of wheals of varying sizes and shapes. Urticaria is sometimes associated with infections and with allergic reactions to food, medicine, or other agents. Other causes include internal disease, physical stimuli, and genetic disorders. (also called hives) (Table 4.2)","Ch.4 Integumentary system · urticaria (ur-ti- KAR-ē-a)"],[3,2,"","vitiligo","white patches on the skin caused by the destruction of melanocytes","Ch.4 Integumentary system · vitiligo (vit-i- LĪ-gō)"],[3,2,"","cauterization","destruction of tissue witha hot or cold instrument, electric current, or caustic substance (also called cautery)","Ch.4 Integumentary system · cauterization (kaw-tur-ī-ZĀ- shun)"],[3,2,"","cryosurgery","destruction of tissue by using extreme cold, often by using liquid nitrogen (Fig. 4.6)","Ch.4 Integumentary system · cryosurgery (krī-ō-SER-jer-ē)"],[3,2,"","debridement","removal of contaminated or dead tissue and foreign matter from an open wound","Ch.4 Integumentary system · debridement (da-BRĒD- ment)"],[3,2,"","dermabrasion","procedure to remove skin scars with abrasive material, such as sandpaper","Ch.4 Integumentary system · dermabrasion (derm-a-BRĀ- zhun)"],[3,2,"","excision","removal by cutting","Ch.4 Integumentary system · excision (ek-SIZH-en)"],[3,2,"","incision","surgical cut or wound produced by a sharp instrument","Ch.4 Integumentary system · incision (in-SIZH-en)"],[3,2,"","incision and drainage (I&D) and","surgical cut made to allow the free flow or withdrawal of fluids froma lesion, wound, or cavity","Ch.4 Integumentary system · incision and drainage (I&D) (in-SIZH-en) and (DRĀ-nij)"],[3,2,"","laser surgery","procedure using an instrument that emitsa high-powered beam of light used to cut, burn, vaporize, or destroy tissue","Ch.4 Integumentary system · laser surgery (LĀ-zer) (SER- jer-ē)"],[3,2,"","Mohs surgery","technique of microscopically controlled serial excisions of a skin cancer","Ch.4 Integumentary system · Mohs surgery (mōz) (SER- jer-ē)"],[3,2,"","skin graft","skin transplanted to replacea lost portion of the body skin surface; it may be a full-thickness or split-thickness graft.","Ch.4 Integumentary system · skin graft (skin) (graft)"],[3,2,"","suturing","to stitch edges of a wound surgically (Fig. 4.7)","Ch.4 Integumentary system · suturing (SOO-cher-ing)"],[3,2,"","abscess","localized collection of pus, bacteria, and other material; can occur in the skin (cutaneous abscess) or other locations within the body (internal abscess)","Ch.4 Integumentary system · abscess (AB-ses)"],[3,2,"","alopecia","loss of hair; there are multiple types with various causes, including androgenic, areata, and traction.","Ch.4 Integumentary system · alopecia (al-ō-PĒ- sha)"],[3,2,"","cyst","closed sac containing fluid or semisolid material; can occur in the skin (cutaneous cyst) or other locations within the body (Table 4.2)","Ch.4 Integumentary system · cyst (sist)"],[3,2,"","diaphoresis","sweating","Ch.4 Integumentary system · diaphoresis (dī-a- fo-RĒ-sis)"],[3,2,"","ecchymosis","large (greater than 1 cm), flat, blue-purple lesion caused by escape of blood into deeper areas of the skin, as may occur when blood is withdrawn by a needle and syringe from an arm vein (Fig 4.8)","Ch.4 Integumentary system · ecchymosis (pl. ecchymoses) (ek- i-MŌ-sis) (ek-i- MŌ-sēz)"],[3,2,"","edema","puffy swelling of tissue from the accumulation of fluid","Ch.4 Integumentary system · edema (e-DĒ-ma)"],[3,2,"","induration","abnormal hard spot(s) or area of skin; may include underlying tissue","Ch.4 Integumentary system · induration (in- dū-RĀ-shun)"],[3,2,"","jaundice","condition characterized by a yellow coloring of the skin, mucous membranes, and sclera (whites of the eyes) caused by the presence of bile (also called icterus)","Ch.4 Integumentary system · jaundice (JAWN- dis)"],[3,2,"","lesion","any visible change in tissue resulting from injury or disease. It is a broad term that includes sores, wounds, ulcers, and tumors.","Ch.4 Integumentary system · lesion (LĒ-zhun)"],[3,2,"","leukoplakia","condition characterized by white spots or patches on mucous membranes, which may be precancerous","Ch.4 Integumentary system · leukoplakia (lū- kō-PLĀ-kē-a)"],[3,2,"","macule","flat, colored spot on the skin (Table 4.2)","Ch.4 Integumentary system · macule (MAK-ūl)"],[3,2,"","nevus","circumscribed malformation of the skin, usually brown, black, or flesh colored. A congenital nevus is present at birth and is referred to as a birthmark. (also calleda mole)","Ch.4 Integumentary system · nevus (pl. nevi) (NĒ-vus) (NĒ-vī)"],[3,2,"","nodule","small, knotlike mass that can be felt by touch (Table 4.2)","Ch.4 Integumentary system · nodule (NOD-ūl)"],[3,2,"","pallor","paleness","Ch.4 Integumentary system · pallor (PAL-or)"],[3,2,"","papule","small, solid skin elevation (Table 4.2)","Ch.4 Integumentary system · papule (PAP-ūl)"],[3,2,"","petechiae","tiny (0.3 cm or smaller), pinpoint, bright red lesions that result from escape of blood into the skin and mucous membranes. (Fig 4.8)","Ch.4 Integumentary system · petechiae (s. petechia) (pe-TĒ- kē-ē) (pe-TĒ-kē- a)"],[3,2,"","pruritus","itching","Ch.4 Integumentary system · pruritus (prū-RĪ- tus)"],[3,2,"","purpura","small (between 0.3 cm and 1 cm), reddish purple-lesions caused by escape of blood into skin and mucus membranes (Fig 4.8)","Ch.4 Integumentary system · purpura (PER- pū-ra)"],[3,2,"","pustule","elevation of skin containing pus (Table 4.2)","Ch.4 Integumentary system · pustule (PUS-tūl)"],[3,2,"","ulcer","erosion of the skin or mucous membrane","Ch.4 Integumentary system · ulcer (UL-ser)"],[3,2,"","verruca","circumscribed cutaneous elevation caused by a virus (also called wart)","Ch.4 Integumentary system · verruca (ver-RŪ- ka)"],[3,2,"","vesicle","small elevation of the epidermis containing liquid (also called blister) (Table 4.2)","Ch.4 Integumentary system · vesicle (VES-i-kl)"],[3,2,"","wheal","transitory, itchy elevation of the skin witha white center and a red surrounding area; a wheal is an individual urticaria (hive) lesion (Table 4.2)","Ch.4 Integumentary system · wheal (hwēl)"],[4,2,"","acute respiratory distress syndrome (ARDS)","respiratory failure as a result of disease or injury. ARDS is respiratory failure in an adult. Symptoms include dyspnea, tachypnea, and cyanosis. (also called adult respiratory distress syndrome)","Ch.5 Respiratory system · acute respiratory distress syndrome (ARDS) (a-KŪT) (RES-pi-ra-tor-ē) (di-STRES) (SIN- drōm)"],[4,2,"","asphyxia","deprivation of oxygen for tissue use; suffocation","Ch.5 Respiratory system · asphyxia (as-FIK- sē-a)"],[4,2,"","asthma","respiratory disease characterized by coughing, wheezing, and shortness of breath, caused by constriction and inflammation of airways that is reversible between attacks","Ch.5 Respiratory system · asthma (AZ-ma)"],[4,2,"","chronic obstructive pulmonary disease (COPD)","progressive lung disease obstructing air flow, which makes breathing difficult. Chronic bronchitis and pulmonary emphysema are the two main components of COPD. Most COPD is a result of cigarette smoking. (Fig. 5.5)","Ch.5 Respiratory system · chronic obstructive pulmonary disease (COPD) (KRON-ik) (ob-STRUK-tiv) (PUL-mō-nar-ē) (di- ZĒZ)"],[4,2,"","coccidioidomycosis","fungal disease affecting the lungs and sometimes other organs of the body (also called valley fever)","Ch.5 Respiratory system · coccidioidomycosis (kok-sid-ē-oy-dō- mī-KŌ-sis)"],[4,2,"","coronavirus disease (COVID- 19)","respiratory infection caused by a virus with symptoms that include fever, cough, fatigue, difficulty breathing, and digestive upset; the disease course can range from mild to severe with the possibility of ARDS and multi-system organ failure","Ch.5 Respiratory system · coronavirus disease (COVID- 19) (kō-RŌ-na-vī- rus) (di-ZĒZ)"],[4,2,"","croup","condition resulting from acute obstruction of the larynx, characterized by a barking cough, hoarseness, and stridor. It may be caused by viral or bacterial infection, allergy, or foreign body. Occurs mainly in children. (also called laryngotracheobronchitis)","Ch.5 Respiratory system · croup (krūp)"],[4,2,"","cystic fibrosis (CF)","hereditary disorder of the exocrine glands characterized by excess mucus production in the respiratory tract, pancreatic deficiency, and other symptoms","Ch.5 Respiratory system · cystic fibrosis (CF) (SIS-tik) (fī-BRŌ- sis)"],[4,2,"","deviated septum","one part of the nasal cavity is smaller because of malformation or injury of the nasal septum","Ch.5 Respiratory system · deviated septum (DĒ-vē-āt-ed) (SEP- tum)"],[4,2,"","diphtheria","serious bacterial infection affecting the mucous membranes of the nose and throat. It createsa thick, gray sheet covering the pharynx, which can lead to difficulty breathing, heart failure, paralysis, and even death. It is rare in developed countries due to widespread vaccination against the disease.","Ch.5 Respiratory system · diphtheria (dif- THĒR-ē-a)"],[4,2,"","emphysema","loss of elasticity of the alveoli resulting in distention causing stretching of the lung. As a result, the body does not receive enough oxygen. (component of COPD) (Fig. 5.5)","Ch.5 Respiratory system · emphysema (em- fi-SĒ-ma)"],[4,2,"","epistaxis","nosebleed (also called rhinorrhagia)","Ch.5 Respiratory system · epistaxis (ep-i- STAK-sis)"],[4,2,"","idiopathic pulmonary fibrosis (IPF)","chronic progressive lung disorder characterized by increasing scarring, which ultimately reduces the capacity of the lungs; etiology unknown. IPF most often affects adults over the age of 50. Smoking, pollutants, and heredity may playa role in its genesis. Symptoms include exertional dyspnea and a dry cough. Lung transplant may be indicated in severe cases; there is no cure.","Ch.5 Respiratory system · idiopathic pulmonary fibrosis (IPF) (id-ē-ō-PATH- ik) (PUL-mō-nar-ē) (fī-BRŌ-sis)"],[4,2,"","influenza","highly contagious and often severe viral infection of the respiratory tract","Ch.5 Respiratory system · influenza (flu) (in-flū-EN-za)"],[4,2,"","obstructive sleep apnea (OSA)","repetitive pharyngeal collapse during sleep, which leads to transient periods of apnea (absence of breathing); can produce daytime drowsiness and elevated blood pressure (Fig. 5.6)","Ch.5 Respiratory system · obstructive sleep apnea (OSA) (ob- STRUK-tiv) (slēp) (AP-nē-a)"],[4,2,"","pertussis","highly contagious bacterial infection of the respiratory tract characterized by a severe hacking cough, followed by an acute crowing inspiration, or whoop. It mainly affects infants too young to be vaccinated and adults whose immunity to the vaccine has faded. (also called whooping cough)","Ch.5 Respiratory system · pertussis (per- TUS-sis)"],[4,2,"","pleural effusion","fluid in the pleural cavity caused by a disease process or trauma","Ch.5 Respiratory system · pleural effusion (PLŪ-ral) (e-FŪ- zhun)"],[4,2,"","pulmonary edema","fluid accumulation in the alveoli and bronchioles, most oftena manifestation of heart failure","Ch.5 Respiratory system · pulmonary edema (PUL-mō- nar-ē) (e-DĒ-ma)"],[4,2,"","pulmonary embolism (PE)","matter foreign to the circulation, carried to the pulmonary artery and its branches, where it blocks circulation to the lungs and can be fatal if of sufficient size or number. Blood clots broken loose from the deep veins of the lower extremities are the most common cause of pulmonary embolism. (Fig. 5.7)","Ch.5 Respiratory system · pulmonary embolism (PE) (PUL-mō-nar-ē) (EM-bo-liz-em)"],[4,2,"","tuberculosis (TB)","infectious bacterial disease, most commonly spread by inhalation of small particles and usually affecting the lungs; may spread to other organs","Ch.5 Respiratory system · tuberculosis (TB) (tū-ber-kū-LŌ-sis)"],[4,2,"","upper respiratory infection (URI)","infection of the nasal cavity, pharynx, or larynx usually caused by a virus (commonly calleda cold) (Fig. 5.8)","Ch.5 Respiratory system · upper respiratory infection (URI) (UP-er) (RES-pi-ra- tor-ē) (in-FEK-shun)"],[4,2,"","chest computed tomography (CT) scan","computerized radiographic images of the chest performed to diagnose tumors, abscesses, and pleural effusion","Ch.5 Respiratory system · chest computed tomography (CT) scan (chest) (kom-PŪ-ted) (tō-MOG-ra-fē) (skan)"],[4,2,"","chest radiograph (CXR)","radiographic image of the chest performed to evaluate the lungs and the heart (also calleda chest x-ray)","Ch.5 Respiratory system · chest radiograph (CXR) (chest) (RĀ-dē- ō-graf)"],[4,2,"","lung ventilation/perfusion scan","two nuclear scan tests, one to measure air flow throughout the lungs (ventilation), and one to measure circulation to all areas of the lungs (perfusion). A V/Q scan is used most often to help diagnose or rule out a pulmonary embolism (PE).","Ch.5 Respiratory system · lung ventilation/perfusion scan (V/Q scan) (lung) (ven-ti-LĀ-shun) (per- FŪ-zhun) (skan)"],[4,2,"","acid-fast bacilli (AFB) smear","test performed on sputum to determine the presence of acid-fast bacilli, which cause tuberculosis","Ch.5 Respiratory system · acid-fast bacilli (AFB) smear (AS- id-fast) (bah-SIL-ī) (smēr)"],[4,2,"","arterial blood gas (ABG)","test performed on arterial blood to determine levels of oxygen (O ), carbon 2 dioxide (CO ), and pH (acidity) 2","Ch.5 Respiratory system · arterial blood gas (ABG) (ar-TĒ-rē-al) (blud) (gas)"],[4,2,"","peak flow meter (PFM)","portable instrument used to measure air flow early in forced exhalation; helps monitor asthma and adjust medication accordingly","Ch.5 Respiratory system · peak flow meter (PFM) (pēk) (flō) (MĒ-ter)"],[4,2,"","pulmonary function tests","group of tests performed to measure breathing capacity and used to determine external respiratory function; when abnormal, they are useful in distinguishing COPD from asthma. Some tests involve the use of a spirometer.","Ch.5 Respiratory system · pulmonary function tests (PFTs) (PUL-mō- nar-ē) (FUNK- shun) (tests)"],[4,2,"","pulse oximetry","noninvasive method of measuring oxygen in the blood by usinga device that attaches to the fingertip","Ch.5 Respiratory system · pulse oximetry (puls) (ok-SIM-e- trē)"],[4,2,"","auscultation","the act of listening througha stethoscope for sounds within the body which are abnormal and that suggest abnormalities or disease; used for assessing and diagnosing conditions of the lungs, pleura, heart, arteries, and abdomen","Ch.5 Respiratory system · auscultation (aws-kul- TĀ-shun)"],[4,2,"","percussion","the act of tapping of a body surface to determine the density of the part beneath by the sound obtained. A dull sound where normallya hollow sound would be elicited indicates displacement of air by fluid or solid waste in a body space or cavity such as in a potential pleural space.","Ch.5 Respiratory system · percussion (per-KUSH- un)"],[4,2,"","PPD skin test (P-P-D)","test performed on individuals who may have been exposed to tuberculosis. PPD (purified protein derivative) of the tuberculin bacillus is injected intradermally. Positive tests indicate previous exposure, not necessarily active tuberculosis. (also called TB skin test)","Ch.5 Respiratory system · PPD skin test (P-P-D) (skin) (test)"],[4,2,"","stethoscope","instrument used to hear internal body sounds; used for performing auscultation and blood pressure measurement","Ch.5 Respiratory system · stethoscope (STETH-ō- skōp)"],[4,2,"","crackles","discontinuous sounds heard primarily witha stethoscope during inspiration that resemble the sound of the rustling of cellophane; often heard at the base of the lung posteriorly in heart failure, pneumonia, and pulmonary fibrosis (also called rales)","Ch.5 Respiratory system · crackles (KRAK-els)"],[4,2,"","effusion","escape of fluid into tissue or body cavity","Ch.5 Respiratory system · effusion (e-FŪ- zhun)"],[4,2,"","hyperventilation","ventilation of the lungs beyond normal body needs","Ch.5 Respiratory system · hyperventilation (hī-per-ven-ti- LĀ-shun)"],[4,2,"","hypoventilation","ventilation of the lungs that does not fulfill the body's gas exchange needs","Ch.5 Respiratory system · hypoventilation (hī-pō-ven-ti-LĀ- shun)"],[4,2,"","paroxysm","periodic, sudden attack","Ch.5 Respiratory system · paroxysm (PAR- ok-siz-em)"],[4,2,"","rhonchi","low-pitched, witha snoring quality, breath sounds heard witha stethoscope suggesting secretions in the large airways","Ch.5 Respiratory system · rhonchi (RONG-kī)"],[4,2,"","stridor","harsh, high-pitched breath sound heard on inspiration; indicates an acute laryngeal obstruction","Ch.5 Respiratory system · stridor (STRĪD- ir)"],[4,2,"","wheeze","whistling noise witha high pitch, caused by air flowing through narrowed airways. Commonly associated with asthma and chronic bronchitis.","Ch.5 Respiratory system · wheeze (wēz)"],[4,2,"","bronchoconstrictor","agent causing narrowing of the bronchi","Ch.5 Respiratory system · bronchoconstrictor (bron-kō-kon-STRIK-tor)"],[4,2,"","bronchodilator","agent causing the bronchi to widen","Ch.5 Respiratory system · bronchodilator (bron-kō-dī-LĀ-tor)"],[4,2,"","nebulizer","device that createsa mist used to deliver medication for giving respiratory treatment","Ch.5 Respiratory system · nebulizer (NEB-ū- lī-zer)"],[4,2,"","ventilator","mechanical device used to assist with or substitute for breathing (Fig. 5.13)","Ch.5 Respiratory system · ventilator (VEN-ti- lā-tor)"],[4,2,"","mucopurulent","containing both mucus and pus","Ch.5 Respiratory system · mucopurulent (mū-kō-PŪR- ū-lent)"],[4,2,"","patent","open, the opposite of closed or compromised, thus allowing passage of air, as in patent trachea and bronchi (can be applied to any tubular passageway in the body, as in a patent artery, allowing passage of blood)","Ch.5 Respiratory system · patent (PĀ- tent)"],[4,2,"","sputum","mucus from the lungs, bronchi, and trachea expelled through the mouth","Ch.5 Respiratory system · sputum (SPŪ-tum)"],[4,2,"","airway","passageway by which air enters and leaves the lungs as well as a mechanical device used to keep the air passageway unobstructed","Ch.5 Respiratory system · airway (ĀR-wā)"],[4,2,"","aspirate","to withdraw fluid or suction fluid; also to draw foreign material into the respiratory tract","Ch.5 Respiratory system · aspirate (AS-per-āt)"],[4,2,"","nosocomial infection","an infection acquired during hospitalization","Ch.5 Respiratory system · nosocomial infection (nos-ō-KŌ-mē-al) (in-FEK- shun)"],[5,2,"","acute kidney injury (AKI)","abrupt decline in kidney function that occurs over hours to days and is usually reversible (also called acute renal failure [ARF]) (Table 6.1)","Ch.6 Urinary system · acute kidney injury (AKI) (a-KŪT) (KID- nē) (IN-ja-rē)"],[5,2,"","chronic kidney disease (CKD)","progressive, irreversible loss of kidney function (also called chronic renal failure [CRF]) (Table 6.1)","Ch.6 Urinary system · chronic kidney disease (CKD) (KRON-ik) (KID-nē) (di-ZĒZ)"],[5,2,"","end-stage renal disease (ESRD)","condition in which kidneys no longer function on their own. Dialysis or kidney transplantation is necessary for survival.","Ch.6 Urinary system · end-stage renal disease (ESRD) (end) (stāj) (RĒ-nal) (di-ZĒZ)"],[5,2,"","epispadias","congenital defect in which the urinary meatus is located on the upper surface of the penis","Ch.6 Urinary system · epispadias (ep-i-SPĀ- dē-as)"],[5,2,"","hypospadias","congenital defect in which the urinary meatus is located on the underside of the penis. Females may also havea form of hypospadias where the urinary meatus is unusually located.","Ch.6 Urinary system · hypospadias (hī-pō- SPĀ-dē-as)"],[5,2,"","polycystic kidney disease (PKD)","condition in which the kidney contains many cysts causing progressive interference with the ability to form urine","Ch.6 Urinary system · polycystic kidney disease (PKD) (pol-ē- SIS-tik) (KID-nē) (di- ZĒZ)"],[5,2,"","renal calculus,","stone in the kidney","Ch.6 Urinary system · renal calculus (pl. calculi) (RĒ-nal) (KAL-kū-lus), (KAL- kū-lī)"],[5,2,"","renal hypertension","elevated blood pressure resulting from kidney disease","Ch.6 Urinary system · renal hypertension (RĒ-nal) (hī-per-TEN- shun)"],[5,2,"","urinary retention","abnormal accumulation of urine in the bladder because of an inability to urinate","Ch.6 Urinary system · urinary retention (Ū- rin-ār-ē) (rē-TEN- shun)"],[5,2,"","urinary suppression","sudden stoppage of urine formation","Ch.6 Urinary system · urinary suppression (Ū-rin-ār-ē) (sū- PRESH-un)"],[5,2,"","urinary tract infection (UTI)","infection of one or more organs of the urinary tract (Fig. 6.5)","Ch.6 Urinary system · urinary tract infection (UTI) (Ū-rin- ār-ē) (trakt) (in-FEK- shun)"],[5,2,"","extracorporeal shock wave lithotripsy (ESWL)","noninvasive surgical procedure to crush stone(s) in the kidney or ureter by administration of repeated shock waves. Stone fragments are eliminated from the body in urine. (also called shock wave lithotripsy [SWL]).","Ch.6 Urinary system · extracorporeal shock wave lithotripsy (ESWL) (eks-tra-kor-POR-ē-al) (shok) (wāv) (LITH-ō-trip- sē)"],[5,2,"","fulguration","destruction of living tissue with an electric spark (a method commonly used to destroy bladder growths) (Fig. 6.8)","Ch.6 Urinary system · fulguration (ful-gū-RĀ- shun)"],[5,2,"","renal transplant","surgical implantation of a donor kidney intoa patient with inadequate renal function (Fig. 6.9)","Ch.6 Urinary system · renal transplant (RĒ-nal) (TRANS-plant)"],[5,2,"","KUB each letter is said","simple radiographic image of the abdomen. It is often used to view the kidneys, ureters, and bladder to determine their size, shape, and location, or to identify radiopaque calculi in these structures. A KUB may also be used to diagnose intestinal obstruction. (also called flat plate of the abdomen)","Ch.6 Urinary system · KUB (K- Ū-B) each letter is said"],[5,2,"","blood urea nitrogen (BUN)","test that measures the amount of nitrogen in the blood that comes from urea. An increased BUN detects an abnormality in renal function.","Ch.6 Urinary system · blood urea nitrogen (BUN) (blud) (ū-RĒ-a) (NĪ- trō-jen)"],[5,2,"","creatinine","blood test that measures the amount of a waste product in the blood that comes from the normal wear and tear of muscles. An elevated amount may indicate impaired kidney function.","Ch.6 Urinary system · creatinine (crē-AT-i-nin)"],[5,2,"","specific gravity (SG)","test performed on a urine specimen to measure the concentrating or diluting ability of the kidneys","Ch.6 Urinary system · specific gravity (SG) (spe-SIF-ik) (GRAV-i-tē)"],[5,2,"","urinalysis (UA)","multiple routine tests performed on a urine specimen. Visual examination and chemical analysis of a urine specimen provides screening for blood, glucose, protein, and other substances in the urine and offersa picture of overall health.","Ch.6 Urinary system · urinalysis (UA) (ū-rin- AL-is-is)"],[5,2,"","urine culture and sensitivity","test performed on a urine specimen to determine the presence of bacteria and yeast; used to diagnose urinary tract infections","Ch.6 Urinary system · urine culture and sensitivity (Ū- rin) (KUL- cher) (and) (sen-si-TIV-i- tē)"],[5,2,"","urodynamics","pertaining to the force and flow of urine within the urinary tract. Urodynamic studies examine the process of voiding and tests bladder tone, capacity, and pressure along with urine flow and perineal muscle function. An enlarged prostate and urethral stricture will diminish urine flow rate.","Ch.6 Urinary system · urodynamics (ū-rō-dī-NAM- iks)"],[5,2,"","enuresis","involuntary urination. Nocturnal enuresis, or bed-wetting, has been described in early literature and continues to be a problem affecting 15% to 20% of school- aged children. There is no one cause for bed wetting. Diurnal enuresis is daytime wetting, which may be caused by a small bladder. Various treatments are used to treat diurnal enuresis. Children generally outgrow daytime wetting.","Ch.6 Urinary system · enuresis (en-ū-RĒ-sis)"],[5,2,"","prolapse","displacement of an organ or anatomic structure from its normal position (also called ptosis)","Ch.6 Urinary system · prolapse (prō-LAPS)"],[5,2,"","stricture","abnormal narrowing, such as a urethral stricture","Ch.6 Urinary system · stricture (STRIK- chūr)"],[5,2,"","urinary incontinence","inability to control the bladder causing leakage of urine","Ch.6 Urinary system · urinary incontinence (Ū-rin-ār-ē) (in-KON-ti- nens)"],[5,2,"","diuretic","agent that promotes the formation and excretion of urine","Ch.6 Urinary system · diuretic (dī-ū-RET-ik)"],[5,2,"","hemodialysis (HD)","procedure for removing impurities from the blood because of an inability of the kidneys to do so (Fig. 6.13)","Ch.6 Urinary system · hemodialysis (HD) (hē-mō-dī-AL-i-sis)"],[5,2,"","peritoneal dialysis","procedure for removing toxic wastes when the kidney is unable to do so; the peritoneal cavity is used as the receptacle for the fluid used in the dialysis (Fig. 6.14)","Ch.6 Urinary system · peritoneal dialysis (pār-i-tō-NĒ-al) (dī- AL-i-sis)"],[5,2,"","urinary catheterization","passage of a catheter into the urinary bladder to withdraw urine","Ch.6 Urinary system · urinary catheterization (Ū-rin- ār-ē) (kath-e-ter-i-ZĀ- shun)"],[5,2,"","catheter","flexible, tubelike device, such as a urinary catheter, for withdrawing or instilling fluids","Ch.6 Urinary system · catheter (cath) (KATH-e-ter)"],[5,2,"","urinal","receptacle for urine","Ch.6 Urinary system · urinal (Ū-rin-al)"],[5,2,"","distended","stretched out (a bladder is distended when filled with urine)","Ch.6 Urinary system · distended (dis-TEN- ded)"],[5,2,"","electrolytes","minerals in the body, such as sodium and potassium, that carry an electrolyte charge. Electrolyte balance is necessary for the body to function normally and is maintained by the kidneys.","Ch.6 Urinary system · electrolytes (ē-LEK-trō- lītt)"],[5,2,"","void","to empty or evacuate waste material, especially urine","Ch.6 Urinary system · void (voyd)"],[6,2,"","erectile dysfunction (ED)","the inability of the male to attain or maintain an erection sufficient to perform sexual intercourse (formerly called impotence)","Ch.7 Male reproductive system · erectile dysfunction (ED) (e-REK- tīl) (dis- FUNK-shun)"],[6,2,"","hydrocele","fluid-filled sac around the testicle; causes scrotal swelling","Ch.7 Male reproductive system · hydrocele (HĪ-drō-sēl)"],[6,2,"","infertility","reduced or absent ability to achieve pregnancy; generally defined after one year of frequent, unprotected sexual intercourse; may relate to male or female","Ch.7 Male reproductive system · infertility (in-fer-TIL-i- tē)"],[6,2,"","phimosis","tightness of the prepuce (foreskin of the penis) that prevents its retraction over the glans penis; it may be congenital or a result of balanitis. Circumcision is the usual treatment.","Ch.7 Male reproductive system · phimosis (fī-MŌ-sis)"],[6,2,"","priapism","persistent abnormal erection of the penis accompanied by pain and tenderness","Ch.7 Male reproductive system · priapism (PRĪ-a-piz-m)"],[6,2,"","prostate cancer","cancer of the prostate gland, usually occurring in men middle-aged and older (Table 7.1)","Ch.7 Male reproductive system · prostate cancer (PROS-tāt) (KAN-cer)"],[6,2,"","spermatocele","distention of the epididymis containing an abnormal cyst-like collection of fluid and sperm cells; may cause scrotal swelling","Ch.7 Male reproductive system · spermatocele (SPER-ma-tō- sēl)"],[6,2,"","testicular cancer","cancer of the testicle, usually occurring in men 15 to 35 years of age","Ch.7 Male reproductive system · testicular cancer (tes- TIK-ū-ler) (KAN-cer)"],[6,2,"","testicular torsion","twisting of the spermatic cord causing decreased blood flow to the testis; occurs most often during puberty and often presents witha sudden onset of severe testicular or scrotal pain. Because of lack of blood flow to the testis, it is considereda surgical emergency.","Ch.7 Male reproductive system · testicular torsion (tes- TIK-ū-ler) (TOR-shun)"],[6,2,"","varicocele","enlarged veins of the spermatic cord; may cause scrotal swelling","Ch.7 Male reproductive system · varicocele (VAR-i-kō- sēl)"],[6,2,"","ablation","destruction of abnormal or excessive tissue by melting, vaporizing, or eroding","Ch.7 Male reproductive system · ablation (ab-LĀ- shun)"],[6,2,"","circumcision","surgical removal of the prepuce (foreskin); all or part of the foreskin may be removed","Ch.7 Male reproductive system · circumcision (ser- kum-SI-zhun)"],[6,2,"","enucleation","excision of a whole organ or mass without cutting into it","Ch.7 Male reproductive system · enucleation (ē-nū- klē-Ā-shun)"],[6,2,"","hydrocelectomy","surgical removal of a fluid-filled sac around the testicle causing scrotal swelling (hydrocele)","Ch.7 Male reproductive system · hydrocelectomy (hī-drō-sē-LEK-to- mē)"],[6,2,"","laser surgery","use of a focused beam of light to excise or vaporize abnormal tissue and to control bleeding; usesa variety of non-invasive and minimally invasive procedures. Two common types of laser surgery used to treat BPH are holmium laser enucleation of the prostate gland (HoLEP) and photoselective vaporization of the prostate gland (PVP). (Table 7.3, Fig 7.5)","Ch.7 Male reproductive system · laser surgery (LĀ- ser) (SUR-jer-ē)"],[6,2,"","morcellation","cutting or grinding solid tissue into smaller pieces for removal","Ch.7 Male reproductive system · morcellation (mor- se-LĀ-shun)"],[6,2,"","robotic surgery","use of small surgical instruments attached to a computer and operated by the surgeon froma console several feet from the operating table (Table 7.2, Fig. 7.6)","Ch.7 Male reproductive system · robotic surgery (rō-BOT-ik) (SUR- jer-ē)"],[6,2,"","sterilization","surgical procedure that prevents pregnancy, either the ability of the female to conceive or of the male to induce conception","Ch.7 Male reproductive system · sterilization (stār- i-li-ZĀ-shun)"],[6,2,"","transurethral incision of the prostate gland (TUIP)","surgical procedure that widens the urethra by makinga few small incisions in the bladder neck and the prostate gland. No prostate tissue is removed. TUIP may be used instead of TURP when the prostate gland is less enlarged. (Table 7.3)","Ch.7 Male reproductive system · transurethral incision of the prostate gland (TUIP) (trans-ū-RĒ- thral) (in-SIZH-en) (of) (the) (PROS- tāt) (gland)"],[6,2,"","transurethral microwave thermotherapy (TUMT)","treatment that eliminates excess tissue present in benign prostatic hyperplasia by using heat generated by microwave (Table 7.3)","Ch.7 Male reproductive system · transurethral microwave thermotherapy (TUMT) (trans-ū- RĒ-thral) (MĪ-krō- wāv) (ther-mō- THER-a-pē)"],[6,2,"","transurethral resection of the prostate gland (TURP)","surgical removal of pieces of the prostate gland tissue by using an instrument inserted through the urethra. The capsule is left intact; usually performed when the enlarged prostate gland interferes with urination. (Table 7.3)","Ch.7 Male reproductive system · transurethral resection of the prostate gland (TURP) (trans-ū- RĒ-thral) (rē-SEK- shun) (of) (the) (PROS-tāt) (gland)"],[6,2,"","Simple prostatectomy 2. Transurethral incision of the prostate gland (TUIP) 3. Transurethral resection of the prostate gland (TURP)","1. Holmium laser enucleation of the prostate gland (HoLEP) 2. Photoselective vaporization of the prostate gland (PVP)","Ch.7 Male reproductive system · Simple prostatectomy 2. Transurethral incision of the prostate gland (TUIP) 3. Transurethral resection of the prostate gland (TURP)"],[6,2,"","MRI ultrasound fusion biopsy (M-R-I)","combination of magnetic resonance imaging with transrectal ultrasound (TRUS) to obtaina tissue froma prostate lesion. Software merges an existing MR image with live ultrasound images. The combined, or fused, MRI-TRUS image is used to direct the biopsy needle into the area of the prostate that looks suspicious on MRI. (also called MRI-TRUS fusion, MR-ultrasound fusion, and fusion guided biopsy) (Table 7.1)","Ch.7 Male reproductive system · MRI ultrasound fusion biopsy (M-R-I) (UL-tra- sound) (FŪ- shun) (BĪ-op-sē)"],[6,2,"","multiparametric MRI (M-R-I)","magnetic resonance imaging procedure providing information of anatomic structure and physiology for the staging of prostate cancer. It usesa combination of different MRI modalities to better understand the size and extent of prostate tumors. (Table 7.1)","Ch.7 Male reproductive system · multiparametric MRI (MUL-ti- par-a-met-rik) (M-R-I)"],[6,2,"","transrectal ultrasound (TRUS)","ultrasound procedure used to diagnose prostate cancer. Sound waves are sent and received by a transducer probe that is placed into the rectum. (Table 7.1)","Ch.7 Male reproductive system · transrectal ultrasound (TRUS) (trans- REK-tal) (UL- tra-sound)"],[6,2,"","prostate- specific antigen (PSA)","blood test that measures the level of prostate-specific antigen in the blood. Elevated test results may indicate the presence of prostate cancer, urinary or prostatic infection, or excess prostate tissue, as found in benign prostatic hyperplasia or prostatitis. (Table 7.1)","Ch.7 Male reproductive system · prostate- specific antigen (PSA) (PROS-tāt) (spe-SIF-ik) (AN-ti-jen)"],[6,2,"","semen analysis","microscopic observation of ejaculated semen, revealing the size, structure, and movement of sperm; used to evaluate male infertility and to determine the effectiveness of a vasectomy (also called sperm count and sperm test)","Ch.7 Male reproductive system · semen analysis (SĒ- men) (a-NAL-i- sis)"],[6,2,"","total testosterone","blood test to measure the level of the hormone responsible for male physical characteristics (testosterone); used to detect multiple conditions in men and women, including infertility","Ch.7 Male reproductive system · total testosterone (TŌ-tal) (tes- TOS-ta-rōn)"],[6,2,"","digital rectal examination (DRE)","physical examination in which the healthcare provider insertsa gloved finger into the rectum and palpates the prostate through the rectal wall to determine the size, shape, and consistency of the gland; used to screen for BPH and prostate cancer. BPH usually presents as a uniform, nontender enlargement, whereas cancer usually presents as a stony hard nodule. (Table 7.1)","Ch.7 Male reproductive system · digital rectal examination (DRE) (DIJ- i-tal) (REK- tal) (eg-zam- i-NĀ-shun)"],[6,2,"","chlamydia","sexually transmitted infection, caused by the bacterium C. trachomatis; sometimes referred to as a silent STI because many people are not aware they have the disease. Symptoms that occur when the disease becomes serious are painful urination and discharge from the penis in men and genital itching, vaginal discharge, and bleeding between menstrual periods in women.","Ch.7 Male reproductive system · chlamydia (kla- MID-ē-a)"],[6,2,"","genital herpes","sexually transmitted infection caused by herpes simplex virus type 2","Ch.7 Male reproductive system · genital herpes (JEN-i-tal) (HER- pēz)"],[6,2,"","gonorrhea","sexually transmitted infection caused by a bacterial organism that inflames the mucous membranes of the genitourinary tract","Ch.7 Male reproductive system · gonorrhea (gon-ō- RĒ-a)"],[6,2,"","human immunodeficiency virus (HIV)","sexually transmitted infection caused by a retrovirus that infects T-helper cells of the immune system; may also be acquired in utero or transmitted through infected blood via needle sharing. Advanced HIV infection progresses to AIDS (acquired immunodeficiency syndrome).","Ch.7 Male reproductive system · human immunodeficiency virus (HIV) (HŪ- man) (im-ū-nō-de- FISH-en-sē) (VĪ- rus)"],[6,2,"","human papillomavirus (HPV)","sexually transmitted infection caused by viral infection; there are more than 40 types of HPV that cause benign or cancerous growths in male and female genitals (also called genital warts)","Ch.7 Male reproductive system · human papillomavirus (HPV) (HŪ-man) (pap-i-LŌ-ma-vī- rus)"],[6,2,"","sexually transmitted infection (STI)","infection spread through sexual contact; STIs affect both males and females, causing damage to reproductive organs and potentially serious health consequences if left untreated (also called sexually transmitted disease [STD])","Ch.7 Male reproductive system · sexually transmitted infection (STI) (SEK-shū-al-ē) (TRANS-mi-ted) (in-FEK-shun)"],[6,2,"","syphilis","infection caused by the bacterium Treponema pallidum. Rapidly spreads throughout the body, and if untreated becomes systemic and can progress through three stages separated by latent periods. Usually sexually transmitted, but may be acquired in utero and by direct contact with infected skin. (Fig. 7.7)","Ch.7 Male reproductive system · syphilis (SIF-i-lis)"],[6,2,"","trichomoniasis","sexually transmitted infection caused by a one-cell organism Trichomonas. It infects the genitourinary tract. Men may be asymptomatic or may develop urethritis, an enlarged prostate gland, or epididymitis. Women may have vaginal itching, dysuria, and vaginal or urethral discharge.","Ch.7 Male reproductive system · trichomoniasis (trik-ō-mō-NĪ-a- sis)"],[6,2,"","artificial insemination","introduction of washed and concentrated sperm into the female reproductive tract; used as a treatment for infertility","Ch.7 Male reproductive system · artificial insemination (ar-ti- FISH-al) (in-sem-i-NĀ-shun)"],[6,2,"","condom","cover for the penis worn to prevent conception and the spread of sexually transmitted infections","Ch.7 Male reproductive system · condom (KON-dum)"],[6,2,"","spermicide","an agent that destroys spermatozoa; used to prevent conception","Ch.7 Male reproductive system · spermicide (SPUR-mi-sīd)"],[6,2,"","azoospermia","lack of live sperm in the semen (characterized by absence of semen or ejaculation)","Ch.7 Male reproductive system · azoospermia (ā-zō-a- SPUR-mē-a)"],[6,2,"","ejaculation","ejection of semen from the male urethra","Ch.7 Male reproductive system · ejaculation (ē-jak-ū-LĀ- shun)"],[6,2,"","orgasm","climax of sexual stimulation","Ch.7 Male reproductive system · orgasm (ŌR-gazm)"],[6,2,"","puberty","period when secondary sex characteristics (such as pubic and armpit hair, deepening of voice in men, breast development in women, etc.) develop and the ability to reproduce sexually begins","Ch.7 Male reproductive system · puberty (PŪ-ber-tē)"],[7,2,"","abnormal uterine bleeding (AUB)","irregular bleeding in the absence of pregnancy; menometrorrhagia, menorrhagia, and metrorrhagia are some types of AUB","Ch.8 Female reproductive system · abnormal uterine bleeding (AUB) (ab- NOR-mul) (Ū-ter-in) (BLĒD-ing)"],[7,2,"","adenomyosis","growth of endometrium into the muscular portion of the uterus","Ch.8 Female reproductive system · adenomyosis (ad-e-nō-mī- Ō-sis)"],[7,2,"","Bartholin cyst","blockage of one of the glands on either side of the vagina; usually causesa tender, swollen lump on the affected side, which may become infected, resulting in a Bartholin abscess","Ch.8 Female reproductive system · Bartholin cyst (BAR-tō-lin) (sist)"],[7,2,"","breast cancer","malignant tumor of the breast (Fig. 8.5)","Ch.8 Female reproductive system · breast cancer (brest) (KAN- cer)"],[7,2,"","cervical cancer","malignant tumor of the cervix, which progresses from cervical dysplasia to carcinoma. Its cause is linked to human papillomavirus (HPV) infection.","Ch.8 Female reproductive system · cervical cancer (SER- vi-kal) (KAN- cer)"],[7,2,"","endometrial cancer","malignant tumor of the endometrium (also called uterine cancer) (Fig. 8.6)","Ch.8 Female reproductive system · endometrial cancer (en-dō- MĒ-trē-al) (KAN-cer)"],[7,2,"","fibrocystic breast changes (FCC)","thickening of tissue (fibrosis), benign cysts, and pain or tenderness in one or both breasts; thought to be caused by monthly hormonal changes (also called fibrocystic breasts; formerly called fibrocystic breast disease)","Ch.8 Female reproductive system · fibrocystic breast changes (FCC) (fī-brō- SIS-tik) (brest) (CHĀN-jiz)"],[7,2,"","ovarian cancer","malignant tumor of the ovary","Ch.8 Female reproductive system · ovarian cancer (ō- VAR-ē-an) (KAN-cer)"],[7,2,"","pelvic inflammatory disease (PID)","inflammation of some or all of the female pelvic organs; can be caused by many different pathogens. If untreated, the infection may spread upward from the vagina, involving the uterus, fallopian tubes, ovaries, and other pelvic organs. An ascending infection may result in infertility and, in acute cases, fatal septicemia (Fig. 8.7).","Ch.8 Female reproductive system · pelvic inflammatory disease (PID) (PEL-vik) (in- FLAM-a-tor- ē) (di-ZĒZ)"],[7,2,"","polycystic ovary syndrome (PCOS)","condition typically characterized by hormonal imbalances, ovulatory dysfunction, and multiple ovarian cysts; symptoms can include irregular menstruation, acne, excess facial and body hair, and infertility. People with this condition have increased risks of cardiovascular disease, obesity, and glucose intolerance.","Ch.8 Female reproductive system · polycystic ovary syndrome (PCOS) (pol- ē-SIS-tik) (Ō- vah-rē) (SIN- drōm)"],[7,2,"","premenstrual syndrome (PMS)","syndrome involving physical and emotional symptoms occurring up to 10 days before menstruation. Symptoms include nervous tension, irritability, mastalgia, edema, and headache.","Ch.8 Female reproductive system · premenstrual syndrome (PMS) (prē- MEN-stroo- al) (SIN- drōm)"],[7,2,"","toxic shock syndrome (TSS)","severe illness characterized by high fever, rash, vomiting, diarrhea, and myalgia, followed by hypotension and, in severe cases, shock and death; usually affects menstruating women using tampons; caused by Staphylococcus aureus and Streptococcus pyogenes","Ch.8 Female reproductive system · toxic shock syndrome (TSS) (TOK- sik) (shok) (SIN-drōm)"],[7,2,"","uterine fibroid","benign tumor of the uterine muscle (also called myoma of the uterus or leiomyoma)","Ch.8 Female reproductive system · uterine fibroid (Ū- ter-in) (FĪ- broyd)"],[7,2,"","uterovaginal prolapse","dropping of the uterus (and sometimes vagina) due to weakened pelvic muscles; the uterus moves downward into and is sometimes visible outside the vagina","Ch.8 Female reproductive system · uterovaginal prolapse (ū- ter-ō-VAJ-i- nal) (prō- LAPS)"],[7,2,"","vaginal fistula","abnormal connection between the vagina and another organ, such as the urinary bladder, colon, or rectum (Table 8.1)","Ch.8 Female reproductive system · vaginal fistula (VAJ-i- nal) (FIS-tū- la)"],[7,2,"","anterior and posterior colporrhaphy","surgical repair of a weakened vaginal wall to correcta cystocele (protrusion of the bladder against the anterior wall of the vagina) and a rectocele (protrusion of the rectum against the posterior wall of the vagina)","Ch.8 Female reproductive system · anterior and posterior colporrhaphy (A&P repair) (an-TĒR-ē-or) (pos-TĒR-ē- or) (kol-POR- a-fē)"],[7,2,"","conization","surgical removal of a cone-shaped area of the cervix; used in the treatment for noninvasive cervical cancer. Types of conization include loop electrosurgical excision procedure (LEEP), cryosurgery (cold knife conization), and laser ablation. (also called cone biopsy)","Ch.8 Female reproductive system · conization (kon-i-ZĀ- shun)"],[7,2,"","dilation and curettage (D&C)","surgical procedure to widen the cervix and remove contents from the uterus usinga curette, an instrument for scraping or suctioning; the procedure can be diagnostic or therapeutic (Fig. 8.10)","Ch.8 Female reproductive system · dilation and curettage (D&C) (dī- LĀ-shun) (kū-re- TAHZH)"],[7,2,"","endometrial ablation","procedure to destroy or remove the endometrium by use of laser, electrical, or thermal energy; used to treat abnormal uterine bleeding (Fig. 8.11)","Ch.8 Female reproductive system · endometrial ablation (en- dō-MĒ-trē-al) (ab-LĀ-shun)"],[7,2,"","myomectomy","excision of a uterine fibroid (myoma)","Ch.8 Female reproductive system · myomectomy (mī-ō-MEK- to-mē)"],[7,2,"","tubal ligation","surgical closure of the fallopian tubes for sterilization; tubes may be cut and tied (ligated), cut and cauterized, or closed off witha clip, clamp, ring, or band (also called tubal sterilization and female surgical sterilization) (Fig. 8.12)","Ch.8 Female reproductive system · tubal ligation (TOO-bul) (lī- GĀ-shun)"],[7,2,"","uterine artery embolization (UAE)","placement of metal coils or small gelatin beads into uterine arteries to stop blood flow supplying uterine fibroids or to stop severe hemorrhage after childbirth; performed by an interventional radiologist (also called uterine fibroid embolization when used to treat uterine fibroids)","Ch.8 Female reproductive system · uterine artery embolization (UAE) (Ū-ter- in) (AR-ter-ē) (em-be-li-ZĀ- shun)"],[7,2,"","sentinel lymph node biopsy","injection of blue dye and/or radioactive isotope used to identify the sentinel lymph node(s), the first in the axillary chain and most likely to contain metastasis of breast cancer. The nodes are removed and microscopically examined. If the nodes closest to the cancer (called \"sentinel nodes\") are negative, additional nodes are not removed. (Fig. 8.13)","Ch.8 Female reproductive system · sentinel lymph node biopsy (SEN-tin-el) (limf) (nōd) (BĪ-op-sē)"],[7,2,"","stereotactic breast biopsy","technique that combines mammography and computer-assisted biopsy to obtain tissue froma breast lesion (Fig. 8.14)","Ch.8 Female reproductive system · stereotactic breast biopsy (ster- ē-ō-TAK-tik) (brest) (BĪ- op-sē)"],[7,2,"","transvaginal sonography (TVS)","ultrasound procedure that usesa transducer placed in the vagina to obtain images of the ovaries, uterus, cervix, fallopian tubes, and surrounding structures; used to diagnose masses such as ovarian cysts or tumors, to monitor pregnancy, and to evaluate ovulation for the treatment of infertility (Fig. 8.15)","Ch.8 Female reproductive system · transvaginal sonography (TVS) (trans-VAJ-i- nal) (so- NOG-ra-fē)"],[7,2,"","CA- 125 test (C- A-1- 25)","blood test primarily used to monitor treatment for ovarian cancer and to detect recurrence once treatment is complete. CA-125 (cancer antigen 125) is a protein found on the surface of most ovarian cancer cells and is released into the bloodstream. Elevated amounts of CA-125 in the blood may indicate the presence of ovarian cancer. (also called CA-125 and CA 125 tumor marker)","Ch.8 Female reproductive system · CA- 125 test (C- A-1- 25) (test)"],[7,2,"","HPV test (H- P-V)","cytological study of cervical and vaginal secretions to detect high-risk forms of the human papillomavirus (HPV) that can cause abnormal cervical cells and cervical cancer; used for cervical cancer screening (Table 8.4)","Ch.8 Female reproductive system · HPV test (H- P-V) (test)"],[7,2,"","Pap test","cytological study of cervical and vaginal secretions to detect abnormal and cancerous cells; primarily used for cervical cancer screening (also called Papanicolaou [pap-a-NIK-kō- lā-oo] test; formerly called Pap smear) (Table 8.4)","Ch.8 Female reproductive system · Pap test (pap ) (test)"],[7,2,"","anovulation","failure of the ovary to release an egg","Ch.8 Female reproductive system · anovulation (an- ov-ū-LĀ-shun)"],[7,2,"","dyspareunia","difficult or painful intercourse","Ch.8 Female reproductive system · dyspareunia (dis- pa-RŪ-nē-a)"],[7,2,"","fistula","abnormal passageway between two organs or between an internal organ and the body surface","Ch.8 Female reproductive system · fistula (FIS-tū-la)"],[7,2,"","oligoovulation","infrequent release of an egg","Ch.8 Female reproductive system · oligoovulation (ol-i-gō-ov-ū-LĀ- shun)"],[7,2,"","contraception","intentional prevention of conception (pregnancy) (also called birth control [BC]) (Fig. 8.16)","Ch.8 Female reproductive system · contraception (kon-tra-SEP- shen)"],[7,2,"","hormone replacement therapy (HRT)","replacement of hormones, estrogen and progesterone, to treat symptoms associated with menopause","Ch.8 Female reproductive system · hormone replacement therapy (HRT) (HŌR-mōn) (rē-PLĀS-ment) (THER-a- pē)"],[7,2,"","speculum","instrument for openinga body cavity to allow visual inspection","Ch.8 Female reproductive system · speculum (SPEK- ū-lum)"],[7,2,"","menarche","beginning of menstruation (specifically, onset of the first menstrual period)","Ch.8 Female reproductive system · menarche (me-NAR- kē)"],[7,2,"","menopause","cessation of menstruation, usually around the ages of 48 to 53 years; may be induced at an earlier age surgically (bilateral oophorectomy) or medically (side effect of chemotherapy treatment)","Ch.8 Female reproductive system · menopaus e (MEN-o- pawz)"],[8,2,"","abortion (AB)","termination of pregnancy by the expulsion from the uterus of an embryo or fetus before viability, usually before 20 weeks of gestation. Spontaneous abortion is the termination of pregnancy that occurs naturally and is commonly referred to as miscarriage. Induced abortion is the intentional termination of pregnancy by surgical or medical intervention.","Ch.9 Obstetrics and neonatology · abortion (AB) (a- BŌR-shun)"],[8,2,"","abruptio placentae","premature separation of the placenta from the uterine wall (Fig. 9.4A)","Ch.9 Obstetrics and neonatology · abruptio placentae (ab-RUP- shē-ō) (pla- SEN-tē)"],[8,2,"","eclampsia","severe complication and progression of preeclampsia characterized by convulsion (see preeclampsia later). Eclampsia is a potentially life-threatening disorder.","Ch.9 Obstetrics and neonatology · eclampsia (e-KLAMP- sē-a)"],[8,2,"","ectopic pregnancy","pregnancy occurring outside the uterus, commonly in the fallopian tubes (Fig. 9.3)","Ch.9 Obstetrics and neonatology · ectopic pregnancy (ek-TOP-ik) (PREG-nan- sē)"],[8,2,"","placenta previa","abnormally low implantation of the placenta on the uterine wall completely or partially covering the cervix. Dilation of the cervix can cause separation of the placenta from the uterine wall, resulting in bleeding. With severe hemorrhage, a cesarean section is necessary to save the mother and baby's life. (Fig. 9.4B)","Ch.9 Obstetrics and neonatology · placenta previa (pla- SEN-ta) (PRĒ-vē-a)"],[8,2,"","preeclampsia","abnormal condition encountered during pregnancy or shortly after delivery characterized by high blood pressure and proteinuria, but with no convulsions. The cause is unknown; if not successfully treated, the condition can progress to eclampsia.","Ch.9 Obstetrics and neonatology · preeclampsi a (prē-ē- KLAMP-sē- a)"],[8,2,"","cleft lip or palate","congenital split of the lip or roof of the mouth, one or both deformities may be present (cleft indicatesa fissure) (Fig. 9.5)","Ch.9 Obstetrics and neonatology · cleft lip or palate (kleft) (lip) (or) (PAL- at)"],[8,2,"","coarctation of the aorta","congenital stenosis (narrowing) that occurs in the arch of the aorta","Ch.9 Obstetrics and neonatology · coarctation of the aorta (kō- ark-TĀ-shun) (of) (the) (ā-OR- ta)"],[8,2,"","congenital cytomegalovirus (CMV) infection","herpes-type virus that crosses the placenta. Symptoms in newborns may include jaundice, microcephaly, developmental delay and hearing loss; some infants may have no symptoms.","Ch.9 Obstetrics and neonatology · congenital cytomegalovirus (CMV) infection (kon-JEN-i-tal) (sī-to-MEG-a-lō- vī-rus) (in-FEK- shun)"],[8,2,"","congenital heart disease","heart abnormality present at birth","Ch.9 Obstetrics and neonatology · congenital heart disease (kon- JEN-i-tal) (hart) (di-ZĒZ)"],[8,2,"","Down syndrome","genetic condition caused by a chromosomal abnormality characterized by varying degrees of intellectual, developmental, and physical disorders or defects (there is an extra 21st chromosome; hence, it is also called trisomy 21) (Fig. 9.6)","Ch.9 Obstetrics and neonatology · Down syndrome (down) (SIN- drōm)"],[8,2,"","erythroblastosis fetalis","condition of the newborn characterized by hemolysis of the erythrocytes. The condition is usually caused by incompatibility of the infant's and mother's blood, occurring when the mother's blood is Rh negative and the infant's blood is Rh positive.","Ch.9 Obstetrics and neonatology · erythroblastosis fetalis (e-rith-rō- blas-TŌ-sis) (fē- TAL-is)"],[8,2,"","esophageal atresia","congenital absence of part of the esophagus. Food cannot pass from the baby's mouth to the stomach.","Ch.9 Obstetrics and neonatology · esophageal atresia (e-sof-a- JĒ-al) (a-TRĒ- zha)"],[8,2,"","fetal alcohol syndrome (FAS)","condition caused by excessive alcohol consumption by the mother during pregnancy. Various birth defects may be present, including central nervous system dysfunction and malformations of the skull and face.","Ch.9 Obstetrics and neonatology · fetal alcohol syndrome (FAS) (FĒ-tal) (AL-kō- hol) (SIN-drōm)"],[8,2,"","gastroschisis","congenital fissure of the abdominal wall that is not at the umbilicus. Enterocele, protrusion of the intestine, is usually present.","Ch.9 Obstetrics and neonatology · gastroschisis (gas-TROS-ki- sis)"],[8,2,"","respiratory distress syndrome (RDS)","respiratory complication in the newborn, especially in premature infants. In premature infants RDS is caused by normal immaturity of the respiratory system resulting in compromised respiration. (formerly called hyaline membrane disease)","Ch.9 Obstetrics and neonatology · respiratory distress syndrome (RDS) (RES-pi- ra-tōr-ē) (di- STRESS) (SIN- drōm)"],[8,2,"","spina bifida","congenital defect in the vertebral column caused by the failure of the vertebral arch to close. If the meninges protrude through the opening the condition is called meningocele. Protrusion of both the meninges and spinal cord is called meningomyelocele. (Fig. 9.7)","Ch.9 Obstetrics and neonatology · spina bifida (SPĪ-na) (BIF-i- da)"],[8,2,"","cervical cerclage","suturing the cervix closed to prevent dilation and premature delivery","Ch.9 Obstetrics and neonatology · cervical cerclage (SER-vi-kal) (ser- KLAHZH)"],[8,2,"","cesarean section","birth of a fetus through an incision in the mother's abdomen and uterus (may also be spelled caesarean)","Ch.9 Obstetrics and neonatology · cesarean section (CS, C-section) (se-ZĀR-ē- an) (SEK- shun)"],[8,2,"","in vitro fertilization (IVF)","method of fertilizing human ova outside the body and placing the zygote into the uterus; used when infertility is present. Infertility management techniques that artificially combine both the ova and the sperm are called assisted reproductive technology (ART). (Fig. 9.10)","Ch.9 Obstetrics and neonatology · in vitro fertilization (IVF) (in) (VĒ-trō) (fer-ti-li-ZĀ- shun)"],[8,2,"","nuchal translucency screening","ultrasound test to check the back of the fetal neck for extra fluid or thickening. It is usually performed between 11 and 13 weeks of pregancy and, when combined with first trimester screening blood tests, may reveal an increased risk for Down syndrome or other congenital disorders.","Ch.9 Obstetrics and neonatology · nuchal translucency screening (NŪ-kal) (trans-LŪ- sen-sē) (SKRĒN-ing)"],[8,2,"","quad screen","blood test performed during the second trimester measuring four hormone levels that can reveal an increased risk of certain disorders in the developing fetus. It measures the levels of alpha-fetoprotein, human chorionic gonadotropin, unconjugated estriol and inhibin and can indicate the possibility of Down syndrome (trisomy 21), trisomy 18, and neural tube defects such as spina bifida. An abnormal quad screen requiresa confirming diagnostic test such as ultrasound or amniocentesis, and genetic counselling is an important part of the work-up.","Ch.9 Obstetrics and neonatology · quad screen (kwod ) (skrēn)"],[8,2,"","Apgar score","system for rapid neonatal assessment at 1 and 5 minutes after birth. Five vital criteria, including heart rate, respiration, muscle tone, response to stimulation, and color, are assessed and scored on a 0-2 scale, with 7-10 considered normal. (Fig. 9.13)","Ch.9 Obstetrics and neonatology · Apgar score (AP-gar) (skor)"],[8,2,"","chorionic villus sampling (CVS)","prenatal test that takesa sample of the the area of blood supply in the placenta either through the abdominal wall or the vagina. It is usually performed between 10 and 13 weeks of pregnancy and tests for chromosome and other genetic problems. It has a small risk of miscarriage and is thus usually performed only in high-risk pregnancies or whena screening test is positive for an abnormality. (Fig. 9.14)","Ch.9 Obstetrics and neonatology · chorionic villus sampling (CVS) (kor-ē-A-nik) (VIL-us) (SAM- pling)"],[8,2,"","colostrum","thin, milky fluid secreted by the breast during pregnancy and during the first days after birth before lactation begins","Ch.9 Obstetrics and neonatology · colostrum (ke-LOS- trem)"],[8,2,"","lochia","vaginal discharge after childbirth","Ch.9 Obstetrics and neonatology · lochia (LŌ-kē-a)"],[8,2,"","quickening","first feeling of movement of the fetus in utero by the pregnant woman. It usually occurs between 16 and 20 weeks of gestation.","Ch.9 Obstetrics and neonatology · quickenin g (KWIK- en-ing)"],[8,2,"","midwife","individual who practices midwifery","Ch.9 Obstetrics and neonatology · midwife (MID- wīf)"],[8,2,"","midwifery","practice of assisting in childbirth","Ch.9 Obstetrics and neonatology · midwifery (MID- wif-rē)"],[8,2,"","obstetrician","physician who specializes in obstetrics","Ch.9 Obstetrics and neonatology · obstetrician (ob- ste-TRISH-an)"],[8,2,"","obstetrics (OB)","medical specialty dealing with pregnancy, childbirth, and puerperium","Ch.9 Obstetrics and neonatology · obstetrics (OB) (ob-STET-riks)"],[8,2,"","breech presentation","birth position in which the buttocks, feet, or knees emerge first","Ch.9 Obstetrics and neonatology · breech presentation (brēch) (prē-zen-TĀ- shun)"],[8,2,"","cephalic presentation","birth position in which any part of the head emerges first. It is the most common presentation.","Ch.9 Obstetrics and neonatology · cephalic presentation (se-FAL-ik) (prē-zen- TĀ-shun)"],[8,2,"","in vitro","outside the body or in a lab setting","Ch.9 Obstetrics and neonatology · in vitro (in) (VĒ-trō)"],[8,2,"","in vivo","within the living body","Ch.9 Obstetrics and neonatology · in vivo (in) (VĒ-vō)"],[8,2,"","lactation","secretion of milk","Ch.9 Obstetrics and neonatology · lactation (lak- TĀ-shun)"],[8,2,"","parturition","act of giving birth","Ch.9 Obstetrics and neonatology · parturition (par-tū-RISH- un)"],[8,2,"","puerperium","period from delivery until the reproductive organs return to normal (approximately 6 weeks)","Ch.9 Obstetrics and neonatology · puerperium (pū-er-PĒ-rē- um)"],[8,2,"","congenital anomaly","abnormality present at birth; often discovered before birth by sonography or amniocentesis","Ch.9 Obstetrics and neonatology · congenital anomaly (kon-JEN-i-tal) (a- NOM-a-lē)"],[8,2,"","meconium","first stool of the newborn (greenish-black)","Ch.9 Obstetrics and neonatology · meconium (me-KŌ- nē-um)"],[8,2,"","gavage","process of feeding througha tube; used for critically ill newborns and others who are unconscious, unable to swallow, or too weak to eat (also called gastric gavage)","Ch.9 Obstetrics and neonatology · gavage (ga- VOZH)"],[8,2,"","premature infant","infant born before completing 37 weeks of gestation (also called preterm infant)","Ch.9 Obstetrics and neonatology · premature infant (PRĒ-ma-tur) (IN- fent)"],[8,2,"","stillborn","born dead (death of fetus after 20 weeks of pregnancy)","Ch.9 Obstetrics and neonatology · stillborn (STIL-born)"],[9,2,"","acute coronary syndrome (ACS)","sudden symptoms of insufficient blood supply to the heart indicating unstable angina or acute myocardial infarction. Rapid assessment is necessary to determine the diagnosis and treatment and to minimize heart damage.","Ch.10 Cardiovascular, immune, lymphatic systems and blood · acute coronary syndrome (ACS) (a- KŪT) (KOR- o-nar-ē) (SIN- drōm)"],[9,2,"","aneurysm","ballooning of a weakened portion of an arterial wall (Fig. 10.10)","Ch.10 Cardiovascular, immune, lymphatic systems and blood · aneurysm (AN-ū-riz- em)"],[9,2,"","angina pectoris","chest pain, which may radiate to the left arm and jaw, that occurs when there is an insufficient supply of blood to the heart muscle","Ch.10 Cardiovascular, immune, lymphatic systems and blood · angina pectoris (an- JĪ-na) (PEK- to-ris)"],[9,2,"","arrhythmia","any disturbance or abnormality in the heart's normal rhythmic pattern","Ch.10 Cardiovascular, immune, lymphatic systems and blood · arrhythmia (ā-RITH-mē- a)"],[9,2,"","cardiac arrest","sudden cessation of cardiac output and effective circulation, which requires cardiopulmonary resuscitation (CPR)","Ch.10 Cardiovascular, immune, lymphatic systems and blood · cardiac arrest (KAR-dē-ak) (a-REST)"],[9,2,"","cardiac tamponade","acute compression of the heart caused by fluid accumulation in the pericardial cavity","Ch.10 Cardiovascular, immune, lymphatic systems and blood · cardiac tamponade (KAR-dē-ak) (tam-po- NĀD)"],[9,2,"","coronary artery disease (CAD)","condition that reduces the flow of blood through the coronary arteries to the myocardium that may progress to
