      const handleAuthSubmit = async () => {
        const email = authEmail.trim();
        if (!email || !email.includes("@")) { showToast("请输入有效的邮箱地址", "error"); return; }
        const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
        const headers = { "apikey": cloudCfg.anonKey, "Content-Type": "application/json" };
        setAuthBusy(true);
        try {
          if (authMode === "login") {
            if (authPassword.length < 6) throw new Error("密码至少 6 位");
            const res = await fetch(`${baseUrl}/auth/v1/token?grant_type=password`, { method: "POST", headers, body: JSON.stringify({ email, password: authPassword }) });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error_description || data.msg || "邮箱或密码错误");
            if (rememberPwd || autoLogin) {
              safeSetStorage(SAVED_CRED_KEY, { rememberPwd: true, autoLogin, email, pwdEnc: encodeCred(authPassword) });
            } else {
              safeSetStorage(SAVED_CRED_KEY, { rememberPwd: false, autoLogin: false, email: "", pwdEnc: "" });
            }
            manualLogoutRef.current = false;
            switchToUser(data.user?.email || email);
            setShowAuthModal(false);
            if (!rememberPwd) setAuthPassword("");
            showToast(`登录成功！欢迎 ${email}`, "success");
          } else if (authMode === "register") {

            const res = await fetch(`${baseUrl}/auth/v1/verify`, { method: "POST", headers, body: JSON.stringify({ type: "signup", email, token: authOtp.trim() }) });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error_description || data.msg || "验证码错误");
            switchToUser(data.user?.email || email);
            setShowAuthModal(false); setAuthPassword(""); setAuthOtp(""); setOtpSent(false);
            showToast("邮箱验证成功！", "success");
          } else if (authMode === "reset") {
            if (!authOtp.trim() || newResetPassword.length < 6) throw new Error("请输入验证码与至少 6 位新密码");
            const vRes = await fetch(`${baseUrl}/auth/v1/verify`, { method: "POST", headers, body: JSON.stringify({ type: "recovery", email, token: authOtp.trim() }) });
            const vData = await vRes.json();

            const uRes = await fetch(`${baseUrl}/auth/v1/user`, { method: "PUT", headers: { "apikey": cloudCfg.anonKey, "Authorization": "Bearer " + vData.access_token, "Content-Type": "application/json" }, body: JSON.stringify({ password: newResetPassword }) });
            if (!uRes.ok) throw new Error("新密码更新失败");

      const syncToSupabase = async (direction, silentIfSame = false) => {
        if (!cloudCfg.url || !cloudCfg.anonKey || currentUser === "guest") return;
        setCloudBusy(true);
        const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
        const headers = { "apikey": cloudCfg.anonKey, "Authorization": "Bearer " + cloudCfg.anonKey, "Content-Type": "application/json", "Prefer": "resolution=merge-duplicates" };
        const chunkByBytes = (arr, maxBytes = 320000, maxCount = 400) => {
          const res = [];
          let cur = [];
          let curBytes = 0;
          for (let i = 0; i < arr.length; i++) {
            const item = arr[i];
            const sz = JSON.stringify(item).length;
            if (cur.length > 0 && (curBytes + sz > maxBytes || cur.length >= maxCount)) {
              res.push(cur);
              cur = [item];
              curBytes = sz;
            } else {
              cur.push(item);
              curBytes += sz;
            }
          }
          if (cur.length > 0) res.push(cur);
          return res;
        };

        try {
          if (direction === "push") {
            // Pre-check remote updatedAt to prevent accidental overwrite of newer progress from another device
            try {
              const chkRes = await fetch(`${baseUrl}/rest/v1/medspire_saves?username=eq.${encodeURIComponent(currentUser)}&select=data`, { headers });
              if (chkRes.ok) {
                const chkRows = await chkRes.json();
                const remoteUpd = chkRows?.[0]?.data?.updatedAt;
                const localSyncAt = safeGetStorage(getUserKey(currentUser, "lastSyncAt"), "");
                if (remoteUpd && (!localSyncAt || new Date(remoteUpd).getTime() - new Date(localSyncAt).getTime() > 5000)) {
                  const remoteTimeStr = new Date(remoteUpd).toLocaleString("zh-CN", { hour12: false });
                  if (!confirm(`⚠️ 检测到云端存档 (${remoteTimeStr}) 比本机上次同步时间更新！\n继续上传将覆盖云端较新的进度。确定要覆盖吗？（点「取消」后可改点「从云端拉取」）`)) {
                    setCloudBusy(false);
                    return;
                  }
                }
              }
            } catch (e) {}
            const dynamicQuestions = customQuestions.filter(q => !q._static);
            const qChunks = chunkByBytes(dynamicQuestions, 300000, 60);
            const aChunks = chunkByBytes(ankiCards, 300000, 200);
            const medEngChanged = medEngCards.filter(c => !/^me-\d+-[fb]$/.test(String(c.id || "")) || c.suspended || c._edited || (c.fsrs && (c.fsrs.reps > 0 || c.fsrs.lapses > 0)));
            const mChunks = chunkByBytes(medEngChanged, 300000, 500);
            const totalItems = Math.max(1, dynamicQuestions.length + ankiCards.length + medEngChanged.length + 1);
            const tasks = [];
            tasks.push({
              key: currentUser,
              label: "核心档案与打卡记录",
              count: 1,
              body: JSON.stringify({
                username: currentUser,
                data: {
                  mistakes, medEngMistakes, medEngRevLog, ankiRevLog,
                  attemptedMap, markedIds, notesMap, highlightsMap, dailyLogs,
                  vocabBook, examGoal,
                  activeBlock: savedBlock,
                  chunkMeta: { qChunks: qChunks.length, aChunks: aChunks.length, mChunks: mChunks.length },
                  updatedAt: new Date().toISOString()
                }
              })
            });
            for (let i = 0; i < qChunks.length; i++) {
              tasks.push({ key: `${currentUser}__q_${i}`, label: `UWorld 题库 (${i + 1}/${qChunks.length})`, count: qChunks[i].length, body: JSON.stringify({ username: `${currentUser}__q_${i}`, data: { items: qChunks[i] } }) });
            }
            for (let i = 0; i < aChunks.length; i++) {
              tasks.push({ key: `${currentUser}__a_${i}`, label: `Anki 卡组 (${i + 1}/${aChunks.length})`, count: aChunks[i].length, body: JSON.stringify({ username: `${currentUser}__a_${i}`, data: { items: aChunks[i] } }) });
            }
            for (let i = 0; i < mChunks.length; i++) {
              tasks.push({ key: `${currentUser}__m_${i}`, label: `医学英语增量卡库 (${i + 1}/${mChunks.length})`, count: mChunks[i].length, body: JSON.stringify({ username: `${currentUser}__m_${i}`, data: { items: mChunks[i] } }) });
            }

            const totalBytes = tasks.reduce((acc, t) => acc + new Blob([t.body]).size, 0);
            let doneItems = 0;
            let doneBytes = 0;
            const startMs = Date.now();

            for (const t of tasks) {
              const bLen = new Blob([t.body]).size;
              const curSpeed = doneBytes > 0 ? doneBytes / Math.max(0.15, (Date.now() - startMs) / 1000) : 0;
              updateSyncProgress(t.label, doneItems, totalItems, `本片 ${formatBytes(bLen)}`, doneBytes, totalBytes, curSpeed);
              const r = await fetch(`${baseUrl}/rest/v1/medspire_saves`, { method: "POST", headers, body: t.body });
              if (!r.ok) {
                const errTxt = await r.text().catch(() => "");
                throw new Error(`${t.label} HTTP ${r.status} ${errTxt.slice(0, 60)}`);
              }
              doneItems += t.count;
              doneBytes += bLen;
              const avgSpeed = doneBytes / Math.max(0.1, (Date.now() - startMs) / 1000);
              updateSyncProgress(t.label, Math.min(totalItems, doneItems), totalItems, "上传完成", doneBytes, totalBytes, avgSpeed);
            }

            const finalSpeed = totalBytes / Math.max(0.1, (Date.now() - startMs) / 1000);
            safeSetStorage(getUserKey(currentUser, "lastSyncAt"), new Date().toISOString());
            setHasUnsynced(false);
            finishSyncProgress("个人全端存档上传", totalItems, totalBytes, finalSpeed);
            showToast(`已全量同步：${questions.length} 题、${ankiCards.length} 张 Anki、${medEngCards.length} 张医学英语及全部打卡记录！`, "success");
          } else {
            updateSyncProgress("云端版本比对", 0, 4, "正在检查云端是否有新改动...");
            const res = await fetch(`${baseUrl}/rest/v1/medspire_saves?username=eq.${encodeURIComponent(currentUser)}&select=data`, { headers });
            if (!res.ok) throw new Error("HTTP " + res.status);
            const rows = await res.json();
            const d = rows?.[0]?.data;
            if (!d) {
              setSyncProgress(null);
              if (!silentIfSame) showToast("云端暂无该账号存档", "info");
              return;
            }
            const localSyncAt = safeGetStorage(getUserKey(currentUser, "lastSyncAt"), "");
            if (silentIfSame && d.updatedAt && localSyncAt && new Date(d.updatedAt).getTime() <= new Date(localSyncAt).getTime()) {
              setSyncProgress(null);
              return;
            }

            if (Array.isArray(d.mistakes)) setMistakes(d.mistakes);
            if (Array.isArray(d.medEngMistakes)) setMedEngMistakes(d.medEngMistakes);
            if (Array.isArray(d.medEngRevLog)) setMedEngRevLog(d.medEngRevLog);
            if (d.attemptedMap) {
              setAttemptedMap(prev => {
                const merged = { ...prev };
                Object.entries(d.attemptedMap).forEach(([qid, val]) => {
                  if (!merged[qid] || (val?.count || 0) >= (merged[qid]?.count || 0)) merged[qid] = val;
                });
                return merged;
              });
            }
            if (Array.isArray(d.markedIds)) setMarkedIds(prev => Array.from(new Set([...(prev || []), ...d.markedIds])));
            if (d.notesMap) setNotesMap(prev => ({ ...d.notesMap, ...prev }));
            if (d.highlightsMap) setHighlightsMap(prev => ({ ...d.highlightsMap, ...prev }));
            if (d.dailyLogs) {
              setDailyLogs(prev => {
                const merged = { ...prev };
                Object.entries(d.dailyLogs).forEach(([dk, val]) => {
                  const cur = merged[dk] || { studySec: 0, qCount: 0, ankiCount: 0, medEngCount: 0 };
                  merged[dk] = {
                    studySec: Math.max(cur.studySec || 0, val?.studySec || 0),
                    qCount: Math.max(cur.qCount || 0, val?.qCount || 0),
                    ankiCount: Math.max(cur.ankiCount || 0, val?.ankiCount || 0),
                    medEngCount: Math.max(cur.medEngCount || 0, val?.medEngCount || 0)
                  };
                });
                return merged;
              });
            }
            if (Array.isArray(d.vocabBook)) setVocabBook(d.vocabBook);
            if (d.examGoal) setExamGoal(d.examGoal);
            if (d.medEngFsrsMap) {
              setMedEngCards(prev => prev.map(c => d.medEngFsrsMap[c.id] ? { ...c, fsrs: d.medEngFsrsMap[c.id].fsrs, suspended: d.medEngFsrsMap[c.id].suspended } : c));
            }
            if (d.ankiFsrsMap) {
              setAnkiCards(prev => prev.map(c => d.ankiFsrsMap[c.id] ? { ...c, fsrs: d.ankiFsrsMap[c.id].fsrs, suspended: d.ankiFsrsMap[c.id].suspended } : c));
            }

            const meta = d.chunkMeta;
            if (meta) {
              const totalChunks = 1 + (meta.qChunks || 0) + (meta.aChunks || 0) + (meta.mChunks || 0);
              let doneChunks = 1;
              let pullBytes = 0;
              const pullStartMs = Date.now();
              const pullChunks = async (prefix, count, label) => {
                let all = [];
                for (let i = 0; i < count; i++) {
                  const spd = pullBytes > 0 ? pullBytes / Math.max(0.15, (Date.now() - pullStartMs) / 1000) : 0;
                  updateSyncProgress(`${label} (${i + 1}/${count})`, doneChunks, totalChunks, "正在拉取分片...", pullBytes, null, spd);
                  const cr = await fetch(`${baseUrl}/rest/v1/medspire_saves?username=eq.${encodeURIComponent(currentUser + prefix + i)}&select=data`, { headers });
                  if (!cr.ok) throw new Error(`${label} HTTP ${cr.status}`);
                  const txt = await cr.text();
                  pullBytes += new Blob([txt]).size;
                  const crows = JSON.parse(txt);
                  if (Array.isArray(crows?.[0]?.data?.items)) all = all.concat(crows[0].data.items);
                  doneChunks++;
                }
                return all;
              };
              const pulledQs = await pullChunks("__q_", meta.qChunks || 0, "UWorld 题库");
              const pulledAnki = await pullChunks("__a_", meta.aChunks || 0, "Anki 卡组");
              const pulledMe = await pullChunks("__m_", meta.mChunks || 0, "医学英语全量卡库");
              if (meta.qChunks > 0 || Array.isArray(d.questions)) setQuestions(meta.qChunks > 0 ? pulledQs : (d.questions || []));
              if (meta.aChunks > 0 || Array.isArray(d.ankiCards)) setAnkiCards(normalizeAnkiClozeActiveNum(meta.aChunks > 0 ? pulledAnki : (d.ankiCards || [])));
              if (meta.mChunks > 0) {
                setMedEngCards(prev => {
                  const base = prev.length > 0 ? prev : buildInitialMedEngCards();
                  const pmMap = new Map(pulledMe.map(c => [c.id, c]));
                  const updatedBase = base.map(c => pmMap.has(c.id) ? pmMap.get(c.id) : c);
                  const baseIds = new Set(base.map(c => c.id));
                  const extras = pulledMe.filter(c => !baseIds.has(c.id));
                  return [...extras, ...updatedBase];
                });
              }
              safeSetStorage(getUserKey(currentUser, "lastSyncAt"), d.updatedAt || new Date().toISOString());
              setHasUnsynced(false);
              finishSyncProgress("全端全量数据拉取", totalChunks);
              showToast(`已从云端全量拉取：${pulledQs.length} 题、${pulledAnki.length} 张 Anki、${pulledMe.length} 张医学英语！`, "success");
            } else {
              // Legacy single-record fallback
              if (Array.isArray(d.questions)) setQuestions(d.questions);
              if (Array.isArray(d.ankiCards)) setAnkiCards(normalizeAnkiClozeActiveNum(d.ankiCards));
              if (Array.isArray(d.medEngCards) && d.medEngCards.length > 0) setMedEngCards(d.medEngCards);
              finishSyncProgress("个人存档拉取", 4);
              showToast("已从云端拉取全部数据！", "success");
            }
          }
        } catch (err) {
          setSyncProgress(null);
          showToast("云同步失败：" + (err?.message || "网络超时或请求异常"), "error");
        } finally {
          setCloudBusy(false);
        }
      };

      const chunkItemsByBytes = (arr, maxBytes = 300000, maxCount = 300) => {
        const res = [];
        let cur = [];
        let curBytes = 0;
        for (let i = 0; i < arr.length; i++) {
          const item = arr[i];
          const sz = JSON.stringify(item).length;
          if (cur.length > 0 && (curBytes + sz > maxBytes || cur.length >= maxCount)) {
            res.push(cur);
            cur = [item];
            curBytes = sz;
          } else {
            cur.push(item);
            curBytes += sz;
          }
        }
        if (cur.length > 0) res.push(cur);
        return res;
      };

      const publishGlobalChunked = async (rootKey, items, label, maxCount = 200) => {
        const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
        const headers = { "apikey": cloudCfg.anonKey, "Authorization": "Bearer " + cloudCfg.anonKey, "Content-Type": "application/json", "Prefer": "resolution=merge-duplicates" };
        const chunks = chunkItemsByBytes(items, 300000, maxCount);
        const bodies = chunks.map((ch, i) => JSON.stringify({ username: `${rootKey}__c_${i}`, data: { items: ch } }));
        const totalBytes = bodies.reduce((acc, b) => acc + new Blob([b]).size, 0);
        const totalSteps = chunks.length + 1;
        let doneBytes = 0;
        const startMs = Date.now();
        for (let i = 0; i < chunks.length; i++) {
          const bLen = new Blob([bodies[i]]).size;
          const spd = doneBytes > 0 ? doneBytes / Math.max(0.15, (Date.now() - startMs) / 1000) : 0;
          updateSyncProgress(`${label} (${i + 1}/${chunks.length})`, i, totalSteps, `本片 ${formatBytes(bLen)}`, doneBytes, totalBytes, spd);
          const r = await fetch(`${baseUrl}/rest/v1/medspire_saves`, { method: "POST", headers, body: bodies[i] });
          if (!r.ok) {
            const errTxt = await r.text().catch(() => "");
            throw new Error(`分片 ${i + 1} HTTP ${r.status} ${errTxt.slice(0, 60)}`);
          }
          doneBytes += bLen;
        }
        const finalSpd = totalBytes / Math.max(0.1, (Date.now() - startMs) / 1000);
        updateSyncProgress(label, chunks.length, totalSteps, "正在写入公共库索引...", doneBytes, totalBytes, finalSpd);
        const metaRes = await fetch(`${baseUrl}/rest/v1/medspire_saves`, {
          method: "POST",
          headers,
          body: JSON.stringify({ username: rootKey, data: { chunkCount: chunks.length, total: items.length, updatedAt: new Date().toISOString() } })
        });
        if (!metaRes.ok) {
          const errTxt = await metaRes.text().catch(() => "");
          throw new Error(`索引 HTTP ${metaRes.status} ${errTxt.slice(0, 60)}`);
        }
        finishSyncProgress(label, totalSteps, totalBytes, finalSpd);
      };

      const pullGlobalChunked = async (rootKey, legacyField, label, showBar = true) => {
        const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
        const headers = { "apikey": cloudCfg.anonKey, "Authorization": "Bearer " + cloudCfg.anonKey };
        const res = await fetch(`${baseUrl}/rest/v1/medspire_saves?username=eq.${encodeURIComponent(rootKey)}&select=data`, { headers });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const rows = await res.json();
        const d = rows?.[0]?.data;
        if (!d) return [];
        if (d.chunkCount > 0) {
          let all = [];
          for (let i = 0; i < d.chunkCount; i++) {
            if (showBar) updateSyncProgress(`${label} (${i + 1}/${d.chunkCount})`, i, d.chunkCount, "正在拉取公共库分片...");
            const cr = await fetch(`${baseUrl}/rest/v1/medspire_saves?username=eq.${encodeURIComponent(rootKey + "__c_" + i)}&select=data`, { headers });
            if (!cr.ok) throw new Error(`分片 ${i + 1} HTTP ${cr.status}`);
            const crows = await cr.json();
            if (Array.isArray(crows?.[0]?.data?.items)) all = all.concat(crows[0].data.items);
          }
          if (showBar) finishSyncProgress(label, d.chunkCount);
          return all;
        }
        return Array.isArray(d[legacyField]) ? d[legacyField] : [];
      };

      const publishGlobalMedEng = async () => {

        } catch (e) { setSyncProgress(null); showToast("发布失败：" + (e?.message || "网络异常"), "error"); }
        finally { setCloudBusy(false); }
      };

      const pullGlobalMedEng = async () => {
        setCloudBusy(true);
        try {
          const remoteMe = await pullGlobalChunked("__global_medeng_v1__", "medEngCards", "医学英语公共词库 (同步)", true);
          if (!remoteMe || remoteMe.length === 0) {
            setSyncProgress(null);
            showToast("云端公共医学英语库暂无额外更新", "info");
          } else {
            setMedEngCards(prev => {
              const prevMap = new Map(prev.map(c => [c.id, c]));
              const merged = remoteMe.map(rc => prevMap.has(rc.id) ? { ...rc, fsrs: prevMap.get(rc.id).fsrs } : rc);
              const remoteIds = new Set(remoteMe.map(c => c.id));
              const localOnly = prev.filter(c => !remoteIds.has(c.id));

                                        const yIdx = parts.findIndex(x => /^20\d{2}$/.test(x));
                                        let sub = [];
                                        if (yIdx >= 0 && parts.length - yIdx >= 4) {
                                          sub = parts.slice(yIdx);
                                        } else {
                                          const qIdx = parts.findIndex(x => x.toLowerCase() === "qbank");
                                          sub = qIdx >= 0 ? parts.slice(qIdx + 1) : [];
                                        }
                                        if (sub.length < 4) continue;
                                        const [yr, rawStep, rawSys, ...rest] = sub;
                                        const step = rawStep.toLowerCase().includes("2") ? "Step 2" : "Step 1";
                                        const sysId = resolveCanonicalSystemId(rawSys, step);
                                        let cnt = 0;
                                        try {
                                          const txt = await f.text();
                                          const parsed = JSON.parse(txt);
                                          cnt = Array.isArray(parsed) ? parsed.length : (Array.isArray(parsed?.questions) ? parsed.questions.length : 0);
                                        } catch (err) {}
                                        if (!years[yr]) years[yr] = {};
                                        if (!years[yr][step]) years[yr][step] = {};
                                        if (!years[yr][step][sysId]) years[yr][step][sysId] = { files: [], count: 0 };
                                        years[yr][step][sysId].files.push(`qbank/${sub.join("/")}`);
                                        years[yr][step][sysId].count += cnt;
                                        totalFound += cnt;
                                      }

                                        const samplePath = files[0]?.webkitRelativePath || files[0]?.name || "";

                                      Object.values(years).forEach(stObj => Object.values(stObj).forEach(sysObj => Object.values(sysObj).forEach(v => v.files.sort())));

                                      const a = document.createElement("a");
                                      a.href = URL.createObjectURL(mfBlob);
                                      a.download = "manifest.json";
                                      a.click();
                                      showToast(`已成功扫描 ${Object.keys(years).length} 个年份共 ${totalFound} 道题，请用新 manifest.json 覆盖并推送！`, "success");

                    const cardStudyStart = getStudyDayStartMs(c.fsrs.due || nowMs);

                    if (diffDays <= 0) overdueCount++;
                    else if (diffDays <= statsForecastDays) forecastBins[diffDays]++;

                const maxForecast = Math.max(1, ...forecastBins);

                            <div className="grid grid-cols-4 gap-2 pt-3 text-center">
                              {[
                                ["Again 重来", btnCounts[0], "bg-rose-100 text-rose-800"],
                                ["Hard 困难", btnCounts[1], "bg-amber-100 text-amber-800"],
                                ["Good 良好", btnCounts[2], "bg-emerald-100 text-emerald-800"],

                                </div>
                              ))}
                            </div>
                          </div>

                      ) : (

                          <div className="text-xs font-bold text-blue-700">{currentFsrsCard.step} · {currentFsrsCard.system}</div>

                        }
                        if (editingAnkiCard.type === "io" || nums.length === 0) {
                          setAnkiCards(prev => prev.map(c => c.id === editingAnkiCard.id ? editingAnkiCard : c));
                          if (previewAnkiCard && previewAnkiCard.id === editingAnkiCard.id) setPreviewAnkiCard(editingAnkiCard);
                          setEditingAnkiCard(null);
                          showToast("Anki 卡片修改已保存！", "success");
                          return;
                        }
                        const existingCNums = new Set();
                        ankiCards.forEach(c => {
                          if (c.id === editingAnkiCard.id || (origTxt && c.type === "cloze" && c.text === origTxt)) {
                            existingCNums.add(c.activeCNum || 1);
                          }
                        });
                        const nowId = Date.now();
                        const spawned = nums.filter(n => !existingCNums.has(n)).map((n, idx) => ({
                          id: `ac-edit-${nowId}-c${n}-${idx}`,
                          type: "cloze",
                          step: editingAnkiCard.step,
                          system: editingAnkiCard.system,
                          text: rawTxt,
                          images: editingAnkiCard.images,
                          extra: editingAnkiCard.extra,
                          extraImages: editingAnkiCard.extraImages,
                          activeCNum: n,
                          suspended: false,
                          flag: 0,
                          fsrs: createInitialFSRS()
                        }));
                        setAnkiCards(prev => {
                          const updated = prev.map(c => {
                            if (c.id === editingAnkiCard.id || (origTxt && c.type === "cloze" && c.text === origTxt)) {
                              return {
                                ...c,
                                type: "cloze",
                                step: editingAnkiCard.step,
                                system: editingAnkiCard.system,
                                text: rawTxt,
                                images: editingAnkiCard.images,
                                extra: editingAnkiCard.extra,
                                extraImages: editingAnkiCard.extraImages,
                                activeCNum: c.activeCNum || 1
                              };
                            }
                            return c;
                          });
                          return [...spawned, ...updated];
                        });
                        if (previewAnkiCard && previewAnkiCard.id === editingAnkiCard.id) setPreviewAnkiCard({ ...editingAnkiCard, type: "cloze" });
                        setEditingAnkiCard(null);
                        showToast(spawned.length > 0 ? `已保存修改，并自动新生成 ${spawned.map(s => "#c"+s.activeCNum).join("/")} 共 ${spawned.length} 张卡片！` : "Anki 卡片修改已保存（已同步同笔记所有卡片）！", "success");
                      }} className="px-5 py-2 rounded-lg bg-indigo-700 hover:bg-indigo-600 text-white font-bold">保存修改</button>
                    </div>
                  </div>
                </div>
              )}

              {/* MODAL: EDIT MEDENG CARD */}
              {editingMedEngCard && (
                <div className="fixed inset-0 z-[70] bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                  <div className="w-full max-w-xl bg-white rounded-2xl shadow-2xl flex flex-col max-h-[90vh] overflow-hidden">
                    <div className="px-5 py-4 bg-teal-900 text-white flex justify-between items-center">
                      <h3 className="font-bold text-base">✏️ 编辑医学英语卡片</h3>
                      <button onClick={() => setEditingMedEngCard(null)}><Icon name="x" className="w-5 h-5" /></button>
                    </div>
                    <div className="p-5 overflow-y-auto space-y-3 text-xs">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <select value={editingMedEngCard.system || MEDENG_SYSTEMS[0].id} onChange={(e) => setEditingMedEngCard(p => ({ ...p, system: e.target.value }))} className="border rounded-lg px-3 py-2 font-semibold bg-white">
                          {MEDENG_SYSTEMS.map(s => <option key={s.id} value={s.id}>{s.id}</option>)}
                        </select>
                        <select value={editingMedEngCard.category || "Word Parts"} onChange={(e) => setEditingMedEngCard(p => ({ ...p, category: e.target.value }))} className="border rounded-lg px-3 py-2 font-semibold bg-white">
                          {MEDENG_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">正面内容 (Front)</label>
                        <input type="text" value={editingMedEngCard.front || ""} onChange={(e) => setEditingMedEngCard(p => ({ ...p, front: e.target.value }))} className="w-full border rounded-xl px-3 py-2 text-sm font-bold" />
                      </div>
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">提示语 (Front Hint)</label>
                        <input type="text" value={editingMedEngCard.frontHint || ""} onChange={(e) => setEditingMedEngCard(p => ({ ...p, frontHint: e.target.value }))} className="w-full border rounded-xl px-3 py-2" />
                      </div>
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">反面答案 / 释义 (Back)</label>
                        <textarea rows={3} value={editingMedEngCard.back || ""} onChange={(e) => setEditingMedEngCard(p => ({ ...p, back: e.target.value }))} className="w-full border rounded-xl px-3 py-2 text-sm" />
                      </div>
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">出处 / 助记备注 (Note)</label>
                        <input type="text" value={editingMedEngCard.note || ""} onChange={(e) => setEditingMedEngCard(p => ({ ...p, note: e.target.value }))} className="w-full border rounded-xl px-3 py-2" />
                      </div>
                    </div>
                    <div className="px-5 py-3 border-t bg-slate-50 flex justify-end gap-2 text-xs">
                      <button onClick={() => setEditingMedEngCard(null)} className="px-4 py-2 rounded-lg bg-white border font-bold">取消</button>
                      <button onClick={() => {
                        setMedEngCards(prev => prev.map(c => c.id === editingMedEngCard.id ? { ...editingMedEngCard, _edited: true } : c));
                        setMedEngMistakes(prev => prev.map(m => m.id === editingMedEngCard.id ? editingMedEngCard : m));
                        setEditingMedEngCard(null);
                        showToast("医学英语卡片修改已保存！", "success");
                      }} className="px-5 py-2 rounded-lg bg-teal-700 hover:bg-teal-600 text-white font-bold">保存修改</button>
                    </div>
                  </div>
                </div>
              )}

              {showAuthModal && (
                <div className="fixed inset-0 z-50 bg-slate-950/70 flex items-center justify-center p-4">
                  <div className="w-full max-w-md bg-white rounded-2xl p-5 space-y-4 text-xs">
                    <div className="flex justify-between font-bold text-base"><span>账号与云端同步</span><button onClick={() => setShowAuthModal(false)}><Icon name="x" className="w-5 h-5" /></button></div>
                    <div className="p-3 bg-slate-50 rounded-xl border flex justify-between items-center">
                      <span>当前账号: <strong>{currentUser}</strong></span>
                      <button onClick={() => { manualLogoutRef.current = true; switchToUser("guest"); setShowAuthModal(false); }} className="text-rose-600 font-bold">退出登录</button>
                    </div>
                    {isAdmin && (
                      <div className="space-y-2">
                        <input type="text" value={cloudCfg.url} onChange={(e) => setCloudCfg(c => ({ ...c, url: e.target.value }))} className="w-full border rounded px-2.5 py-1.5 font-mono" />
                        <input type="password" value={cloudCfg.anonKey} onChange={(e) => setCloudCfg(c => ({ ...c, anonKey: e.target.value }))} className="w-full border rounded px-2.5 py-1.5 font-mono" />
                      </div>
                    )}
                    <div className="flex gap-2">
                      <button disabled={cloudBusy} onClick={() => syncToSupabase("push")} className="flex-1 py-2.5 rounded-xl bg-blue-700 text-white font-bold">上传全部存档至云端</button>
                      <button disabled={cloudBusy} onClick={() => syncToSupabase("pull")} className="flex-1 py-2.5 rounded-xl bg-emerald-600 text-white font-bold">从云端拉取</button>
                    </div>
                    <div className="pt-2 border-t flex gap-2">
                      <button onClick={() => {
                        const backup = {
                          exportedAt: new Date().toISOString(),
                          user: currentUser,
                          questions, mistakes, ankiCards, medEngCards, medEngMistakes, medEngRevLog, ankiRevLog,
                          attemptedMap, markedIds, notesMap, highlightsMap, dailyLogs, vocabBook, examGoal
                        };
                        const blob = new Blob([JSON.stringify(backup)], { type: "application/json" });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement("a");
                        a.href = url;
                        a.download = `medspire-backup-${new Date().toISOString().slice(0, 10)}.json`;
                        a.click();
                        URL.revokeObjectURL(url);
                        showToast("已导出全量本地备份 JSON！", "success");
                      }} className="flex-1 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold border">📥 导出本地全量备份</button>
                      <label className="flex-1 py-2 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-800 font-bold border border-amber-300 text-center cursor-pointer">
                        📤 从备份恢复
                        <input type="file" accept=".json" className="hidden" onChange={(e) => {
                          const f = e.target.files?.[0];
                          if (!f) return;
                          const reader = new FileReader();
                          reader.onload = (ev) => {
                            try {
                              const d = JSON.parse(String(ev.target?.result || "{}"));
                              if (!confirm(`确定从备份 (${d.exportedAt || "未知时间"}) 恢复全量数据？将覆盖当前本地进度。`)) return;
                              if (Array.isArray(d.questions)) setQuestions(d.questions);
                              if (Array.isArray(d.mistakes)) setMistakes(d.mistakes);
                              if (Array.isArray(d.ankiCards)) setAnkiCards(normalizeAnkiClozeActiveNum(d.ankiCards));
                              if (Array.isArray(d.medEngCards)) setMedEngCards(d.medEngCards);
                              if (Array.isArray(d.medEngMistakes)) setMedEngMistakes(d.medEngMistakes);
                              if (Array.isArray(d.medEngRevLog)) setMedEngRevLog(d.medEngRevLog);
                              if (Array.isArray(d.ankiRevLog)) setAnkiRevLog(d.ankiRevLog);
                              if (d.attemptedMap) setAttemptedMap(d.attemptedMap);
                              if (Array.isArray(d.markedIds)) setMarkedIds(d.markedIds);
                              if (d.notesMap) setNotesMap(d.notesMap);
                              if (d.highlightsMap) setHighlightsMap(d.highlightsMap);
                              if (d.dailyLogs) setDailyLogs(d.dailyLogs);
                              if (Array.isArray(d.vocabBook)) setVocabBook(d.vocabBook);
                              if (d.examGoal) setExamGoal(d.examGoal);
                              showToast("已从本地备份完整恢复全部数据！", "success");
                            } catch { showToast("备份文件格式无效", "error"); }
                          };
                          reader.readAsText(f);
                          e.target.value = "";
                        }} />
                      </label>
                    </div>
                  </div>
                </div>
              )}
            </>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
