    // =========================================================================
    // 3. FSRS SPACED REPETITION ENGINE (Anki FSRS Exponential / Power-Law)
    // =========================================================================
    const FSRS_DEFAULTS = {
      w: [0.4, 0.6, 2.4, 5.8, 4.93, 0.94, 0.86, 0.01, 1.49, 0.14, 0.94, 2.18, 0.05, 0.34, 1.26, 0.29, 2.61],
      DECAY: -0.5,
      FACTOR: 19 / 81
    };

    function createInitialFSRS(nowMs = Date.now()) {
      return {
        state: "New", // New | Learning | Review | Relearning
        stability: 0.4,
        difficulty: 5.0,
        elapsedDays: 0,
        scheduledDays: 0,
        reps: 0,
        lapses: 0,
        lastReview: nowMs,
        due: nowMs // Due immediately when first added to mistake notebook
      };
    }

    function fsrsRetrievability(elapsedDays, stability) {
      if (stability <= 0) return 0;
      return Math.pow(1 + FSRS_DEFAULTS.FACTOR * (Math.max(0, elapsedDays) / stability), FSRS_DEFAULTS.DECAY);
    }

    function fsrsNextIntervalDays(stability, targetRetention = 0.90) {
      const r = Math.min(0.98, Math.max(0.70, targetRetention));
      const ivl = (stability / FSRS_DEFAULTS.FACTOR) * (Math.pow(r, 1 / FSRS_DEFAULTS.DECAY) - 1);
      return Math.max(1, Math.round(ivl));
    }

    // Grade: 1=Again, 2=Hard, 3=Good, 4=Easy
    function fsrsSchedule(cardFsrs, grade, targetRetention = 0.90, nowMs = Date.now()) {
      const w = FSRS_DEFAULTS.w;
      const f = cardFsrs || createInitialFSRS(nowMs);
      const elapsedDays = f.lastReview ? Math.max(0, (nowMs - f.lastReview) / 86400000) : 0;
      const clampD = (d) => Math.min(10, Math.max(1, d));

      let nextS = f.stability;
      let nextD = f.difficulty;
      let nextState = f.state;
      let nextLapses = f.lapses || 0;
      let nextDays = 1;
      let dueMs = nowMs;

      if (f.reps === 0 || f.state === "New") {
        nextD = clampD(w[4] - Math.exp(w[5] * (grade - 1)) + 1);
        nextS = Math.max(0.1, w[grade - 1]);
        if (grade === 1) {
          nextState = "Learning";
          nextDays = 0;
          dueMs = nowMs + 10 * 60 * 1000; // 10 min
        } else if (grade === 2) {
          nextState = "Learning";
          nextDays = 0.5;
          dueMs = nowMs + 12 * 3600 * 1000; // 12 hours
        } else {
          nextState = "Review";
          nextDays = fsrsNextIntervalDays(nextS, targetRetention);
          dueMs = nowMs + nextDays * 86400000;
        }
      } else {
        const R = fsrsRetrievability(elapsedDays, f.stability);
        nextD = clampD(f.difficulty - w[6] * (grade - 3));
        nextD = clampD(w[7] * w[4] + (1 - w[7]) * nextD);

        if (grade === 1) {
          nextLapses += 1;
          nextState = "Relearning";
          nextS = Math.max(0.2, w[11] * Math.pow(nextD, -w[12]) * (Math.pow(f.stability + 1, w[13]) - 1) * Math.exp(w[14] * (1 - R)));
          nextDays = 0;
          dueMs = nowMs + 10 * 60 * 1000; // 10 min
        } else {
          const hardPenalty = grade === 2 ? w[15] : 1;
          const easyBonus = grade === 4 ? w[16] : 1;
          nextS = f.stability * (1 + Math.exp(w[8]) * (11 - nextD) * Math.pow(f.stability, -w[9]) * (Math.exp(w[10] * (1 - R)) - 1) * hardPenalty * easyBonus);
          nextState = "Review";
          nextDays = fsrsNextIntervalDays(nextS, targetRetention);
          dueMs = nowMs + nextDays * 86400000;
        }
      }

      return {
        state: nextState,
        stability: Number(nextS.toFixed(2)),
        difficulty: Number(nextD.toFixed(2)),
        elapsedDays: Number(elapsedDays.toFixed(2)),
        scheduledDays: nextDays,
        reps: (f.reps || 0) + 1,
        lapses: nextLapses,
        lastReview: nowMs,
        due: dueMs
      };
    }

      const [qmTab, setQmTab] = useState("json"); // json | manual | pdf | browse
      const [importJsonText, setImportJsonText] = useState("");
      const [jsonImportStep, setJsonImportStep] = useState("Step 1");
      const [jsonImportSystem, setJsonImportSystem] = useState(UWORLD_SYSTEMS[0].id);
      const [jsonForceDeck, setJsonForceDeck] = useState(false);
      const [qmStepFilter, setQmStepFilter] = useState("ALL");
      const [qmSysFilter, setQmSysFilter] = useState("ALL");

      // Manual Editor State (Supports Ctrl+V image paste!)
      const [manStep, setManStep] = useState("Step 1");
      const [manSystem, setManSystem] = useState(UWORLD_SYSTEMS[0].id);
      const [manStem, setManStem] = useState("");
      const [manVignetteImg, setManVignetteImg] = useState("");
      const [manOpts, setManOpts] = useState({ A: "", B: "", C: "", D: "", E: "" });
      const [manAns, setManAns] = useState("A");
      const [manExps, setManExps] = useState({ A: "", B: "", C: "", D: "", E: "" });
      const [manGenExp, setManGenExp] = useState("");
      const [manExpImgs, setManExpImgs] = useState([]);
      const [manEO, setManEO] = useState("");

      // Optional AI PDF State
      const [pdfFile, setPdfFile] = useState(null);
      const [pdfPageRange, setPdfPageRange] = useState("1-12");
      const [pdfStep, setPdfStep] = useState("Step 1");
      const [pdfSystem, setPdfSystem] = useState(UWORLD_SYSTEMS[0].id);
      const [pdfProgress, setPdfProgress] = useState("");
      const [pdfBusy, setPdfBusy] = useState(false);

      // FSRS Mistake Notebook State
      const [showMistakeModal, setShowMistakeModal] = useState(false);
      const [mistakeTab, setMistakeTab] = useState("fsrs"); // fsrs | all
      const [mistakeStepFilter, setMistakeStepFilter] = useState("ALL");
      const [fsrsRevealed, setFsrsRevealed] = useState(false);
      const [fsrsChosen, setFsrsChosen] = useState(null);

      // Create Test Controls
      const [activeStep, setActiveStep] = useState("Step 1"); // Step 1 | Step 2
      const [testMode, setTestMode] = useState("Tutor"); // Tutor | Timed
      const [qFilterMode, setQFilterMode] = useState("All"); // All | Unused | Incorrect | Marked
      const [selectedSystems, setSelectedSystems] = useState(() => UWORLD_SYSTEMS.map(s => s.id));
      const [questionCount, setQuestionCount] = useState(10);

      // Active Block State
      const [activeBlock, setActiveBlock] = useState(null);
      const [darkMode, setDarkMode] = useState(false);
      const [textSize, setTextSize] = useState(1);
      const [highlightMode, setHighlightMode] = useState(false);
      const [showLabModal, setShowLabModal] = useState(false);
      const [showNotesModal, setShowNotesModal] = useState(false);
      const [expandedExpOpt, setExpandedExpOpt] = useState(null);
      const [zoomImage, setZoomImage] = useState(null);
      const stemRef = useRef(null);

      const showToast = useCallback((msg, type = "info") => setToast({ msg, type, id: Date.now() }), []);
      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 2800);
        return () => clearTimeout(t);
      }, [toast]);

      // Auto-pull global hot-updated questions from Supabase on startup
      useEffect(() => {
        if (!cloudCfg.url || !cloudCfg.anonKey) return;
        const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
        (async () => {
          try {
            const res = await fetch(`${baseUrl}/rest/v1/medspire_saves?username=eq.__global_questions_v2__&select=data`, {
              headers: { "apikey": cloudCfg.anonKey, "Authorization": "Bearer " + cloudCfg.anonKey }
            });
            if (!res.ok) return;
            const rows = await res.json();
            const remoteQs = rows?.[0]?.data?.questions;
            if (Array.isArray(remoteQs) && remoteQs.length > 0) {
              setQuestions(prev => {
                const remoteMap = new Map(remoteQs.filter(q => q && q.id).map(q => [q.id, q]));
                const prevIds = new Set(prev.map(q => q.id));
                const addedCount = remoteQs.filter(q => q && q.id && !prevIds.has(q.id)).length;
                const updatedPrev = prev.map(q => remoteMap.has(q.id) ? remoteMap.get(q.id) : q);
                const newItems = remoteQs.filter(q => q && q.id && !prevIds.has(q.id));
                if (addedCount > 0) {
                  showToast(`已从云端公共库同步 +${addedCount} 道新题！`, "success");
                }
                return [...newItems, ...updatedPrev];
              });
            }
          } catch (e) {}
        })();
      }, []);

      // Timer & Auto-save activeBlock
      useEffect(() => {
        if (view !== "TEST" || !activeBlock) return;
        const timer = setInterval(() => {
          setActiveBlock(prev => {
            if (!prev) return prev;
            const next = { ...prev, elapsedSec: (prev.elapsedSec || 0) + 1 };
            safeSetStorage(getUserKey(currentUser, "activeBlock"), next);
            setSavedBlock(next);
            return next;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [view, activeBlock?.id, currentUser]);

      useEffect(() => {
        if (view === "TEST" && activeBlock) {
          safeSetStorage(getUserKey(currentUser, "activeBlock"), activeBlock);
          setSavedBlock(activeBlock);
        }
      }, [activeBlock, view, currentUser]);

      // FSRS Due Cards calculation
      const dueMistakes = useMemo(() => {
        const now = Date.now();
        return mistakes
          .filter(m => (!m.fsrs || (m.fsrs.due || 0) <= now))
          .sort((a, b) => (a.fsrs?.due || 0) - (b.fsrs?.due || 0));
      }, [mistakes]);

      const currentFsrsCard = dueMistakes[0] || null;

      // Eligible questions for Step 1 / Step 2 Create Test
      const eligibleQuestions = useMemo(() => {
        return questions.filter(q => {
          if ((q.step || "Step 1") !== activeStep) return false;
          if (!selectedSystems.includes(q.system)) return false;
          if (qFilterMode === "Unused") return !attemptedMap[q.id];
          if (qFilterMode === "Incorrect") return mistakes.some(m => m.id === q.id) || (attemptedMap[q.id] && !attemptedMap[q.id].lastCorrect);
          if (qFilterMode === "Marked") return markedIds.includes(q.id);
          return true;
        });
      }, [questions, activeStep, selectedSystems, qFilterMode, attemptedMap, mistakes, markedIds]);

      const startTestBlock = (customIds = null, customTitle = null) => {
        const pool = customIds ? questions.filter(q => customIds.includes(q.id)) : eligibleQuestions;
        if (pool.length === 0) {
          showToast("当前板块与筛选条件下暂无题目，请先导入原版题目！", "error");
          return;
        }
        const shuffled = [...pool].sort(() => Math.random() - 0.5);
        const picked = customIds ? shuffled : shuffled.slice(0, Math.min(questionCount, shuffled.length));
        const block = {
          id: `blk-${Date.now()}`,
          step: activeStep,
          mode: testMode,
          sectionTitle: customTitle || `${activeStep} · ${testMode} · ${qFilterMode}`,
          qIds: picked.map(q => q.id),
          currentIndex: 0,
          answers: {},
          submitted: {},
          struck: {},
          elapsedSec: 0,
          startedAt: new Date().toLocaleString("zh-CN", { hour12: false })
        };
        setActiveBlock(block);
        setExpandedExpOpt(null);
        setView("TEST");
      };

      const resumeSavedBlock = () => {
        if (!savedBlock) return;
        setActiveBlock(savedBlock);
        setView("TEST");
        showToast("已恢复上次做题进度！", "success");
      };

      const currentQuestion = useMemo(() => {
        if (!activeBlock) return null;
        return questions.find(q => q.id === activeBlock.qIds[activeBlock.currentIndex]) || null;
      }, [activeBlock, questions]);

      const recordAnswerResult = (q, chosen) => {
        const isCorrect = chosen === q.answer;
        setAttemptedMap(prev => ({
          ...prev,
          [q.id]: { lastCorrect: isCorrect, count: (prev[q.id]?.count || 0) + 1 }
        }));
        if (!isCorrect) {
          const nowMs = Date.now();
          const exactTime = new Date(nowMs).toLocaleString("zh-CN", { hour12: false });
          const sectionLabel = `${q.step || "Step 1"} · ${q.system}`;
          setMistakes(prev => {
            const existing = prev.find(m => m.id === q.id);
            const rec = {
              ...q,
              wrongChoice: chosen,
              timestamp: exactTime,
              sectionLabel,
              wrongCount: existing ? (existing.wrongCount || 1) + 1 : 1,
              fsrs: existing?.fsrs ? fsrsSchedule(existing.fsrs, 1, targetRetention, nowMs) : createInitialFSRS(nowMs)
            };
            return [rec, ...prev.filter(m => m.id !== q.id)];
          });
        }
      };

      const handleSubmitQuestion = () => {
        if (!activeBlock || !currentQuestion) return;
        const chosen = activeBlock.answers[currentQuestion.id];
        if (!chosen) { showToast("请先选择一个选项再提交", "error"); return; }
        recordAnswerResult(currentQuestion, chosen);
        setActiveBlock(prev => ({ ...prev, submitted: { ...prev.submitted, [currentQuestion.id]: true } }));
        setExpandedExpOpt(currentQuestion.answer);
      };

      const handleEndBlock = () => {
        if (!activeBlock) return;
        const newSubmitted = { ...activeBlock.submitted };
        let correctCount = 0;
        activeBlock.qIds.forEach(qid => {
          const q = questions.find(item => item.id === qid);
          const chosen = activeBlock.answers[qid];
          if (q && chosen) {
            if (!newSubmitted[qid]) {
              recordAnswerResult(q, chosen);
              newSubmitted[qid] = true;
            }
            if (chosen === q.answer) correctCount++;
          }
        });
        const finished = { ...activeBlock, submitted: newSubmitted, correctCount, endedAt: new Date().toLocaleString("zh-CN", { hour12: false }) };
        setActiveBlock(finished);
        setBlockHistory(prev => [{ id: finished.id, title: finished.sectionTitle, total: finished.qIds.length, correct: correctCount, date: finished.endedAt }, ...prev.slice(0, 14)]);
        safeSetStorage(getUserKey(currentUser, "activeBlock"), null);
        setSavedBlock(null);
        setView("SUMMARY");
      };

      const handleHighlightSelection = (qid) => {
        const sel = window.getSelection();
        const text = sel ? sel.toString().trim() : "";
        if (!text || text.length < 2) return;
        setHighlightsMap(prev => {
          const cur = prev[qid] || [];
          if (cur.includes(text)) return prev;
          return { ...prev, [qid]: [...cur, text] };
        });
        if (sel.removeAllRanges) sel.removeAllRanges();
        showToast("已高亮划线", "info");
      };

      const handleFsrsRate = (grade) => {
        if (!currentFsrsCard) return;
        const nowMs = Date.now();
        const nextFsrs = fsrsSchedule(currentFsrsCard.fsrs, grade, targetRetention, nowMs);
        const ivlText = formatFsrsInterval(nextFsrs, nowMs);
        setMistakes(prev => prev.map(m => m.id === currentFsrsCard.id ? { ...m, fsrs: nextFsrs } : m));
        setFsrsRevealed(false);
        setFsrsChosen(null);
        showToast(`FSRS 已调度：下次复习在 ${ivlText} 后`, "success");
      };

      const formatTime = (sec) => {
        const m = Math.floor((sec || 0) / 60).toString().padStart(2, "0");
        const s = ((sec || 0) % 60).toString().padStart(2, "0");
        return `${m}:${s}`;
      };

      // Paste image handler for Manual Question Editor
      const handlePasteImage = (e, targetType) => {
        const items = e.clipboardData?.items;
        if (!items) return;
        for (let i = 0; i < items.length; i++) {
          if (items[i].type.indexOf("image") !== -1) {
            e.preventDefault();
            const file = items[i].getAsFile();
            const reader = new FileReader();
            reader.onload = (ev) => {
              const dataUrl = ev.target.result;
              if (targetType === "vignette") setManVignetteImg(dataUrl);
              else setManExpImgs(prev => [...prev, dataUrl]);
              showToast("已粘贴图片！", "success");
            };
            reader.readAsDataURL(file);
            break;
          }
        }
      };

      const handleSaveManualQuestion = () => {
        if (!isAdmin) { showToast("仅管理员账号可上传题库", "error"); return; }
        if (!manStem.trim() || !manOpts.A.trim() || !manOpts.B.trim()) {
          showToast("请至少填写题干与 A/B 选项", "error");
          return;
        }
        const cleanOpts = {};
        const cleanExps = {};
        Object.entries(manOpts).forEach(([k, v]) => {
          if (v.trim()) {
            cleanOpts[k] = v.trim();
            if (manExps[k]?.trim()) cleanExps[k] = manExps[k].trim();
          }
        });
        const newQ = {
          id: `q-man-${Date.now()}`,
          step: manStep,
          system: manSystem,
          difficulty: "Medium",
          stem: manStem.trim(),
          vignetteImage: manVignetteImg || undefined,
          options: cleanOpts,
          answer: manAns,
          explanations: cleanExps,
          generalExplanation: manGenExp.trim() || undefined,
          explanationImages: manExpImgs.length > 0 ? manExpImgs : undefined,
          educationalObjective: manEO.trim() || ""
        };
        setQuestions(prev => [newQ, ...prev]);
        setManStem(""); setManVignetteImg("");
        setManOpts({ A: "", B: "", C: "", D: "", E: "" });
        setManExps({ A: "", B: "", C: "", D: "", E: "" });
        setManGenExp(""); setManExpImgs([]); setManEO("");
        showToast("原版题目已保存入库！", "success");
      };

      const handleImportJson = (rawOverride = null) => {
        if (!isAdmin) { showToast("仅管理员账号可上传题库", "error"); return; }
        try {
          const raw = typeof rawOverride === "string" ? rawOverride : importJsonText;
          const parsed = JSON.parse(raw.trim());
          const arr = Array.isArray(parsed) ? parsed : [parsed];
          const valid = arr.filter(q => q && q.stem && q.options && q.answer).map((q, idx) => ({
            id: q.id || `q-json-${Date.now()}-${idx}`,
            step: (!jsonForceDeck && STEPS.includes(q.step)) ? q.step : jsonImportStep,
            system: (!jsonForceDeck && UWORLD_SYSTEMS.some(s => s.id === q.system)) ? q.system : jsonImportSystem,
            difficulty: ["Easy", "Medium", "Hard"].includes(q.difficulty) ? q.difficulty : "Medium",
            stem: String(q.stem).trim(),
            vignetteImage: q.vignetteImage || undefined,
            options: q.options,
            answer: String(q.answer).trim().toUpperCase().charAt(0),
            explanations: q.explanations || {},
            generalExplanation: q.generalExplanation || undefined,
            explanationImages: Array.isArray(q.explanationImages) ? q.explanationImages : undefined,
            educationalObjective: q.educationalObjective || ""
          }));
          if (valid.length === 0) { showToast("JSON 中没有有效题目", "error"); return; }
          setQuestions(prev => [...valid, ...prev]);
          setImportJsonText("");
          showToast(`成功导入 ${valid.length} 题至 ${jsonImportStep} · ${jsonImportSystem}！`, "success");
          setQmTab("browse");
        } catch (e) {
          showToast("JSON 格式错误，请检查括号与引号", "error");
        }
      };

      // Account & Cloud Sync
      const switchToUser = (uname) => {
        setCurrentUser(uname);
        setQuestions(safeGetStorage(uname === "guest" ? STORAGE_KEYS.QUESTIONS : getUserKey(uname, "questions"), INITIAL_QUESTIONS));
        setMistakes(safeGetStorage(uname === "guest" ? STORAGE_KEYS.MISTAKES : getUserKey(uname, "mistakes"), []));
        setAttemptedMap(safeGetStorage(getUserKey(uname, "attempted"), {}));
        setMarkedIds(safeGetStorage(getUserKey(uname, "marked"), []));
        setNotesMap(safeGetStorage(getUserKey(uname, "notes"), {}));
        setHighlightsMap(safeGetStorage(getUserKey(uname, "highlights"), {}));
        setBlockHistory(safeGetStorage(getUserKey(uname, "blocks"), []));
        setSavedBlock(safeGetStorage(getUserKey(uname, "activeBlock"), null));
        setView("DASHBOARD");
      };

      const sendEmailOtp = async (mode) => {
        if (otpCooldown > 0) return;
        const email = authEmail.trim();
        if (!email || !email.includes("@")) { showToast("请输入有效的邮箱地址", "error"); return; }
        if (mode === "register" && authPassword.length < 6) { showToast("Supabase 要求密码至少 6 位", "error"); return; }
        setAuthBusy(true);
        try {
          const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
          const headers = { "apikey": cloudCfg.anonKey, "Content-Type": "application/json" };
          if (mode === "register") {
            const res = await fetch(`${baseUrl}/auth/v1/signup`, {
              method: "POST", headers, body: JSON.stringify({ email, password: authPassword })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.msg || data.error_description || data.message || ("HTTP " + res.status));
            setOtpSent(true);
            setOtpCooldown(60);
            showToast("注册验证码已发送至邮箱，请查收！", "success");
          } else {
            const res = await fetch(`${baseUrl}/auth/v1/recover`, {
              method: "POST", headers, body: JSON.stringify({ email })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.msg || data.error_description || data.message || ("HTTP " + res.status));
            setOtpSent(true);
            setOtpCooldown(60);
            showToast("重置验证码已发送至邮箱，请查收！", "success");
          }
        } catch (err) {
          showToast("发送失败：" + (err.message || "请检查邮箱或发信限额"), "error");
        } finally {
          setAuthBusy(false);
        }
      };

      const handleAuthSubmit = async () => {
        const email = authEmail.trim();
        if (!email || !email.includes("@")) { showToast("请输入有效的邮箱地址", "error"); return; }
        const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
        const headers = { "apikey": cloudCfg.anonKey, "Content-Type": "application/json" };
        setAuthBusy(true);
        try {
          if (authMode === "login") {
            if (authPassword.length < 6) throw new Error("密码至少 6 位");
            const res = await fetch(`${baseUrl}/auth/v1/token?grant_type=password`, {
              method: "POST", headers, body: JSON.stringify({ email, password: authPassword })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error_description || data.msg || "邮箱或密码错误");
            const loggedEmail = data.user?.email || email;
            switchToUser(loggedEmail);
            setShowAuthModal(false); setAuthPassword("");
            showToast(`登录成功！欢迎 ${loggedEmail}`, "success");
          } else if (authMode === "register") {
            if (!authOtp.trim()) throw new Error("请先获取并输入邮箱验证码");
            const res = await fetch(`${baseUrl}/auth/v1/verify`, {
              method: "POST", headers, body: JSON.stringify({ type: "signup", email, token: authOtp.trim() })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error_description || data.msg || "验证码错误或已过期");
            const loggedEmail = data.user?.email || email;
            safeSetStorage(getUserKey(loggedEmail, "questions"), questions);
            switchToUser(loggedEmail);
            setShowAuthModal(false); setAuthPassword(""); setAuthOtp(""); setOtpSent(false);
            showToast(`邮箱验证成功！欢迎 ${loggedEmail}`, "success");
          } else if (authMode === "reset") {
            if (!authOtp.trim() || newResetPassword.length < 6) throw new Error("请输入邮箱验证码与至少 6 位新密码");
            const vRes = await fetch(`${baseUrl}/auth/v1/verify`, {
              method: "POST", headers, body: JSON.stringify({ type: "recovery", email, token: authOtp.trim() })
            });
            const vData = await vRes.json();
            if (!vRes.ok || !vData.access_token) throw new Error(vData.error_description || vData.msg || "验证码无效或已过期");
            const uRes = await fetch(`${baseUrl}/auth/v1/user`, {
              method: "PUT",
              headers: { "apikey": cloudCfg.anonKey, "Authorization": "Bearer " + vData.access_token, "Content-Type": "application/json" },
              body: JSON.stringify({ password: newResetPassword })
            });
            if (!uRes.ok) throw new Error("新密码更新失败");
            switchToUser(email);
            setShowAuthModal(false); setAuthOtp(""); setNewResetPassword(""); setOtpSent(false); setAuthMode("login");
            showToast("密码重置成功并已自动登录！", "success");
          }
        } catch (err) {
          showToast(err.message || "操作失败", "error");
        } finally {
          setAuthBusy(false);
        }
      };

      const syncToSupabase = async (direction) => {
        if (!cloudCfg.url || !cloudCfg.anonKey) { showToast("请先配置 Supabase", "error"); return; }
        if (currentUser === "guest") { showToast("请先登录个人账号再云同步", "error"); return; }
        setCloudBusy(true);
        try {
          const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
          const headers = {
            "apikey": cloudCfg.anonKey,
            "Authorization": "Bearer " + cloudCfg.anonKey,
            "Content-Type": "application/json",
            "Prefer": "resolution=merge-duplicates"
          };
          if (direction === "push") {
            const payload = {
              username: currentUser,
              data: { questions, mistakes, attemptedMap, markedIds, notesMap, highlightsMap, blockHistory, activeBlock: savedBlock, updatedAt: new Date().toISOString() }
            };
            const res = await fetch(`${baseUrl}/rest/v1/medspire_saves`, { method: "POST", headers, body: JSON.stringify(payload) });
            if (!res.ok) throw new Error("HTTP " + res.status);
            showToast("全部题库、FSRS 错题、高亮划线与进度已上传云端！", "success");
          } else {
            const res = await fetch(`${baseUrl}/rest/v1/medspire_saves?username=eq.${encodeURIComponent(currentUser)}&select=data`, { headers });
            if (!res.ok) throw new Error("HTTP " + res.status);
            const rows = await res.json();
            if (!rows || rows.length === 0) { showToast("云端暂无该账号存档", "info"); }
            else {
              const d = rows[0].data;
              if (Array.isArray(d.questions)) setQuestions(d.questions);
              if (Array.isArray(d.mistakes)) setMistakes(d.mistakes);
              if (d.attemptedMap) setAttemptedMap(d.attemptedMap);
              if (Array.isArray(d.markedIds)) setMarkedIds(d.markedIds);
              if (d.notesMap) setNotesMap(d.notesMap);
              if (d.highlightsMap) setHighlightsMap(d.highlightsMap);
              if (Array.isArray(d.blockHistory)) setBlockHistory(d.blockHistory);
              if (d.activeBlock) {
                safeSetStorage(getUserKey(currentUser, "activeBlock"), d.activeBlock);
                setSavedBlock(d.activeBlock);
              }
              showToast("已从云端拉取最新刷题数据！", "success");
            }
          }
        } catch (err) {
          showToast("云同步失败：" + (err.message || "请检查网络"), "error");
        } finally {
          setCloudBusy(false);
        }
      };

      const pullGlobalQuestions = async () => {
        if (!cloudCfg.url || !cloudCfg.anonKey) return;
        setCloudBusy(true);
        try {
          const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
          const res = await fetch(`${baseUrl}/rest/v1/medspire_saves?username=eq.__global_questions_v2__&select=data`, {
            headers: { "apikey": cloudCfg.anonKey, "Authorization": "Bearer " + cloudCfg.anonKey }
          });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const rows = await res.json();
          const remoteQs = rows?.[0]?.data?.questions;
          if (!Array.isArray(remoteQs) || remoteQs.length === 0) {
            showToast("云端公共题库暂无题目", "info");
          } else {
            setQuestions(prev => {
              const remoteMap = new Map(remoteQs.filter(q => q && q.id).map(q => [q.id, q]));
              const prevIds = new Set(prev.map(q => q.id));
              const updatedPrev = prev.map(q => remoteMap.has(q.id) ? remoteMap.get(q.id) : q);
              const newItems = remoteQs.filter(q => q && q.id && !prevIds.has(q.id));
              return [...newItems, ...updatedPrev];
            });
            showToast(`已同步云端最新题库（共 ${remoteQs.length} 题）`, "success");
          }
        } catch (err) {
          showToast("同步失败，请检查网络", "error");
        } finally {
          setCloudBusy(false);
        }
      };

      const publishGlobalQuestions = async () => {
        if (!isAdmin) { showToast("仅管理员账号可发布公共题库", "error"); return; }
        if (!cloudCfg.url || !cloudCfg.anonKey) return;
        setCloudBusy(true);
        try {
          const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
          const res = await fetch(`${baseUrl}/rest/v1/medspire_saves`, {
            method: "POST",
            headers: {
              "apikey": cloudCfg.anonKey,
              "Authorization": "Bearer " + cloudCfg.anonKey,
              "Content-Type": "application/json",
              "Prefer": "resolution=merge-duplicates"
            },
            body: JSON.stringify({ username: "__global_questions_v2__", data: { questions, updatedAt: new Date().toISOString() } })
          });
          if (!res.ok) throw new Error("HTTP " + res.status);
          showToast(`已发布全部 ${questions.length} 题至全端公共库！`, "success");
        } catch (err) {
          showToast("发布失败，请检查网络", "error");
        } finally {
          setCloudBusy(false);
        }
      };

      const handlePdfAiImport = async () => {
        if (!isAdmin) { showToast("仅管理员账号可上传题库", "error"); return; }
        if (!pdfFile || !aiCfg.apiKey.trim() || !window.pdfjsLib) {
          showToast("请先选择 PDF 并填写 API Key", "error");
          return;
        }
        setPdfBusy(true);
        setPdfProgress("正在读取 PDF 页面...");
        try {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
          const pdf = await window.pdfjsLib.getDocument({ data: await pdfFile.arrayBuffer() }).promise;
          let startP = 1, endP = Math.min(pdf.numPages, 20);
          const m = pdfPageRange.trim().match(/^(\d+)\s*[-~]\s*(\d+)$/);
          if (m) { startP = Math.max(1, parseInt(m[1], 10)); endP = Math.min(pdf.numPages, parseInt(m[2], 10)); }
          const pageImages = [];
          for (let p = startP; p <= endP; p++) {
            setPdfProgress(`渲染第 ${p}/${endP} 页...`);
            const page = await pdf.getPage(p);
            const vp = page.getViewport({ scale: 1.5 });
            const canvas = document.createElement("canvas");
            canvas.width = vp.width; canvas.height = vp.height;
            await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
            const dataUrl = canvas.toDataURL("image/jpeg", 0.82);
            pageImages.push({ pageNum: p, dataUrl, base64: dataUrl.split(",")[1], width: canvas.width, height: canvas.height });
          }

          const cropPageImage = (pageObj, box) => {
            try {
              if (!pageObj || !Array.isArray(box) || box.length !== 4) return undefined;
              const [ymin, xmin, ymax, xmax] = box.map(Number);
              const sx = Math.max(0, (xmin / 1000) * pageObj.width);
              const sy = Math.max(0, (ymin / 1000) * pageObj.height);
              const sw = Math.max(40, ((xmax - xmin) / 1000) * pageObj.width);
              const sh = Math.max(40, ((ymax - ymin) / 1000) * pageObj.height);
              const img = new Image(); img.src = pageObj.dataUrl;
              const c = document.createElement("canvas");
              const scale = sw > 720 ? 720 / sw : 1;
              c.width = Math.round(sw * scale); c.height = Math.round(sh * scale);
              c.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
              return c.toDataURL("image/jpeg", 0.78);
            } catch (e) { return undefined; }
          };

          const allExtracted = [];
          const sysPrompt = `Extract ALL UWorld questions verbatim from these PDF pages as a strict JSON array:
[{"id":"q-uw-1","step":"${pdfStep}","system":"${pdfSystem}","difficulty":"Medium","stem":"VERBATIM stem","options":{"A":"..."},"answer":"A","explanations":{"A":"VERBATIM Choice A explanation"},"generalExplanation":"VERBATIM main disease/mechanism/treatment explanation","educationalObjective":"VERBATIM Educational Objective","imagePage":1,"cropBox":[ymin,xmin,ymax,xmax]}]
Output ONLY valid JSON array.`;

          for (let i = 0; i < pageImages.length; i += 4) {
            const batch = pageImages.slice(i, i + 4);
            setPdfProgress(`AI 视觉提取第 ${batch.map(b => b.pageNum).join(", ")} 页...`);
            let rawReply = "";
            if (aiCfg.provider === "gemini") {
              const parts = [{ text: sysPrompt }];
              batch.forEach(b => { parts.push({ text: `[Page ${b.pageNum}]` }); parts.push({ inline_data: { mime_type: "image/jpeg", data: b.base64 } }); });
              const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(aiCfg.model.trim() || "gemini-2.5-flash")}:generateContent?key=${encodeURIComponent(aiCfg.apiKey.trim())}`, {
                method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ contents: [{ parts }], generationConfig: { temperature: 0.1 } })
              });
              if (!res.ok) throw new Error("API HTTP " + res.status);
              rawReply = (await res.json())?.candidates?.[0]?.content?.parts?.[0]?.text || "";
            } else {
              const baseUrl = (aiCfg.baseUrl || "https://api.openai.com/v1").replace(/\/$/, "");
              const contentArr = [{ type: "text", text: sysPrompt }];
              batch.forEach(b => { contentArr.push({ type: "text", text: `[Page ${b.pageNum}]` }); contentArr.push({ type: "image_url", image_url: { url: b.dataUrl } }); });
              const res = await fetch(`${baseUrl}/chat/completions`, {
                method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + aiCfg.apiKey.trim() },
                body: JSON.stringify({ model: aiCfg.model.trim() || "gpt-4o-mini", messages: [{ role: "user", content: contentArr }], temperature: 0.1 })
              });
              if (!res.ok) throw new Error("API HTTP " + res.status);
              rawReply = (await res.json())?.choices?.[0]?.message?.content || "";
            }
            const arrMatch = rawReply.replace(/^```json\s*/i, "").replace(/```$/i, "").trim().match(/\[[\s\S]*\]/);
            if (arrMatch) {
              try {
                JSON.parse(arrMatch[0]).forEach((q, idx) => {
                  if (!q || !q.stem || !q.options || !q.answer) return;
                  const targetPage = q.imagePage ? pageImages.find(pg => pg.pageNum === Number(q.imagePage)) : null;
                  allExtracted.push({
                    id: q.id || `q-pdf-${Date.now()}-${i}-${idx}`,
                    step: STEPS.includes(q.step) ? q.step : pdfStep,
                    system: UWORLD_SYSTEMS.some(s => s.id === q.system) ? q.system : pdfSystem,
                    difficulty: "Medium",
                    stem: String(q.stem).trim(),
                    vignetteImage: (targetPage && q.cropBox) ? cropPageImage(targetPage, q.cropBox) : undefined,
                    options: q.options,
                    answer: String(q.answer).trim().toUpperCase().charAt(0),
                    explanations: q.explanations || {},
                    generalExplanation: q.generalExplanation || undefined,
                    educationalObjective: q.educationalObjective || ""
                  });
                });
              } catch (e) {}
            }
          }
          if (allExtracted.length > 0) {
            setQuestions(prev => [...allExtracted, ...prev]);
            setPdfProgress(`成功导入 ${allExtracted.length} 题！`);
            showToast(`导入 ${allExtracted.length} 题`, "success");
          } else {
            setPdfProgress("未识别到题目");
          }
        } catch (err) {
          setPdfProgress("出错：" + err.message);
        } finally {
          setPdfBusy(false);
        }
      };

      const stepQuestions = useMemo(() => questions.filter(q => (q.step || "Step 1") === activeStep), [questions, activeStep]);
      const stepAttempted = useMemo(() => stepQuestions.filter(q => attemptedMap[q.id]).length, [stepQuestions, attemptedMap]);
      const stepCorrect = useMemo(() => stepQuestions.filter(q => attemptedMap[q.id]?.lastCorrect).length, [stepQuestions, attemptedMap]);

      // =========================================================================
      // 6. RENDER
      // =========================================================================
      return (

              <div className="w-full max-w-md bg-white text-slate-900 rounded-2xl shadow-2xl p-6 sm:p-8 space-y-5">
                <div className="text-center space-y-2">
                  <div className="w-14 h-14 mx-auto rounded-2xl bg-blue-700 text-white flex items-center justify-center font-black text-xl shadow-lg">UW</div>
                  <h1 className="text-xl font-extrabold text-slate-900">UWorld 个人临床题库系统</h1>
                  <p className="text-xs text-slate-500">请先使用邮箱验证码注册或登录，以同步题库与 FSRS 错题进度</p>
                </div>

                <div className="flex gap-2 text-xs">

                  <button onClick={() => { setAuthMode("register"); setOtpSent(false); }} className={`flex-1 py-2 rounded-lg font-bold ${authMode === "register" ? "bg-emerald-600 text-white" : "bg-slate-100 text-slate-600"}`}>邮箱注册</button>
                  <button onClick={() => { setAuthMode("reset"); setOtpSent(false); }} className={`flex-1 py-2 rounded-lg font-bold ${authMode === "reset" ? "bg-amber-600 text-white" : "bg-slate-100 text-slate-600"}`}>忘记密码</button>

                <div className="space-y-3 text-xs">

                        <button disabled={authBusy || otpCooldown > 0} onClick={() => sendEmailOtp(authMode)} className="px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 disabled:opacity-50 text-white font-bold shrink-0">
                          {authBusy ? "发送中..." : otpCooldown > 0 ? `${otpCooldown}s 后重发` : otpSent ? "重新发送" : "发送验证码"}
                        </button>
                      </div>
                      {authMode === "reset" && (
                        <input type="password" value={newResetPassword} onChange={(e) => setNewResetPassword(e.target.value)} placeholder="设置新密码 (至少 6 位)" className="w-full border rounded-lg px-3 py-2 bg-white" />
                      )}

                  <button disabled={authBusy} onClick={handleAuthSubmit} className="w-full py-3 rounded-xl bg-blue-700 hover:bg-blue-600 disabled:opacity-50 text-white font-extrabold text-sm shadow-lg shadow-blue-700/25">
                    {authBusy ? "处理中..." : authMode === "register" ? "验证邮箱并完成注册" : authMode === "reset" ? "验证并重设密码" : "登录进入题库"}
                  </button>
                </div>
              </div>
            </div>
          ) : (
            <>
          {/* VIEW 1: DASHBOARD */}
          {view === "DASHBOARD" && (
            <>
              <header className="bg-blue-900 text-white shadow-md px-4 sm:px-6 py-3">
                <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
                  <div className="flex items-center gap-3">
                    <div className="w-9 h-9 rounded-lg bg-blue-600 border border-blue-400 flex items-center justify-center font-black text-sm shadow">UW</div>
                    <div>
                      <h1 className="font-bold text-base sm:text-lg leading-tight">UWorld 个人临床题库</h1>
                      <p className="text-[11px] text-blue-200">Step 1 / Step 2 · 22 大器官系统 · FSRS 记忆曲线错题本</p>
                    </div>
                  </div>
                  <div className="flex flex-wrap items-center gap-2">
                    <button onClick={() => setShowAuthModal(true)} className="px-3 py-1.5 rounded-lg bg-blue-800 hover:bg-blue-700 border border-blue-600 text-xs font-semibold flex items-center gap-1.5">
                      <Icon name="user" className="w-4 h-4 text-emerald-300" />
                      <span>{currentUser === "guest" ? "登录 / 云同步" : currentUser}</span>

                      <Icon name="brain" className="w-4 h-4 text-amber-300" />

                      {dueMistakes.length > 0 && (

                      )}
                    </button>
                    <button onClick={() => { if (!isAdmin) setQmTab("browse"); setShowQManager(true); }} className="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-xs font-bold flex items-center gap-1.5 shadow">
                      <Icon name="database" className="w-4 h-4" />
                      <span>{isAdmin ? `导入与题库管理 (${questions.length})` : `题库浏览与同步 (${questions.length})`}</span>
                    </button>
                  </div>
                </div>
              </header>

              <main className="max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 space-y-6">
                {/* Step 1 / Step 2 Switcher */}
                <div className="flex items-center justify-between flex-wrap gap-3">

                    {STEPS.map(st => {

                    当前 <strong>{activeStep}</strong> 正确率：<strong className="text-blue-700">{stepAttempted > 0 ? Math.round((stepCorrect / stepAttempted) * 100) : 0}%</strong> ({stepCorrect}/{stepAttempted})
                  </div>
                </div>

                {/* Resume Unfinished Block */}
                {savedBlock && (
                  <div className="bg-amber-50 border-2 border-amber-400 rounded-xl p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
