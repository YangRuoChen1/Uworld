    function buildInitialMedEngCards() {
      const seed = window.__MEDENG_SEED__ || [];
      const out = [];
      const catNames = ["Word Parts", "Abbreviations", "NOT Built from Word Parts"];
      const ptCnMap = { "Combining Form": "词干/组合形式", "Prefix": "前缀", "Suffix": "后缀" };
      for (let i = 0; i < seed.length; i++) {
        const [sysIdx, catCode, subType, frontTerm, backDef, note] = seed[i];
        const sysObj = MEDENG_SYSTEMS[sysIdx] || MEDENG_SYSTEMS[0];
        const category = catNames[catCode] || "Word Parts";
        const ptLabel = subType ? `${subType} (${ptCnMap[subType] || subType})` : category;
        const hintF = catCode === 0 ? `${ptLabel} · 写出其英文含义` : catCode === 1 ? "Medical Abbreviation · 写出完整英文全称/含义" : "Medical Term (NOT Built from Word Parts) · 写出英文释义";
        const hintB = catCode === 0 ? `${ptLabel} · 写出对应的医学词缀` : catCode === 1 ? "写出对应的医学缩写 (Abbreviation)" : "根据释义写出对应的医学术语";
        out.push({
          id: `me-${i}-f`,
          system: sysObj.id,
          category,
          partType: subType || "",
          direction: "正→反",
          front: frontTerm,
          frontHint: hintF,
          back: backDef,
          note: note || sysObj.id,
          suspended: false,
          fsrs: createInitialFSRS()

          direction: "反→正",
          front: backDef,
          frontHint: hintB,
          back: frontTerm,
          note: note || sysObj.id,
          suspended: false,
          fsrs: createInitialFSRS()
        });
      }
      return out;

    function speakEnglish(text) {
      if (!window.speechSynthesis || !text) return;
      try {
        window.speechSynthesis.cancel();
        const clean = String(text).replace(/\//g, " ").replace(/\([^)]*\)/g, "").trim();
        const u = new SpeechSynthesisUtterance(clean);
        u.lang = "en-US";
        u.rate = 0.92;
        window.speechSynthesis.speak(u);

    // =========================================================================
    // 3. STUDY DAY BOUNDARY (03:00 AM - 03:00 AM) & CHECK-IN CALENDAR HELPERS
    // =========================================================================
    function getStudyDateKey(nowMs = Date.now()) {
      const shifted = new Date(nowMs - 3 * 3600 * 1000);
      const y = shifted.getFullYear();
      const m = String(shifted.getMonth() + 1).padStart(2, "0");
      const d = String(shifted.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function computeCheckInStats(dailyLogs) {
      // dailyLogs = { "2026-11-15": { studySec: 1900, qCount: 12, ankiCount: 25 } }
      const checkedKeys = Object.keys(dailyLogs || {})
        .filter(k => k >= "2026-10-01" && k <= "2056-10-01" && (dailyLogs[k]?.studySec || 0) >= 1800)
        .sort();
      const totalDays = checkedKeys.length;
      let maxStreak = 0;
      let curStreak = 0;
      let prevDate = null;
      checkedKeys.forEach(k => {
        const dt = new Date(k + "T00:00:00");
        if (prevDate && Math.round((dt - prevDate) / 86400000) === 1) {
          curStreak += 1;
        } else {
          curStreak = 1;
        }
        if (curStreak > maxStreak) maxStreak = curStreak;
        prevDate = dt;
      });
      return { totalDays, maxStreak, checkedSet: new Set(checkedKeys) };
    }

    // =========================================================================
    // 4. FSRS SPACED REPETITION ENGINE
    // =========================================================================
    const FSRS_DEFAULTS = {
      w: [0.4, 0.6, 2.4, 5.8, 4.93, 0.94, 0.86, 0.01, 1.49, 0.14, 0.94, 2.18, 0.05, 0.34, 1.26, 0.29, 2.61],
      DECAY: -0.5,
      FACTOR: 19 / 81
    };

    function createInitialFSRS(nowMs = Date.now()) {
      return {
        state: "New",
        stability: 0.4,
        difficulty: 5.0,
        elapsedDays: 0,
        scheduledDays: 0,
        reps: 0,
        lapses: 0,
        lastReview: nowMs,
        due: nowMs
      };
    }

    function fsrsRetrievability(elapsedDays, stability) {
      if (stability <= 0) return 0;
      return Math.pow(1 + FSRS_DEFAULTS.FACTOR * (Math.max(0, elapsedDays) / stability), FSRS_DEFAULTS.DECAY);
    }

    function fsrsNextIntervalDays(stability, targetRetention = 0.90) {
      const r = Math.min(0.98, Math.max(0.70, targetRetention));
      const ivl = (stability / FSRS_DEFAULTS.FACTOR) * (Math.pow(r, 1 / FSRS_DEFAULTS.DECAY) - 1);
      return Math.max(1, Math.round(ivl));
    }

    function fsrsSchedule(cardFsrs, grade, targetRetention = 0.90, nowMs = Date.now()) {
      const w = FSRS_DEFAULTS.w;
      const f = cardFsrs || createInitialFSRS(nowMs);
      const elapsedDays = f.lastReview ? Math.max(0, (nowMs - f.lastReview) / 86400000) : 0;
      const clampD = (d) => Math.min(10, Math.max(1, d));

      let nextS = f.stability;
      let nextD = f.difficulty;
      let nextState = f.state;
      let nextLapses = f.lapses || 0;
      let nextDays = 1;
      let dueMs = nowMs;

      if (f.reps === 0 || f.state === "New") {
        nextD = clampD(w[4] - Math.exp(w[5] * (grade - 1)) + 1);
        nextS = Math.max(0.1, w[grade - 1]);
        if (grade === 1) {
          nextState = "Learning"; nextDays = 0; dueMs = nowMs + 10 * 60 * 1000;
        } else if (grade === 2) {
          nextState = "Learning"; nextDays = 0.5; dueMs = nowMs + 12 * 3600 * 1000;
        } else {
          nextState = "Review"; nextDays = fsrsNextIntervalDays(nextS, targetRetention); dueMs = nowMs + nextDays * 86400000;
        }
      } else {
        const R = fsrsRetrievability(elapsedDays, f.stability);
        nextD = clampD(f.difficulty - w[6] * (grade - 3));
        nextD = clampD(w[7] * w[4] + (1 - w[7]) * nextD);
        if (grade === 1) {
          nextLapses += 1;
          nextState = "Relearning";
          nextS = Math.max(0.2, w[11] * Math.pow(nextD, -w[12]) * (Math.pow(f.stability + 1, w[13]) - 1) * Math.exp(w[14] * (1 - R)));
          nextDays = 0; dueMs = nowMs + 10 * 60 * 1000;
        } else {
          const hardPenalty = grade === 2 ? w[15] : 1;
          const easyBonus = grade === 4 ? w[16] : 1;
          nextS = f.stability * (1 + Math.exp(w[8]) * (11 - nextD) * Math.pow(f.stability, -w[9]) * (Math.exp(w[10] * (1 - R)) - 1) * hardPenalty * easyBonus);
          nextState = "Review";
          nextDays = fsrsNextIntervalDays(nextS, targetRetention);
          dueMs = nowMs + nextDays * 86400000;
        }
      }
      return {
        state: nextState,
        stability: Number(nextS.toFixed(2)),
        difficulty: Number(nextD.toFixed(2)),
        elapsedDays: Number(elapsedDays.toFixed(2)),
        scheduledDays: nextDays,
        reps: (f.reps || 0) + 1,
        lapses: nextLapses,
        lastReview: nowMs,
        due: dueMs
      };
    }

    function normalizeAnkiClozeActiveNum(cards) {
      if (!Array.isArray(cards) || cards.length === 0) return cards || [];
      const groups = new Map();
      cards.forEach((c, idx) => {
        if (c && c.type === "cloze" && c.text && !c.activeCNum) {
          const key = c.text;
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(idx);
        }
      });
      if (groups.size === 0) return cards;
      const out = [...cards];
      groups.forEach((idxs, txt) => {
        const nums = [];
        const re = /\{\{c(\d+)::/g;
        let m;
        while ((m = re.exec(txt)) !== null) {
          const n = Number(m[1]);
          if (!nums.includes(n)) nums.push(n);
        }
        nums.sort((a, b) => a - b);
        if (nums.length === 0) return;
        idxs.forEach((cardIdx, pos) => {
          out[cardIdx] = { ...out[cardIdx], activeCNum: nums[pos % nums.length] };
        });
      });
      return out;
    }

      if (!window.initSqlJs) throw new Error("SQL.js 引擎未加载");

    function isZstdBytes(u8) {
      return u8 && u8.length >= 4 && u8[0] === 0x28 && u8[1] === 0xb5 && u8[2] === 0x2f && u8[3] === 0xfd;
    }

    function maybeDecompressZstd(u8) {
      if (!isZstdBytes(u8)) return u8;
      if (!window.fzstd || !window.fzstd.decompress) throw new Error("Zstd 解压引擎 (fzstd) 未加载");
      return window.fzstd.decompress(u8);
    }

    function parseMediaProtobuf(u8) {
      // Minimal Protobuf decoder for Anki MediaEntries { repeated MediaEntry entries = 1; }
      const dec = new TextDecoder("utf-8");
      const readVarint = (buf, pos) => {
        let val = 0, shift = 0;
        while (pos < buf.length) {
          const b = buf[pos++];
          val |= (b & 0x7f) << shift;
          if ((b & 0x80) === 0) break;
          shift += 7;
        }
        return [val, pos];
      };
      const map = {};
      let pos = 0, idx = 0;
      while (pos < u8.length) {
        const [tag, p1] = readVarint(u8, pos); pos = p1;
        const fieldNum = tag >> 3, wireType = tag & 7;
        if (fieldNum === 1 && wireType === 2) {
          const [len, p2] = readVarint(u8, pos); pos = p2;
          const entryEnd = pos + len;
          let ePos = pos, fname = "";
          while (ePos < entryEnd) {
            const [eTag, ep1] = readVarint(u8, ePos); ePos = ep1;
            const ef = eTag >> 3, ew = eTag & 7;
            if (ef === 1 && ew === 2) {
              const [slen, ep2] = readVarint(u8, ePos); ePos = ep2;
              fname = dec.decode(u8.subarray(ePos, ePos + slen));
              ePos += slen;
            } else if (ew === 0) {
              const [, ep2] = readVarint(u8, ePos); ePos = ep2;
            } else if (ew === 2) {
              const [blen, ep2] = readVarint(u8, ePos); ePos = ep2 + blen;
            } else break;
          }
          if (fname) map[String(idx)] = fname;
          idx++;
          pos = entryEnd;
        } else if (wireType === 0) {
          const [, p2] = readVarint(u8, pos); pos = p2;
        } else if (wireType === 2) {
          const [len, p2] = readVarint(u8, pos); pos = p2 + len;
        } else break;
      }
      return map;
    }

    function uint8ToBase64(u8) {
      let bin = "";
      const chunk = 0x8000;
      for (let i = 0; i < u8.length; i += chunk) {
        bin += String.fromCharCode.apply(null, u8.subarray(i, i + chunk));
      }
      return btoa(bin);
    }

    // Parse .apkg (Supports both Legacy collection.anki2/21 JSON and Anki 23.10+ collection.anki21b Zstd + Protobuf!)
    async function parseApkgFile(file, fallbackStep, fallbackSystem) {
      if (!window.JSZip) throw new Error("JSZip 未加载");
      const zip = await window.JSZip.loadAsync(file);
      const dbEntry = zip.file("collection.anki21b") || zip.file("collection.anki21") || zip.file("collection.anki2");
      if (!dbEntry) throw new Error("无效的 .apkg 文件（缺少数据库）");

      const mediaEntry = zip.file("media");
      const mediaMap = {};
      if (mediaEntry) {
        const rawMediaU8 = maybeDecompressZstd(new Uint8Array(await mediaEntry.async("arraybuffer")));
        let filenameMap = {};
        if (rawMediaU8.length > 0 && rawMediaU8[0] === 0x7b) {
          filenameMap = JSON.parse(new TextDecoder("utf-8").decode(rawMediaU8));
        } else {
          filenameMap = parseMediaProtobuf(rawMediaU8);
        }
        for (const [numKey, filename] of Object.entries(filenameMap)) {
          const fEntry = zip.file(numKey);
          if (fEntry) {
            const fileU8 = maybeDecompressZstd(new Uint8Array(await fEntry.async("arraybuffer")));
            const b64 = uint8ToBase64(fileU8);
            const ext = (filename.split(".").pop() || "png").toLowerCase();
            const mime = ext === "jpg" || ext === "jpeg" ? "image/jpeg" : ext === "gif" ? "image/gif" : ext === "svg" ? "image/svg+xml" : "image/png";
            mediaMap[filename] = `data:${mime};base64,${b64}`;
          }
        }
      }

      const replaceMedia = (str) => {
        if (!str) return "";
        return str.replace(/src=["']([^"']+)["']/gi, (full, fname) => {
          const clean = decodeURIComponent(fname);
          return mediaMap[clean] ? `src="${mediaMap[clean]}"` : full;
        });
      };

      const SQL = await getSqlInstance();
      const rawDbU8 = new Uint8Array(await dbEntry.async("arraybuffer"));
      const dbBytes = maybeDecompressZstd(rawDbU8);
      const db = new SQL.Database(dbBytes);

      let decksJson = {};
      let colCrtSec = Math.floor(Date.now() / 1000);
      try {
        const colRes = db.exec("SELECT crt, decks FROM col LIMIT 1");
        if (colRes[0]?.values?.[0]) {
          if (colRes[0].values[0][0]) colCrtSec = Number(colRes[0].values[0][0]);
          if (colRes[0].values[0][1]) decksJson = JSON.parse(colRes[0].values[0][1]);
        }
      } catch (e) {}
      try {
        const dRows = db.exec("SELECT id, name FROM decks");
        if (dRows[0]?.values) dRows[0].values.forEach(([id, name]) => { decksJson[String(id)] = { name }; });
      } catch (e) {}

      const rows = db.exec(`
        SELECT c.id, c.did, c.ord, c.type, c.queue, c.due, c.ivl, c.reps, c.lapses, n.flds
        FROM cards c JOIN notes n ON c.nid = n.id
      `);
      const imported = [];
      if (rows[0]?.values) {
        rows[0].values.forEach(([cid, did, cord, ctype, cqueue, cdue, ivl, reps, lapses, flds], idx) => {
          const fields = String(flds || "").split("\x1f");
          const front = replaceMedia(fields[0] || "");
          const back = replaceMedia(fields.slice(1).join("<br/>"));
          if (front.includes("请更新至 Anki 的最新版本") || front.includes("Please update to the latest Anki")) return;
          const deckName = decksJson[String(did)]?.name || "";
          const nowMs = Date.now();
          const stability = ivl > 0 ? Number(ivl) : 0.4;
          let realDueMs = nowMs;
          let cardState = "New";
          const isSuspended = Number(cqueue) === -1;
          const isNewCard = Number(ctype) === 0 || Number(cqueue) === 0 || Number(reps) === 0;
          if (!isNewCard) {
            cardState = "Review";
            if (Number(cqueue) === 1 || Number(cqueue) === 3) {
              cardState = "Learning";
              realDueMs = Number(cdue) * 1000;
            } else if (Number(cqueue) === 2 || Number(ctype) === 2) {
              realDueMs = (colCrtSec + Number(cdue) * 86400) * 1000;
            }
          }
          const fsrs = {
            state: cardState,
            stability,
            difficulty: 5.0,
            elapsedDays: 0,
            scheduledDays: Math.max(0, Number(ivl || 0)),
            reps: isNewCard ? 0 : Number(reps || 0),
            lapses: Number(lapses || 0),
            lastReview: isNewCard ? 0 : Math.max(0, realDueMs - Math.max(1, Number(ivl || 1)) * 86400000),
            due: realDueMs
          };

          // Detect Anki 23.10+ Native Image Occlusion (image-occlusion:rect:left=...)
          const isNativeIO = front.includes("image-occlusion:rect:");
          if (isNativeIO) {
            const masks = [];
            const rectRe = /\{\{c(\d+)::image-occlusion:rect:([^}]+)\}\}/g;
            let rm;
            while ((rm = rectRe.exec(front)) !== null) {
              const cNum = Number(rm[1]);
              const props = rm[2];
              const getProp = (k) => {
                const pm = props.match(new RegExp(k + "=([\\d.]+)"));
                return pm ? parseFloat(pm[1]) * 100 : 0;
              };
              masks.push({
                cNum,
                x: getProp("left"),
                y: getProp("top"),
                w: getProp("width"),
                h: getProp("height")
              });
            }
            const allFieldsHtml = replaceMedia(fields.slice(1).join("<br/>"));
            const imgMatch = allFieldsHtml.match(/<img[^>]+src=["']([^"']+)["'][^>]*>/i);
            const ioImgSrc = imgMatch ? imgMatch[1] : "";
            const ioExtraHtml = allFieldsHtml.replace(/<img[^>]*>/gi, "").trim();
            imported.push({
              id: `apkg-${cid}-${Date.now()}-${idx}`,
              type: "io",
              step: fallbackStep,
              system: fallbackSystem,
              originalDeck: deckName,
              image: ioImgSrc,
              masks,
              activeCNum: Number(cord || 0) + 1,
              extra: ioExtraHtml,
              suspended: isSuspended,
              flag: 0,
              fsrs
            });
          } else {
            const isCloze = /\{\{c\d+::/.test(front);
            imported.push({
              id: `apkg-${cid}-${Date.now()}-${idx}`,
              type: isCloze ? "cloze" : "basic",
              step: fallbackStep,
              system: fallbackSystem,
              originalDeck: deckName,
              text: front,
              extra: back,
              activeCNum: isCloze ? (Number(cord || 0) + 1) : undefined,
              suspended: isSuspended,
              flag: 0,
              fsrs
            });
          }
        });
      }
      db.close();
      return { imported, deckCount: Object.keys(decksJson).length, mediaCount: Object.keys(mediaMap).length };
    }

    // Export cards to real .apkg (ZIP + collection.anki2 + media)
    async function exportApkgFile(cards, presetNewLimit, presetRevLimit) {

          flds: [{ name: "Text", ord: 0, sticky: false, rtl: false, font: "Arial", size: 20 }, { name: "Extra", ord: 1, sticky: false, rtl: false, font: "Arial", size: 16 }],

      const dconf = { "1": { id: 1, name: "Default", new: { perDay: presetNewLimit, delays: [1, 10], ints: [1, 4, 7], initialFactor: 2500, order: 1 }, rev: { perDay: presetRevLimit, ease4: 1.3, ivlFct: 1, maxIvl: 36500 }, lapse: { delays: [10], mult: 0, minInt: 1, leechAction: 0, leechFails: 8 }, maxTaken: 60, timer: 0, autoplay: true, replayq: true, mod: nowSec, usn: -1 } };

      db.run("INSERT INTO col VALUES (1,?,?,?,?,0,-1,0,?,?,?,?,?)", [nowSec, nowMs, nowMs, 11, "{}", JSON.stringify(models), JSON.stringify(decks), JSON.stringify(dconf), "{}"]);

      const zip = new window.JSZip();
      const mediaManifest = {};
      let mediaIdx = 0;

      const extractMedia = (htmlStr) => {
        if (!htmlStr) return "";
        return htmlStr.replace(/src=["'](data:image\/([a-zA-Z0-9+]+);base64,([^"']+))["']/gi, (full, dataUri, ext, b64) => {
          const fname = `uw_img_${mediaIdx}.${ext === "jpeg" ? "jpg" : ext}`;
          zip.file(String(mediaIdx), b64, { base64: true });
          mediaManifest[String(mediaIdx)] = fname;
          mediaIdx++;
          return `src="${fname}"`;
        });
      };

      cards.forEach((c, i) => {
        const nid = nowMs + i * 10;
        const cid = nid + 1;
        let front = c.type === "io" ? `<img src="${c.image}">` : (c.text || "");
        let back = c.extra || "";
        front = extractMedia(front);
        back = extractMedia(back);
        const flds = `${front}\x1f${back}`;
        const reps = c.fsrs?.reps || 0;

        const lapses = c.fsrs?.lapses || 0;
        const ctype = reps === 0 ? 0 : 2;

      const dbBinary = db.export();

      // Anki Eligible Cards (by Step & System, respecting New & Review limits)
      const ankiStepCards = useMemo(() => ankiCards.filter(c => (c.step || "Step 1") === ankiStep), [ankiCards, ankiStep]);
      const ankiDueStats = useMemo(() => {
        const now = Date.now();
        const filtered = ankiStepCards.filter(c => ankiSelectedSystems.includes(c.system));
        const activeFiltered = filtered.filter(c => !c.suspended);
        const newCards = activeFiltered.filter(c => !c.fsrs || c.fsrs.reps === 0);
        const revCards = activeFiltered.filter(c => c.fsrs && c.fsrs.reps > 0 && (c.fsrs.due || 0) <= now);
        return { total: filtered.length, newCards, revCards };
      }, [ankiStepCards, ankiSelectedSystems]);

      const startAnkiSession = () => {
        const pickedNew = ankiDueStats.newCards.slice(0, ankiNewLimit);
        const pickedRev = ankiDueStats.revCards.slice(0, ankiRevLimit);
        const queue = [...pickedRev, ...pickedNew];
        if (queue.length === 0) {
          showToast("当前选定系统没有新卡或到期复习卡！", "info");
          return;
        }
        setAnkiQueue(queue.map(c => c.id));
        setAnkiHistory([]);
        setAnkiRevealed(false);
        setView("ANKI_STUDY");
      };

      const startAnkiAheadSession = () => {
        const filtered = ankiStepCards.filter(c => ankiSelectedSystems.includes(c.system));
        if (filtered.length === 0) {
          showToast("当前选定系统暂无任何卡片！", "info");
          return;
        }
        const sorted = [...filtered].sort((a, b) => (a.fsrs?.due || 0) - (b.fsrs?.due || 0)).slice(0, Math.max(20, ankiRevLimit));
        setAnkiQueue(sorted.map(c => c.id));
        setAnkiHistory([]);
        setAnkiRevealed(false);
        setView("ANKI_STUDY");
        showToast(`已开启提前复习模式（共 ${sorted.length} 张）`, "info");
      };

      const currentAnkiStudyCard = useMemo(() => {
        if (ankiQueue.length === 0) return null;
        return ankiCards.find(c => c.id === ankiQueue[0]) || null;
      }, [ankiQueue, ankiCards]);

      const handleAnkiUndo = () => {
        if (ankiHistory.length === 0) {
          showToast("暂无可回退的上一张卡片", "info");
          return;
        }
        const last = ankiHistory[ankiHistory.length - 1];
        setAnkiHistory(prev => prev.slice(0, -1));
        setAnkiCards(prev => prev.map(c => c.id === last.cardId ? { ...c, fsrs: last.prevFsrs } : c));
        setAnkiQueue(last.prevQueue);
        setAnkiRevLog(prev => {
          const idx = prev.findIndex(l => l.cardId === last.cardId);
          return idx >= 0 ? [...prev.slice(0, idx), ...prev.slice(idx + 1)] : prev;
        });
        setDailyLogs(prev => {
          const cur = prev[last.dayKey];
          if (!cur) return prev;
          return { ...prev, [last.dayKey]: { ...cur, ankiCount: Math.max(0, (cur.ankiCount || 0) - 1) } };
        });
        setAnkiRevealed(false);
        showToast("已回退到上一张卡片 (Ctrl+Z)", "info");
      };

      const handleAnkiStudyRate = (grade) => {
        if (!currentAnkiStudyCard) return;
        const nowMs = Date.now();
        const dk = getStudyDateKey();
        setAnkiHistory(prev => [...prev, {
          cardId: currentAnkiStudyCard.id,
          prevFsrs: currentAnkiStudyCard.fsrs ? { ...currentAnkiStudyCard.fsrs } : undefined,
          prevQueue: [...ankiQueue],
          dayKey: dk
        }]);
        const nextFsrs = fsrsSchedule(currentAnkiStudyCard.fsrs, grade, targetRetention, nowMs);
        setAnkiCards(prev => prev.map(c => c.id === currentAnkiStudyCard.id ? { ...c, fsrs: nextFsrs } : c));
        setAnkiRevLog(prev => [{
          ts: nowMs,
          dayKey: getStudyDateKey(nowMs),
          cardId: currentAnkiStudyCard.id,
          step: currentAnkiStudyCard.step || "Step 1",
          system: currentAnkiStudyCard.system || "General Principles",
          grade,
          stateBefore: currentAnkiStudyCard.fsrs?.state || "New",
          ivlAfter: nextFsrs.scheduledDays || 0
        }, ...prev.slice(0, 4999)]);
        setDailyLogs(prev => {
          const cur = prev[dk] || { studySec: 0, qCount: 0, ankiCount: 0 };
          return { ...prev, [dk]: { ...cur, ankiCount: (cur.ankiCount || 0) + 1 } };
        });
        setAnkiRevealed(false);
        if (grade === 1) {
          // Put Again card back at end of session queue
          setAnkiQueue(prev => [...prev.slice(1), prev[0]]);
        } else {
          setAnkiQueue(prev => prev.slice(1));
        }
        if (ankiQueue.length <= 1 && grade !== 1) {
          showToast("本次 Anki 知识点学习已完成！", "success");
          setView("DASHBOARD");
        }
      };

      // FSRS Mistakes Due
      const dueMistakes = useMemo(() => {
        const now = Date.now();
        const qIdSet = new Set(questions.map(q => q.id));
        return mistakes.filter(m => qIdSet.has(m.id) && (!m.fsrs || (m.fsrs.due || 0) <= now)).sort((a, b) => (a.fsrs?.due || 0) - (b.fsrs?.due || 0));
      }, [mistakes, questions]);
      const currentFsrsCard = dueMistakes[0] || null;

      // Start QBank Test
      const startTestBlock = () => {
        if (eligibleQuestions.length === 0) { showToast("当前筛选条件下暂无题目", "error"); return; }
        const picked = [...eligibleQuestions].sort(() => Math.random() - 0.5).slice(0, Math.min(questionCount, eligibleQuestions.length));
        const block = {
          id: `blk-${Date.now()}`,
          step: activeStep,
          mode: testMode,
          sectionTitle: `${activeStep} · ${testMode} · ${qFilterMode}`,
          qIds: picked.map(q => q.id),
          currentIndex: 0,
          answers: {},
          submitted: {},
          struck: {},
          elapsedSec: 0,
          startedAt: new Date().toLocaleString("zh-CN", { hour12: false })
        };
        setActiveBlock(block);
        setExpandedExpOpt(null);
        setView("TEST");
      };


      const resetSingleQuestionStatus = (qid) => {
        setAttemptedMap(prev => { const n = { ...prev }; delete n[qid]; return n; });
        setMistakes(prev => prev.filter(m => m.id !== qid));
        if (activeBlock && activeBlock.qIds.includes(qid)) {
          setActiveBlock(prev => {
            if (!prev) return prev;
            const newSub = { ...prev.submitted }; delete newSub[qid];
            const newAns = { ...prev.answers }; delete newAns[qid];
            return { ...prev, submitted: newSub, answers: newAns };
          });
        }
        showToast("已重置该题为未写状态", "info");
      };

      const resetSystemQuestionsStatus = (sysId) => {
        const targetIds = new Set(questions.filter(q => (q.step || "Step 1") === activeStep && q.system === sysId).map(q => q.id));
        if (targetIds.size === 0) return;
        if (!confirm(`确定要重置「${sysId}」全部 ${targetIds.size} 道题的作答状态（恢复为未写）吗？`)) return;
        setAttemptedMap(prev => {
          const n = { ...prev };
          targetIds.forEach(id => delete n[id]);
          return n;
        });
        setMistakes(prev => prev.filter(m => !targetIds.has(m.id)));
        showToast(`已重置「${sysId}」全部 ${targetIds.size} 道题状态！`, "success");
      };


      const startWeaknessBlock = () => {
        const sysStats = getSystemsForStep(activeStep).map(sys => {
          const qs = stepQuestions.filter(q => q.system === sys.id);
          const done = qs.filter(q => attemptedMap[q.id]);
          const right = done.filter(q => attemptedMap[q.id]?.lastCorrect).length;
          const acc = done.length > 0 ? right / done.length : 0.5;
          return { id: sys.id, acc, count: qs.length };
        }).filter(s => s.count > 0).sort((a, b) => a.acc - b.acc);

        const weakSysIds = new Set(sysStats.slice(0, 3).map(s => s.id));
        const mistakeIds = new Set(mistakes.map(m => m.id));
        const markedSet = new Set(markedIds);

        const scored = stepQuestions.map(q => {
          let score = 0;
          if (mistakeIds.has(q.id) || (attemptedMap[q.id] && !attemptedMap[q.id].lastCorrect)) score += 3;
          if (markedSet.has(q.id)) score += 2;
          if (weakSysIds.has(q.system)) score += 2;
          if (!attemptedMap[q.id]) score += 1;
          return { q, score, rnd: Math.random() };
        }).sort((a, b) => (b.score - a.score) || (a.rnd - b.rnd));

        const picked = scored.slice(0, Math.min(questionCount === 999 ? 40 : questionCount, scored.length)).map(x => x.q);
        if (picked.length === 0) { showToast("当前 Step 暂无题目可组卷", "error"); return; }
        setActiveBlock({
          id: `blk-weak-${Date.now()}`,
          step: activeStep,
          mode: testMode,
          sectionTitle: `${activeStep} · 🎯 薄弱项突击`,
          qIds: picked.map(q => q.id),
          currentIndex: 0,
          answers: {},
          submitted: {},
          struck: {},
          elapsedSec: 0,
          startedAt: new Date().toLocaleString("zh-CN", { hour12: false })
        });
        setExpandedExpOpt(null);
        setView("TEST");
        showToast(`已生成 ${picked.length} 题薄弱项突击卷！`, "success");
      };

      const convertQuestionToAnki = (q) => {
        if (!q) return;
        const ansText = q.options?.[q.answer] || q.answer;
        const promptCore = q.educationalObjective
          ? `${q.educationalObjective}\n\n核心考点：{{c1::${ansText}}}`
          : `${(q.stem || "").slice(0, 220)}...\n\n正确答案：{{c1::${ansText}}}`;
        const extraHtml = [
          q.generalExplanation ? `<div><strong>解析：</strong>${q.generalExplanation}</div>` : "",
          q.explanations?.[q.answer] ? `<div class="mt-2"><strong>正确选项解释：</strong>${q.explanations[q.answer]}</div>` : ""
        ].filter(Boolean).join("");
        const newCard = {
          id: `anki-q-${q.id}-${Date.now()}`,
          type: "cloze",
          step: q.step || activeStep,
          system: q.system,
          text: promptCore,
          extra: extraHtml,
          activeCNum: 1,
          suspended: false,
          flag: 0,
          fsrs: createInitialFSRS()
        };
        setAnkiCards(prev => [newCard, ...prev]);
        showToast("已一键转存为 Anki 填空卡！", "success");
      };

      // Global Keyboard Shortcuts for Desktop Speed Study
      useEffect(() => {
        const onKey = (e) => {
          const tag = (e.target?.tagName || "").toUpperCase();
          if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || e.target?.isContentEditable) return;
          if (showQManager || showAnkiMgrModal || showMedEngManager || showAuthModal || showPerfModal || showNotebookModal || previewAnkiCard || editingAnkiCard || editingMedEngCard) return;

          if (view === "ANKI_STUDY" && currentAnkiStudyCard) {
            if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === "z" || e.key === "ArrowLeft")) { e.preventDefault(); handleAnkiUndo(); }
            else if (e.code === "Space") { e.preventDefault(); if (!ankiRevealed) setAnkiRevealed(true); }
            else if (ankiRevealed && ["1", "2", "3", "4"].includes(e.key)) { e.preventDefault(); handleAnkiStudyRate(Number(e.key)); }
          } else if (view === "MEDENG_STUDY" && currentMedEngCard) {
            if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === "z" || e.key === "ArrowLeft")) { e.preventDefault(); handleMedEngUndo(); }
            else if (e.code === "Space") { e.preventDefault(); if (!medEngRevealed) setMedEngRevealed(true); }
            else if (medEngRevealed && ["1", "2", "3", "4"].includes(e.key)) { e.preventDefault(); handleMedEngRate(Number(e.key)); }
          } else if (view === "TEST" && activeBlock && currentQuestion) {
            const qid = currentQuestion.id;
            const isSub = Boolean(activeBlock.submitted[qid]);
            const keyMap = { "1": "A", "2": "B", "3": "C", "4": "D", "5": "E", "a": "A", "b": "B", "c": "C", "d": "D", "e": "E" };
            const opt = keyMap[e.key.toLowerCase()];
            if (opt && !isSub && currentQuestion.options?.[opt]) {
              setActiveBlock(p => ({ ...p, answers: { ...p.answers, [qid]: opt } }));
            } else if (e.key === "ArrowLeft" && activeBlock.currentIndex > 0) {
              setActiveBlock(p => ({ ...p, currentIndex: p.currentIndex - 1 })); setExpandedExpOpt(null);
            } else if (e.key === "ArrowRight" && activeBlock.currentIndex < activeBlock.qIds.length - 1) {
              setActiveBlock(p => ({ ...p, currentIndex: p.currentIndex + 1 })); setExpandedExpOpt(null);
            }
          }
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, [view, activeBlock, currentQuestion, ankiRevealed, currentAnkiStudyCard, ankiHistory, medEngRevealed, currentMedEngCard, medEngHistory, showQManager, showAnkiMgrModal, showMedEngManager, showAuthModal, showPerfModal, showNotebookModal, previewAnkiCard, editingAnkiCard, editingMedEngCard]);

      const startOverviewFromQuestion = (sysQuestions, startIdx, titleLabel) => {
        if (!sysQuestions || sysQuestions.length === 0) return;
        const block = {
          id: `blk-ov-${Date.now()}`,
          step: activeStep,
          mode: "Tutor",
          sectionTitle: `${activeStep} · 总览直选 · ${titleLabel}`,
          qIds: sysQuestions.map(q => q.id),
          currentIndex: Math.max(0, Math.min(startIdx, sysQuestions.length - 1)),
          answers: {},
          submitted: {},
          struck: {},
          elapsedSec: 0,
          startedAt: new Date().toLocaleString("zh-CN", { hour12: false })
        };
        setActiveBlock(block);
        setExpandedExpOpt(null);
        setView("TEST");
      };

      const currentQuestion = useMemo(() => {
        if (!activeBlock) return null;
        return questions.find(q => q.id === activeBlock.qIds[activeBlock.currentIndex]) || null;
      }, [activeBlock, questions]);

      const recordAnswerResult = (q, chosen) => {
        const isCorrect = chosen === q.answer;
        setAttemptedMap(prev => ({ ...prev, [q.id]: { lastCorrect: isCorrect, count: (prev[q.id]?.count || 0) + 1 } }));
        const dk = getStudyDateKey();
        setDailyLogs(prev => {
          const cur = prev[dk] || { studySec: 0, qCount: 0, ankiCount: 0 };
          return { ...prev, [dk]: { ...cur, qCount: (cur.qCount || 0) + 1 } };
        });
        if (!isCorrect) {
          const nowMs = Date.now();
          setMistakes(prev => {
            const existing = prev.find(m => m.id === q.id);
            const rec = {
              ...q,
              wrongChoice: chosen,
              timestamp: new Date(nowMs).toLocaleString("zh-CN", { hour12: false }),
              sectionLabel: `${q.step || "Step 1"} · ${q.system}`,
              wrongCount: existing ? (existing.wrongCount || 1) + 1 : 1,
              fsrs: existing?.fsrs ? fsrsSchedule(existing.fsrs, 1, targetRetention, nowMs) : createInitialFSRS(nowMs)
            };
            return [rec, ...prev.filter(m => m.id !== q.id)];
          });
        }
      };

      const handleSubmitQuestion = () => {
        if (!activeBlock || !currentQuestion) return;
        const chosen = activeBlock.answers[currentQuestion.id];
        if (!chosen) { showToast("请先选择一个选项", "error"); return; }
        recordAnswerResult(currentQuestion, chosen);
        setActiveBlock(prev => ({ ...prev, submitted: { ...prev.submitted, [currentQuestion.id]: true } }));
        setExpandedExpOpt(currentQuestion.answer);
      };

      const handleEndBlock = () => {
        if (!activeBlock) return;
        const newSubmitted = { ...activeBlock.submitted };
        let correctCount = 0;
        activeBlock.qIds.forEach(qid => {
          const q = questions.find(item => item.id === qid);
          const chosen = activeBlock.answers[qid];
          if (q && chosen) {
            if (!newSubmitted[qid]) { recordAnswerResult(q, chosen); newSubmitted[qid] = true; }
            if (chosen === q.answer) correctCount++;
          }
        });
        setActiveBlock({ ...activeBlock, submitted: newSubmitted, correctCount });
        safeSetStorage(getUserKey(currentUser, "activeBlock"), null);
        setSavedBlock(null);
        setView("SUMMARY");
      };

      const formatTime = (sec) => {
        const m = Math.floor((sec || 0) / 60).toString().padStart(2, "0");
        const s = ((sec || 0) % 60).toString().padStart(2, "0");
        return `${m}:${s}`;
      };


      // MedEng (Exploring Medical Language) Computed Queues & Handlers
      const medEngFilteredAll = useMemo(() => {
        return medEngCards.filter(c => {
          if (!medEngSelectedSystems.includes(c.system)) return false;
          if (medEngCategoryFilter !== "ALL" && c.category !== medEngCategoryFilter) return false;
          if (medEngDirFilter !== "ALL" && c.direction !== medEngDirFilter) return false;
          return true;
        });
      }, [medEngCards, medEngSelectedSystems, medEngCategoryFilter, medEngDirFilter]);

      const medEngDueStats = useMemo(() => {
        const now = Date.now();
        const active = medEngFilteredAll.filter(c => !c.suspended);
        const newCards = active.filter(c => !c.fsrs || c.fsrs.reps === 0);
        const revCards = active.filter(c => c.fsrs && c.fsrs.reps > 0 && (c.fsrs.due || 0) <= now);
        return { newCards, revCards, total: active.length };
      }, [medEngFilteredAll]);

      const dueMedEngMistakes = useMemo(() => {
        const now = Date.now();
        return medEngMistakes.filter(m => !m.fsrs || (m.fsrs.due || 0) <= now);
      }, [medEngMistakes]);

      const startMedEngSession = () => {
        const pickedNew = medEngDueStats.newCards.slice(0, medEngNewLimit);
        const pickedRev = medEngDueStats.revCards.slice(0, medEngRevLimit);
        const q = [...pickedRev, ...pickedNew].map(c => c.id);
        if (q.length === 0) { showToast("当前筛选条件暂无到期或未学医学英语卡片！", "info"); return; }
        setMedEngQueue(q);
        setMedEngHistory([]);
        setMedEngIdx(0);
        setMedEngRevealed(false);
        setView("MEDENG_STUDY");
      };

      const startMedEngAheadSession = () => {
        const active = medEngFilteredAll.filter(c => !c.suspended);
        if (active.length === 0) { showToast("请先勾选至少一个章节或词库", "info"); return; }
        const q = active.slice(0, Math.max(1, medEngNewLimit + medEngRevLimit)).map(c => c.id);
        setMedEngQueue(q);
        setMedEngHistory([]);
        setMedEngIdx(0);
        setMedEngRevealed(false);
        setView("MEDENG_STUDY");
      };

      const currentMedEngCard = useMemo(() => {
        if (view !== "MEDENG_STUDY" || !medEngQueue[medEngIdx]) return null;
        return medEngCards.find(c => c.id === medEngQueue[medEngIdx]) || null;
      }, [view, medEngQueue, medEngIdx, medEngCards]);

      const handleMedEngUndo = () => {
        if (medEngHistory.length === 0) {
          showToast("暂无可回退的上一张卡片", "info");
          return;
        }
        const last = medEngHistory[medEngHistory.length - 1];
        setMedEngHistory(prev => prev.slice(0, -1));
        setMedEngCards(prev => prev.map(c => c.id === last.cardId ? last.prevCard : c));
        setMedEngMistakes(last.prevMistakes);
        setMedEngRevLog(prev => prev.slice(0, -1));
        setDailyLogs(prev => {
          const cur = prev[last.dayKey];
          if (!cur) return prev;
          return { ...prev, [last.dayKey]: { ...cur, medEngCount: Math.max(0, (cur.medEngCount || 0) - 1) } };
        });
        setMedEngIdx(last.prevIdx);
        setMedEngRevealed(false);
        showToast("已回退到上一张卡片 (Ctrl+Z)", "info");
      };

      const handleMedEngRate = (grade) => {
        if (!currentMedEngCard) return;
        const dk = getStudyDateKey();
        setMedEngHistory(prev => [...prev, {
          cardId: currentMedEngCard.id,
          prevCard: { ...currentMedEngCard, fsrs: currentMedEngCard.fsrs ? { ...currentMedEngCard.fsrs } : undefined },
          prevIdx: medEngIdx,
          prevMistakes: [...medEngMistakes],
          dayKey: dk
        }]);
        const nextFsrs = fsrsSchedule(currentMedEngCard.fsrs, grade, targetRetention);
        const updatedCard = { ...currentMedEngCard, fsrs: nextFsrs };
        setMedEngCards(prev => prev.map(c => c.id === currentMedEngCard.id ? updatedCard : c));
        setMedEngRevLog(prev => [...prev, { ts: Date.now(), cardId: currentMedEngCard.id, system: currentMedEngCard.system, category: currentMedEngCard.category, grade }]);

        // Track mistakes if rated Again (1), remove if rated Good(3)/Easy(4)
        if (grade === 1) {
          setMedEngMistakes(prev => {
            const exists = prev.some(m => m.id === updatedCard.id);
            return exists ? prev.map(m => m.id === updatedCard.id ? updatedCard : m) : [updatedCard, ...prev];
          });
        } else if (grade >= 3) {
          setMedEngMistakes(prev => prev.filter(m => m.id !== updatedCard.id));
        }

        setDailyLogs(prev => {
          const cur = prev[dk] || { studySec: 0, qCount: 0, ankiCount: 0, medEngCount: 0 };
          return { ...prev, [dk]: { ...cur, medEngCount: (cur.medEngCount || 0) + 1 } };
        });

        setMedEngRevealed(false);
        if (medEngIdx + 1 < medEngQueue.length) {
          setMedEngIdx(i => i + 1);
        } else {
          showToast("🎉 本轮医学英语翻转卡学习完成！", "success");
          setView("DASHBOARD");
        }
      };

      const handleAddSingleMedEngCard = () => {
        if (!isAdmin || !newMeFront.trim() || !newMeBack.trim()) { showToast("请填写正面与反面内容", "error"); return; }
        const nowId = Date.now();
        const ptCn = { "Combining Form": "词干/组合形式", "Prefix": "前缀", "Suffix": "后缀" }[newMePartType] || "";
        const ptLabel = newMeCat === "Word Parts" ? `${newMePartType} (${ptCn})` : newMeCat;
        const created = [{
          id: `me-man-${nowId}-f`,
          system: newMeSys,
          category: newMeCat,
          partType: newMeCat === "Word Parts" ? newMePartType : "",
          direction: "正→反",
          front: newMeFront.trim(),
          frontHint: newMeCat === "Word Parts" ? `${ptLabel} · 写出其英文含义` : newMeCat === "Abbreviations" ? "Medical Abbreviation · 写出全称" : "Medical Term · 写出英文释义",
          back: newMeBack.trim(),
          note: newMeNote.trim() || newMeSys,
          suspended: false,
          fsrs: createInitialFSRS()
        }];
        if (newMeBothSides) {
          created.push({
            id: `me-man-${nowId}-b`,
            system: newMeSys,
            category: newMeCat,
            partType: newMeCat === "Word Parts" ? newMePartType : "",
            direction: "反→正",
            front: newMeBack.trim(),
            frontHint: newMeCat === "Word Parts" ? `${ptLabel} · 写出对应的医学词缀` : newMeCat === "Abbreviations" ? "写出对应的医学缩写" : "根据释义写出医学术语",
            back: newMeFront.trim(),
            note: newMeNote.trim() || newMeSys,
            suspended: false,
            fsrs: createInitialFSRS()
          });
        }
        setMedEngCards(prev => [...created, ...prev]);
        setNewMeFront(""); setNewMeBack(""); setNewMeNote("");
        showToast(`已成功添加 ${created.length} 张医学英语卡片！`, "success");
      };

      const prepareMedEngJsonPreview = (rawStr) => {
        if (!isAdmin) return;
        try {
          const parsed = JSON.parse((rawStr || medEngJsonText).trim());
          const arr = Array.isArray(parsed) ? parsed : [parsed];
          const out = [];

      const syncToSupabase = async (direction) => {
        if (!cloudCfg.url || !cloudCfg.anonKey || currentUser === "guest") return;
        setCloudBusy(true);
        const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
        const headers = { "apikey": cloudCfg.anonKey, "Authorization": "Bearer " + cloudCfg.anonKey, "Content-Type": "application/json", "Prefer": "resolution=merge-duplicates" };
        const chunkByBytes = (arr, maxBytes = 320000, maxCount = 400) => {
          const res = [];
          let cur = [];
          let curBytes = 0;
          for (let i = 0; i < arr.length; i++) {
            const item = arr[i];
            const sz = JSON.stringify(item).length;
            if (cur.length > 0 && (curBytes + sz > maxBytes || cur.length >= maxCount)) {
              res.push(cur);
              cur = [item];
              curBytes = sz;
            } else {
              cur.push(item);
              curBytes += sz;
            }
          }
          if (cur.length > 0) res.push(cur);
          return res;
        };

        try {
          if (direction === "push") {
            // Pre-check remote updatedAt to prevent accidental overwrite of newer progress from another device
            try {
              const chkRes = await fetch(`${baseUrl}/rest/v1/medspire_saves?username=eq.${encodeURIComponent(currentUser)}&select=data`, { headers });
              if (chkRes.ok) {
                const chkRows = await chkRes.json();
                const remoteUpd = chkRows?.[0]?.data?.updatedAt;
                const localSyncAt = safeGetStorage(getUserKey(currentUser, "lastSyncAt"), "");
                if (remoteUpd && (!localSyncAt || new Date(remoteUpd).getTime() - new Date(localSyncAt).getTime() > 5000)) {
                  const remoteTimeStr = new Date(remoteUpd).toLocaleString("zh-CN", { hour12: false });
                  if (!confirm(`⚠️ 检测到云端存档 (${remoteTimeStr}) 比本机上次同步时间更新！\n继续上传将覆盖云端较新的进度。确定要覆盖吗？（点「取消」后可改点「从云端拉取」）`)) {
                    setCloudBusy(false);
                    return;
                  }
                }
              }
            } catch (e) {}
            const qChunks = chunkByBytes(questions, 300000, 60);
            const aChunks = chunkByBytes(ankiCards, 300000, 200);
            const mChunks = chunkByBytes(medEngCards, 300000, 500);
            const totalItems = Math.max(1, questions.length + ankiCards.length + medEngCards.length + 1);
            let doneItems = 0;

            const postChunk = async (key, dataObj, label, countAdded) => {
              updateSyncProgress(label, doneItems, totalItems, `正在上传...`);
              const r = await fetch(`${baseUrl}/rest/v1/medspire_saves`, {
                method: "POST",
                headers,
                body: JSON.stringify({ username: key, data: dataObj })
              });
              if (!r.ok) {
                const errTxt = await r.text().catch(() => "");
                throw new Error(`${label} HTTP ${r.status} ${errTxt.slice(0, 60)}`);
              }
              doneItems += countAdded;
              updateSyncProgress(label, Math.min(totalItems, doneItems), totalItems, "上传完成");
            };

            // 1. Core profile & logs + manifest of chunk counts
            await postChunk(currentUser, {
              mistakes, medEngMistakes, medEngRevLog,
              attemptedMap, markedIds, notesMap, highlightsMap, dailyLogs,
              activeBlock: savedBlock,
              chunkMeta: { qChunks: qChunks.length, aChunks: aChunks.length, mChunks: mChunks.length },
              updatedAt: new Date().toISOString()
            }, "核心档案与打卡记录", 1);

            // 2. QBank chunks
            for (let i = 0; i < qChunks.length; i++) {
              await postChunk(`${currentUser}__q_${i}`, { items: qChunks[i] }, `UWorld 题库 (${i + 1}/${qChunks.length})`, qChunks[i].length);
            }
            // 3. Anki chunks
            for (let i = 0; i < aChunks.length; i++) {
              await postChunk(`${currentUser}__a_${i}`, { items: aChunks[i] }, `Anki 卡组 (${i + 1}/${aChunks.length})`, aChunks[i].length);
            }
            // 4. MedEng full chunks
            for (let i = 0; i < mChunks.length; i++) {
              await postChunk(`${currentUser}__m_${i}`, { items: mChunks[i] }, `医学英语全量卡库 (${i + 1}/${mChunks.length})`, mChunks[i].length);
            }

            safeSetStorage(getUserKey(currentUser, "lastSyncAt"), new Date().toISOString());
            finishSyncProgress("全端全量数据上传", totalItems);
            showToast(`已全量同步：${questions.length} 题、${ankiCards.length} 张 Anki、${medEngCards.length} 张医学英语及全部打卡记录！`, "success");
          } else {
            updateSyncProgress("核心档案与打卡记录", 0, 4, "正在读取云端目录...");
            const res = await fetch(`${baseUrl}/rest/v1/medspire_saves?username=eq.${encodeURIComponent(currentUser)}&select=data`, { headers });
            if (!res.ok) throw new Error("HTTP " + res.status);
            const rows = await res.json();
            const d = rows?.[0]?.data;
            if (!d) {
              setSyncProgress(null);
              showToast("云端暂无该账号存档", "info");
              return;
            }

            if (Array.isArray(d.mistakes)) setMistakes(d.mistakes);
            if (Array.isArray(d.medEngMistakes)) setMedEngMistakes(d.medEngMistakes);
            if (Array.isArray(d.medEngRevLog)) setMedEngRevLog(d.medEngRevLog);
            if (d.attemptedMap) setAttemptedMap(d.attemptedMap);
            if (Array.isArray(d.markedIds)) setMarkedIds(d.markedIds);
            if (d.notesMap) setNotesMap(d.notesMap);
            if (d.highlightsMap) setHighlightsMap(d.highlightsMap);
            if (d.dailyLogs) setDailyLogs(d.dailyLogs);

            const meta = d.chunkMeta;
            if (meta) {
              const totalChunks = 1 + (meta.qChunks || 0) + (meta.aChunks || 0) + (meta.mChunks || 0);
              let doneChunks = 1;
              const pullChunks = async (prefix, count, label) => {
                let all = [];
                for (let i = 0; i < count; i++) {
                  updateSyncProgress(`${label} (${i + 1}/${count})`, doneChunks, totalChunks, "正在拉取分片...");
                  const cr = await fetch(`${baseUrl}/rest/v1/medspire_saves?username=eq.${encodeURIComponent(currentUser + prefix + i)}&select=data`, { headers });
                  if (!cr.ok) throw new Error(`${label} HTTP ${cr.status}`);
                  const crows = await cr.json();
                  if (Array.isArray(crows?.[0]?.data?.items)) all = all.concat(crows[0].data.items);
                  doneChunks++;
                }
                return all;
              };
              const pulledQs = await pullChunks("__q_", meta.qChunks || 0, "UWorld 题库");
              const pulledAnki = await pullChunks("__a_", meta.aChunks || 0, "Anki 卡组");
              const pulledMe = await pullChunks("__m_", meta.mChunks || 0, "医学英语全量卡库");
              if (meta.qChunks > 0 || Array.isArray(d.questions)) setQuestions(meta.qChunks > 0 ? pulledQs : (d.questions || []));
              if (meta.aChunks > 0 || Array.isArray(d.ankiCards)) setAnkiCards(normalizeAnkiClozeActiveNum(meta.aChunks > 0 ? pulledAnki : (d.ankiCards || [])));
              if (meta.mChunks > 0) setMedEngCards(pulledMe);
              safeSetStorage(getUserKey(currentUser, "lastSyncAt"), d.updatedAt || new Date().toISOString());
              finishSyncProgress("全端全量数据拉取", totalChunks);
              showToast(`已从云端全量拉取：${pulledQs.length} 题、${pulledAnki.length} 张 Anki、${pulledMe.length} 张医学英语！`, "success");
            } else {
              // Legacy single-record fallback
              if (Array.isArray(d.questions)) setQuestions(d.questions);
              if (Array.isArray(d.ankiCards)) setAnkiCards(normalizeAnkiClozeActiveNum(d.ankiCards));
              if (Array.isArray(d.medEngCards) && d.medEngCards.length > 0) setMedEngCards(d.medEngCards);
              finishSyncProgress("个人存档拉取", 4);
              showToast("已从云端拉取全部数据！", "success");
            }
          }
        } catch (err) {
          setSyncProgress(null);
          showToast("云同步失败：" + (err?.message || "网络超时或请求异常"), "error");
        } finally {
          setCloudBusy(false);
        }
      };

      const chunkItemsByBytes = (arr, maxBytes = 300000, maxCount = 300) => {
        const res = [];
        let cur = [];
        let curBytes = 0;
        for (let i = 0; i < arr.length; i++) {
          const item = arr[i];
          const sz = JSON.stringify(item).length;
          if (cur.length > 0 && (curBytes + sz > maxBytes || cur.length >= maxCount)) {
            res.push(cur);
            cur = [item];
            curBytes = sz;
          } else {
            cur.push(item);
            curBytes += sz;
          }
        }
        if (cur.length > 0) res.push(cur);
        return res;
      };

      const publishGlobalChunked = async (rootKey, items, label, maxCount = 200) => {
        const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
        const headers = { "apikey": cloudCfg.anonKey, "Authorization": "Bearer " + cloudCfg.anonKey, "Content-Type": "application/json", "Prefer": "resolution=merge-duplicates" };
        const chunks = chunkItemsByBytes(items, 300000, maxCount);
        const totalSteps = chunks.length + 1;
        for (let i = 0; i < chunks.length; i++) {
          updateSyncProgress(`${label} (${i + 1}/${chunks.length})`, i, totalSteps, "正在分片上传至公共库...");
          const r = await fetch(`${baseUrl}/rest/v1/medspire_saves`, {
            method: "POST",
            headers,
            body: JSON.stringify({ username: `${rootKey}__c_${i}`, data: { items: chunks[i] } })
          });
          if (!r.ok) {
            const errTxt = await r.text().catch(() => "");
            throw new Error(`分片 ${i + 1} HTTP ${r.status} ${errTxt.slice(0, 60)}`);
          }
        }
        updateSyncProgress(label, chunks.length, totalSteps, "正在写入公共库索引...");
        const metaRes = await fetch(`${baseUrl}/rest/v1/medspire_saves`, {
          method: "POST",
          headers,
          body: JSON.stringify({ username: rootKey, data: { chunkCount: chunks.length, total: items.length, updatedAt: new Date().toISOString() } })
        });
        if (!metaRes.ok) {
          const errTxt = await metaRes.text().catch(() => "");
          throw new Error(`索引 HTTP ${metaRes.status} ${errTxt.slice(0, 60)}`);
        }
        finishSyncProgress(label, totalSteps);
      };

      const pullGlobalChunked = async (rootKey, legacyField, label, showBar = true) => {
        const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
        const headers = { "apikey": cloudCfg.anonKey, "Authorization": "Bearer " + cloudCfg.anonKey };
        const res = await fetch(`${baseUrl}/rest/v1/medspire_saves?username=eq.${encodeURIComponent(rootKey)}&select=data`, { headers });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const rows = await res.json();
        const d = rows?.[0]?.data;
        if (!d) return [];
        if (d.chunkCount > 0) {
          let all = [];
          for (let i = 0; i < d.chunkCount; i++) {
            if (showBar) updateSyncProgress(`${label} (${i + 1}/${d.chunkCount})`, i, d.chunkCount, "正在拉取公共库分片...");
            const cr = await fetch(`${baseUrl}/rest/v1/medspire_saves?username=eq.${encodeURIComponent(rootKey + "__c_" + i)}&select=data`, { headers });
            if (!cr.ok) throw new Error(`分片 ${i + 1} HTTP ${cr.status}`);
            const crows = await cr.json();
            if (Array.isArray(crows?.[0]?.data?.items)) all = all.concat(crows[0].data.items);
          }
          if (showBar) finishSyncProgress(label, d.chunkCount);
          return all;
        }
        return Array.isArray(d[legacyField]) ? d[legacyField] : [];
