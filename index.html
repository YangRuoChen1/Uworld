nt of glucose (sugar) in the blood after fasting for 8 to 10 hours. Elevation may indicate diabetes mellitus.","Ch.16 Endocrine system · fasting blood sugar (FBS) (FAST-ing) (blud) (SHOOG-er)"],[15,2,"","fine needle aspiration (FNA)","biopsy technique that usesa narrow hollow needle to obtain tiny amounts of tissue for pathologic examination. Thyroid nodules are frequently biopsied using FNA.","Ch.16 Endocrine system · fine needle aspiration (FNA) (FĪN) (NĒ-del) (as-pi- RĀ-shen)"],[15,2,"","glycosylated hemoglobin","blood test used to diagnose diabetes and monitor its treatment by measuring the amount of glucose (sugar) bound to hemoglobin in the blood. HbA1c provides an indication of blood sugar level over the past three months, covering the 120-day lifespan of the red blood cell (also called glycated hemoglobin, hemoglobin A1c, and A1c test).","Ch.16 Endocrine system · glycosylated hemoglobin (HbA1c) (glī- KŌ-sa-lāt-ad) (HĒ-mō-glō-bin)"],[15,2,"","thyroid- stimulating hormone level (TSH)","blood test that measures the amount of thyroid-stimulating hormone in the blood; used to diagnose thyroid disorders and to monitor patients on thyroid replacement therapy","Ch.16 Endocrine system · thyroid- stimulating hormone level (TSH) (THĪ- royd) (STIM- yuh-lāt-ing) (HŌR-mōn) (LEV-el)"],[15,2,"","thyroxine level (T)","blood test that gives the direct measurement of the amount of thyroxine in the patient's blood. A greater-than-normal amount indicates hyperthyroidism; a less-than-normal amount indicates hypothyroidism.","Ch.16 Endocrine system · thyroxine level (T ) (thī-ROK- 4 sin) (LEV-el)"],[15,2,"","exophthalmos","abnormal protrusion of the eyeball","Ch.16 Endocrine system · exophthalmo s (ek-sof- THAL-mos)"],[15,2,"","goiter","enlargement of the thyroid gland. May be caused by autoimmune diseases of the thyroid (Graves disease or Hashimoto thyroiditis), iodine deficiency, or the presence of multiple nodules.","Ch.16 Endocrine system · goiter (GOY- ter)"],[15,2,"","tetany","condition affecting nerves causing muscle spasms as a result of low amounts of calcium in the blood caused by a deficiency of the parathyroid hormone","Ch.16 Endocrine system · tetany (TET- a-nē)"],[15,2,"","hormone","chemical substance secreted by an endocrine gland that is carried in the blood to a target tissue","Ch.16 Endocrine system · hormone (HOR- mōn)"],[15,2,"","incretins","a group of hormones produced by the gastrointestinal system that stimulate the release of insulin from the pancreas and help preserve the beta cells. Incretin mimetics are medications that copy this action and help control blood sugar in patients with type 2 diabetes mellitus.","Ch.16 Endocrine system · incretins (in-KRĒ- tins)"],[15,2,"","metabolism","sum total of all the chemical processes that take place in a living organism","Ch.16 Endocrine system · metabolis m (me- TAB-ō- lizm)"]];
  </script>

    const FSRS_DEFAULTS = {
      w: [0.4, 0.6, 2.4, 5.8, 4.93, 0.94, 0.86, 0.01, 1.49, 0.14, 0.94, 2.18, 0.05, 0.34, 1.26, 0.29, 2.61],

    function createInitialFSRS(nowMs = Date.now()) {

    function fsrsRetrievability(elapsedDays, stability) {
      if (stability <= 0) return 0;
      return Math.pow(1 + FSRS_DEFAULTS.FACTOR * (Math.max(0, elapsedDays) / stability), FSRS_DEFAULTS.DECAY);
    }

    function fsrsNextIntervalDays(stability, targetRetention = 0.90) {
      const r = Math.min(0.98, Math.max(0.70, targetRetention));
      const ivl = (stability / FSRS_DEFAULTS.FACTOR) * (Math.pow(r, 1 / FSRS_DEFAULTS.DECAY) - 1);
      return Math.max(1, Math.round(ivl));
    }

    function fsrsSchedule(cardFsrs, grade, targetRetention = 0.90, nowMs = Date.now()) {
      const w = FSRS_DEFAULTS.w;
      const f = cardFsrs || createInitialFSRS(nowMs);
      const elapsedDays = f.lastReview ? Math.max(0, (nowMs - f.lastReview) / 86400000) : 0;
      const clampD = (d) => Math.min(10, Math.max(1, d));

      let nextS = f.stability;
      let nextD = f.difficulty;
      let nextState = f.state;
      let nextLapses = f.lapses || 0;
      let nextDays = 1;
      let dueMs = nowMs;

      if (f.reps === 0 || f.state === "New") {
        nextD = clampD(w[4] - Math.exp(w[5] * (grade - 1)) + 1);
        nextS = Math.max(0.1, w[grade - 1]);
        if (grade === 1) {
          nextState = "Learning"; nextDays = 0; dueMs = nowMs + 10 * 60 * 1000;
        } else if (grade === 2) {
          nextState = "Learning"; nextDays = 0.5; dueMs = nowMs + 12 * 3600 * 1000;
        } else {
          nextState = "Review"; nextDays = fsrsNextIntervalDays(nextS, targetRetention); dueMs = nowMs + nextDays * 86400000;
        }
      } else {
        const R = fsrsRetrievability(elapsedDays, f.stability);
        nextD = clampD(f.difficulty - w[6] * (grade - 3));
        nextD = clampD(w[7] * w[4] + (1 - w[7]) * nextD);
        if (grade === 1) {
          nextLapses += 1;
          nextState = "Relearning";
          nextS = Math.max(0.2, w[11] * Math.pow(nextD, -w[12]) * (Math.pow(f.stability + 1, w[13]) - 1) * Math.exp(w[14] * (1 - R)));
          nextDays = 0; dueMs = nowMs + 10 * 60 * 1000;
        } else {
          const hardPenalty = grade === 2 ? w[15] : 1;
          const easyBonus = grade === 4 ? w[16] : 1;
          nextS = f.stability * (1 + Math.exp(w[8]) * (11 - nextD) * Math.pow(f.stability, -w[9]) * (Math.exp(w[10] * (1 - R)) - 1) * hardPenalty * easyBonus);
          nextState = "Review";
          nextDays = fsrsNextIntervalDays(nextS, targetRetention);
          dueMs = nowMs + nextDays * 86400000;
        }
      }
      return {
        state: nextState,
        stability: Number(nextS.toFixed(2)),
        difficulty: Number(nextD.toFixed(2)),
        elapsedDays: Number(elapsedDays.toFixed(2)),
        scheduledDays: nextDays,
        reps: (f.reps || 0) + 1,
        lapses: nextLapses,
        lastReview: nowMs,
        due: dueMs
      };
    }

    function parseMediaProtobuf(u8) {
      // Minimal Protobuf decoder for Anki MediaEntries { repeated MediaEntry entries = 1; }
      const dec = new TextDecoder("utf-8");
      const readVarint = (buf, pos) => {
        let val = 0, shift = 0;
        while (pos < buf.length) {
          const b = buf[pos++];
          val |= (b & 0x7f) << shift;
          if ((b & 0x80) === 0) break;
          shift += 7;
        }
        return [val, pos];
      };
      const map = {};
      let pos = 0, idx = 0;
      while (pos < u8.length) {
        const [tag, p1] = readVarint(u8, pos); pos = p1;
        const fieldNum = tag >> 3, wireType = tag & 7;
        if (fieldNum === 1 && wireType === 2) {
          const [len, p2] = readVarint(u8, pos); pos = p2;
          const entryEnd = pos + len;
          let ePos = pos, fname = "";
          while (ePos < entryEnd) {
            const [eTag, ep1] = readVarint(u8, ePos); ePos = ep1;
            const ef = eTag >> 3, ew = eTag & 7;
            if (ef === 1 && ew === 2) {
              const [slen, ep2] = readVarint(u8, ePos); ePos = ep2;
              fname = dec.decode(u8.subarray(ePos, ePos + slen));
              ePos += slen;
            } else if (ew === 0) {
              const [, ep2] = readVarint(u8, ePos); ePos = ep2;
            } else if (ew === 2) {
              const [blen, ep2] = readVarint(u8, ePos); ePos = ep2 + blen;
            } else break;
          }
          if (fname) map[String(idx)] = fname;
          idx++;
          pos = entryEnd;
        } else if (wireType === 0) {
          const [, p2] = readVarint(u8, pos); pos = p2;
        } else if (wireType === 2) {
          const [len, p2] = readVarint(u8, pos); pos = p2 + len;
        } else break;
      }
      return map;
    }

    function uint8ToBase64(u8) {
      let bin = "";
      const chunk = 0x8000;
      for (let i = 0; i < u8.length; i += chunk) {
        bin += String.fromCharCode.apply(null, u8.subarray(i, i + chunk));
      }
      return btoa(bin);
    }

    // Parse .apkg (Supports both Legacy collection.anki2/21 JSON and Anki 23.10+ collection.anki21b Zstd + Protobuf!)
    async function parseApkgFile(file, fallbackStep, fallbackSystem) {
      if (!window.JSZip) throw new Error("JSZip 未加载");
      const zip = await window.JSZip.loadAsync(file);
      const dbEntry = zip.file("collection.anki21b") || zip.file("collection.anki21") || zip.file("collection.anki2");
      if (!dbEntry) throw new Error("无效的 .apkg 文件（缺少数据库）");

      const mediaEntry = zip.file("media");
      const mediaMap = {};
      if (mediaEntry) {
        const rawMediaU8 = maybeDecompressZstd(new Uint8Array(await mediaEntry.async("arraybuffer")));
        let filenameMap = {};
        if (rawMediaU8.length > 0 && rawMediaU8[0] === 0x7b) {
          filenameMap = JSON.parse(new TextDecoder("utf-8").decode(rawMediaU8));
        } else {
          filenameMap = parseMediaProtobuf(rawMediaU8);
        }
        for (const [numKey, filename] of Object.entries(filenameMap)) {
          const fEntry = zip.file(numKey);
          if (fEntry) {
            const fileU8 = maybeDecompressZstd(new Uint8Array(await fEntry.async("arraybuffer")));
            const b64 = uint8ToBase64(fileU8);
            const ext = (filename.split(".").pop() || "png").toLowerCase();
            const mime = ext === "jpg" || ext === "jpeg" ? "image/jpeg" : ext === "gif" ? "image/gif" : ext === "svg" ? "image/svg+xml" : "image/png";
            mediaMap[filename] = `data:${mime};base64,${b64}`;
          }
        }
      }

      const replaceMedia = (str) => {
        if (!str) return "";
        return str.replace(/src=["']([^"']+)["']/gi, (full, fname) => {
          const clean = decodeURIComponent(fname);
          return mediaMap[clean] ? `src="${mediaMap[clean]}"` : full;
        });
      };

      const SQL = await getSqlInstance();
      const rawDbU8 = new Uint8Array(await dbEntry.async("arraybuffer"));
      const dbBytes = maybeDecompressZstd(rawDbU8);
      const db = new SQL.Database(dbBytes);

      let decksJson = {};
      let colCrtSec = Math.floor(Date.now() / 1000);
      try {
        const colRes = db.exec("SELECT crt, decks FROM col LIMIT 1");
        if (colRes[0]?.values?.[0]) {
          if (colRes[0].values[0][0]) colCrtSec = Number(colRes[0].values[0][0]);
          if (colRes[0].values[0][1]) decksJson = JSON.parse(colRes[0].values[0][1]);
        }
      } catch (e) {}
      try {
        const dRows = db.exec("SELECT id, name FROM decks");
        if (dRows[0]?.values) dRows[0].values.forEach(([id, name]) => { decksJson[String(id)] = { name }; });
      } catch (e) {}

      const rows = db.exec(`
        SELECT c.id, c.did, c.ord, c.type, c.queue, c.due, c.ivl, c.reps, c.lapses, n.flds
        FROM cards c JOIN notes n ON c.nid = n.id
      `);
      const imported = [];
      if (rows[0]?.values) {
        rows[0].values.forEach(([cid, did, cord, ctype, cqueue, cdue, ivl, reps, lapses, flds], idx) => {
          const fields = String(flds || "").split("\x1f");
          const front = replaceMedia(fields[0] || "");
          const back = replaceMedia(fields.slice(1).join("<br/>"));
          if (front.includes("请更新至 Anki 的最新版本") || front.includes("Please update to the latest Anki")) return;
          const deckName = decksJson[String(did)]?.name || "";
          const nowMs = Date.now();
          const stability = ivl > 0 ? Number(ivl) : 0.4;
          let realDueMs = nowMs;
          let cardState = "New";
          const isSuspended = Number(cqueue) === -1;
          const isNewCard = Number(ctype) === 0 || Number(cqueue) === 0 || Number(reps) === 0;
          if (!isNewCard) {
            cardState = "Review";
            if (Number(cqueue) === 1 || Number(cqueue) === 3) {
              cardState = "Learning";
              realDueMs = Number(cdue) * 1000;
            } else if (Number(cqueue) === 2 || Number(ctype) === 2) {
              realDueMs = (colCrtSec + Number(cdue) * 86400) * 1000;
            }
          }
          const fsrs = {
            state: cardState,
            stability,
            difficulty: 5.0,
            elapsedDays: 0,
            scheduledDays: Math.max(0, Number(ivl || 0)),
            reps: isNewCard ? 0 : Number(reps || 0),
            lapses: Number(lapses || 0),
            lastReview: isNewCard ? 0 : Math.max(0, realDueMs - Math.max(1, Number(ivl || 1)) * 86400000),
            due: realDueMs
          };

          // Detect Anki 23.10+ Native Image Occlusion (image-occlusion:rect:left=...)
          const isNativeIO = front.includes("image-occlusion:rect:");
          if (isNativeIO) {
            const masks = [];
            const rectRe = /\{\{c(\d+)::image-occlusion:rect:([^}]+)\}\}/g;
            let rm;
            while ((rm = rectRe.exec(front)) !== null) {
              const cNum = Number(rm[1]);
              const props = rm[2];
              const getProp = (k) => {
                const pm = props.match(new RegExp(k + "=([\\d.]+)"));
                return pm ? parseFloat(pm[1]) * 100 : 0;
              };
              masks.push({
                cNum,
                x: getProp("left"),
                y: getProp("top"),
                w: getProp("width"),
                h: getProp("height")
              });
            }
            const allFieldsHtml = replaceMedia(fields.slice(1).join("<br/>"));
            const imgMatch = allFieldsHtml.match(/<img[^>]+src=["']([^"']+)["'][^>]*>/i);
            const ioImgSrc = imgMatch ? imgMatch[1] : "";
            const ioExtraHtml = allFieldsHtml.replace(/<img[^>]*>/gi, "").trim();
            imported.push({
              id: `apkg-${cid}-${Date.now()}-${idx}`,
              type: "io",
              step: fallbackStep,
              system: fallbackSystem,
              originalDeck: deckName,
              image: ioImgSrc,
              masks,
              activeCNum: Number(cord || 0) + 1,
              extra: ioExtraHtml,
              suspended: isSuspended,
              flag: 0,
              fsrs
            });
          } else {
            const isCloze = /\{\{c\d+::/.test(front);
            imported.push({
              id: `apkg-${cid}-${Date.now()}-${idx}`,
              type: isCloze ? "cloze" : "basic",
              step: fallbackStep,
              system: fallbackSystem,
              originalDeck: deckName,
              text: front,
              extra: back,
              suspended: isSuspended,
              flag: 0,
              fsrs
            });
          }
        });
      }
      db.close();
      return { imported, deckCount: Object.keys(decksJson).length, mediaCount: Object.keys(mediaMap).length };
    }

    // Export cards to real .apkg (ZIP + collection.anki2 + media)
    async function exportApkgFile(cards, presetNewLimit, presetRevLimit) {
      if (!window.JSZip) throw new Error("JSZip 未加载");
      const SQL = await getSqlInstance();
      const db = new SQL.Database();
      const nowSec = Math.floor(Date.now() / 1000);
      const nowMs = Date.now();

      db.run(`
        CREATE TABLE col (id integer primary key, crt integer not null, mod integer not null, scm integer not null, ver integer not null, dty integer not null, usn integer not null, ls integer not null, conf text not null, models text not null, decks text not null, dconf text not null, tags text not null);
        CREATE TABLE notes (id integer primary key, guid text not null, mid integer not null, mod integer not null, usn integer not null, tags text not null, flds text not null, sfld integer not null, csum integer not null, flags integer not null, data text not null);
        CREATE TABLE cards (id integer primary key, nid integer not null, did integer not null, ord integer not null, mod integer not null, usn integer not null, type integer not null, queue integer not null, due integer not null, ivl integer not null, factor integer not null, reps integer not null, lapses integer not null, left integer not null, odue integer not null, odid integer not null, flags integer not null, data text not null);
        CREATE TABLE revlog (id integer primary key, cid integer not null, usn integer not null, ease integer not null, ivl integer not null, lastIvl integer not null, factor integer not null, time integer not null, type integer not null);
        CREATE TABLE graves (usn integer not null, oid integer not null, type integer not null);
      `);

      const mid = 1600000000001;
      const models = {
        [mid]: {
          id: mid, name: "UWorld-Cloze", type: 1, mod: nowSec, usn: -1, sortf: 0, did: 1,
          tmpls: [{ name: "Cloze", ord: 0, qfmt: "{{cloze:Text}}", afmt: "{{cloze:Text}}<br><hr>{{Extra}}", bqfmt: "", bafmt: "", did: null }],
          flds: [{ name: "Text", ord: 0, sticky: false, rtl: false, font: "Arial", size: 20 }, { name: "Extra", ord: 1, sticky: false, rtl: false, font: "Arial", size: 16 }],
          css: ".card { font-family: arial; font-size: 18px; text-align: left; color: black; background-color: white; }"
        }
      };
      const decks = { "1": { id: 1, name: "UWorld QBank Anki", mod: nowSec, usn: -1, lrnToday: [0,0], revToday: [0,0], newToday: [0,0], timeToday: [0,0], collapsed: false, desc: "", dyn: 0, conf: 1 } };
      const dconf = { "1": { id: 1, name: "Default", new: { perDay: presetNewLimit, delays: [1, 10], ints: [1, 4, 7], initialFactor: 2500, order: 1 }, rev: { perDay: presetRevLimit, ease4: 1.3, ivlFct: 1, maxIvl: 36500 }, lapse: { delays: [10], mult: 0, minInt: 1, leechAction: 0, leechFails: 8 }, maxTaken: 60, timer: 0, autoplay: true, replayq: true, mod: nowSec, usn: -1 } };

      db.run("INSERT INTO col VALUES (1,?,?,?,?,0,-1,0,?,?,?,?,?)", [nowSec, nowMs, nowMs, 11, "{}", JSON.stringify(models), JSON.stringify(decks), JSON.stringify(dconf), "{}"]);

      const zip = new window.JSZip();
      const mediaManifest = {};
      let mediaIdx = 0;

      const extractMedia = (htmlStr) => {
        if (!htmlStr) return "";
        return htmlStr.replace(/src=["'](data:image\/([a-zA-Z0-9+]+);base64,([^"']+))["']/gi, (full, dataUri, ext, b64) => {
          const fname = `uw_img_${mediaIdx}.${ext === "jpeg" ? "jpg" : ext}`;
          zip.file(String(mediaIdx), b64, { base64: true });
          mediaManifest[String(mediaIdx)] = fname;
          mediaIdx++;
          return `src="${fname}"`;
        });
      };

      cards.forEach((c, i) => {
        const nid = nowMs + i * 10;
        const cid = nid + 1;
        let front = c.type === "io" ? `<img src="${c.image}">` : (c.text || "");
        let back = c.extra || "";
        front = extractMedia(front);
        back = extractMedia(back);
        const flds = `${front}\x1f${back}`;
        const reps = c.fsrs?.reps || 0;
        const ivl = Math.round(c.fsrs?.scheduledDays || 0);
        const lapses = c.fsrs?.lapses || 0;
        const ctype = reps === 0 ? 0 : 2;
        const cqueue = reps === 0 ? 0 : 2;
        const tag = `${c.step || "Step1"}_${(c.system || "General").replace(/\s+/g, "_")}`;
        db.run("INSERT INTO notes VALUES (?,?,?,?,?,?,?,?,?,0,'')", [nid, `uw_${nid}`, mid, nowSec, -1, ` ${tag} `, flds, 0, 0]);
        db.run("INSERT INTO cards VALUES (?,?,1,0,?,-1,?,?,?,?,2500,?,?,0,0,0,0,'')", [cid, nid, nowSec, ctype, cqueue, i + 1, ivl, reps, lapses]);
      });

      const dbBinary = db.export();
      db.close();
      zip.file("collection.anki2", dbBinary);
      zip.file("media", JSON.stringify(mediaManifest));
      return await zip.generateAsync({ type: "blob" });
    }

      const [medEngCategoryFilter, setMedEngCategoryFilter] = useState("ALL"); // ALL | Word Parts | Abbreviations | NOT Built from Word Parts
      const [medEngDirFilter, setMedEngDirFilter] = useState("ALL"); // ALL | 正→反 | 反→正
      const [medEngNewLimit, setMedEngNewLimit] = useState(30);
      const [medEngRevLimit, setMedEngRevLimit] = useState(120);
      const [medEngQueue, setMedEngQueue] = useState([]);
      const [medEngIdx, setMedEngIdx] = useState(0);
      const [medEngRevealed, setMedEngRevealed] = useState(false);
      const [showMedEngManager, setShowMedEngManager] = useState(false);
      const [medEngMgrTab, setMedEngMgrTab] = useState("browse"); // addCard | json | browse
      const [medEngSearch, setMedEngSearch] = useState("");
      const [medEngSysFilter, setMedEngSysFilter] = useState("ALL");
      const [medEngCatFilter, setMedEngCatFilter] = useState("ALL");
      const [medEngSelectedIds, setMedEngSelectedIds] = useState([]);
      const [medEngMoveTargetSys, setMedEngMoveTargetSys] = useState(MEDENG_SYSTEMS[0].id);
      const [medEngDueDaysInput, setMedEngDueDaysInput] = useState("0");
      const [medEngJsonText, setMedEngJsonText] = useState("");
      const [medEngJsonSys, setMedEngJsonSys] = useState(MEDENG_SYSTEMS[0].id);
      const [medEngJsonCat, setMedEngJsonCat] = useState("Word Parts");
      const [medEngJsonForce, setMedEngJsonForce] = useState(false);
      const [medEngPreviewList, setMedEngPreviewList] = useState(null);
      const [newMeSys, setNewMeSys] = useState(MEDENG_SYSTEMS[0].id);
      const [newMeCat, setNewMeCat] = useState("Word Parts");
      const [newMePartType, setNewMePartType] = useState("Combining Form");
      const [newMeFront, setNewMeFront] = useState("");
      const [newMeBack, setNewMeBack] = useState("");
      const [newMeNote, setNewMeNote] = useState("");
      const [newMeBothSides, setNewMeBothSides] = useState(true);
      const [showMedEngMistakeModal, setShowMedEngMistakeModal] = useState(false);
      const [medEngMistakeRevealed, setMedEngMistakeRevealed] = useState(false);
      useEffect(() => safeSetStorage(getUserKey(currentUser, "ankiRevLog"), ankiRevLog), [ankiRevLog, currentUser]);
      const [showAnkiStatsModal, setShowAnkiStatsModal] = useState(false);
      const [statsStepFilter, setStatsStepFilter] = useState("ALL");
      const [statsSelectedSystems, setStatsSelectedSystems] = useState(() => ALL_SYSTEMS_UNIQUE.map(s => s.id));
      const [statsForecastDays, setStatsForecastDays] = useState(30);

      // Active Test Block & Per-question timer
      const [activeBlock, setActiveBlock] = useState(null);
      const [qTimesMap, setQTimesMap] = useState({}); // { qid: elapsedSecondsOnThisQ }
      const [darkMode, setDarkMode] = useState(false);
      const [textSize, setTextSize] = useState(1);
      const [highlightMode, setHighlightMode] = useState(false);
      const [showLabModal, setShowLabModal] = useState(false);
      const [showNotesModal, setShowNotesModal] = useState(false);
      const [expandedExpOpt, setExpandedExpOpt] = useState(null);
      const [zoomImage, setZoomImage] = useState(null);

      const showToast = useCallback((msg, type = "info") => setToast({ msg, type, id: Date.now() }), []);
      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 2800);
        return () => clearTimeout(t);
      }, [toast]);

      // Sync selectedSystems when switching Step 1 <-> Step 2
      useEffect(() => {
        setSelectedSystems(getSystemsForStep(activeStep).map(s => s.id));
      }, [activeStep]);
      useEffect(() => {
        setAnkiSelectedSystems(getSystemsForStep(ankiStep).map(s => s.id));
      }, [ankiStep]);

      // Study Time Tracker (03:00 AM - 03:00 AM boundary, counts BOTH QBank TEST & ANKI_STUDY!)
      useEffect(() => {
        if (currentUser === "guest") return;
        if (view !== "TEST" && view !== "ANKI_STUDY" && view !== "MEDENG_STUDY") return;
        const timer = setInterval(() => {
          const dk = getStudyDateKey();
          setDailyLogs(prev => {
            const cur = prev[dk] || { studySec: 0, qCount: 0, ankiCount: 0, medEngCount: 0 };
            return { ...prev, [dk]: { ...cur, studySec: (cur.studySec || 0) + 1 } };
          });
          if (view === "TEST" && activeBlock) {
            const curQid = activeBlock.qIds[activeBlock.currentIndex];
            if (curQid && !activeBlock.submitted[curQid]) {
              setQTimesMap(p => ({ ...p, [curQid]: (p[curQid] || 0) + 1 }));
            }
            setActiveBlock(prev => {
              if (!prev) return prev;
              const next = { ...prev, elapsedSec: (prev.elapsedSec || 0) + 1 };
              safeSetStorage(getUserKey(currentUser, "activeBlock"), next);
              setSavedBlock(next);
              return next;
            });
          }
        }, 1000);
        return () => clearInterval(timer);
      }, [view, activeBlock?.id, activeBlock?.currentIndex, currentUser]);

      const todayKey = getStudyDateKey();
      const todayStats = dailyLogs[todayKey] || { studySec: 0, qCount: 0, ankiCount: 0, medEngCount: 0 };
      const checkInStats = useMemo(() => computeCheckInStats(dailyLogs), [dailyLogs]);

      // Helper to show front-page sync progress bar
      const updateSyncProgress = (label, done, total, detail = "") => {
        const pct = total > 0 ? Math.min(100, Math.round((done / total) * 100)) : 0;
        setSyncProgress({ active: true, label, done, total, pct, detail });
      };
      const finishSyncProgress = (label, total) => {
        setSyncProgress({ active: true, label, done: total, total, pct: 100, detail: "同步完成" });
        setTimeout(() => setSyncProgress(null), 1600);
      };

      // Auto-login on startup if enabled
      useEffect(() => {
        if (currentUser !== "guest" || manualLogoutRef.current) return;
        const cred = safeGetStorage(SAVED_CRED_KEY, null);
        if (!cred?.autoLogin || !cred?.email || !cred?.pwdEnc || !cloudCfg.url || !cloudCfg.anonKey) return;
        const pwd = decodeCred(cred.pwdEnc);
        if (!pwd || pwd.length < 6) return;
        const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
        (async () => {
          setAuthBusy(true);
          try {
            const res = await fetch(`${baseUrl}/auth/v1/token?grant_type=password`, {
              method: "POST",
              headers: { "apikey": cloudCfg.anonKey, "Content-Type": "application/json" },
              body: JSON.stringify({ email: cred.email, password: pwd })
            });
            const data = await res.json();
            if (res.ok && (data.user?.email || cred.email)) {
              switchToUser(data.user?.email || cred.email);
              showToast(`已自动登录：${data.user?.email || cred.email}`, "success");
            }
          } catch (e) {}
          finally { setAuthBusy(false); }
        })();
      }, []);

      // Auto-pull global questions, Anki & MedEng on startup with progress bar
      useEffect(() => {
        if (!cloudCfg.url || !cloudCfg.anonKey) return;
        const baseUrl = cloudCfg.url.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
        const hdrs = { "apikey": cloudCfg.anonKey, "Authorization": "Bearer " + cloudCfg.anonKey };
        (async () => {
          const totalModules = 3;
          let doneModules = 0;
          updateSyncProgress("UWorld 公共题库", 0, totalModules, "正在连接云端...");
          try {
            const res = await fetch(`${baseUrl}/rest/v1/medspire_saves?username=eq.__global_questions_v3__&select=data`, { headers: hdrs });
            if (res.ok) {
              const rows = await res.json();
              const remoteQs = rows?.[0]?.data?.questions;
              if (Array.isArray(remoteQs) && remoteQs.length > 0) {
                setQuestions(prev => {
                  const remoteMap = new Map(remoteQs.filter(q => q && q.id).map(q => [q.id, q]));
                  const prevIds = new Set(prev.map(q => q.id));
                  const addedCount = remoteQs.filter(q => q && q.id && !prevIds.has(q.id)).length;
                  const updatedPrev = prev.map(q => remoteMap.has(q.id) ? remoteMap.get(q.id) : q);
                  const newItems = remoteQs.filter(q => q && q.id && !prevIds.has(q.id));
                  if (addedCount > 0) showToast(`已从云端公共库同步 +${addedCount} 道新题！`, "success");
                  return [...newItems, ...updatedPrev];
                });
              }
            }
          } catch (e) {}
          doneModules = 1;
          updateSyncProgress("Anki 公共卡组", doneModules, totalModules, "正在检查 Anki 更新...");
          try {
            const aRes = await fetch(`${baseUrl}/rest/v1/medspire_saves?username=eq.__global_anki_v1__&select=data`, { headers: hdrs });
            if (aRes.ok) {
              const aRows = await aRes.json();
              const remoteAnki = aRows?.[0]?.data?.ankiCards;
              if (Array.isArray(remoteAnki) && remoteAnki.length > 0) {
                setAnkiCards(prev => {
                  const prevMap = new Map(prev.map(c => [c.id, c]));
                  const merged = remoteAnki.map(rc => prevMap.has(rc.id) ? { ...rc, fsrs: prevMap.get(rc.id).fsrs } : rc);
                  const remoteIds = new Set(remoteAnki.map(c => c.id));
                  const localOnly = prev.filter(c => !remoteIds.has(c.id));
                  return [...merged, ...localOnly];
                });
              }
            }
          } catch (e) {}
          doneModules = 2;
          updateSyncProgress("医学英语公共词库", doneModules, totalModules, "正在同步 Exploring Medical Language...");
          try {
            const mRes = await fetch(`${baseUrl}/rest/v1/medspire_saves?username=eq.__global_medeng_v1__&select=data`, { headers: hdrs });
            if (mRes.ok) {
              const mRows = await mRes.json();
              const remoteMe = mRows?.[0]?.data?.medEngCards;
              if (Array.isArray(remoteMe) && remoteMe.length > 0) {
                setMedEngCards(prev => {
                  const prevMap = new Map(prev.map(c => [c.id, c]));
                  const merged = remoteMe.map(rc => prevMap.has(rc.id) ? { ...rc, fsrs: prevMap.get(rc.id).fsrs } : rc);
                  const remoteIds = new Set(remoteMe.map(c => c.id));
                  const localOnly = prev.filter(c => !remoteIds.has(c.id));
                  return [...merged, ...localOnly];
                });
              }
            }
          } catch (e) {}
          finishSyncProgress("全端公共库同步", totalModules);
        })();
      }, []);

      const deleteQuestionById = (qid) => {
        setQuestions(prev => prev.filter(q => q.id !== qid));
        setMistakes(prev => prev.filter(m => m.id !== qid));
        setMarkedIds(prev => prev.filter(id => id !== qid));
        setAttemptedMap(prev => { const n = { ...prev }; delete n[qid]; return n; });
      };

      const handleBatchMoveQuestions = () => {
        if (selectedMoveIds.length === 0) { showToast("请先勾选要移动的题目", "error"); return; }
        const idSet = new Set(selectedMoveIds);
        setQuestions(prev => prev.map(q => idSet.has(q.id) ? { ...q, step: moveTargetStep, system: moveTargetSystem } : q));
        showToast(`已将 ${selectedMoveIds.length} 道题移动至 ${moveTargetStep} · ${moveTargetSystem}`, "success");
        setSelectedMoveIds([]);
      };

      // QBank Eligible Questions
      const stepQuestions = useMemo(() => questions.filter(q => (q.step || "Step 1") === activeStep), [questions, activeStep]);
      const eligibleQuestions = useMemo(() => {
        return stepQuestions.filter(q => {
          if (!selectedSystems.includes(q.system)) return false;
          if (qFilterMode === "Unused") return !attemptedMap[q.id];
          if (qFilterMode === "Incorrect") return mistakes.some(m => m.id === q.id) || (attemptedMap[q.id] && !attemptedMap[q.id].lastCorrect);
          if (qFilterMode === "Marked") return markedIds.includes(q.id);
          return true;
        });
      }, [stepQuestions, selectedSystems, qFilterMode, attemptedMap, mistakes, markedIds]);

      // Anki Eligible Cards (by Step & System, respecting New & Review limits)
      const ankiStepCards = useMemo(() => ankiCards.filter(c => (c.step || "Step 1") === ankiStep), [ankiCards, ankiStep]);
      const ankiDueStats = useMemo(() => {
        const now = Date.now();
        const filtered = ankiStepCards.filter(c => ankiSelectedSystems.includes(c.system));
        const activeFiltered = filtered.filter(c => !c.suspended);
        const newCards = activeFiltered.filter(c => !c.fsrs || c.fsrs.reps === 0);
        const revCards = activeFiltered.filter(c => c.fsrs && c.fsrs.reps > 0 && (c.fsrs.due || 0) <= now);
        return { total: filtered.length, newCards, revCards };
      }, [ankiStepCards, ankiSelectedSystems]);

      const startAnkiSession = () => {
        const pickedNew = ankiDueStats.newCards.slice(0, ankiNewLimit);
        const pickedRev = ankiDueStats.revCards.slice(0, ankiRevLimit);
        const queue = [...pickedRev, ...pickedNew];
        if (queue.length === 0) {
          showToast("当前选定系统没有新卡或到期复习卡！", "info");
          return;
        }
        setAnkiQueue(queue.map(c => c.id));
        setAnkiRevealed(false);
        setView("ANKI_STUDY");
      };

      const startAnkiAheadSession = () => {
        const filtered = ankiStepCards.filter(c => ankiSelectedSystems.includes(c.system));
        if (filtered.length === 0) {
          showToast("当前选定系统暂无任何卡片！", "info");
          return;
        }
        const sorted = [...filtered].sort((a, b) => (a.fsrs?.due || 0) - (b.fsrs?.due || 0)).slice(0, Math.max(20, ankiRevLimit));
        setAnkiQueue(sorted.map(c => c.id));
        setAnkiRevealed(false);
        setView("ANKI_STUDY");
        showToast(`已开启提前复习模式（共 ${sorted.length} 张）`, "info");
      };

      const currentAnkiStudyCard = useMemo(() => {
        if (ankiQueue.length === 0) return null;
        return ankiCards.find(c => c.id === ankiQueue[0]) || null;
      }, [ankiQueue, ankiCards]);

      const handleAnkiStudyRate = (grade) => {
        if (!currentAnkiStudyCard) return;
        const nowMs = Date.now();
        const nextFsrs = fsrsSchedule(currentAnkiStudyCard.fsrs, grade, targetRetention, nowMs);
        setAnkiCards(prev => prev.map(c => c.id === currentAnkiStudyCard.id ? { ...c, fsrs: nextFsrs } : c));
        setAnkiRevLog(prev => [{
          ts: nowMs,
          dayKey: getStudyDateKey(nowMs),
          cardId: currentAnkiStudyCard.id,
          step: currentAnkiStudyCard.step || "Step 1",
          system: currentAnkiStudyCard.system || "General Principles",
          grade,
          stateBefore: currentAnkiStudyCard.fsrs?.state || "New",
          ivlAfter: nextFsrs.scheduledDays || 0
        }, ...prev.slice(0, 4999)]);
        const dk = getStudyDateKey();
        setDailyLogs(prev => {
          const cur = prev[dk] || { studySec: 0, qCount: 0, ankiCount: 0 };
          return { ...prev, [dk]: { ...cur, ankiCount: (cur.ankiCount || 0) + 1 } };
        });
        setAnkiRevealed(false);
        if (grade === 1) {
          // Put Again card back at end of session queue
          setAnkiQueue(prev => [...prev.slice(1), prev[0]]);
        } else {
          setAnkiQueue(prev => prev.slice(1));
        }
        if (ankiQueue.length <= 1 && grade !== 1) {
          showToast("本次 Anki 知识点学习已完成！", "success");
          setView("DASHBOARD");
        }
      };

      // FSRS Mistakes Due
      const dueMistakes = useMemo(() => {
        const now = Date.now();
        const qIdSet = new Set(questions.map(q => q.id));
        return mistakes.filter(m => qIdSet.has(m.id) && (!m.fsrs || (m.fsrs.due || 0) <= now)).sort((a, b) => (a.fsrs?.due || 0) - (b.fsrs?.due || 0));
      }, [mistakes, questions]);
      const currentFsrsCard = dueMistakes[0] || null;

      // Start QBank Test
      const startTestBlock = () => {
        if (eligibleQuestions.length === 0) { showToast("当前筛选条件下暂无题目", "error"); return; }
        const picked = [...eligibleQuestions].sort(() => Math.random() - 0.5).slice(0, Math.min(questionCount, eligibleQuestions.length));
        const block = {
          id: `blk-${Date.now()}`,
          step: activeStep,
          mode: testMode,
          sectionTitle: `${activeStep} · ${testMode} · ${qFilterMode}`,
          qIds: picked.map(q => q.id),
          currentIndex: 0,
          answers: {},
          submitted: {},
          struck: {},
          elapsedSec: 0,
          startedAt: new Date().toLocaleString("zh-CN", { hour12: false })
        };
        setActiveBlock(block);
        setExpandedExpOpt(null);
        setView("TEST");
      };

      const currentQuestion = useMemo(() => {
        if (!activeBlock) return null;
        return questions.find(q => q.id === activeBlock.qIds[activeBlock.currentIndex]) || null;
      }, [activeBlock, questions]);

      const recordAnswerResult = (q, chosen) => {
        const isCorrect = chosen === q.answer;
        setAttemptedMap(prev => ({ ...prev, [q.id]: { lastCorrect: isCorrect, count: (prev[q.id]?.count || 0) + 1 } }));
        const dk = getStudyDateKey();
        setDailyLogs(prev => {
          const cur = prev[dk] || { studySec: 0, qCount: 0, ankiCount: 0 };
          return { ...prev, [dk]: { ...cur, qCount: (cur.qCount || 0) + 1 } };
        });
        if (!isCorrect) {
          const nowMs = Date.now();
          setMistakes(prev => {
            const existing = prev.find(m => m.id === q.id);
            const rec = {
              ...q,
              wrongChoice: chosen,
              timestamp: new Date(nowMs).toLocaleString("zh-CN", { hour12: false }),
              sectionLabel: `${q.step || "Step 1"} · ${q.system}`,
              wrongCount: existing ? (existing.wrongCount || 1) + 1 : 1,
              fsrs: existing?.fsrs ? fsrsSchedule(existing.fsrs, 1, targetRetention, nowMs) : createInitialFSRS(nowMs)
            };
            return [rec, ...prev.filter(m => m.id !== q.id)];
          });
        }
      };

      const handleSubmitQuestion = () => {
        if (!activeBlock || !currentQuestion) return;
        const chosen = activeBlock.answers[currentQuestion.id];
        if (!chosen) { showToast("请先选择一个选项", "error"); return; }
        recordAnswerResult(currentQuestion, chosen);
        setActiveBlock(prev => ({ ...prev, submitted: { ...prev.submitted, [currentQuestion.id]: true } }));
        setExpandedExpOpt(currentQuestion.answer);
      };

      const handleEndBlock = () => {
        if (!activeBlock) return;
        const newSubmitted = { ...activeBlock.submitted };
        let correctCount = 0;
        activeBlock.qIds.forEach(qid => {
          const q = questions.find(item => item.id === qid);
          const chosen = activeBlock.answers[qid];
          if (q && chosen) {
            if (!newSubmitted[qid]) { recordAnswerResult(q, chosen); newSubmitted[qid] = true; }
            if (chosen === q.answer) correctCount++;
          }
        });
        setActiveBlock({ ...activeBlock, submitted: newSubmitted, correctCount });
        safeSetStorage(getUserKey(currentUser, "activeBlock"), null);
        setSavedBlock(null);
        setView("SUMMARY");
      };

      const formatTime = (sec) => {
        const m = Math.floor((sec || 0) / 60).toString().padStart(2, "0");
        const s = ((sec || 0) % 60).toString().padStart(2, "0");
        return `${m}:${s}`;
      };


      // MedEng (Exploring Medical Language) Computed Queues & Handlers
      const medEngFilteredAll = useMemo(() => {
        return medEngCards.filter(c => {
          if (!medEngSelectedSystems.includes(c.system)) return false;
          if (medEngCategoryFilter !== "ALL" && c.category !== medEngCategoryFilter) return false;
          if (medEngDirFilter !== "ALL" && c.direction !== medEngDirFilter) return false;
          return true;
        });
      }, [medEngCards, medEngSelectedSystems, medEngCategoryFilter, medEngDirFilter]);

      const medEngDueStats = useMemo(() => {
        const now = Date.now();
        const active = medEngFilteredAll.filter(c => !c.suspended);
        const newCards = active.filter(c => !c.fsrs || c.fsrs.reps === 0);
        const revCards = active.filter(c => c.fsrs && c.fsrs.reps > 0 && (c.fsrs.due || 0) <= now);
        return { newCards, revCards, total: active.length };
      }, [medEngFilteredAll]);

      const dueMedEngMistakes = useMemo(() => {
        const now = Date.now();
        return medEngMistakes.filter(m => !m.fsrs || (m.fsrs.due || 0) <= now);
      }, [medEngMistakes]);

      const startMedEngSession = () => {
        const pickedNew = medEngDueStats.newCards.slice(0, medEngNewLimit);
        const pickedRev = medEngDueStats.revCards.slice(0, medEngRevLimit);
        const q = [...pickedRev, ...pickedNew].map(c => c.id);
        if (q.length === 0) { showToast("当前筛选条件暂无到期或未学医学英语卡片！", "info"); return; }
        setMedEngQueue(q);
        setMedEngIdx(0);
        setMedEngRevealed(false);
        setView("MEDENG_STUDY");
      };

      const startMedEngAheadSession = () => {
        const active = medEngFilteredAll.filter(c => !c.suspended);
        if (active.length === 0) { showToast("请先勾选至少一个章节或词库", "info"); return; }
        const q = active.slice(0, Math.max(1, medEngNewLimit + medEngRevLimit)).map(c => c.id);
        setMedEngQueue(q);
        setMedEngIdx(0);
        setMedEngRevealed(false);
        setView("MEDENG_STUDY");
      };

      const currentMedEngCard = useMemo(() => {
        if (view !== "MEDENG_STUDY" || !medEngQueue[medEngIdx]) return null;
        return medEngCards.find(c => c.id === medEngQueue[medEngIdx]) || null;
      }, [view, medEngQueue, medEngIdx, medEngCards]);

      const handleMedEngRate = (grade) => {
        if (!currentMedEngCard) return;
        const nextFsrs = fsrsSchedule(currentMedEngCard.fsrs, grade, targetRetention);
        const updatedCard = { ...currentMedEngCard, fsrs: nextFsrs };
        setMedEngCards(prev => prev.map(c => c.id === currentMedEngCard.id ? updatedCard : c));
        setMedEngRevLog(prev => [...prev, { ts: Date.now(), cardId: currentMedEngCard.id, system: currentMedEngCard.system, category: currentMedEngCard.category, grade }]);

        // Track mistakes if rated Again (1), remove if rated Good(3)/Easy(4)
        if (grade === 1) {
          setMedEngMistakes(prev => {
            const exists = prev.some(m => m.id === updatedCard.id);
            return exists ? prev.map(m => m.id === updatedCard.id ? updatedCard : m) : [updatedCard, ...prev];
          });
        } else if (grade >= 3) {
          setMedEngMistakes(prev => prev.filter(m => m.id !== updatedCard.id));
        }

        const dk = getStudyDateKey();
        setDailyLogs(prev => {
          const cur = prev[dk] || { studySec: 0, qCount: 0, ankiCount: 0, medEngCount: 0 };
          return { ...prev, [dk]: { ...cur, medEngCount: (cur.medEngCount || 0) + 1 } };
        });

        setMedEngRevealed(false);
        if (medEngIdx + 1 < medEngQueue.length) {
          setMedEngIdx(i => i + 1);
        } else {
          showToast("🎉 本轮医学英语翻转卡学习完成！", "success");
          setView("DASHBOARD");
        }
      };

      const handleAddSingleMedEngCard = () => {
        if (!isAdmin || !newMeFront.trim() || !newMeBack.trim()) { showToast("请填写正面与反面内容", "error"); return; }
        const nowId = Date.now();
        const ptCn = { "Combining Form": "词干/组合形式", "Prefix": "前缀", "Suffix": "后缀" }[newMePartType] || "";
        const ptLabel = newMeCat === "Word Parts" ? `${newMePartType} (${ptCn})` : newMeCat;
        const created = [{
          id: `me-man-${nowId}-f`,
          system: newMeSys,
          category: newMeCat,
          partType: newMeCat === "Word Parts" ? newMePartType : "",
          direction: "正→反",
          front: newMeFront.trim(),

                                            {MEDENG_SYSTEMS.map(s => <option key={s.id} value={s.id}>{s.id}</option>)}
                                          </select>
                                          <button onClick={() => { const s = new Set(medEngSelectedIds); setMedEngCards(p => p.map(c => s.has(c.id) ? { ...c, system: medEngMoveTargetSys } : c)); setMedEngSelectedIds([]); showToast("已移动章节", "success"); }} className="px-2.5 py-1 rounded bg-teal-700 text-white font-bold">移动</button>
                                          <button onClick={() => { const s = new Set(medEngSelectedIds); setMedEngCards(p => p.filter(c => !s.has(c.id))); setMedEngSelectedIds([]); showToast("已删除选中卡片", "info"); }} className="px-2.5 py-1 rounded bg-rose-600 text-white font-bold">删除</button>
                                        </>
                                      )}
                                    </div>
                                  )}
                                </div>
                                <div className="space-y-1.5 max-h-72 overflow-y-auto">
                                  {filtered.slice(0, 100).map(c => (
                                    <div key={c.id} className="p-2.5 rounded-xl border bg-white flex items-center justify-between gap-3">
                                      <div className="flex items-center gap-2.5 min-w-0">
                                        <input type="checkbox" checked={medEngSelectedIds.includes(c.id)} onChange={() => setMedEngSelectedIds(p => p.includes(c.id) ? p.filter(x => x !== c.id) : [...p, c.id])} className="accent-teal-700" />
                                        <div className="min-w-0">
                                          <div className="font-bold text-slate-800 truncate">{c.front} <span className="text-teal-700 font-normal">→ {c.back}</span></div>
                                          <div className="text-[10px] text-slate-400 truncate">{c.system} · {c.category} · {c.direction} {c.suspended ? "· ⏸已暂停" : ""}</div>
                                        </div>
                                      </div>
                                    </div>
                                  ))}
                                  {filtered.length > 100 && <div className="text-center text-slate-400 py-2">共匹配 {filtered.length} 张，当前仅展示前 100 张，请使用搜索框精确筛选</div>}
                                </div>
                              </>
                            );
                          })()}
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )}

              {/* MODAL: MEDENG MISTAKE FSRS */}
              {showMedEngMistakeModal && (
                <div className="fixed inset-0 z-50 bg-slate-950/75 flex items-center justify-center p-4">
                  <div className="w-full max-w-2xl bg-white rounded-2xl shadow-2xl p-6 max-h-[85vh] flex flex-col space-y-4">
                    <div className="flex justify-between items-center border-b pb-3">
                      <h3 className="font-bold text-lg">医学英语 FSRS 错词复习 ({dueMedEngMistakes.length} 到期)</h3>
                      <button onClick={() => setShowMedEngMistakeModal(false)}><Icon name="x" className="w-5 h-5" /></button>
                    </div>
                    <div className="overflow-y-auto flex-1 space-y-4">
                      {!dueMedEngMistakes[0] ? (
                        <div className="text-center py-12 text-slate-500">🎉 今日到期医学英语错词已全部复习完毕！</div>
                      ) : (() => {
                        const mc = dueMedEngMistakes[0];
                        return (
                          <div className="space-y-4">
                            <div className="text-xs font-bold text-teal-700">{mc.system} · {mc.category} · {mc.direction}</div>
                            <div className="p-6 rounded-2xl bg-slate-50 border text-center text-2xl font-extrabold text-slate-900">{mc.front}</div>
                            {medEngMistakeRevealed && (
                              <div className="p-5 rounded-2xl bg-teal-50 border border-teal-300 text-center text-lg font-bold text-teal-900">{mc.back}</div>
                            )}
                            {!medEngMistakeRevealed ? (
                              <button onClick={() => setMedEngMistakeRevealed(true)} className="w-full py-3 rounded-xl bg-teal-700 text-white font-bold text-sm">显示答案</button>
                            ) : (
                              <div className="grid grid-cols-4 gap-2">
                                {[[1, "Again", "bg-rose-600"], [2, "Hard", "bg-amber-600"], [3, "Good", "bg-emerald-600"], [4, "Easy", "bg-sky-600"]].map(([g, l, c]) => (
                                  <button key={g} onClick={() => {
                                    const next = fsrsSchedule(mc.fsrs, g, targetRetention);
                                    if (g >= 3) {
                                      setMedEngMistakes(p => p.filter(m => m.id !== mc.id));
                                    } else {
                                      setMedEngMistakes(p => p.map(m => m.id === mc.id ? { ...m, fsrs: next } : m));
                                    }
                                    setMedEngCards(p => p.map(card => card.id === mc.id ? { ...card, fsrs: next } : card));
                                    setMedEngMistakeRevealed(false);
                                  }} className={`${c} text-white rounded-xl py-2.5 text-xs font-bold`}>{l} ({formatFsrsInterval(fsrsSchedule(mc.fsrs, g, targetRetention))})</button>
                                ))}
                              </div>
                            )}
                          </div>
                        );
                      })()}
                    </div>
                  </div>
                </div>
              )}

              {showAuthModal && (
                <div className="fixed inset-0 z-50 bg-slate-950/70 flex items-center justify-center p-4">
                  <div className="w-full max-w-md bg-white rounded-2xl p-5 space-y-4 text-xs">
                    <div className="flex justify-between font-bold text-base"><span>账号与云端同步</span><button onClick={() => setShowAuthModal(false)}><Icon name="x" className="w-5 h-5" /></button></div>
                    <div className="p-3 bg-slate-50 rounded-xl border flex justify-between items-center">
                      <span>当前账号: <strong>{currentUser}</strong></span>
                      <button onClick={() => { manualLogoutRef.current = true; switchToUser("guest"); setShowAuthModal(false); }} className="text-rose-600 font-bold">退出登录</button>
                    </div>
                    {isAdmin && (
                      <div className="space-y-2">
                        <input type="text" value={cloudCfg.url} onChange={(e) => setCloudCfg(c => ({ ...c, url: e.target.value }))} className="w-full border rounded px-2.5 py-1.5 font-mono" />
                        <input type="password" value={cloudCfg.anonKey} onChange={(e) => setCloudCfg(c => ({ ...c, anonKey: e.target.value }))} className="w-full border rounded px-2.5 py-1.5 font-mono" />
                      </div>
                    )}
                    <div className="flex gap-2">
                      <button disabled={cloudBusy} onClick={() => syncToSupabase("push")} className="flex-1 py-2.5 rounded-xl bg-blue-700 text-white font-bold">上传全部存档至云端</button>
                      <button disabled={cloudBusy} onClick={() => syncToSupabase("pull")} className="flex-1 py-2.5 rounded-xl bg-emerald-600 text-white font-bold">从云端拉取</button>
                    </div>
                  </div>
                </div>
              )}
            </>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
