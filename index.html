                      ))}
                      <div className="flex items-center gap-1 ml-1">
                        <span className="text-xs text-slate-500">自选:</span>
                        <input
                          type="number"
                          min={1}
                          max={999}
                          value={questionCount === 999 ? "" : questionCount}
                          onChange={(e) => {
                            const v = parseInt(e.target.value, 10);
                            if (!isNaN(v) && v >= 1) setQuestionCount(Math.min(999, v));
                            else if (e.target.value === "") setQuestionCount(1);
                          }}
                          placeholder="输入题数"
                          className="w-20 px-2.5 py-1.5 rounded-lg border border-slate-300 text-xs font-bold text-blue-700 focus:outline-none focus:border-blue-500"
                        />
                      </div>
                    </div>
                    <button onClick={() => startTestBlock()} className="px-7 py-3 rounded-xl bg-blue-700 hover:bg-blue-600 text-white font-extrabold text-sm shadow-lg flex items-center gap-2">
                      <Icon name="play" className="w-4 h-4" />
                      <span>Generate Test (开始刷题)</span>
                    </button>
                  </div>
                </div>
              </main>
            </>
          )}

          {/* VIEW 2: UWORLD TEST SCREEN */}
          {view === "TEST" && activeBlock && currentQuestion && (() => {
            const qid = currentQuestion.id;
            const isSubmitted = Boolean(activeBlock.submitted[qid]);
            const selectedOpt = activeBlock.answers[qid];
            const struckOpts = activeBlock.struck[qid] || [];
            const isMarked = markedIds.includes(qid);
            const isCorrect = selectedOpt === currentQuestion.answer;
            const fontSizeCls = textSize === 0 ? "text-sm" : textSize === 2 ? "text-lg" : "text-base";
            const qHighlights = highlightsMap[qid] || [];

            return (
              <div className="flex-1 flex flex-col h-screen overflow-hidden">
                <header className="bg-[#1b4b91] text-white px-3 py-2 flex items-center justify-between gap-2 shrink-0 shadow">
                  <div className="flex items-center gap-2.5">
                    <div className="text-xs sm:text-sm font-bold leading-tight">
                      <div>Item {activeBlock.currentIndex + 1} of {activeBlock.qIds.length}</div>
                      <div className="text-[10px] text-blue-200 font-mono">{currentQuestion.step || "Step 1"} · QID: {qid}</div>
                    </div>
                    <button onClick={() => setMarkedIds(p => p.includes(qid) ? p.filter(i => i !== qid) : [...p, qid])} className={`px-2.5 py-1 rounded border text-xs font-semibold flex items-center gap-1 ${isMarked ? "bg-rose-600 border-rose-400 text-white" : "bg-blue-800/70 border-blue-500 text-blue-100"}`}>
                      <Icon name="flag" className="w-3.5 h-3.5" /> <span>{isMarked ? "Marked" : "Mark"}</span>
                    </button>
                  </div>

                  <div className="flex items-center gap-1.5">
                    <button disabled={activeBlock.currentIndex === 0} onClick={() => { setActiveBlock(p => ({ ...p, currentIndex: p.currentIndex - 1 })); setExpandedExpOpt(null); }} className="px-2.5 py-1 rounded bg-blue-800 hover:bg-blue-700 disabled:opacity-40 text-xs font-semibold flex items-center gap-1">
                      <Icon name="chevronLeft" className="w-4 h-4" /> <span className="hidden sm:inline">Previous</span>
                    </button>
                    <button disabled={activeBlock.currentIndex >= activeBlock.qIds.length - 1} onClick={() => { setActiveBlock(p => ({ ...p, currentIndex: p.currentIndex + 1 })); setExpandedExpOpt(null); }} className="px-2.5 py-1 rounded bg-blue-800 hover:bg-blue-700 disabled:opacity-40 text-xs font-semibold flex items-center gap-1">
                      <span className="hidden sm:inline">Next</span> <Icon name="chevronRight" className="w-4 h-4" />
                    </button>
                  </div>

                  <div className="flex items-center gap-1 text-xs">
                    <button onClick={() => setHighlightMode(!highlightMode)} className={`px-2 py-1 rounded flex items-center gap-1 ${highlightMode ? "bg-yellow-400 text-slate-950 font-bold" : "hover:bg-blue-800"}`} title="选中题干文字自动荧光笔划线">
                      <Icon name="highlighter" className="w-4 h-4" /> <span className="hidden md:inline">{highlightMode ? "划线中" : "荧光笔"}</span>
                    </button>
                    <button onClick={() => setShowLabModal(true)} className="px-2 py-1 rounded hover:bg-blue-800 flex items-center gap-1" title="Lab Values">
                      <Icon name="beaker" className="w-4 h-4" /> <span className="hidden md:inline">Lab</span>
                    </button>
                    <button onClick={() => setShowNotesModal(true)} className={`px-2 py-1 rounded hover:bg-blue-800 flex items-center gap-1 ${notesMap[qid] ? "text-amber-300" : ""}`} title="Notes">
                      <Icon name="fileText" className="w-4 h-4" /> <span className="hidden md:inline">Notes</span>
                    </button>
                    <button onClick={() => setDarkMode(!darkMode)} className="px-2 py-1 rounded hover:bg-blue-800" title="Reverse Color">
                      <Icon name={darkMode ? "sun" : "moon"} className="w-4 h-4" />
                    </button>
                    <button onClick={() => setTextSize(s => (s + 1) % 3)} className="px-2 py-1 rounded hover:bg-blue-800 font-bold" title="Text Zoom">
                      A{textSize === 2 ? "+" : textSize === 0 ? "-" : ""}
                    </button>
                  </div>
                </header>

                <div className="flex-1 flex overflow-hidden">
                  <aside className={`w-12 sm:w-14 shrink-0 overflow-y-auto border-r flex flex-col items-center py-2 gap-1 ${darkMode ? "bg-slate-900 border-slate-800" : "bg-slate-200 border-slate-300"}`}>
                    {activeBlock.qIds.map((id, idx) => {
                      const sub = activeBlock.submitted[id];
                      const ans = activeBlock.answers[id];
                      const qObj = questions.find(q => q.id === id);
                      const isCur = idx === activeBlock.currentIndex;
                      let cls = darkMode ? "text-slate-400 hover:bg-slate-800" : "text-slate-700 hover:bg-slate-300";
                      if (isCur) cls = "bg-blue-700 text-white font-bold";
                      else if (sub && qObj) cls = ans === qObj.answer ? "text-emerald-600 font-bold" : "text-rose-600 font-bold";
                      return (
                        <button key={id} onClick={() => { setActiveBlock(p => ({ ...p, currentIndex: idx })); setExpandedExpOpt(null); }} className={`relative w-9 h-8 rounded text-xs flex items-center justify-center ${cls}`}>
                          <span>{idx + 1}</span>
                          {markedIds.includes(id) && <span className="absolute top-0.5 right-0.5 w-1.5 h-1.5 rounded-full bg-rose-500" />}
                        </button>
                      );
                    })}
                  </aside>

                  <main className={`flex-1 overflow-y-auto p-4 sm:p-8 ${darkMode ? "bg-slate-950 text-slate-100" : "bg-white text-slate-900"}`}>
                    <div className="max-w-4xl mx-auto space-y-6 pb-12">
                      <div className="flex flex-wrap items-center justify-between gap-2 text-xs text-slate-400">
                        <span>System: <strong className={darkMode ? "text-sky-300" : "text-blue-700"}>{currentQuestion.system}</strong></span>
                        <div className="flex items-center gap-2">
                          <button onClick={() => handleHighlightSelection(qid)} className="px-2 py-0.5 rounded bg-yellow-100 text-yellow-900 border border-yellow-300 hover:bg-yellow-200">
                            高亮选中文字
                          </button>
                          {qHighlights.length > 0 && (
                            <button onClick={() => setHighlightsMap(p => ({ ...p, [qid]: [] }))} className="text-slate-400 hover:text-rose-500">清除划线</button>
                          )}
                        </div>
                      </div>

                      {/* Stem with Highlighter */}
                      <p
                        ref={stemRef}
                        onMouseUp={() => highlightMode && handleHighlightSelection(qid)}
                        onTouchEnd={() => highlightMode && handleHighlightSelection(qid)}
                        className={`font-serif-clinical leading-relaxed whitespace-pre-line ${fontSizeCls}`}
                      >
                        {renderHighlightedStem(currentQuestion.stem, qHighlights)}
                      </p>

                      {currentQuestion.vignetteImage && (
                        <div className="my-4">
                          <img src={currentQuestion.vignetteImage} alt="Clinical Exhibit" onClick={() => setZoomImage(currentQuestion.vignetteImage)} className="max-h-80 rounded-lg border border-slate-300 shadow cursor-zoom-in mx-auto" />
                        </div>
                      )}

                      {/* Options */}
                      <div className={`rounded-xl border-2 p-3 sm:p-4 space-y-2 ${darkMode ? "border-slate-700 bg-slate-900/60" : "border-sky-200 bg-slate-50/70"}`}>
                        {Object.entries(currentQuestion.options).map(([key, text]) => {
                          const isSel = selectedOpt === key;
                          const isAns = currentQuestion.answer === key;
                          const isStruck = struckOpts.includes(key);
                          let rowStyle = darkMode ? "hover:bg-slate-800 border-transparent" : "hover:bg-blue-50 border-transparent";
                          if (!isSubmitted && isSel) rowStyle = darkMode ? "bg-blue-900/50 border-blue-500" : "bg-blue-100/80 border-blue-500";
                          if (isSubmitted) {
                            if (isAns) rowStyle = darkMode ? "bg-emerald-950/60 border-emerald-500" : "bg-emerald-50 border-emerald-500";
                            else if (isSel && !isAns) rowStyle = darkMode ? "bg-rose-950/60 border-rose-500" : "bg-rose-50 border-rose-500";
                          }
                          return (
                            <div key={key} className={`flex items-center justify-between gap-2 px-3 py-2.5 rounded-lg border ${rowStyle}`}>
                              <button disabled={isSubmitted} onClick={() => setActiveBlock(p => ({ ...p, answers: { ...p.answers, [qid]: key } }))} className="flex-1 text-left flex items-start gap-3">
                                <span className={`w-6 h-6 rounded-full border flex items-center justify-center text-xs font-bold shrink-0 mt-0.5 ${
                                  !isSubmitted && isSel ? "bg-blue-600 text-white border-blue-600" :
                                  isSubmitted && isAns ? "bg-emerald-600 text-white border-emerald-600" :
                                  isSubmitted && isSel ? "bg-rose-600 text-white border-rose-600" :
                                  darkMode ? "border-slate-500 text-slate-300" : "border-slate-400 text-slate-700"
                                }`}>{key}</span>
                                <span className={`${fontSizeCls} ${isStruck ? "line-through opacity-45" : ""}`}>{text}</span>
                              </button>
                              <div className="flex items-center gap-2 shrink-0">
                                {isSubmitted && isAns && <Icon name="check" className="w-5 h-5 text-emerald-500" />}
                                {isSubmitted && isSel && !isAns && <Icon name="x" className="w-5 h-5 text-rose-500" />}
                                {!isSubmitted && (
                                  <button onClick={() => setActiveBlock(p => {
                                    const cur = p.struck[qid] || [];
                                    return { ...p, struck: { ...p.struck, [qid]: cur.includes(key) ? cur.filter(k => k !== key) : [...cur, key] } };
                                  })} className="text-[11px] px-2 py-0.5 rounded border border-slate-400/40 text-slate-400 hover:text-slate-200">{isStruck ? "恢复" : "划掉"}</button>
                                )}
                              </div>
                            </div>
                          );
                        })}
                      </div>

                      {!isSubmitted && (
                        <button onClick={handleSubmitQuestion} className="px-7 py-2.5 rounded-lg bg-[#2563eb] hover:bg-blue-500 text-white font-bold text-sm shadow">Submit</button>
                      )}

                      {/* Verbatim UWorld Explanation + Dedicated General Mechanism Section + Images + EO */}
                      {isSubmitted && (
                        <div className={`rounded-xl border p-5 space-y-5 ${darkMode ? "bg-slate-900 border-slate-700" : "bg-slate-50 border-slate-200"}`}>
                          <div className={`flex items-center justify-between pb-3 border-b ${darkMode ? "border-slate-800" : "border-slate-200"}`}>
                            <span className={`font-extrabold text-sm ${isCorrect ? "text-emerald-500" : "text-rose-500"}`}>
                              {isCorrect ? "✓ Correct" : `✗ Incorrect · Correct Answer: ${currentQuestion.answer}`}
                            </span>
                            <span className="text-xs text-slate-400">Explanation</span>
                          </div>

                          {/* Choice-by-choice verbatim rationales */}
                          {currentQuestion.explanations && Object.keys(currentQuestion.explanations).length > 0 && (
                            <div className="space-y-2">
                              {Object.entries(currentQuestion.explanations).map(([k, exp]) => {
                                const isOpen = expandedExpOpt === k || k === currentQuestion.answer || k === selectedOpt;
                                return (
                                  <div key={k} className={`rounded-lg border p-3 text-xs sm:text-sm ${k === currentQuestion.answer ? (darkMode ? "border-emerald-700 bg-emerald-950/30" : "border-emerald-300 bg-emerald-50/70") : (darkMode ? "border-slate-800 bg-slate-950/50" : "border-slate-200 bg-white")}`}>
                                    <button onClick={() => setExpandedExpOpt(expandedExpOpt === k ? null : k)} className="w-full flex items-center justify-between font-bold">
                                      <span>Choice {k} {k === currentQuestion.answer ? "(Correct)" : ""}</span>
                                      <Icon name={isOpen ? "chevronDown" : "chevronRight"} className="w-4 h-4" />
                                    </button>
                                    {isOpen && <p className="mt-1.5 leading-relaxed whitespace-pre-line opacity-95">{exp}</p>}
                                  </div>
                                );
                              })}
                            </div>
                          )}

                          {/* Dedicated Disease / Mechanism / Treatment Section */}
                          {currentQuestion.generalExplanation && (
                            <div className={`p-4 rounded-xl border space-y-2 ${darkMode ? "bg-slate-950 border-slate-800" : "bg-white border-slate-200"}`}>
                              <div className="text-xs font-extrabold uppercase tracking-wider text-blue-600">疾病机制与诊疗深度解析 (Disease / Mechanism / Management)</div>
                              <p className="text-xs sm:text-sm leading-relaxed whitespace-pre-line">{currentQuestion.generalExplanation}</p>
                            </div>
                          )}

                          {/* Explanation Exhibit Images */}
                          {Array.isArray(currentQuestion.explanationImages) && currentQuestion.explanationImages.length > 0 && (
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                              {currentQuestion.explanationImages.map((imgSrc, i) => (
                                <img key={i} src={imgSrc} alt={`Exhibit ${i + 1}`} onClick={() => setZoomImage(imgSrc)} className="rounded-lg border border-slate-300 max-h-64 mx-auto cursor-zoom-in shadow" />
                              ))}
                            </div>
                          )}

                          {/* Verbatim Educational Objective */}
                          {currentQuestion.educationalObjective && (
                            <div className={`p-4 rounded-xl border ${darkMode ? "bg-amber-950/30 border-amber-700/50 text-amber-200" : "bg-amber-50 border-amber-300 text-slate-800"}`}>
                              <div className="text-xs font-extrabold uppercase tracking-wider text-amber-600 mb-1">Educational Objective</div>
                              <p className="text-xs sm:text-sm leading-relaxed whitespace-pre-line">{currentQuestion.educationalObjective}</p>
                            </div>
                          )}
                        </div>
                      )}
                    </div>
                  </main>
                </div>

                <footer className="bg-[#1b4b91] text-white px-4 py-2 flex items-center justify-between text-xs shrink-0">
                  <div className="flex items-center gap-3">
                    <span className="font-mono">Block Time: {formatTime(activeBlock.elapsedSec)}</span>
                    <span className="hidden sm:inline px-2 py-0.5 rounded bg-blue-800">{activeBlock.mode}</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <button onClick={() => { setView("DASHBOARD"); showToast("进度已自动保存", "info"); }} className="px-3 py-1 rounded bg-blue-800 hover:bg-blue-700 flex items-center gap-1 font-semibold">
                      <Icon name="pause" className="w-3.5 h-3.5" /> <span>Suspend</span>
                    </button>
                    <button onClick={handleEndBlock} className="px-3 py-1 rounded bg-rose-600 hover:bg-rose-500 flex items-center gap-1 font-bold">
                      <Icon name="stop" className="w-3.5 h-3.5" /> <span>End Block</span>
                    </button>
                  </div>
                </footer>
              </div>
            );
          })()}

          {/* VIEW 3: BLOCK SUMMARY */}
          {view === "SUMMARY" && activeBlock && (
            <div className="flex-1 flex items-center justify-center p-6">
              <div className="w-full max-w-xl bg-white rounded-2xl border shadow-xl p-6 sm:p-8 text-center space-y-5">
                <h2 className="text-2xl font-extrabold text-slate-800">Block Complete</h2>
                <div className="text-5xl font-black text-blue-700">{Math.round(((activeBlock.correctCount || 0) / activeBlock.qIds.length) * 100)}%</div>
                <p className="text-sm text-slate-600">答对 {activeBlock.correctCount || 0} / {activeBlock.qIds.length} 题（错题已自动加入 FSRS 复习队列）</p>
                <div className="flex justify-center gap-3">
                  <button onClick={() => setView("TEST")} className="px-5 py-2.5 rounded-xl bg-slate-100 text-slate-800 font-bold text-sm">逐题复盘</button>
                  <button onClick={() => setView("DASHBOARD")} className="px-6 py-2.5 rounded-xl bg-blue-700 text-white font-bold text-sm">返回首页</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: FSRS MISTAKE NOTEBOOK & DAILY REVIEW */}
          {showMistakeModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-3 sm:p-6">
              <div className="w-full max-w-4xl bg-white text-slate-900 rounded-2xl shadow-2xl flex flex-col max-h-[90vh]">
                <div className="px-5 py-4 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2">
                  <div className="flex items-center gap-2">
                    <Icon name="brain" className="w-5 h-5 text-blue-700" />
                    <h3 className="font-bold text-lg">FSRS 错题记忆复习系统</h3>
                  </div>
                  <div className="flex items-center gap-3 text-xs">
                    <label className="flex items-center gap-1.5 text-slate-600">
                      <span>目标保留率:</span>
                      <select value={targetRetention} onChange={(e) => setTargetRetention(Number(e.target.value))} className="border rounded px-2 py-1 font-bold text-blue-700">
                        <option value={0.85}>85%</option>
                        <option value={0.90}>90% (推荐)</option>
                        <option value={0.95}>95%</option>
                      </select>
                    </label>
                    <button onClick={() => setShowMistakeModal(false)} className="p-1.5 text-slate-400 hover:text-slate-700"><Icon name="x" className="w-5 h-5" /></button>
                  </div>
                </div>

                <div className="px-5 pt-3 border-b border-slate-200 flex gap-4 text-sm font-semibold">
                  <button onClick={() => setMistakeTab("fsrs")} className={`pb-2.5 border-b-2 ${mistakeTab === "fsrs" ? "border-blue-600 text-blue-700" : "border-transparent text-slate-500"}`}>
                    今日到期 FSRS 卡片 ({dueMistakes.length})
                  </button>
                  <button onClick={() => setMistakeTab("all")} className={`pb-2.5 border-b-2 ${mistakeTab === "all" ? "border-blue-600 text-blue-700" : "border-transparent text-slate-500"}`}>
                    全部错题档案 ({mistakes.length})
                  </button>
                </div>

                <div className="p-5 overflow-y-auto flex-1">
                  {mistakeTab === "fsrs" ? (
                    !currentFsrsCard ? (
                      <div className="text-center py-14 space-y-2">
                        <div className="text-3xl">🎉</div>
                        <div className="font-bold text-slate-800">今日到期的 FSRS 错题卡片已全部复习完毕！</div>
                        <p className="text-xs text-slate-500">系统已根据你的记忆稳定性（S）与难度（D）安排好后续复习时间。</p>
                      </div>
                    ) : (
                      <div className="space-y-4">
                        <div className="flex flex-wrap items-center justify-between gap-2 text-xs bg-slate-50 p-3 rounded-xl border">
                          <div className="flex items-center gap-2">
                            <span className="px-2 py-0.5 rounded bg-blue-100 text-blue-800 font-bold">{currentFsrsCard.step || "Step 1"} · {currentFsrsCard.system}</span>
                            <span className="text-slate-500">状态: {currentFsrsCard.fsrs?.state || "New"} · 稳定性 S={currentFsrsCard.fsrs?.stability || 0.4}d · 难度 D={currentFsrsCard.fsrs?.difficulty || 5.0}</span>
                          </div>
                          <span className="font-mono text-slate-400">上次做错: {currentFsrsCard.timestamp}</span>
                        </div>

                        <p className="font-serif-clinical text-sm sm:text-base leading-relaxed whitespace-pre-line">{currentFsrsCard.stem}</p>
                        {currentFsrsCard.vignetteImage && <img src={currentFsrsCard.vignetteImage} alt="Exhibit" className="max-h-60 rounded-lg border mx-auto" />}

                        <div className="space-y-1.5">
                          {Object.entries(currentFsrsCard.options || {}).map(([k, v]) => (
                            <button
                              key={k}
                              disabled={fsrsRevealed}
                              onClick={() => { setFsrsChosen(k); setFsrsRevealed(true); }}
                              className={`w-full text-left px-3.5 py-2.5 rounded-lg border text-xs sm:text-sm flex items-start gap-2.5 ${
                                fsrsRevealed && k === currentFsrsCard.answer ? "bg-emerald-50 border-emerald-500 font-semibold" :
                                fsrsRevealed && fsrsChosen === k && k !== currentFsrsCard.answer ? "bg-rose-50 border-rose-500" :
                                "bg-white hover:bg-blue-50 border-slate-200"
                              }`}
                            >
                              <span className="font-bold">{k}.</span>
                              <span>{v}</span>
                            </button>
                          ))}
                        </div>

                        {!fsrsRevealed ? (
                          <button onClick={() => setFsrsRevealed(true)} className="w-full py-2.5 rounded-xl bg-blue-700 text-white font-bold text-sm">
                            显示答案与解析（评估记忆保留率）
                          </button>
                        ) : (
                          <div className="space-y-4">
                            <div className="p-4 rounded-xl bg-slate-50 border space-y-2 text-xs">
                              <div className="font-bold text-emerald-700">正确答案: {currentFsrsCard.answer}</div>
                              {currentFsrsCard.explanations?.[currentFsrsCard.answer] && <p className="whitespace-pre-line">{currentFsrsCard.explanations[currentFsrsCard.answer]}</p>}
                              {currentFsrsCard.generalExplanation && (
                                <div className="pt-2 border-t">
                                  <strong className="text-blue-700">机制解析:</strong>
                                  <p className="whitespace-pre-line mt-0.5">{currentFsrsCard.generalExplanation}</p>
                                </div>
                              )}
                              {currentFsrsCard.educationalObjective && (
                                <div className="p-2.5 rounded bg-amber-50 border border-amber-200 text-amber-900">
                                  <strong>EO:</strong> {currentFsrsCard.educationalObjective}
                                </div>
                              )}
                            </div>

                            {/* 4 FSRS Rating Buttons with live calculated next interval */}
                            <div className="grid grid-cols-4 gap-2">
                              {[
                                [1, "Again 重来", "bg-rose-600 hover:bg-rose-500"],
                                [2, "Hard 困难", "bg-amber-600 hover:bg-amber-500"],
                                [3, "Good 良好", "bg-emerald-600 hover:bg-emerald-500"],
                                [4, "Easy 简单", "bg-sky-600 hover:bg-sky-500"]
                              ].map(([g, label, cls]) => {
                                const sim = fsrsSchedule(currentFsrsCard.fsrs, g, targetRetention);
                                return (
                                  <button key={g} onClick={() => handleFsrsRate(g)} className={`${cls} text-white rounded-xl py-2.5 px-2 text-center shadow transition`}>
                                    <div className="font-bold text-xs">{label}</div>
                                    <div className="text-[11px] opacity-90 mt-0.5">{formatFsrsInterval(sim)}</div>
                                  </button>
                                );
                              })}
                            </div>
                          </div>
                        )}
                      </div>
                    )
                  ) : (
                    <div className="space-y-3 text-xs">
                      <div className="flex gap-2">
                        {["ALL", "Step 1", "Step 2"].map(st => (
                          <button key={st} onClick={() => setMistakeStepFilter(st)} className={`px-3 py-1 rounded-lg font-bold ${mistakeStepFilter === st ? "bg-blue-700 text-white" : "bg-slate-100 text-slate-600"}`}>{st}</button>
                        ))}
                      </div>
                      {mistakes.filter(m => mistakeStepFilter === "ALL" || (m.step || "Step 1") === mistakeStepFilter).map((m, i) => (
                        <div key={m.id + i} className="p-3.5 rounded-xl border bg-slate-50 space-y-1.5">
                          <div className="flex justify-between font-bold text-blue-800">
                            <span>{m.sectionLabel || `${m.step} · ${m.system}`}</span>
                            <span className="font-mono text-slate-500">{m.timestamp} · 下次复习: {m.fsrs?.due ? new Date(m.fsrs.due).toLocaleDateString() : "今日"}</span>
                          </div>
                          <p className="text-slate-700 line-clamp-2">{m.stem}</p>
                          <div className="text-slate-600">误选: <strong className="text-rose-600">{m.wrongChoice}</strong> | 正解: <strong className="text-emerald-600">{m.answer}</strong> | 错 {m.wrongCount || 1} 次</div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* MODAL: QUESTION MANAGER (JSON + MANUAL WITH PASTE IMAGE + OPTIONAL AI PDF + BROWSE) */}
          {showQManager && (
            <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-3 sm:p-6">
              <div className="w-full max-w-4xl bg-white text-slate-900 rounded-2xl shadow-2xl flex flex-col max-h-[90vh]">
                <div className="px-5 py-4 border-b border-slate-200 flex items-center justify-between">
                  <h3 className="font-bold text-lg flex items-center gap-2"><Icon name="database" className="w-5 h-5 text-blue-600" /> 题库管理与原汁原味导入 ({questions.length})</h3>
                  <button onClick={() => setShowQManager(false)}><Icon name="x" className="w-5 h-5 text-slate-400" /></button>
                </div>

                <div className="px-5 pt-3 border-b border-slate-200 flex flex-wrap gap-4 text-sm font-semibold">
                  {isAdmin && (
                    <>
                      <button onClick={() => setQmTab("json")} className={`pb-2.5 border-b-2 ${qmTab === "json" ? "border-blue-600 text-blue-700" : "border-transparent text-slate-500"}`}>JSON 批量导入 (免 API Key)</button>
                      <button onClick={() => setQmTab("manual")} className={`pb-2.5 border-b-2 ${qmTab === "manual" ? "border-emerald-600 text-emerald-700" : "border-transparent text-slate-500"}`}>单题录入 (支持 Ctrl+V 贴图)</button>
                      <button onClick={() => setQmTab("pdf")} className={`pb-2.5 border-b-2 ${qmTab === "pdf" ? "border-purple-600 text-purple-700" : "border-transparent text-slate-500"}`}>PDF + API 导入 (需 Key)</button>
                    </>
                  )}
                  <button onClick={() => setQmTab("browse")} className={`pb-2.5 border-b-2 ${qmTab === "browse" ? "border-blue-600 text-blue-700" : "border-transparent text-slate-500"}`}>题库浏览与同步 ({questions.length})</button>
                </div>

                <div className="p-5 overflow-y-auto flex-1 text-xs">
                  {qmTab === "json" && (
                    <div className="space-y-3">
                      <div className="p-3 rounded-xl bg-slate-50 border border-slate-200 space-y-2.5">
                        <div className="font-bold text-slate-700">选择导入目标卡组（Step 板块 & 器官系统）：</div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                          <select value={jsonImportStep} onChange={(e) => setJsonImportStep(e.target.value)} className="border border-slate-300 rounded-lg px-3 py-2 bg-white font-semibold">
                            {STEPS.map(s => <option key={s} value={s}>{s}</option>)}
                          </select>
                          <select value={jsonImportSystem} onChange={(e) => setJsonImportSystem(e.target.value)} className="border border-slate-300 rounded-lg px-3 py-2 bg-white">
                            {UWORLD_SYSTEMS.map(s => <option key={s.id} value={s.id}>{s.id} ({s.cn})</option>)}
                          </select>
                        </div>
                        <div className="flex flex-wrap items-center justify-between gap-2">
                          <label className="flex items-center gap-1.5 text-slate-600 cursor-pointer">
                            <input type="checkbox" checked={jsonForceDeck} onChange={(e) => setJsonForceDeck(e.target.checked)} className="accent-blue-700" />
                            <span>强制全部归入上方选定卡组（忽略 JSON 原带分类）</span>
                          </label>
                          <label className="px-3 py-1.5 rounded-lg bg-white border border-blue-300 text-blue-700 font-bold cursor-pointer hover:bg-blue-50 flex items-center gap-1.5">
                            <Icon name="upload" className="w-3.5 h-3.5" />
                            <span>直接选择 .json 文件导入</span>
                            <input type="file" accept=".json,application/json" className="hidden" onChange={(e) => {
                              const f = e.target.files?.[0];
                              if (!f) return;
                              const reader = new FileReader();
                              reader.onload = (ev) => handleImportJson(String(ev.target?.result || ""));
                              reader.readAsText(f);
                              e.target.value = "";
                            }} />
                          </label>
                        </div>
                      </div>
                      <textarea rows={9} value={importJsonText} onChange={(e) => setImportJsonText(e.target.value)} className="w-full border border-slate-300 rounded-xl p-3 font-mono" placeholder='或直接在此粘贴 JSON 数组: [{"step":"Step 1","system":"General Principles","stem":"...","options":{"A":"..."},"answer":"A","explanations":{"A":"..."},"generalExplanation":"...","educationalObjective":"..."}]' />
                      <div className="flex justify-between items-center">
                        {isAdmin ? (
                        <button disabled={cloudBusy} onClick={publishGlobalQuestions} className="px-3.5 py-2 rounded-lg bg-emerald-50 border border-emerald-300 text-emerald-700 font-bold flex items-center gap-1">
                          <Icon name="cloud" className="w-4 h-4" /> 发布至全端公共库（热更新）
                        </button>
                        ) : (<span className="text-slate-400">仅管理员账号可发布公共库</span>)}
                        <button onClick={() => handleImportJson()} className="px-5 py-2.5 rounded-xl bg-blue-700 text-white font-bold">批量导入 JSON</button>
                      </div>
                    </div>
                  )}

                  {qmTab === "manual" && (
                    <div className="space-y-3">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <select value={manStep} onChange={(e) => setManStep(e.target.value)} className="border rounded-lg px-3 py-2 font-semibold">
                          {STEPS.map(s => <option key={s} value={s}>{s}</option>)}
                        </select>
                        <select value={manSystem} onChange={(e) => setManSystem(e.target.value)} className="border rounded-lg px-3 py-2">
                          {UWORLD_SYSTEMS.map(s => <option key={s.id} value={s.id}>{s.id} ({s.cn})</option>)}
                        </select>
                      </div>
                      <textarea rows={4} value={manStem} onChange={(e) => setManStem(e.target.value)} placeholder="粘贴原汁原味英文题干..." className="w-full border rounded-xl p-3" />
                      <div onPaste={(e) => handlePasteImage(e, "vignette")} className="p-3 rounded-xl border-2 border-dashed border-slate-300 bg-slate-50 text-center">
                        <div className="text-slate-500">点击此处后按 <strong>Ctrl+V</strong> 直接粘贴题干病例截图（心电图/胸片/病理切片）</div>
                        {manVignetteImg && <img src={manVignetteImg} alt="Preview" className="max-h-36 mx-auto mt-2 rounded border" />}
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        {["A", "B", "C", "D", "E"].map(k => (
                          <div key={k} className="flex gap-1.5 items-center">
                            <span className="font-bold w-4">{k}.</span>
                            <input type="text" value={manOpts[k]} onChange={(e) => setManOpts(p => ({ ...p, [k]: e.target.value }))} placeholder={`选项 ${k}`} className="flex-1 border rounded-lg px-2.5 py-1.5" />
                          </div>
                        ))}
                      </div>
                      <div className="flex items-center gap-2">
                        <span className="font-bold">正确答案:</span>
                        {["A", "B", "C", "D", "E"].map(k => (
                          <button key={k} onClick={() => setManAns(k)} className={`px-3 py-1 rounded font-bold border ${manAns === k ? "bg-emerald-600 text-white border-emerald-600" : "bg-white"}`}>{k}</button>
                        ))}
                      </div>
                      <textarea rows={3} value={manGenExp} onChange={(e) => setManGenExp(e.target.value)} placeholder="粘贴原文机制 / 疾病 / 治疗解析（将独立显示在题目下方）..." className="w-full border rounded-xl p-3" />
                      <div onPaste={(e) => handlePasteImage(e, "exp")} className="p-3 rounded-xl border-2 border-dashed border-slate-300 bg-slate-50 text-center">
                        <div className="text-slate-500">点击此处后按 <strong>Ctrl+V</strong> 粘贴解析配图（可连贴多张）</div>
                        {manExpImgs.length > 0 && (
                          <div className="flex flex-wrap gap-2 justify-center mt-2">
                            {manExpImgs.map((src, i) => <img key={i} src={src} alt="" className="h-20 rounded border" />)}
                          </div>
                        )}
                      </div>
                      <textarea rows={2} value={manEO} onChange={(e) => setManEO(e.target.value)} placeholder="粘贴原文 Educational Objective..." className="w-full border rounded-xl p-3" />
                      <button onClick={handleSaveManualQuestion} className="w-full py-2.5 rounded-xl bg-emerald-600 text-white font-bold text-sm">保存该题至题库</button>
                    </div>
                  )}

                  {qmTab === "pdf" && (
                    <div className="space-y-3">
                      <p className="text-amber-700 bg-amber-50 border border-amber-200 p-3 rounded-xl">
                        说明：纯前端网页若要直接解析 PDF，必须调用外部视觉 API（需自备 Gemini/OpenAI Key）。若无 Key，建议使用「JSON 批量导入」或「单题录入（Ctrl+V 贴图）」。
                      </p>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <select value={aiCfg.provider} onChange={(e) => setAiCfg(c => ({ ...c, provider: e.target.value }))} className="border rounded-lg px-3 py-2">
                          <option value="gemini">Google Gemini API</option>
                          <option value="openai">OpenAI 兼容接口</option>
                        </select>
                        <input type="password" value={aiCfg.apiKey} onChange={(e) => setAiCfg(c => ({ ...c, apiKey: e.target.value }))} placeholder="输入 API Key" className="border rounded-lg px-3 py-2" />
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                        <input type="file" accept="application/pdf" onChange={(e) => setPdfFile(e.target.files?.[0] || null)} className="sm:col-span-2 border rounded-lg p-2" />
                        <input type="text" value={pdfPageRange} onChange={(e) => setPdfPageRange(e.target.value)} placeholder="页码 1-12" className="border rounded-lg px-3 py-2" />
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <select value={pdfStep} onChange={(e) => setPdfStep(e.target.value)} className="border rounded-lg px-3 py-2">{STEPS.map(s => <option key={s}>{s}</option>)}</select>
                        <select value={pdfSystem} onChange={(e) => setPdfSystem(e.target.value)} className="border rounded-lg px-3 py-2">{UWORLD_SYSTEMS.map(s => <option key={s.id} value={s.id}>{s.id}</option>)}</select>
                      </div>
                      {pdfProgress && <div className="p-2 bg-slate-100 rounded">{pdfProgress}</div>}
                      <button disabled={pdfBusy} onClick={handlePdfAiImport} className="px-5 py-2.5 rounded-xl bg-blue-700 text-white font-bold">{pdfBusy ? "解析中..." : "开始 API 识别"}</button>
                    </div>
                  )}

                  {qmTab === "browse" && (
                    <div className="space-y-2.5">
                      <div className="flex flex-wrap gap-2">
                        <select value={qmStepFilter} onChange={(e) => setQmStepFilter(e.target.value)} className="border rounded-lg px-2.5 py-1.5">
                          <option value="ALL">全部 Step</option>
                          {STEPS.map(s => <option key={s} value={s}>{s}</option>)}
                        </select>
                        <select value={qmSysFilter} onChange={(e) => setQmSysFilter(e.target.value)} className="border rounded-lg px-2.5 py-1.5 flex-1">
                          <option value="ALL">全部 22 个系统</option>
                          {UWORLD_SYSTEMS.map(s => <option key={s.id} value={s.id}>{s.id}</option>)}
                        </select>
                        <button disabled={cloudBusy} onClick={pullGlobalQuestions} className="px-3 py-1.5 rounded-lg bg-blue-700 text-white font-bold">{cloudBusy ? "同步中..." : "同步云端最新题库"}</button>
                        {isAdmin && <button disabled={cloudBusy} onClick={publishGlobalQuestions} className="px-3 py-1.5 rounded-lg bg-emerald-600 text-white font-bold">发布至云端公共库</button>}
                      </div>
                      {questions.filter(q => (qmStepFilter === "ALL" || q.step === qmStepFilter) && (qmSysFilter === "ALL" || q.system === qmSysFilter)).map(q => (
                        <div key={q.id} className="p-3 rounded-xl border flex justify-between gap-2">
                          <div>
                            <div className="font-bold text-blue-700">{q.step} · {q.system} · 答案 {q.answer} {q.vignetteImage ? "🖼️" : ""}</div>
                            <p className="text-slate-700 line-clamp-2 mt-0.5">{q.stem}</p>
                          </div>
                          {isAdmin && <button onClick={() => setQuestions(p => p.filter(item => item.id !== q.id))} className="text-slate-400 hover:text-rose-600"><Icon name="trash" className="w-4 h-4" /></button>}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* MODAL: LAB VALUES, NOTES, ZOOM, AUTH */}
          {showLabModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/60 flex items-center justify-center p-4">
              <div className="w-full max-w-2xl bg-white rounded-2xl shadow-2xl flex flex-col max-h-[82vh]">
                <div className="px-5 py-3.5 bg-blue-900 text-white rounded-t-2xl flex justify-between"><span className="font-bold text-sm">Lab Values</span><button onClick={() => setShowLabModal(false)}><Icon name="x" className="w-5 h-5" /></button></div>
                <div className="p-5 overflow-y-auto space-y-4 text-xs">
                  {LAB_VALUES.map(sec => (
                    <div key={sec.cat}><h4 className="font-bold text-blue-800 border-b pb-1 mb-2">{sec.cat}</h4><div className="grid grid-cols-1 sm:grid-cols-2 gap-1.5">{sec.items.map(([k, v]) => <div key={k} className="flex justify-between bg-slate-50 px-2.5 py-1.5 rounded"><span>{k}</span><span className="font-mono">{v}</span></div>)}</div></div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {showNotesModal && currentQuestion && (
            <div className="fixed inset-0 z-50 bg-slate-950/60 flex items-center justify-center p-4">
              <div className="w-full max-w-lg bg-white rounded-2xl p-5 space-y-3">
                <div className="flex justify-between border-b pb-2"><h4 className="font-bold text-sm">个人笔记</h4><button onClick={() => setShowNotesModal(false)}><Icon name="x" className="w-5 h-5" /></button></div>
                <textarea rows={6} value={notesMap[currentQuestion.id] || ""} onChange={(e) => setNotesMap(p => ({ ...p, [currentQuestion.id]: e.target.value }))} className="w-full border rounded-xl p-3 text-sm" placeholder="记录思考或机制..." />
                <div className="flex justify-end"><button onClick={() => setShowNotesModal(false)} className="px-4 py-2 rounded-lg bg-blue-700 text-white text-xs font-bold">保存</button></div>
              </div>
            </div>
          )}

          {zoomImage && (
            <div onClick={() => setZoomImage(null)} className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4 cursor-zoom-out">
              <img src={zoomImage} alt="Zoom" className="max-w-full max-h-[90vh] rounded-lg" />
            </div>
          )}

          {showAuthModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/70 flex items-center justify-center p-4">
              <div className="w-full max-w-lg bg-white rounded-2xl shadow-2xl flex flex-col max-h-[85vh]">
                <div className="px-5 py-4 border-b flex justify-between"><h3 className="font-bold text-base">账号与 Supabase 云同步</h3><button onClick={() => setShowAuthModal(false)}><Icon name="x" className="w-5 h-5" /></button></div>
                <div className="px-5 pt-3 border-b flex gap-4 text-sm font-semibold">
                  <button onClick={() => setAuthTab("account")} className={`pb-2 border-b-2 ${authTab === "account" ? "border-blue-600 text-blue-700" : "border-transparent text-slate-500"}`}>注册 / 登录</button>
                  <button onClick={() => setAuthTab("sync")} className={`pb-2 border-b-2 ${authTab === "sync" ? "border-emerald-600 text-emerald-700" : "border-transparent text-slate-500"}`}>云端同步</button>
                </div>
                <div className="p-5 space-y-3 text-xs">
                  {authTab === "account" ? (
                    <>
                      <div className="p-3 bg-slate-50 rounded-xl border flex justify-between"><span>当前账号: <strong>{currentUser}</strong></span>{currentUser !== "guest" && <button onClick={() => { switchToUser("guest"); setShowAuthModal(false); }} className="text-rose-600">退出</button>}</div>
                      <div className="flex gap-2">
                        <button onClick={() => { setAuthMode("login"); setOtpSent(false); }} className={`flex-1 py-2 rounded-lg font-bold ${authMode === "login" ? "bg-blue-700 text-white" : "bg-slate-100"}`}>登录</button>
                        <button onClick={() => { setAuthMode("register"); setOtpSent(false); }} className={`flex-1 py-2 rounded-lg font-bold ${authMode === "register" ? "bg-emerald-600 text-white" : "bg-slate-100"}`}>邮箱注册</button>
                        <button onClick={() => { setAuthMode("reset"); setOtpSent(false); }} className={`flex-1 py-2 rounded-lg font-bold ${authMode === "reset" ? "bg-amber-600 text-white" : "bg-slate-100 text-slate-600"}`}>忘记密码</button>
                      </div>
                      <input type="email" value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} placeholder="输入你的邮箱地址" className="w-full border rounded-xl px-3 py-2.5 text-sm" />
                      {authMode !== "reset" && (
                        <input type="password" value={authPassword} onChange={(e) => setAuthPassword(e.target.value)} placeholder="密码 (至少 6 位)" className="w-full border rounded-xl px-3 py-2.5 text-sm" />
                      )}
                      {(authMode === "register" || authMode === "reset") && (
                        <div className="space-y-2 p-3 rounded-xl bg-slate-50 border border-slate-200">
                          <div className="flex gap-2">
                            <input type="text" value={authOtp} onChange={(e) => setAuthOtp(e.target.value)} placeholder="输入邮箱收到的验证码" className="flex-1 border rounded-lg px-3 py-2 bg-white font-mono" />
                            <button disabled={authBusy || otpCooldown > 0} onClick={() => sendEmailOtp(authMode)} className="px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 disabled:opacity-50 text-white font-bold shrink-0">
                              {authBusy ? "发送中..." : otpCooldown > 0 ? `${otpCooldown}s 后重发` : otpSent ? "重新发送" : "发送验证码"}
                            </button>
                          </div>
                          {authMode === "reset" && (
                            <input type="password" value={newResetPassword} onChange={(e) => setNewResetPassword(e.target.value)} placeholder="设置新密码 (至少 6 位)" className="w-full border rounded-lg px-3 py-2 bg-white" />
                          )}
                        </div>
                      )}
                      <button disabled={authBusy} onClick={handleAuthSubmit} className="w-full py-2.5 rounded-xl bg-blue-700 hover:bg-blue-600 disabled:opacity-50 text-white font-bold text-sm">
                        {authBusy ? "处理中..." : authMode === "register" ? "验证邮箱并完成注册" : authMode === "reset" ? "验证并重设密码" : "邮箱密码登录"}
                      </button>
                    </>
                  ) : (
                    <>
                      {isAdmin ? (
                        <>
                          <input type="text" value={cloudCfg.url} onChange={(e) => setCloudCfg(c => ({ ...c, url: e.target.value }))} className="w-full border rounded-lg px-3 py-2 font-mono" />
                          <input type="password" value={cloudCfg.anonKey} onChange={(e) => setCloudCfg(c => ({ ...c, anonKey: e.target.value }))} className="w-full border rounded-lg px-3 py-2 font-mono" />
                        </>
                      ) : (
                        <div className="p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800">
                          ✅ 已自动连接云端同步服务，可直接备份或拉取当前账号的刷题进度与错题本。
                        </div>
                      )}
                      <div className="flex gap-2">
                        <button disabled={cloudBusy} onClick={() => syncToSupabase("push")} className="flex-1 py-2.5 rounded-xl bg-blue-700 text-white font-bold">上传至云端</button>
                        <button disabled={cloudBusy} onClick={() => syncToSupabase("pull")} className="flex-1 py-2.5 rounded-xl bg-emerald-600 text-white font-bold">从云端拉取</button>
                      </div>
                    </>
                  )}
                </div>
              </div>
            </div>
          )}
            </>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
