    async function hashPassword(pw) {
      try {
        if (window.crypto && window.crypto.subtle) {
          const buf = await window.crypto.subtle.digest("SHA-256", new TextEncoder().encode(pw));
          return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
        }
      } catch (e) {}
      let h = 0;
      for (let i = 0; i < pw.length; i++) h = ((h << 5) - h) + pw.charCodeAt(i);
      return "fb_" + Math.abs(h).toString(16);
    }


    // =========================================================================
    // 4. SMART AI QUESTION PARSER (JSON & Unstructured Markdown/Text)
    // =========================================================================
    function parseSmartQuestions(rawText, defaultSystem = "Cardiovascular") {
      const trimmed = (rawText || "").trim();
      if (!trimmed) return { questions: [], error: "请输入题目文本或 JSON 数组" };

      // 1. Try JSON first
      if (trimmed.startsWith("[") || trimmed.startsWith("{")) {
        try {
          const parsed = JSON.parse(trimmed);
          const arr = Array.isArray(parsed) ? parsed : [parsed];
          const valid = arr
            .filter(q => q && q.stem && q.options && q.answer)
            .map((q, idx) => ({
              id: q.id || `q-imp-${Date.now()}-${idx}`,
              system: SYSTEMS.some(s => s.id === q.system) || q.system === "General" ? q.system : defaultSystem,
              difficulty: ["Easy", "Medium", "Hard"].includes(q.difficulty) ? q.difficulty : "Medium",
              stem: String(q.stem).trim(),
              vignetteImage: q.vignetteImage || undefined,
              options: q.options,
              answer: String(q.answer).trim().toUpperCase().charAt(0),
              explanations: q.explanations || {},
              educationalObjective: q.educationalObjective || "已从 JSON 导入核心临床考点。"
            }));
          if (valid.length > 0) return { questions: valid, error: null };
        } catch (e) {
          // Fall through to regex parser
        }
      }

      // 2. Robust Regex Parser for Markdown / Unstructured AI Output
      const blocks = trimmed.split(/(?=(?:^|\n)(?:#{1,3}\s*)?(?:Question|Q\d+|题干|题目)\s*[:：.\d])/i).filter(b => b.trim().length > 15);
      const blocksToParse = blocks.length > 0 ? blocks : [trimmed];
      const extracted = [];

      blocksToParse.forEach((block, idx) => {
        // Extract Answer
        const ansMatch = block.match(/(?:Answer|Correct\s*Answer|答案|正确答案)\s*[:：]\s*\*{0,2}([A-E])\*{0,2}/i);
        // Extract EO
        const eoMatch = block.match(/(?:Educational\s*Objective|EO|核心考点|考点总结)\s*[:：]\s*([\s\S]+?)(?=\n(?:Question|Q\d+|题干|题目)|$)/i);
        // Extract Explanation
        const expMatch = block.match(/(?:Explanation|解析|答案解析)\s*[:：]\s*([\s\S]+?)(?=\n(?:Educational\s*Objective|EO|核心考点|考点总结)|$)/i);

        // Extract Options A-E
        const optionRegex = /(?:^|\n)\s*[-*]?\s*\*{0,2}([A-E])[.)、:：]\*{0,2}\s+([^\n]+)/g;
        const options = {};
        let firstOptionIndex = block.length;
        let match;
        while ((match = optionRegex.exec(block)) !== null) {
          if (match.index < firstOptionIndex) firstOptionIndex = match.index;
          options[match[1].toUpperCase()] = match[2].trim();
        }

        // Stem is everything before first option, stripped of header label
        let stemRaw = block.slice(0, firstOptionIndex)
          .replace(/^(?:#{1,3}\s*)?(?:Question|Q\d+|题干|题目)\s*\d*\s*[:：.]?\s*/i, "")
          .trim();

        if (stemRaw && Object.keys(options).length >= 2 && ansMatch) {
          const ansKey = ansMatch[1].toUpperCase();
          const expText = expMatch ? expMatch[1].trim() : "暂无详细解析，请结合临床指南复盘。";
          const explanations = {};
          Object.keys(options).forEach(k => {
            explanations[k] = k === ansKey ? `正确选项。${expText}` : `干扰项。${expText}`;
          });
          extracted.push({
            id: `q-regex-${Date.now()}-${idx}`,
            system: defaultSystem,
            difficulty: "Medium",
            stem: stemRaw,
            options,
            answer: ansKey,
            explanations,
            educationalObjective: eoMatch ? eoMatch[1].trim() : "AI 文本智能解析导入考点。"
          });
        }
      });

      if (extracted.length === 0) {
        return { questions: [], error: "未能识别标准题干/选项(A-E)/答案(Answer: X) 格式，请检查粘贴内容。" };
      }
      return { questions: extracted, error: null };
    }

        let disc = [...currentDiscard];
        let h = [...currentHand];
        for (let i = 0; i < count; i++) {
          if (d.length === 0) {
            if (disc.length === 0) break;
            d = shuffleArray(disc);
            disc = [];
            sfx.shuffle();
            showToast("抽牌堆已空，弃牌堆已重洗！", "info");
          }
          h.push(d.shift());
        }
        return { nextDraw: d, nextDiscard: disc, nextHand: h };
      }, [showToast]);

      // Execute Card Effect after normal play or diagnostic modal
      const executeCardEffect = useCallback((card, mode, extraBonus = false) => {
        const cost = getCardEffectiveCost(card);
        if (energy < cost) {
          showToast("能量不足！无法打出该卡牌", "error");
          return;
        }

        let value = card.baseValue;
        if (mode === "crit") {
          value = card.boostedValue;
        } else if (mode === "fail") {
          value = Math.max(1, Math.floor(card.baseValue * 0.5));
        }

        // Remove card from hand -> discard
        const remainingHand = hand.filter(c => c.uid !== card.uid);
        let nextDraw = [...drawPile];
        let nextDiscard = [...discardPile, card];
        let nextHand = [...remainingHand];
        let nextEnergy = energy - cost;

        // Handle extra draw or energy bonus
        if (card.draw) {
          const res = drawCards(card.draw, nextDraw, nextDiscard, nextHand);
          nextDraw = res.nextDraw; nextDiscard = res.nextDiscard; nextHand = res.nextHand;
        }
        if (mode === "crit" && extraBonus) {
          nextEnergy += 1;
          const res = drawCards(1, nextDraw, nextDiscard, nextHand);
          nextDraw = res.nextDraw; nextDiscard = res.nextDiscard; nextHand = res.nextHand;
          spawnFloatText("player", "+1 能量 / +1 抽牌", "text-emerald-300");
        }

        setEnergy(nextEnergy);
        setHand(nextHand);
        setDrawPile(nextDraw);
        setDiscardPile(nextDiscard);
        setSelectedCardUid(null);

        // Apply combat math
        if (card.type === "Attack") {
          sfx.attack();
          setShakeTarget("enemy");
          setTimeout(() => setShakeTarget(null), 420);

          setEnemy(prevEnemy => {
            if (!prevEnemy) return prevEnemy;
            let dmg = value;
            let newBlock = prevEnemy.block;
            if (!card.pierce && newBlock > 0) {
              const absorbed = Math.min(newBlock, dmg);
              newBlock -= absorbed;
              dmg -= absorbed;
            }
            const newHp = Math.max(0, prevEnemy.hp - dmg);
            spawnFloatText("enemy", `-${value}${mode === "crit" ? " CRIT!" : ""}`, mode === "crit" ? "text-emerald-400 font-extrabold" : "text-rose-400");

            // Check enemy death
            if (newHp <= 0) {
              setTimeout(() => {
                sfx.victory();
                setGold(g => g + (prevEnemy.isBoss ? 80 : 35));
                if (nodeIndex >= 2 || prevEnemy.isBoss) {
                  setRunHistory(h => [{ date: new Date().toLocaleDateString(), path: currentPath, result: "通关胜利" }, ...h.slice(0, 9)]);
                  setScreen("VICTORY");
                } else {
                  const pool = shuffleArray(CARD_LIBRARY.filter(c => c.id !== "c-strike" && c.id !== "c-defend")).slice(0, 3);
                  setRewardChoices(pool);
                  setScreen("REWARD");
                }
              }, 480);
            }
            return { ...prevEnemy, block: newBlock, hp: newHp };
          });
        } else {
          sfx.defend();
          setPlayerBlock(b => b + value);
          spawnFloatText("player", `+${value} 格挡`, "text-sky-300");
          if (card.heal) {
            const healAmt = mode === "crit" ? card.heal * 2 : card.heal;
            setPlayerHp(hp => Math.min(playerMaxHp, hp + healAmt));
            spawnFloatText("player", `+${healAmt} HP`, "text-emerald-300");
          }
        }

        if (mode === "fail") {
          setShakeTarget("player");
          setTimeout(() => setShakeTarget(null), 420);
          setPlayerHp(hp => {
            const nhp = Math.max(0, hp - 3);
            if (nhp <= 0) {
              setTimeout(() => {
                setRunHistory(h => [{ date: new Date().toLocaleDateString(), path: currentPath, result: "误诊阵亡" }, ...h.slice(0, 9)]);
                setScreen("DEFEAT");
              }, 450);
            }
            return nhp;
          });
          spawnFloatText("player", "-3 HP (误诊反噬)", "text-red-400");
        }
      }, [energy, hand, drawPile, discardPile, getCardEffectiveCost, showToast, drawCards, spawnFloatText, nodeIndex, currentPath, playerMaxHp]);

      // Trigger Overcharge Diagnostic Modal
      const handleOverchargeClick = (card) => {
        const cost = getCardEffectiveCost(card);
        if (energy < cost) {
          showToast("能量不足！无法启动精准诊断", "error");
          return;
        }
        // Prefer questions matching currentPath, fallback to all
        const pathQs = questions.filter(q => q.system === currentPath);
        const pool = pathQs.length > 0 ? pathQs : questions;
        if (pool.length === 0) {
          showToast("题库为空，请先在题库管理中添加题目！", "error");
          return;
        }
        const picked = pool[Math.floor(Math.random() * pool.length)];
        setDiagModal({
          card,
          question: picked,
          selectedOpt: null,
          submitted: false,
          expandedOpt: null
        });
      };

      const submitDiagnosticAnswer = () => {
        if (!diagModal || !diagModal.selectedOpt || diagModal.submitted) return;
        const isCorrect = diagModal.selectedOpt === diagModal.question.answer;
        if (isCorrect) {
          sfx.critSuccess();
          setCritEffect(true);
          setTimeout(() => setCritEffect(false), 750);
        } else {
          sfx.alarmFail();
          // Add or update Mistake Notebook with exact datetime, section, node, and wrong count
          const exactTime = new Date().toLocaleString("zh-CN", { hour12: false });
          const sysLabel = (SYSTEMS.find(s => s.id === currentPath)?.label) || currentPath;
          const sectionLabel = `${sysLabel} · 第 ${nodeIndex + 1}/3 节点 (${enemy?.name || "临床遭遇"}) · 第 ${turnCount} 回合`;
          setMistakes(prev => {
            const existing = prev.find(m => m.id === diagModal.question.id);
            const record = {
              ...diagModal.question,
              wrongChoice: diagModal.selectedOpt,
              timestamp: exactTime,
              sectionLabel,
              cardName: diagModal.card?.name || "精准诊断",
              wrongCount: existing ? (existing.wrongCount || 1) + 1 : 1
            };
            return [record, ...prev.filter(m => m.id !== diagModal.question.id)];
          });
        }
        setDiagModal(prev => ({
          ...prev,
          submitted: true,
          expandedOpt: prev.question.answer
        }));
      };

      const confirmDiagnosticAndPlay = () => {
        if (!diagModal || !diagModal.submitted) return;
        const isCorrect = diagModal.selectedOpt === diagModal.question.answer;
        const card = diagModal.card;
        setDiagModal(null);
        executeCardEffect(card, isCorrect ? "crit" : "fail", isCorrect);
      };

      // End Turn -> Enemy acts -> Start Next Player Turn
      const handleEndTurn = () => {
        if (isEnemyTurn || !enemy || enemy.hp <= 0) return;
        setIsEnemyTurn(true);
        setSelectedCardUid(null);

        // Discard remaining hand
        const afterHandDiscard = [...discardPile, ...hand];
        setHand([]);
        setDiscardPile(afterHandDiscard);

        setTimeout(() => {
          const intent = enemy.intents[enemyIntentIdx % enemy.intents.length];
          if (intent.type === "Attack" || intent.type === "Debuff") {
            sfx.attack();
            setShakeTarget("player");
            setTimeout(() => setShakeTarget(null), 420);

            setPlayerBlock(prevBlock => {
              const absorbed = Math.min(prevBlock, intent.value);
              const unblockedDmg = intent.value - absorbed;
              if (unblockedDmg > 0) {
                setPlayerHp(hp => {
                  const nhp = Math.max(0, hp - unblockedDmg);
                  if (nhp <= 0) {
                    setTimeout(() => {
                      setRunHistory(h => [{ date: new Date().toLocaleDateString(), path: currentPath, result: "战斗阵亡" }, ...h.slice(0, 9)]);
                      setScreen("DEFEAT");
                    }, 480);
                  }
                  return nhp;
                });
                spawnFloatText("player", `-${unblockedDmg} HP`, "text-red-400");
              } else {
                spawnFloatText("player", "格挡成功!", "text-sky-300");
              }
              return 0; // Block clears at start of player's next turn
            });
          } else if (intent.type === "Defend") {
            sfx.defend();
            setEnemy(e => e ? { ...e, block: e.block + intent.value } : e);
            spawnFloatText("enemy", `+${intent.value} 格挡`, "text-sky-300");
          }

          // Advance to next player turn if alive
          setTimeout(() => {
            setPlayerHp(currHp => {
              if (currHp > 0) {
                setPlayerBlock(0);
                setEnergy(maxEnergy);
                setTurnCount(t => t + 1);
                setEnemyIntentIdx(idx => idx + 1);
                const { nextDraw, nextDiscard, nextHand } = drawCards(5, drawPile, afterHandDiscard, []);
                setDrawPile(nextDraw);
                setDiscardPile(nextDiscard);
                setHand(nextHand);
                setIsEnemyTurn(false);
              }
              return currHp;
            });
          }, 550);
        }, 550);
      };

      const handlePickRewardCard = (card) => {
        const updatedDeck = [...playerDeck, card];
        setPlayerDeck(updatedDeck);
        showToast(`已将【${card.name}】加入卡组！`, "success");
        setScreen("REST");
      };

      const handleSkipReward = () => {
        setScreen("REST");
      };

      const handleProceedNextNode = (healOption) => {
        if (healOption) {
          const healAmt = Math.floor(playerMaxHp * 0.3);
          setPlayerHp(hp => Math.min(playerMaxHp, hp + healAmt));
          showToast(`休整恢复 +${healAmt} HP`, "success");
        }
        const nextIdx = nodeIndex + 1;
        setNodeIndex(nextIdx);
        startCombat(currentPath, nextIdx, playerDeck);
      };

      const handleImportQuestions = () => {
        const res = parseSmartQuestions(importText, importSystem);
        if (res.error) {
          showToast(res.error, "error");
          return;
        }
        setQuestions(prev => [...res.questions, ...prev]);
        setImportText("");
        showToast(`成功解析并导入 ${res.questions.length} 道临床题目！`, "success");
        setQmTab("browse");
      };

      const handleResetQuestions = () => {
        setQuestions(INITIAL_QUESTIONS);
        showToast("已重置为默认预置题库", "info");
      };

      const currentSystemMeta = SYSTEMS.find(s => s.id === currentPath) || SYSTEMS[0];
      const filteredQuestions = useMemo(() => {
        if (qmFilter === "ALL") return questions;
        return questions.filter(q => q.system === qmFilter);
      }, [questions, qmFilter]);

      // =========================================================================
      // 6. RENDER HELPERS & SCREENS
      // =========================================================================
      return (
        <div className={`min-h-screen flex flex-col bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950 ${critEffect ? "animate-crit" : ""}`}>
          {/* Toast Notification */}
          {toast && (
            <div className={`fixed top-16 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl shadow-2xl border backdrop-blur-md text-sm font-medium flex items-center gap-2 transition-all ${
              toast.type === "error" ? "bg-red-950/90 border-red-500/50 text-red-200" :
              toast.type === "success" ? "bg-emerald-950/90 border-emerald-500/50 text-emerald-200" :
              "bg-slate-800/90 border-sky-500/40 text-sky-200"
            }`}>
              <Icon name={toast.type === "error" ? "alert" : "sparkles"} className="w-4 h-4 shrink-0" />
              <span>{toast.msg}</span>
            </div>
          )}

          {/* Top HUD */}
          <header className="sticky top-0 z-30 bg-slate-900/85 backdrop-blur-md border-b border-slate-800 px-3 sm:px-6 py-2.5">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
              <div className="flex items-center gap-3">
                <button onClick={() => setScreen("MENU")} className="flex items-center gap-2 font-bold text-base sm:text-lg tracking-tight text-white hover:text-sky-400 transition">
                  <span className="w-8 h-8 rounded-lg bg-gradient-to-br from-sky-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-sky-500/20">
                    <Icon name="stethoscope" className="w-4 h-4 text-white" />
                  </span>
                  <span>MedSpire <span className="hidden sm:inline text-xs font-normal text-slate-400">医学尖塔</span></span>
                </button>

                {screen !== "MENU" && screen !== "PATH_SELECT" && (
                  <div className="hidden md:flex items-center gap-3 pl-3 border-l border-slate-700/80 text-xs">
                    <div className="flex items-center gap-1.5 text-rose-400 font-semibold">
                      <Icon name="heart" className="w-4 h-4 fill-rose-500/30" />
                      <span>{playerHp}/{playerMaxHp}</span>
                    </div>
                    <div className="flex items-center gap-1 text-amber-400 font-semibold">
                      <Icon name="coins" className="w-4 h-4" />
                      <span>{gold}</span>
                    </div>
                    <span className={`px-2.5 py-0.5 rounded-full border ${currentSystemMeta.badge}`}>
                      Path: {currentSystemMeta.en} ({nodeIndex + 1}/3)
                    </span>
                  </div>
                )}
              </div>

              <div className="flex items-center gap-1.5 sm:gap-2">
                <button
                  onClick={() => setShowAuthModal(true)}
                  className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs sm:text-sm text-slate-200 transition"
                >
                  <Icon name="user" className="w-4 h-4 text-emerald-400" />
                  <span className="max-w-[72px] truncate">{currentUser === "guest" ? "登录/存档" : currentUser}</span>
                </button>

                <button
                  onClick={() => setShowInstallModal(true)}
                  title="安装为桌面/平板图标"
                  className="hidden sm:flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-slate-300 transition"
                >
                  <Icon name="monitor" className="w-4 h-4 text-indigo-400" />
                  <span>桌面版</span>
                </button>

                <button
                  onClick={() => setShowMistakeModal(true)}
                  className="relative flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs sm:text-sm text-slate-200 transition"
                >
                  <Icon name="book" className="w-4 h-4 text-amber-400" />
                  <span className="hidden sm:inline">错题本</span>
                  {mistakes.length > 0 && (
                    <span className="px-1.5 py-0.2 rounded-full bg-rose-500 text-white text-[10px] font-bold">
                      {mistakes.length}
                    </span>
                  )}
                </button>

                <button
                  onClick={() => setShowQManager(true)}
                  className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs sm:text-sm text-slate-200 transition"
                >
                  <Icon name="database" className="w-4 h-4 text-sky-400" />
                  <span className="hidden sm:inline">题库</span>
                  <span className="text-xs text-sky-400 font-semibold">({questions.length})</span>
                </button>

                <button
                  onClick={toggleMute}
                  title={muted ? "取消静音" : "静音"}
                  className="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 transition"
                >
                  <Icon name={muted ? "volumeX" : "volume2"} className="w-4 h-4" />
                </button>
              </div>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="flex-1 flex flex-col max-w-7xl w-full mx-auto px-3 sm:px-6 py-4">
            {/* 1. MAIN MENU */}
            {screen === "MENU" && (
              <div className="flex-1 flex flex-col items-center justify-center text-center py-8">
                <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-sky-500/10 border border-sky-500/30 text-sky-300 text-xs font-medium mb-5">
                  <Icon name="sparkles" className="w-3.5 h-3.5" />
                  <span>Slay the Spire × UWorld 临床决策 Roguelike</span>
                </div>
                <h1 className="text-4xl sm:text-6xl font-extrabold tracking-tight bg-gradient-to-r from-white via-sky-200 to-indigo-300 bg-clip-text text-transparent mb-4">
                  医学尖塔 MedSpire
                </h1>
                <p className="max-w-xl text-slate-400 text-sm sm:text-base mb-8 leading-relaxed">
                  在回合制卡牌交锋中触发<strong className="text-emerald-400">【精准诊断】</strong>，直面高仿真临床病例题。答对即刻超载翻倍并抽牌回能；误诊则反噬扣血并自动归档至病历错题本。
                </p>

                {savedActiveRun && (
                  <div className="w-full max-w-xl mb-6 p-4 rounded-2xl bg-gradient-to-r from-emerald-950/90 to-sky-950/90 border border-emerald-500/50 shadow-xl text-left flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                    <div>
                      <div className="flex items-center gap-2 text-emerald-300 text-xs font-bold mb-1">
                        <Icon name="clock" className="w-4 h-4" />
                        <span>检测到上次未完成的查房进度 ({savedActiveRun.savedAt})</span>
                      </div>
                      <div className="text-sm font-semibold text-white">
                        {SYSTEMS.find(s => s.id === savedActiveRun.currentPath)?.label || savedActiveRun.currentPath} · 第 {savedActiveRun.nodeIndex + 1}/3 节点 ({savedActiveRun.enemy?.name}) · HP {savedActiveRun.playerHp}/{savedActiveRun.playerMaxHp}
                      </div>
                    </div>
                    <div className="flex items-center gap-2 shrink-0">
                      <button onClick={resumeSavedRun} className="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-xs transition">
                        继续上次进度
                      </button>
                      <button onClick={discardSavedRun} className="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs transition">
                        放弃
                      </button>
                    </div>
                  </div>
                )}

                <div className="flex flex-wrap items-center justify-center gap-3 mb-10">
                  <button
                    onClick={() => setScreen("PATH_SELECT")}
                    className="px-7 py-3.5 rounded-xl bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white font-bold text-base shadow-xl shadow-sky-500/25 transition transform hover:-translate-y-0.5 flex items-center gap-2"
                  >
                    <Icon name="sword" className="w-5 h-5" />
                    <span>开始临床查房征程</span>
                  </button>
                  <button
                    onClick={() => setShowQManager(true)}
                    className="px-5 py-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-semibold text-base transition flex items-center gap-2"
                  >
                    <Icon name="database" className="w-5 h-5 text-sky-400" />
                    <span>AI 题库导入与管理</span>
                  </button>
                </div>

                {runHistory.length > 0 && (
                  <div className="w-full max-w-md bg-slate-900/70 border border-slate-800 rounded-2xl p-4 text-left">
                    <h3 className="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2.5">近期查房战绩</h3>
                    <div className="space-y-1.5">
                      {runHistory.slice(0, 4).map((r, i) => (
                        <div key={i} className="flex items-center justify-between text-xs py-1 border-b border-slate-800/60 last:border-0">
                          <span className="text-slate-300">{r.path}</span>
                          <span className={r.result === "通关胜利" ? "text-emerald-400 font-semibold" : "text-rose-400"}>{r.result}</span>
                          <span className="text-slate-500">{r.date}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* 2. PATH SELECTION */}
            {screen === "PATH_SELECT" && (
              <div className="flex-1 flex flex-col justify-center py-4">
                <div className="text-center mb-8">
                  <h2 className="text-2xl sm:text-3xl font-bold text-white mb-2">选择临床专科轮转路径</h2>
                  <p className="text-sm text-slate-400">同专科卡牌在对应病区享有 <span className="text-sky-400 font-semibold">消耗 -1 费</span> 的专科共鸣加成</p>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  {SYSTEMS.map(sys => {
                    const qCount = questions.filter(q => q.system === sys.id).length;
                    return (
                      <button
                        key={sys.id}
                        onClick={() => startNewRun(sys.id)}
                        className="group text-left bg-slate-900/90 hover:bg-slate-800/90 border border-slate-800 hover:border-sky-500/60 rounded-2xl p-5 transition-all flex flex-col justify-between shadow-lg hover:-translate-y-1"
                      >
                        <div>
                          <div className={`w-12 h-12 rounded-xl bg-gradient-to-br ${sys.color} flex items-center justify-center mb-4 shadow-lg`}>
                            <Icon name={sys.icon} className="w-6 h-6 text-white" />
                          </div>
                          <h3 className="text-lg font-bold text-white group-hover:text-sky-300 transition">{sys.label}</h3>
                          <p className="text-xs text-slate-400 font-mono mb-3">{sys.en}</p>
                          <p className="text-xs text-slate-300 leading-relaxed mb-4">{sys.desc}</p>
                        </div>
                        <div className="pt-3 border-t border-slate-800 flex items-center justify-between text-xs">
                          <span className="text-slate-400">题库储备: <strong className="text-slate-200">{qCount}</strong> 题</span>
                          <span className="text-sky-400 font-semibold flex items-center gap-0.5">进入病区 <Icon name="chevronRight" className="w-4 h-4" /></span>
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>
            )}

            {/* 3. COMBAT ARENA */}
            {screen === "COMBAT" && enemy && (
              <div className="flex-1 flex flex-col justify-between gap-4">
                {/* Mobile Compact Status */}
                <div className="flex md:hidden items-center justify-between bg-slate-900/80 border border-slate-800 rounded-xl px-3 py-2 text-xs">
                  <span className="text-rose-400 font-bold">HP {playerHp}/{playerMaxHp}</span>
                  <span className={`px-2 py-0.5 rounded-full border ${currentSystemMeta.badge}`}>{currentSystemMeta.label} {nodeIndex + 1}/3</span>
                  <span className="text-amber-400 font-bold">金币 {gold}</span>
                </div>

                {/* Middle Arena: Player vs Enemy */}
                <div className="flex-1 grid grid-cols-1 md:grid-cols-2 gap-6 items-center bg-slate-900/50 border border-slate-800/80 rounded-3xl p-5 sm:p-8 relative overflow-hidden">
                  {/* Subtle turn indicator */}
                  <div className="absolute top-3 left-1/2 -translate-x-1/2 px-3 py-1 rounded-full bg-slate-800/90 border border-slate-700 text-[11px] font-mono text-slate-300">
                    第 {turnCount} 回合 · {isEnemyTurn ? "病症发作中..." : "医师行动回合"}
                  </div>

                  {/* LEFT: Player */}
                  <div className={`relative flex flex-col items-center justify-center pt-6 ${shakeTarget === "player" ? "animate-shake" : ""}`}>
                    {floatingTexts.filter(f => f.target === "player").map(f => (

                      const isExpanded = diagModal.expandedOpt === key;

                      let borderStyle = "border-slate-300 bg-white hover:bg-sky-50";

                        borderStyle = "border-sky-600 bg-sky-50 ring-2 ring-sky-500/30";

                        if (isAnswer) borderStyle = "border-emerald-600 bg-emerald-50";

                            onClick={() => {
                              if (!diagModal.submitted) {
                                setDiagModal(prev => ({ ...prev, selectedOpt: key }));
                              } else {
                                setDiagModal(prev => ({ ...prev, expandedOpt: prev.expandedOpt === key ? null : key }));
                              }

                            className="w-full text-left px-4 py-3 flex items-start justify-between gap-3"

                                diagModal.submitted && isAnswer ? "bg-emerald-600 text-white border-emerald-600" :

                                "border-slate-400 text-slate-700"

                    当前题库浏览 ({questions.length})
                  </button>
                </div>

                <div className="p-5 overflow-y-auto flex-1">
                  {qmTab === "import" ? (
                    <div className="space-y-4">
                      <div className="flex flex-wrap items-center justify-between gap-2">
                        <p className="text-xs text-slate-400">
                          支持直接粘贴 <strong className="text-slate-200">JSON 数组</strong>，或非结构化 Markdown（含 <code className="text-sky-300">Question: / A. B. C. D. / Answer: / Explanation:</code>）。
                        </p>
                        <select
                          value={importSystem}
                          onChange={(e) => setImportSystem(e.target.value)}
                          className="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200"
                        >
                          {SYSTEMS.map(s => <option key={s.id} value={s.id}>归类专科: {s.label}</option>)}
                          <option value="General">归类专科: 全科综合</option>
                        </select>
                      </div>

                      <textarea
                        value={importText}
                        onChange={(e) => setImportText(e.target.value)}
                        rows={10}
                        placeholder={`示例 Markdown：\nQuestion: A 58-year-old man presents with crushing chest pain...\nA. Aspirin + UFH\nB. Warfarin\nC. Alteplase\nD. Observation\nAnswer: A\nExplanation: Primary PCI requires UFH...\nEducational Objective: STEMI anticoagulation`}
                        className="w-full rounded-xl bg-slate-950 border border-slate-700 p-3.5 text-xs sm:text-sm text-slate-200 font-mono focus:outline-none focus:border-sky-500"
                      />

                      <div className="flex flex-wrap items-center justify-between gap-2">
                        <div className="flex items-center gap-3">
                          <button
                            onClick={handleResetQuestions}
                          className="text-xs text-slate-400 hover:text-rose-400 transition"
                        >
                          恢复默认预置题库
                          </button>
                          <button
                            disabled={cloudBusy}
                            onClick={publishGlobalQuestions}
                            className="px-3 py-1.5 rounded-lg bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/40 text-emerald-300 text-xs font-bold flex items-center gap-1 transition"
                          >
                            <Icon name="cloud" className="w-3.5 h-3.5" />
                            <span>{cloudBusy ? "发布中..." : "发布至全端公共库（热更新）"}</span>
                          </button>
                        </div>
                        <button
                          onClick={handleImportQuestions}
                          className="px-5 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold text-sm flex items-center gap-1.5 transition"
                        >
                          <Icon name="plus" className="w-4 h-4" />
                          <span>智能解析并保存至本地</span>
                        </button>
                      </div>
                    </div>
                  ) : (
                    <div className="space-y-3">
                      <div className="flex flex-wrap gap-1.5 mb-2">
                        {["ALL", ...SYSTEMS.map(s => s.id), "General"].map(f => (
                          <button
                            key={f}
                            onClick={() => setQmFilter(f)}
                            className={`px-2.5 py-1 rounded-lg text-xs font-semibold transition ${
                              qmFilter === f ? "bg-sky-600 text-white" : "bg-slate-800 text-slate-400 hover:text-slate-200"
                            }`}
                          >
                            {f === "ALL" ? "全部" : f}
                          </button>
                        ))}
                      </div>

                      {filteredQuestions.map(q => (
                        <div key={q.id} className="p-3.5 rounded-xl bg-slate-950/70 border border-slate-800 flex items-start justify-between gap-3">
                          <div className="space-y-1">
                            <div className="flex items-center gap-2 text-[11px]">
                              <span className="px-2 py-0.5 rounded bg-sky-500/20 text-sky-300 font-semibold">{q.system}</span>
                              <span className="text-emerald-400 font-mono">答案: {q.answer}</span>
                            </div>
                            <p className="text-xs text-slate-300 line-clamp-2">{q.stem}</p>
                            <p className="text-[11px] text-amber-400/90">EO: {q.educationalObjective}</p>
                          </div>
                          <button
                            onClick={() => setQuestions(prev => prev.filter(item => item.id !== q.id))}
                            className="p-1.5 rounded-lg text-slate-500 hover:text-rose-400 hover:bg-slate-800 shrink-0"
                          >
                            <Icon name="trash" className="w-4 h-4" />
                          </button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* =================================================================
              MODAL 3: MISTAKE NOTEBOOK (病历讨论室 / 错题本升级版)
             ================================================================= */}
          {showMistakeModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-6">
              <div className="w-full max-w-4xl bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl flex flex-col max-h-[88vh]">
                <div className="px-5 py-4 border-b border-slate-800 flex items-center justify-between">
                  <div className="flex items-center gap-2.5">
                    <Icon name="book" className="w-5 h-5 text-amber-400" />
                    <h3 className="font-bold text-lg text-white">病历讨论室 · 错题复盘本 ({mistakes.length})</h3>
                  </div>
                  <div className="flex items-center gap-2">
                    {mistakes.length > 0 && (
                      <button onClick={() => setMistakes([])} className="text-xs text-slate-400 hover:text-rose-400 px-2 py-1">
                        清空记录
                      </button>
                    )}
                    <button onClick={() => setShowMistakeModal(false)} className="p-1.5 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white">
                      <Icon name="x" className="w-5 h-5" />
                    </button>
                  </div>
                </div>

                {/* Filter Pills */}
                <div className="px-5 py-2.5 border-b border-slate-800/80 flex flex-wrap gap-1.5 bg-slate-900/60">
                  {["ALL", ...SYSTEMS.map(s => s.id)].map(f => (
                    <button
                      key={f}
                      onClick={() => setMistakeFilter(f)}
                      className={`px-2.5 py-1 rounded-lg text-xs font-semibold transition ${
                        mistakeFilter === f ? "bg-amber-500 text-slate-950" : "bg-slate-800 text-slate-400 hover:text-slate-200"
                      }`}
                    >
                      {f === "ALL" ? `全部 (${mistakes.length})` : `${SYSTEMS.find(s => s.id === f)?.label || f} (${mistakes.filter(m => m.system === f).length})`}
                    </button>
                  ))}
                </div>

                <div className="p-5 overflow-y-auto space-y-4">
                  {mistakes.filter(m => mistakeFilter === "ALL" || m.system === mistakeFilter).length === 0 ? (
                    <div className="text-center py-12 text-slate-400 text-sm">
                      该版块暂无错题记录！继续保持精准诊断。
                    </div>
                  ) : (
                    mistakes
                      .filter(m => mistakeFilter === "ALL" || m.system === mistakeFilter)
                      .map((m, idx) => {
                        const isExp = expandedMistakeId === (m.id + idx);
                        return (
                          <div key={m.id + idx} className="p-4 rounded-xl bg-slate-950/85 border border-slate-800 space-y-3">
                            {/* Metadata Header: Exact Time + Section + Wrong Count */}
                            <div className="flex flex-wrap items-center justify-between gap-2 text-xs">
                              <div className="flex flex-wrap items-center gap-1.5">
                                <span className="px-2 py-0.5 rounded bg-rose-500/20 text-rose-300 font-semibold">{m.system}</span>
                                {m.sectionLabel && (
                                  <span className="px-2 py-0.5 rounded bg-sky-500/15 text-sky-300 border border-sky-500/30">
                                    版块: {m.sectionLabel}
                                  </span>
                                )}
                                {m.cardName && (
                                  <span className="px-2 py-0.5 rounded bg-slate-800 text-slate-300">
                                    卡牌: {m.cardName}
                                  </span>
                                )}
                              </div>
                              <div className="flex items-center gap-2 text-slate-400 font-mono">
                                <span className="flex items-center gap-1 text-amber-300/90">
                                  <Icon name="clock" className="w-3.5 h-3.5" />
                                  {m.timestamp}
                                </span>
                                {(m.wrongCount || 1) > 1 && (
                                  <span className="px-1.5 py-0.5 rounded bg-rose-600/30 text-rose-300 font-bold">错 {m.wrongCount} 次</span>
                                )}
                              </div>
                            </div>

                            <p className="text-xs sm:text-sm text-slate-200 leading-relaxed font-serif-clinical">{m.stem}</p>

                            <div className="flex flex-wrap items-center justify-between gap-2 text-xs bg-slate-900/90 px-3 py-2 rounded-lg border border-slate-800">
                              <span>
                                你的误选: <strong className="text-rose-400">{m.wrongChoice}. {m.options?.[m.wrongChoice]}</strong>
                              </span>
                              <span>
                                正确答案: <strong className="text-emerald-400">{m.answer}. {m.options?.[m.answer]}</strong>
                              </span>
                            </div>

                            <div className="p-3 rounded-lg bg-slate-900 border border-slate-800 text-xs text-slate-300 space-y-1.5">
                              <div><strong className="text-emerald-400">正解解析:</strong> {m.explanations?.[m.answer] || m.options?.[m.answer]}</div>
                              {m.explanations?.[m.wrongChoice] && (
                                <div><strong className="text-rose-400">误选辨析 ({m.wrongChoice}):</strong> {m.explanations[m.wrongChoice]}</div>
                              )}
                              <div className="text-amber-300 pt-1"><strong>EO 核心考点:</strong> {m.educationalObjective}</div>
                            </div>

                            <button
                              onClick={() => setExpandedMistakeId(isExp ? null : (m.id + idx))}
                              className="text-xs text-sky-400 hover:text-sky-300 flex items-center gap-1"
                            >
                              <Icon name={isExp ? "chevronDown" : "chevronRight"} className="w-3.5 h-3.5" />
                              <span>{isExp ? "收起全部选项" : "展开全部选项与解析"}</span>
                            </button>

                            {isExp && m.options && (
                              <div className="space-y-1.5 pt-1 border-t border-slate-800/80 text-xs">
                                {Object.entries(m.options).map(([k, v]) => (
                                  <div key={k} className={`p-2 rounded-lg ${k === m.answer ? "bg-emerald-950/50 border border-emerald-500/30" : k === m.wrongChoice ? "bg-rose-950/40 border border-rose-500/30" : "bg-slate-900/50"}`}>
                                    <div className="font-semibold text-slate-200">{k}. {v}</div>
                                    {m.explanations?.[k] && <div className="text-slate-400 mt-0.5">{m.explanations[k]}</div>}
                                  </div>
                                ))}
                              </div>
                            )}
                          </div>
                        );
                      })
                  )}
                </div>
              </div>
            </div>
          )}

          {/* =================================================================
              MODAL 4: ACCOUNT, PROGRESS & CLOUD SYNC MODAL
             ================================================================= */}
          {showAuthModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-6">
              <div className="w-full max-w-xl bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl flex flex-col max-h-[88vh]">
                <div className="px-5 py-4 border-b border-slate-800 flex items-center justify-between">
                  <div className="flex items-center gap-2.5">
                    <Icon name="user" className="w-5 h-5 text-emerald-400" />
                    <h3 className="font-bold text-lg text-white">账号档案与云端同步</h3>
                  </div>
                  <button onClick={() => setShowAuthModal(false)} className="p-1.5 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="px-5 pt-3 border-b border-slate-800 flex gap-4 text-sm font-semibold">
                  <button onClick={() => setAuthTab("account")} className={`pb-2.5 border-b-2 transition ${authTab === "account" ? "border-emerald-400 text-emerald-400" : "border-transparent text-slate-400"}`}>
                    注册 / 登录账号
                  </button>
                  <button onClick={() => setAuthTab("sync")} className={`pb-2.5 border-b-2 transition ${authTab === "sync" ? "border-sky-400 text-sky-400" : "border-transparent text-slate-400"}`}>
                    多端云同步 & 存档导入导出
                  </button>
                </div>

                <div className="p-5 overflow-y-auto space-y-4">
                  {authTab === "account" ? (
                    <div className="space-y-4">
                      <div className="p-3 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-between text-xs">
                        <span className="text-slate-400">当前登录账号：<strong className="text-emerald-400 text-sm">{currentUser === "guest" ? "游客模式 (本地默认)" : currentUser}</strong></span>
                        {currentUser !== "guest" && (
                          <button onClick={() => { switchToUser("guest"); setShowAuthModal(false); showToast("已退出至游客模式", "info"); }} className="text-rose-400 hover:underline">
                            退出登录
                          </button>
                        )}
                      </div>

                      <div className="flex gap-2">
                        <button onClick={() => setAuthMode("login")} className={`flex-1 py-2 rounded-lg text-xs font-bold ${authMode === "login" ? "bg-sky-600 text-white" : "bg-slate-800 text-slate-400"}`}>
                          登录已有账号
                        </button>
                        <button onClick={() => setAuthMode("register")} className={`flex-1 py-2 rounded-lg text-xs font-bold ${authMode === "register" ? "bg-emerald-600 text-slate-950" : "bg-slate-800 text-slate-400"}`}>
                          注册新账号
                        </button>
                      </div>

                      <div className="space-y-3">
                        <input
                          type="text"
                          value={authUsername}
                          onChange={(e) => setAuthUsername(e.target.value)}
                          placeholder="输入用户名（如：yangrc）"
                          className="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white focus:outline-none focus:border-sky-500"
                        />
                        <input
                          type="password"
                          value={authPassword}
                          onChange={(e) => setAuthPassword(e.target.value)}
                          placeholder="输入密码（至少 4 位，SHA-256 加密存储）"
                          className="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white focus:outline-none focus:border-sky-500"
                        />
                        <button onClick={handleAuthSubmit} className="w-full py-2.5 rounded-xl bg-gradient-to-r from-sky-500 to-emerald-500 text-slate-950 font-extrabold text-sm">
                          {authMode === "register" ? "立即注册并创建独立存档" : "登录并加载我的错题与进度"}
                        </button>
                      </div>
                      <p className="text-[11px] text-slate-400 leading-relaxed">
                        每个账号独立保存题库、错题本、历史战绩与实时战斗断点进度（关闭网页再打开会自动询问是否继续）。
                      </p>
                    </div>
                  ) : (
                    <div className="space-y-4">
                      <div className="p-4 rounded-xl bg-slate-950 border border-slate-800 space-y-2.5">
                        <div className="text-xs font-bold text-white flex items-center gap-1.5">
                          <Icon name="download" className="w-4 h-4 text-emerald-400" />
                          <span>跨设备文件存档（PC ↔ iPad 零配置互通）</span>
                        </div>
                        <p className="text-[11px] text-slate-400">一键导出包含全量题库、错题本和当前关卡进度的 JSON 存档文件，在另一台设备导入即可无缝续刷。</p>
                        <div className="flex flex-wrap gap-2 pt-1">
                          <button onClick={exportFullBackup} className="px-3.5 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold flex items-center gap-1.5">
                            <Icon name="download" className="w-3.5 h-3.5" /> 导出全量存档 (.json)
                          </button>
                          <label className="px-3.5 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-bold flex items-center gap-1.5 cursor-pointer">
                            <Icon name="upload" className="w-3.5 h-3.5 text-sky-400" /> 导入恢复存档
                            <input type="file" accept=".json" onChange={importFullBackup} className="hidden" />
                          </label>
                        </div>
                      </div>

                      <div className="p-4 rounded-xl bg-slate-950 border border-slate-800 space-y-2.5">
                        <div className="text-xs font-bold text-white flex items-center gap-1.5">
                          <Icon name="cloud" className="w-4 h-4 text-sky-400" />
                          <span>Supabase 真·云端数据库同步（可选）</span>
                        </div>
                        <p className="text-[11px] text-slate-400">
                          在免费 Supabase 项目中新建表 <code className="text-sky-300">medspire_saves (username text primary key, data jsonb)</code> 并填入下方参数，即可实现多端实时云同步：
                        </p>
                        <input
                          type="text"
                          value={cloudCfg.url}
                          onChange={(e) => setCloudCfg(c => ({ ...c, url: e.target.value }))}
                          placeholder="Supabase Project URL (https://xxx.supabase.co)"
                          className="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white"
                        />
                        <input
                          type="password"
                          value={cloudCfg.anonKey}
                          onChange={(e) => setCloudCfg(c => ({ ...c, anonKey: e.target.value }))}
                          placeholder="Supabase Anon Key"
                          className="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white"
                        />
                        <div className="flex gap-2 pt-1">
                          <button disabled={cloudBusy} onClick={() => syncToSupabase("push")} className="flex-1 py-2 rounded-lg bg-sky-600 hover:bg-sky-500 disabled:opacity-50 text-white text-xs font-bold">
                            {cloudBusy ? "同步中..." : "上传至云端"}
                          </button>
                          <button disabled={cloudBusy} onClick={() => syncToSupabase("pull")} className="flex-1 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white text-xs font-bold">
                            {cloudBusy ? "同步中..." : "从云端拉取"}
                          </button>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* =================================================================
              MODAL 5: RESUME PROGRESS POPUP ON STARTUP
             ================================================================= */}
          {showResumePrompt && savedActiveRun && screen === "MENU" && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-md bg-slate-900 border border-emerald-500/50 rounded-2xl p-6 shadow-2xl space-y-4">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center">
                    <Icon name="clock" className="w-6 h-6" />
                  </div>
                  <div>
                    <h3 className="font-bold text-base text-white">是否继续上次的查房进度？</h3>
                    <p className="text-xs text-slate-400">上次保存：{savedActiveRun.savedAt}</p>
                  </div>
                </div>
                <div className="p-3.5 rounded-xl bg-slate-950 border border-slate-800 text-xs space-y-1 text-slate-300">
                  <div>当前版块：<strong className="text-sky-300">{SYSTEMS.find(s => s.id === savedActiveRun.currentPath)?.label || savedActiveRun.currentPath}</strong></div>
                  <div>进度状态：第 {savedActiveRun.nodeIndex + 1}/3 节点 · {savedActiveRun.enemy?.name} · 第 {savedActiveRun.turnCount} 回合</div>
                  <div>医师状态：HP {savedActiveRun.playerHp}/{savedActiveRun.playerMaxHp} · 金币 {savedActiveRun.gold}</div>
                </div>
                <div className="flex gap-2.5">
                  <button onClick={resumeSavedRun} className="flex-1 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-sm">
                    继续上次进度
                  </button>
                  <button onClick={() => setShowResumePrompt(false)} className="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm">
                    稍后再说
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* =================================================================
              MODAL 6: INSTALL AS DESKTOP / IPAD APP GUIDE
             ================================================================= */}
          {showInstallModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-lg bg-slate-900 border border-slate-700 rounded-2xl p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2.5">
                    <Icon name="monitor" className="w-5 h-5 text-indigo-400" />
                    <h3 className="font-bold text-lg text-white">将 MedSpire 安装为桌面/平板图标</h3>
                  </div>
                  <button onClick={() => setShowInstallModal(false)} className="p-1 text-slate-400 hover:text-white"><Icon name="x" className="w-5 h-5" /></button>
                </div>
                <div className="space-y-3 text-xs sm:text-sm text-slate-300 leading-relaxed">
                  <div className="p-3.5 rounded-xl bg-slate-950 border border-slate-800">
                    <div className="font-bold text-sky-400 mb-1">1. 电脑桌面图标（Windows / Mac）</div>
                    <p>将本页面部署到免费的 <strong>GitHub Pages / Vercel / Cloudflare Pages</strong> 后，用 Chrome 或 Edge 打开，点击地址栏右侧的<strong>「安装 MedSpire」</strong>图标，即可在桌面生成独立应用图标，双击即开、无浏览器边框。</p>
                  </div>
                  <div className="p-3.5 rounded-xl bg-slate-950 border border-slate-800">
                    <div className="font-bold text-emerald-400 mb-1">2. iPad / iPhone 主屏幕图标</div>
                    <p>用 Safari 打开部署链接，点击右上角<strong>分享按钮 ➔「添加到主屏幕」</strong>，即可在 iPad 桌面生成全屏 App 图标。</p>
                  </div>
                  <div className="p-3.5 rounded-xl bg-slate-950 border border-slate-800">
                    <div className="font-bold text-amber-400 mb-1">3. 本地单文件直接双击运行</div>
                    <p>你也可以直接下载本 HTML 文件保存为桌面快捷方式，所有 46 道内置题库与账号存档均可离线永久使用。</p>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
